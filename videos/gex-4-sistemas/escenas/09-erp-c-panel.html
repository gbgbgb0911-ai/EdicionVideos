<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Sistemas 09 — ERP: de archivos sueltos a un panel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      .fl { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 24px 16px 16px; border-radius: 22px; background: #ffffff; color: var(--teal); font-weight: 800; font-size: 30px; white-space: nowrap; }
      .fl .ico { width: 64px; height: 64px; }
      #mess { position: absolute; left: 0; right: 0; top: 1300px; display: flex; justify-content: center; }
      #dash { position: absolute; left: 60px; top: 300px; width: 960px; }
      .kp { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 26px 26px 10px; }
      .t { display: flex; flex-direction: column; gap: 6px; padding: 20px 24px; border-radius: 24px; background: var(--soft); }
      .t span { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 26px; letter-spacing: 0.08em; white-space: nowrap; }
      .t span i { width: 40px; height: 40px; display: inline-block; }
      .t b { font-weight: 800; font-size: 56px; line-height: 1; white-space: nowrap; }
      .t.o b { color: #c94a0c; }
      .bars { position: relative; display: flex; align-items: flex-end; gap: 26px; height: 330px; margin: 16px 26px 0; padding: 0 20px; border-bottom: 5px solid var(--line); }
      .bars .bc { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
      .bars .bc i { width: 100%; border-radius: 14px 14px 0 0; background: #1fc4b8; }
      .bars .bc:last-child i { background: #fe6820; }
      .mo { display: flex; gap: 26px; margin: 10px 26px 0; padding: 0 20px; }
      .mo span { flex: 1; text-align: center; font-weight: 800; font-size: 26px; }
      .ft { display: flex; justify-content: center; padding: 22px 0 28px; }
      .ft .chip { font-size: 32px; padding: 12px 26px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="11" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="11" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">ERP · TODO EN UN PANEL</span></div>
        <div class="fl" id="f1" style="left: 80px; top: 400px"><span class="ico" data-ic="doc" data-col="#179a4a"></span>inventario_final.xlsx</div>
        <div class="fl" id="f2" style="left: 560px; top: 560px"><span class="ico" data-ic="doc" data-col="#179a4a"></span>pagos (2).xlsx</div>
        <div class="fl" id="f3" style="left: 120px; top: 720px"><span class="ico" data-ic="doc" data-col="#ea5a14"></span>gastos_marzo.pdf</div>
        <div class="fl" id="f4" style="left: 600px; top: 860px"><span class="ico" data-ic="folder"></span>compras.docx</div>
        <div class="fl" id="f5" style="left: 90px; top: 1020px"><span class="ico" data-ic="receipt" data-col="#ea5a14"></span>cuaderno de caja</div>
        <div class="fl" id="f6" style="left: 540px; top: 1160px"><span class="ico" data-ic="doc" data-col="#179a4a"></span>ventas_v3.xlsx</div>
        <div id="mess"><span class="chip gr" id="messc" style="font-size: 34px; padding: 12px 26px">Información repartida</span></div>
        <div class="win" id="dash">
          <div class="bar"><i></i><i></i><i></i><b>Panel general</b></div>
          <div class="kp">
            <div class="t"><span><i data-ic="cart"></i>VENTAS</span><b class="num" id="k1">$0</b></div>
            <div class="t o"><span><i data-ic="receipt" data-col="#ea5a14"></i>GASTOS</span><b class="num" id="k2">$0</b></div>
            <div class="t"><span><i data-ic="box"></i>STOCK</span><b class="num" id="k3">0</b></div>
            <div class="t o"><span><i data-ic="card" data-col="#ea5a14"></i>POR PAGAR</span><b class="num" id="k4">$0</b></div>
          </div>
          <div class="bars" id="bars">
            <div class="bc"><i style="height: 38%"></i></div>
            <div class="bc"><i style="height: 52%"></i></div>
            <div class="bc"><i style="height: 46%"></i></div>
            <div class="bc"><i style="height: 64%"></i></div>
            <div class="bc"><i style="height: 72%"></i></div>
            <div class="bc"><i style="height: 92%"></i></div>
          </div>
          <div class="mo"><span>Ene</span><span>Feb</span><span>Mar</span><span>Abr</span><span>May</span><span>Jun</span></div>
          <div class="ft"><span class="chip g" id="ok">Tu empresa de un vistazo ✓</span></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-pop" src="assets/sfx/pop.wav" data-start="0.35" data-volume="0.28"></audio>
      <audio id="s-suck" src="assets/sfx/whoosh.wav" data-start="4.3" data-volume="0.45"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="5.15" data-volume="0.35"></audio>
      <audio id="s-ding" src="assets/sfx/ding.wav" data-start="7.6" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="10.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 10.6;
      const r = GEX.rng(909);
      const parts = GEX.particles(document.getElementById("fx"), 12, 909, { x0: 40, x1: 1040, y0: 260, y1: 1520 });
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.05);
      // información repartida: archivos sueltos que no paran de moverse
      const files = ["#f1", "#f2", "#f3", "#f4", "#f5", "#f6"];
      files.forEach((id, i) => {
        const el = document.querySelector(id);
        const rot = (r() - 0.5) * 16;
        const t = 0.3 + i * 0.16;
        tl.fromTo(id, { scale: 0, rotation: rot * 3, autoAlpha: 0 }, { scale: 1, rotation: rot, autoAlpha: 1, duration: 0.42, ease: "back.out(2.2)" }, t);
        tl.to(id, { x: (r() - 0.5) * 40, y: (r() - 0.5) * 50, rotation: -rot, duration: 0.8 + r() * 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, t + 0.5);
        // se centralizan
        const cx = 540 - (el.offsetLeft + el.offsetWidth / 2);
        const cy = 800 - (el.offsetTop + el.offsetHeight / 2);
        tl.to(id, { x: cx, y: cy, rotation: 0, scale: 0.2, autoAlpha: 0, duration: 0.55, ease: "power3.in" }, 4.3 + i * 0.05);
      });
      tl.fromTo("#mess", { y: 60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 1.6);
      tl.to("#messc", { rotation: -2, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 5 }, 2.4);
      tl.to("#mess", { scale: 0, autoAlpha: 0, duration: 0.3, ease: "back.in(2)" }, 4.15);
      // panel general
      tl.fromTo("#dash", { scale: 0.2, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.55, ease: "back.out(1.6)" }, 4.85);
      tl.fromTo("#dash .t", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.1 }, 5.3);
      GEX.count(tl, document.getElementById("k1"), 0, 24500, 5.5, 1.4, "$");
      GEX.count(tl, document.getElementById("k2"), 0, 8200, 5.6, 1.4, "$");
      GEX.count(tl, document.getElementById("k3"), 0, 1240, 5.7, 1.4, "", " u");
      GEX.count(tl, document.getElementById("k4"), 0, 3100, 5.8, 1.4, "$");
      tl.fromTo("#bars .bc i", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, transformOrigin: "50% 100%", duration: 0.6, ease: "back.out(1.6)", stagger: 0.1 }, 6.0);
      tl.fromTo("#ok", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(3)" }, 7.6);
      GEX.punch(tl, "#ok", 8.3, 1.08);
      tl.to("#bars .bc:last-child i", { scaleY: 1.06, transformOrigin: "50% 100%", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 8.0);
      tl.to("#dash .t", { y: -6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.15 }, 8.2);
      // salida
      tl.to("#dash", { y: 800, rotation: 6, autoAlpha: 0, duration: 0.4, ease: "power3.in" }, EXIT);
      tl.to("#tag", { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
