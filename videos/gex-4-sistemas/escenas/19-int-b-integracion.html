<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Sistemas 19 — Todo en un solo sistema</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #store { position: absolute; left: 0; right: 0; top: 300px; display: flex; justify-content: center; }
      .md { position: absolute; width: 450px; height: 220px; border-radius: 32px; background: #ffffff; color: var(--teal); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-weight: 800; font-size: 38px; white-space: nowrap; }
      .md .ico { width: 110px; height: 110px; }
      #sys { position: absolute; left: 60px; top: 300px; width: 960px; height: 840px; }
      #sys .bar img { height: 40px; margin-left: 8px; }
      #side { position: absolute; left: 0; top: 80px; width: 330px; bottom: 0; padding: 22px 16px; background: var(--soft); display: flex; flex-direction: column; gap: 14px; }
      .mi { display: flex; align-items: center; gap: 14px; height: 100px; padding: 0 16px; border-radius: 22px; background: #ffffff; font-weight: 800; font-size: 32px; white-space: nowrap; }
      .mi .ico { width: 64px; height: 64px; }
      .mi:first-child { background: #0b958b; color: #ffffff; }
      .mi:first-child .ico { background: #ffffff; }
      #main { position: absolute; left: 354px; top: 104px; right: 24px; display: flex; flex-direction: column; gap: 16px; }
      .kp { padding: 18px 22px; border-radius: 24px; background: var(--soft); display: flex; flex-direction: column; gap: 4px; }
      .kp span { font-weight: 800; font-size: 24px; letter-spacing: 0.1em; white-space: nowrap; }
      .kp b { font-weight: 800; font-size: 50px; line-height: 1.05; white-space: nowrap; }
      .kp.o b { color: #c94a0c; }
      #fin { position: absolute; left: 0; right: 0; top: 1180px; display: flex; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="11.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="11.5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">EJEMPLO · UNA TIENDA</span></div>
        <div id="store"><div class="pill" id="st"><span class="pi" data-ic="store"></span>Una tienda necesita…<i class="shine" id="sh"></i></div></div>
        <div class="md" id="d0" style="left: 60px; top: 440px"><span class="ico" data-ic="cart"></span>Punto de venta</div>
        <div class="md" id="d1" style="left: 570px; top: 440px"><span class="ico" data-ic="box" data-col="#ea5a14"></span>Inventario</div>
        <div class="md" id="d2" style="left: 60px; top: 690px"><span class="ico" data-ic="users" data-col="#ea5a14"></span>Clientes</div>
        <div class="md" id="d3" style="left: 570px; top: 690px"><span class="ico" data-ic="user"></span>Empleados</div>
        <div class="win" id="sys">
          <div class="bar"><i></i><i></i><i></i><img src="assets/logo-v2/gex-full.png" alt="GEX" /><b>Sistema de tu tienda</b></div>
          <div id="side">
            <div class="mi" id="i0"><span class="ico" data-ic="cart"></span>Ventas</div>
            <div class="mi" id="i1"><span class="ico" data-ic="box" data-col="#ea5a14"></span>Inventario</div>
            <div class="mi" id="i2"><span class="ico" data-ic="users" data-col="#ea5a14"></span>Clientes</div>
            <div class="mi" id="i3"><span class="ico" data-ic="user"></span>Empleados</div>
          </div>
          <div id="main">
            <div class="kp"><span>VENTAS HOY</span><b class="num" id="k1">$0</b></div>
            <div class="kp o"><span>STOCK BAJO</span><b class="num" id="k2">0 productos</b></div>
            <div class="kp"><span>CLIENTES POR SEGUIR</span><b class="num" id="k3">0</b></div>
            <div class="kp o"><span>EMPLEADOS EN TURNO</span><b class="num" id="k4">0 / 12</b></div>
          </div>
        </div>
        <div id="fin"><div class="pill g" id="pf"><span class="pi" data-ic="check" data-col="#179a4a" data-sw="6"></span>1 solo sistema, a tu medida<i class="shine" id="sh2"></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-p1" src="assets/sfx/pop.wav" data-start="1.2" data-volume="0.3"></audio>
      <audio id="s-p2" src="assets/sfx/pop.wav" data-start="3.4" data-volume="0.28"></audio>
      <audio id="s-mg" src="assets/sfx/whoosh.wav" data-start="6.0" data-volume="0.45"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="6.75" data-volume="0.35"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="11.08" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 11.1;
      const parts = GEX.particles(document.getElementById("fx"), 12, 1919, { x0: 40, x1: 1040, y0: 260, y1: 1500 });
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      gsap.set(["#sys", "#pf"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.05);
      tl.fromTo("#st", { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)" }, 0.2);
      tl.fromTo("#sh", { x: -140 }, { x: 600, duration: 0.6, ease: "power2.inOut" }, 0.8);
      tl.set("#sh", { x: -140 }, 1.45);
      // cada función que necesita la tienda
      [1.2, 2.3, 3.4, 4.5].forEach((t, i) => {
        const id = "#d" + i;
        tl.fromTo(id, { y: 140, scale: 0.4, rotation: i % 2 ? 8 : -8, autoAlpha: 0 }, { y: 0, scale: 1, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2.2)" }, t);
        tl.fromTo(id + " .ico", { rotation: -150 }, { rotation: 0, duration: 0.5, ease: "back.out(2)" }, t + 0.05);
        GEX.float(tl, id, t + 0.6, 5.9, 6, 1.2 + i * 0.12);
      });
      // se unen en un solo sistema
      tl.to("#st", { y: -80, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, 5.9);
      [0, 1, 2, 3].forEach((i) => {
        const d = document.getElementById("d" + i);
        const dx = 540 - (d.offsetLeft + 225), dy = 760 - (d.offsetTop + 110);
        tl.to("#d" + i, { x: dx, y: dy, scale: 0.3, rotation: (i - 1.5) * 20, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 6.0 + i * 0.03);
      });
      tl.fromTo("#sys", { scale: 0.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.55, ease: "back.out(1.7)", immediateRender: false }, 6.5);
      tl.fromTo(".mi", { x: -120, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12 }, 6.8);
      tl.fromTo(".kp", { x: 80, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out", stagger: 0.12 }, 7.0);
      GEX.count(tl, document.getElementById("k1"), 0, 1862, 7.2, 1.0, "$");
      GEX.count(tl, document.getElementById("k2"), 0, 3, 7.35, 0.8, "", " productos");
      GEX.count(tl, document.getElementById("k3"), 0, 5, 7.5, 0.8);
      GEX.count(tl, document.getElementById("k4"), 0, 11, 7.65, 0.8, "", " / 12");
      tl.fromTo("#pf", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 8.2);
      tl.fromTo("#sh2", { x: -140 }, { x: 800, duration: 0.7, ease: "power2.inOut" }, 8.8);
      tl.set("#sh2", { x: -140 }, 9.55);
      // menú: el resaltado recorre los módulos
      ["#i1", "#i2", "#i3"].forEach((id, i) => {
        tl.to(id, { keyframes: [{ backgroundColor: "#e0f5f3", duration: 0.2 }, { backgroundColor: "#ffffff", duration: 0.4 }], ease: "none" }, 9.0 + i * 0.4);
      });
      GEX.float(tl, "#sys", 7.4, EXIT, 6, 1.8);
      // salida
      tl.to("#sys", { y: 900, rotation: 6, autoAlpha: 0, duration: 0.4, ease: "power3.in" }, EXIT);
      tl.to("#pf", { x: -900, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, EXIT);
      tl.to("#tag", { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
