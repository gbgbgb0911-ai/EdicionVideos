<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Sistemas 11 — POS: dónde se usa</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #pos { position: absolute; left: 270px; top: 300px; width: 540px; height: 470px; }
      #pos svg { width: 100%; height: 100%; overflow: visible; }
      .biz { position: absolute; top: 850px; width: 290px; height: 270px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; border-radius: 32px; background: #ffffff; color: var(--teal); font-weight: 800; font-size: 38px; white-space: nowrap; }
      .biz .ico { width: 130px; height: 130px; }
      #more { position: absolute; left: 0; right: 0; top: 1170px; display: flex; justify-content: center; }
      #pubw { position: absolute; left: 0; right: 0; top: 1290px; display: flex; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">POS · CAJA DE VENTAS</span></div>
        <div id="pos">
          <svg viewBox="0 0 540 470">
            <g id="paper"><rect x="398" y="300" width="96" height="80" rx="6" fill="#ffffff" /><path d="M414 318h64 M414 336h64 M414 354h40" stroke="#1fc4b8" stroke-width="6" stroke-linecap="round" /></g>
            <rect x="380" y="372" width="132" height="84" rx="18" fill="#ffffff" />
            <rect x="398" y="384" width="96" height="10" rx="5" fill="#cfdcdb" />
            <rect x="20" y="10" width="400" height="270" rx="28" fill="#ffffff" />
            <rect x="44" y="34" width="352" height="222" rx="14" fill="#eef4f3" />
            <g id="tiles">
              <rect x="62" y="52" width="100" height="56" rx="10" fill="#1fc4b8" />
              <rect x="170" y="52" width="100" height="56" rx="10" fill="#fe6820" />
              <rect x="278" y="52" width="100" height="56" rx="10" fill="#1fc4b8" />
              <rect x="62" y="116" width="100" height="56" rx="10" fill="#fe6820" />
              <rect x="170" y="116" width="100" height="56" rx="10" fill="#1fc4b8" />
              <rect x="278" y="116" width="100" height="56" rx="10" fill="#fe6820" />
            </g>
            <rect x="62" y="184" width="316" height="54" rx="12" fill="#0b958b" />
            <rect x="190" y="280" width="60" height="70" fill="#ffffff" />
            <rect x="100" y="346" width="240" height="44" rx="18" fill="#ffffff" />
          </svg>
        </div>
        <div class="biz" id="z1" style="left: 60px"><span class="ico" data-ic="fork"></span>Restaurante</div>
        <div class="biz" id="z2" style="left: 395px"><span class="ico" data-ic="shirt" data-col="#ea5a14"></span>Tienda</div>
        <div class="biz" id="z3" style="left: 730px"><span class="ico" data-ic="basket"></span>Minimarket</div>
        <div id="more"><span class="chip o" id="mc" style="font-size: 34px; padding: 12px 26px">+ farmacias, cafeterías, ferreterías…</span></div>
        <div id="pubw"><div class="pill" id="pub"><span class="pi" data-ic="users"></span>Venden directo al cliente<i class="shine" id="sh"></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="2.3" data-volume="0.3"></audio>
      <audio id="s-2" src="assets/sfx/tick.wav" data-start="2.9" data-volume="0.28"></audio>
      <audio id="s-3" src="assets/sfx/tick.wav" data-start="3.5" data-volume="0.28"></audio>
      <audio id="s-4" src="assets/sfx/pop.wav" data-start="5.0" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.6;
      const parts = GEX.particles(document.getElementById("fx"), 12, 1111, { x0: 40, x1: 1040, y0: 260, y1: 1500 });
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.05);
      tl.fromTo("#pos", { y: 300, scale: 0.6, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.55, ease: "back.out(1.6)" }, 0.1);
      // la caja trabajando: botones que se tocan y ticket que se imprime
      const tiles = document.querySelectorAll("#tiles rect");
      [0, 4, 2, 3, 5, 1, 0, 4].forEach((k, i) => {
        tl.to(tiles[k], { keyframes: [{ scale: 0.85, duration: 0.08 }, { scale: 1, duration: 0.18 }], transformOrigin: "50% 50%", ease: "sine.out" }, 0.8 + i * 0.6);
      });
      tl.fromTo("#paper", { y: 70 }, { y: -40, duration: 1.2, ease: "steps(8)", repeat: 3, repeatDelay: 0.3 }, 1.0);
      GEX.float(tl, "#pos", 0.8, EXIT, 8, 1.8);
      // negocios
      [["#z1", 2.3], ["#z2", 2.9], ["#z3", 3.5]].forEach(([id, t], i) => {
        tl.fromTo(id, { y: 120, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.2)" }, t);
        tl.fromTo(id + " .ico", { rotation: -150 }, { rotation: 0, duration: 0.5, ease: "back.out(2)" }, t + 0.05);
        tl.to(id + " .ico", { y: -10, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3 }, t + 0.7 + i * 0.15);
      });
      tl.fromTo("#mc", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)" }, 4.3);
      tl.fromTo("#pub", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)" }, 5.0);
      tl.fromTo("#sh", { x: -140 }, { x: 800, duration: 0.7, ease: "power2.inOut" }, 5.6);
      tl.set("#sh", { x: -140 }, 6.35);
      // salida
      tl.to("#pos", { y: -500, autoAlpha: 0, duration: 0.35, ease: "power3.in" }, EXIT);
      GEX.scatter(tl, ["#z1", "#z2", "#z3", "#mc", "#pub"], EXIT, 11);
      tl.to("#tag", { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
