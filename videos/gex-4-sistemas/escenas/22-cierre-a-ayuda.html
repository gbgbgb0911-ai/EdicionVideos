<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Sistemas 22 — ¿No sabes cuál necesitas? GEX te ayuda</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .logo { display: inline-flex; align-items: center; padding: 18px 34px; border-radius: 28px; background: #ffffff; }
      .logo img { display: block; }
      .top { gap: 24px; }
      .q { display: flex; align-items: center; gap: 24px; }
      #qm { width: 150px; height: 150px; border-radius: 50%; background: var(--orange); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 110px; line-height: 1; flex: none; }
      #qt { font-weight: 800; font-size: 50px; line-height: 1.1; }
      #qt .t { color: #1fc4b8; }
      .chips { display: flex; gap: 14px; }
      .chips .chip { font-size: 34px; padding: 10px 24px; }
      #lg img { height: 84px; }
      .help { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="6" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="top" id="top">
          <div class="q"><div id="qm">?</div><div id="qt">¿Qué sistema<br /><span class="t">necesita tu negocio?</span></div></div>
          <div class="chips"><span class="chip" id="c0">CRM</span><span class="chip" id="c1">ERP</span><span class="chip" id="c2">POS</span><span class="chip" id="c3">Personal</span></div>
          <div class="help" id="help"><span class="logo" id="lg"><img src="assets/logo-v2/gex-full.png" alt="GEX" /></span><div class="pill plain" id="hp"><span id="ht">te ayuda a descubrirlo</span><i class="shine" id="sh"></i></div></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-pop" src="assets/sfx/pop.wav" data-start="0.9" data-volume="0.28"></audio>
      <audio id="s-lg" src="assets/sfx/shimmer.wav" data-start="3.6" data-volume="0.32"></audio>
      <audio id="s-hp" src="assets/sfx/pop.wav" data-start="4.15" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.58" data-volume="0.4"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 5.6;
      const fx = document.getElementById("fx");
      const parts = GEX.particles(fx, 5, 2222, { x0: 60, x1: 150, y0: 200, y1: 800 }).concat(GEX.particles(fx, 5, 2223, { x0: 930, x1: 1000, y0: 200, y1: 800 }));
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      const ht = GEX.split(document.getElementById("ht"));
      gsap.set(["#lg", "#hp"], { autoAlpha: 0 });
      tl.fromTo("#qm", { scale: 0, rotation: -200 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.2)" }, 0.1);
      tl.to("#qm", { rotation: 14, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0.7);
      tl.fromTo("#qt", { x: 80, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.fromTo(".chips .chip", { y: 50, scale: 0.4, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)", stagger: 0.12 }, 0.9);
      // duda: el resaltado salta entre las opciones
      [0, 2, 1, 3, 0, 2].forEach((k, i) => {
        tl.to("#c" + k, { keyframes: [{ backgroundColor: "#ea5a14", scale: 1.1, duration: 0.12 }, { backgroundColor: "#0b958b", scale: 1, duration: 0.25 }], ease: "none" }, 1.6 + i * 0.32);
      });
      // GEX te ayuda
      tl.fromTo("#lg", { scale: 0.3, rotation: -8, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(2.4)", immediateRender: false }, 3.6);
      tl.fromTo("#hp", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 4.15);
      GEX.reveal(tl, ht.words, 4.25, "rise", { stagger: 0.06, duration: 0.35 });
      tl.fromTo("#sh", { x: -140 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 4.8);
      tl.set("#sh", { x: -140 }, 5.45);
      GEX.float(tl, "#lg", 4.2, EXIT, 6, 1.2);
      // salida en piezas
      GEX.scatter(tl, ["#qm", "#qt", "#c0", "#c1", "#c2", "#c3", "#lg", "#hp"], EXIT, 22);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
