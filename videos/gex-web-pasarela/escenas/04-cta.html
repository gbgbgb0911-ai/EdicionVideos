<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Web pasarela 04 — CTA escríbeme</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 10px; top: 300px; }
      #st { text-align: center; font-weight: 800; line-height: 1.05; white-space: nowrap; }
      #a { font-size: 52px; }
      #b { font-size: 92px; }
      #c2 { font-size: 66px; color: #1fc4b8; }
      #ctaw { position: relative; margin-top: 30px; display: flex; justify-content: center; }
      #cta { font-size: 62px; padding: 18px 44px 18px 18px; }
      #cta .pi { width: 88px; height: 88px; }
      #cta .pi svg { width: 54px; height: 54px; }
      #rg { position: absolute; left: 50%; top: 50%; width: 440px; height: 124px; margin: -62px 0 0 -220px; border-radius: 999px; border: 8px solid #1fc4b8; }
      .dg { position: absolute; width: 16px; height: 80px; border-radius: 8px; transform: rotate(25deg); }
      .sk { position: absolute; width: 18px; height: 18px; border-radius: 50%; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="5.4" data-track-index="0">
        <span class="dg" id="d1" style="left: 120px; top: 560px; background: #fe6820"></span><span class="dg" id="d2" style="left: 150px; top: 580px; background: #1fc4b8"></span>
        <span class="dg" id="d3" style="left: 900px; top: 560px; background: #1fc4b8"></span><span class="dg" id="d4" style="left: 930px; top: 580px; background: #fe6820"></span>
        <div class="top" id="top">
          <div id="st"><div id="a"><span id="ta">Si quieres una</span></div><div id="b"><span id="tb">PÁGINA WEB</span></div><div id="c2"><span id="tc">así de completa,</span></div></div>
          <div id="ctaw"><span id="rg"></span><div class="pill o" id="cta"><span class="pi" data-ic="chat" data-col="#ea5a14" data-sw="4.5"></span>Escríbeme<i class="shine" id="sh" data-layout-allow-overflow></i></div></div>
        </div>
        <i class="sk" id="k1" style="left: 230px; top: 720px; background: #fe6820"></i><i class="sk" id="k2" style="left: 830px; top: 690px; background: #1fc4b8"></i><i class="sk" id="k3" style="left: 300px; top: 820px; background: #ffffff"></i><i class="sk" id="k4" style="left: 760px; top: 830px; background: #fe6820"></i>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.38"></audio>
      <audio id="s-b" src="assets/sfx/pop.wav" data-start="0.6" data-volume="0.28"></audio>
      <audio id="s-clk" src="assets/sfx/click.wav" data-start="3.0" data-volume="0.3"></audio>
      <audio id="s-sh" src="assets/sfx/shimmer.wav" data-start="3.1" data-volume="0.26"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="4.98" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 5.0;
      const A = GEX.split(document.getElementById("ta")), B = GEX.split(document.getElementById("tb")), C = GEX.split(document.getElementById("tc"));
      gsap.set(["#cta", "#rg", ".dg", ".sk"], { autoAlpha: 0 });
      const cur = GEX.cursor(document.getElementById("scene"));
      gsap.set(cur.c, { x: 1120, y: 900 });
      // la frase
      GEX.reveal(tl, A.words, 0.05, "rise", { stagger: 0.08, duration: 0.36 });
      GEX.reveal(tl, B.chars, 0.5, "drop", { stagger: 0.04, duration: 0.4 });
      GEX.reveal(tl, C.words, 1.6, "rise", { stagger: 0.1, duration: 0.38 });
      tl.fromTo(".dg", { y: (i) => (i < 2 ? -120 : 120), autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.06, immediateRender: false }, 0.9);
      tl.to(".dg", { y: (i) => (i % 2 ? -14 : 14), duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.4);
      // escríbeme
      tl.fromTo("#cta", { y: 60, scale: 0.4, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 2.3);
      tl.fromTo("#cta .pi", { rotation: -180 }, { rotation: 0, duration: 0.5, ease: "back.out(2)" }, 2.35);
      GEX.tap(tl, cur, 640, 660, 2.55, 0.45);
      tl.to("#cta", { keyframes: [{ scale: 0.92, duration: 0.08 }, { scale: 1.1, duration: 0.16 }, { scale: 1, duration: 0.25 }], ease: "sine.out" }, 3.0);
      tl.fromTo("#sh", { x: -140 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 3.1);
      tl.set("#sh", { x: -140 }, 3.75);
      [3.1, 3.7, 4.3].forEach((t) => tl.fromTo("#rg", { scale: 1, borderWidth: 8, autoAlpha: 1 }, { scale: 1.35, borderWidth: 0, autoAlpha: 1, duration: 0.55, ease: "circ.out", immediateRender: false }, t));
      tl.set("#rg", { autoAlpha: 0 }, 4.86);
      tl.fromTo(".sk", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.06, immediateRender: false }, 3.1);
      tl.to(".sk", { y: -20, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2, stagger: 0.08 }, 3.4);
      tl.to(cur.c, { x: 1120, y: 1000, duration: 0.4, ease: "power2.in" }, 3.4);
      tl.to("#cta .pi", { rotation: 12, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5 }, 3.8);
      GEX.scatter(tl, ["#cta", "#d1", "#d2", "#d3", "#d4", "#k1", "#k2", "#k3", "#k4"], EXIT, 142);
      tl.to(A.words.concat(B.chars, C.words), { y: -140, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.015 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
