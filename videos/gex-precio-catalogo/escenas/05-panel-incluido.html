<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Precio 05 — Panel administrativo incluido</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .line { display: flex; align-items: center; gap: 14px; }
      .plus { display: flex; align-items: center; justify-content: center; width: 70px; height: 70px; border-radius: 50%; background: var(--orange); font-weight: 800; font-size: 54px; line-height: 1; padding-bottom: 6px; }
      .stamp { margin-left: 8px; padding: 10px 22px; border-radius: 14px; border: 5px solid #ffffff; font-weight: 800; font-size: 34px; letter-spacing: 0.14em; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="zone" id="zone">
          <div class="line">
            <span class="plus" id="plus">+</span>
            <div class="pill" id="p1">
              <span class="ic"><svg viewBox="0 0 40 40"><rect x="4" y="6" width="32" height="24" rx="4" fill="none" stroke="#0b958b" stroke-width="3.5" /><path d="M10 24v-6 M17 24v-10 M24 24v-4 M31 24v-8" stroke="#ea5a14" stroke-width="3.5" stroke-linecap="round" /><path d="M14 35h12" stroke="#0b958b" stroke-width="3.5" stroke-linecap="round" /></svg></span>
              <span id="t1">Panel administrativo</span><i class="shine" id="sh"></i>
            </div>
          </div>
          <div class="stamp" id="stamp">INCLUIDO</div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.9"></audio>
      <audio id="s-pop" src="assets/sfx/pop.wav" data-start="0.12" data-volume="0.45"></audio>
      <audio id="s-stamp" src="assets/sfx/click.wav" data-start="0.95" data-volume="0.6"></audio>
      <audio id="s-ding" src="assets/sfx/ding.wav" data-start="1.0" data-volume="0.35"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="3.12" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.15;
      const t1 = GEX.split(document.getElementById("t1"));
      tl.fromTo("#plus", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.6)" }, 0.1);
      tl.fromTo("#p1", { x: -120, scaleX: 0.2, transformOrigin: "left center", autoAlpha: 0 }, { x: 0, scaleX: 1, transformOrigin: "left center", autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.25);
      GEX.reveal(tl, t1.chars, 0.35, "rise", { stagger: 0.015, duration: 0.3 });
      // sello "INCLUIDO"
      tl.fromTo("#stamp", { scale: 2.4, rotation: -14, autoAlpha: 0 }, { scale: 1, rotation: -5, autoAlpha: 1, duration: 0.25, ease: "power4.in" }, 0.72);
      tl.to("#zone", { keyframes: [{ y: 6 }, { y: -3 }, { y: 0 }], duration: 0.18, ease: "none" }, 0.97);
      tl.to("#plus", { rotation: 90, duration: 0.5, ease: "back.inOut(2)" }, 1.6);
      tl.fromTo("#sh", { x: -120 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 1.9);
      GEX.float(tl, "#stamp", 1.3, EXIT, 5, 1.2);
      tl.to(["#plus", "#p1", "#stamp"], { x: -700, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
