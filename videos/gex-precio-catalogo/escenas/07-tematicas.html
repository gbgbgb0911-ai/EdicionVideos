<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Precio 07 — Temáticas por temporada</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .season { display: flex; align-items: center; gap: 14px; margin-left: 8px; padding: 12px 28px 12px 14px; border-radius: 999px; background: #ffffff; color: #12201f; font-weight: 800; font-size: 36px; white-space: nowrap; }
      .season .mo { color: #0b958b; }
      .season .hw { color: #c94a0c; }
      #pk { width: 64px; height: 64px; overflow: visible; }
      .bat { position: absolute; width: 70px; height: 36px; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="zone" id="zone">
          <div class="pill" id="p1">
            <span class="ic"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="none" stroke="#0b958b" stroke-width="3.5" /><path d="M20 6v28 M6 20h28 M10 10l20 20 M30 10L10 30" stroke="#ea5a14" stroke-width="2.5" stroke-linecap="round" /></svg></span>
            <span id="t1">Temáticas por temporada</span><i class="shine" id="sh"></i>
          </div>
          <div class="season" id="season">
            <svg id="pk" viewBox="0 0 64 64"><path d="M32 12c-4 0-5-6-2-8" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" /><ellipse cx="20" cy="38" rx="14" ry="20" fill="#ea5a14" /><ellipse cx="44" cy="38" rx="14" ry="20" fill="#ea5a14" /><ellipse cx="32" cy="38" rx="14" ry="22" fill="#f07a2e" /><path d="M22 34l5-5 5 5Z M36 34l5-5 5 5Z" fill="#12201f" /><path d="M22 46c4 4 16 4 20 0l-4 2-3-2-3 2-3-2-3 2Z" fill="#12201f" /></svg>
            <span><span class="mo">Octubre</span> → <span class="hw">Halloween</span></span>
          </div>
        </div>
        <svg class="bat" id="b1" viewBox="0 0 70 36"><path d="M35 14c-3-6-10-10-18-10 4 4 4 8 0 12-6-4-12-2-17 2 8 0 12 6 14 12 4-6 10-8 16-6 1 3 3 4 5 4s4-1 5-4c6-2 12 0 16 6 2-6 6-12 14-12-5-4-11-6-17-2-4-4-4-8 0-12-8 0-15 4-18 10Z" fill="#ffffff" /></svg>
        <svg class="bat" id="b2" viewBox="0 0 70 36"><path d="M35 14c-3-6-10-10-18-10 4 4 4 8 0 12-6-4-12-2-17 2 8 0 12 6 14 12 4-6 10-8 16-6 1 3 3 4 5 4s4-1 5-4c6-2 12 0 16 6 2-6 6-12 14-12-5-4-11-6-17-2-4-4-4-8 0-12-8 0-15 4-18 10Z" fill="#ffffff" /></svg>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.9"></audio>
      <audio id="s-pop" src="assets/sfx/pop.wav" data-start="0.7" data-volume="0.45"></audio>
      <audio id="s-bat" src="assets/sfx/whoosh.wav" data-start="1.1" data-volume="0.5"></audio>
      <audio id="s-ding" src="assets/sfx/ding.wav" data-start="1.0" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="3.62" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.65;
      const t1 = GEX.split(document.getElementById("t1"));
      tl.fromTo("#p1", { x: -700, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.05);
      GEX.reveal(tl, t1.chars, 0.15, "rise", { stagger: 0.015, duration: 0.3 });
      tl.fromTo("#season", { y: -20, scale: 0.5, autoAlpha: 0, transformOrigin: "0% 50%" }, { y: 0, scale: 1, autoAlpha: 1, transformOrigin: "0% 50%", duration: 0.4, ease: "back.out(2.4)" }, 0.7);
      // calabaza rebota
      tl.fromTo("#pk", { y: -40, rotation: -20 }, { y: 0, rotation: 0, duration: 0.6, ease: "bounce.out" }, 0.8);
      tl.to("#pk", { rotation: 8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.5);
      // murciélagos cruzan cerca de la etiqueta
      [["#b1", 40, 560, 1.05], ["#b2", 120, 610, 1.3]].forEach(([id, x0, y0, t]) => {
        tl.fromTo(id, { x: x0 - 140, y: y0, scale: 0.6, autoAlpha: 0 }, { x: x0 + 760, y: y0 - 180, scale: 0.9, autoAlpha: 1, duration: 1.8, ease: "sine.inOut" }, t);
        tl.to(id + " path", { scaleY: 0.4, svgOrigin: "35 18", duration: 0.09, ease: "none", yoyo: true, repeat: 15 }, t);
        tl.to(id, { autoAlpha: 0, duration: 0.2, ease: "none" }, t + 1.6);
      });
      tl.fromTo("#sh", { x: -120 }, { x: 760, duration: 0.6, ease: "power2.inOut" }, 2.2);
      GEX.float(tl, "#zone", 1.3, EXIT, 6, 1.6);
      tl.to(["#p1", "#season"], { x: -760, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
