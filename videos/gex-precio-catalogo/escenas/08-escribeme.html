<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Precio 08 — Escríbeme</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .q { font-weight: 700; font-size: 38px; padding-left: 8px; white-space: nowrap; }
      .logo { margin-left: 8px; padding: 14px 24px; border-radius: 22px; background: #ffffff; }
      .logo img { display: block; height: 58px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="zone" id="zone">
          <div class="q" id="q">¿Necesitas soluciones digitales así?</div>
          <div class="pill wa" id="p1">
            <span class="ic"><svg viewBox="0 0 40 40"><path d="M10 31l2-6a10 10 0 1 1 4 4Z" fill="none" stroke="#179a4a" stroke-width="3.5" stroke-linejoin="round" /><path d="M16 15c0 4 4 8 8 8l1-2-3-2-1 1c-1 0-2-1-3-3l1-1-1-3Z" fill="#179a4a" /></svg></span>
            <span id="t1">Escríbeme</span><i class="shine" id="sh"></i>
          </div>
          <div class="logo" id="logo"><img src="assets/logo-v2/gex-full.png" alt="GEX" /></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.8"></audio>
      <audio id="s-pop" src="assets/sfx/pop.wav" data-start="0.55" data-volume="0.45"></audio>
      <audio id="s-click" src="assets/sfx/click.wav" data-start="1.6" data-volume="0.5"></audio>
      <audio id="s-pop2" src="assets/sfx/pop.wav" data-start="0.95" data-volume="0.35"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="3.62" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.65;
      const q = GEX.split(document.getElementById("q"));
      const t1 = GEX.split(document.getElementById("t1"));
      GEX.reveal(tl, q.words, 0.05, "rise", { stagger: 0.05, duration: 0.35 });
      tl.fromTo("#p1", { scale: 0.3, autoAlpha: 0, transformOrigin: "0% 50%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 50%", duration: 0.45, ease: "back.out(2.4)" }, 0.55);
      GEX.reveal(tl, t1.chars, 0.65, "pop", { stagger: 0.03, duration: 0.3 });
      tl.fromTo("#logo", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.95);
      // botón "presionado" y latido de invitación
      tl.to("#p1", { keyframes: [{ scale: 0.93, duration: 0.07 }, { scale: 1.06, duration: 0.14 }, { scale: 1, duration: 0.2 }], transformOrigin: "0% 50%", ease: "sine.out" }, 1.58);
      tl.to("#p1", { scale: 1.04, transformOrigin: "0% 50%", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.1);
      tl.fromTo("#sh", { x: -120 }, { x: 520, duration: 0.55, ease: "power2.inOut" }, 1.9);
      tl.to(["#q", "#p1", "#logo"], { x: -760, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
