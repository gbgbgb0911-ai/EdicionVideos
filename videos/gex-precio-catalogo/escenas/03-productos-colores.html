<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Precio 03 — Productos y colores</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .swatches { display: flex; gap: 14px; padding: 14px 20px; border-radius: 999px; background: #ffffff; margin-left: 8px; }
      .sw { width: 50px; height: 50px; border-radius: 50%; border: 4px solid #ffffff; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="zone" id="zone">
          <div class="pill" id="p1">
            <span class="ic"><svg viewBox="0 0 40 40"><path d="M10 9l6-3c1 2 2 3 4 3s3-1 4-3l6 3 6 8-5 4-3-3v16H14V18l-3 3-5-4Z" fill="#0b958b" /></svg></span>
            <span id="t1">Ilustraciones y colores</span><i class="shine" id="sh"></i>
          </div>
          <div class="swatches" id="sws">
            <span class="sw" style="background: #e74c3c"></span><span class="sw" style="background: #f5b041"></span><span class="sw" style="background: #2e86c1"></span><span class="sw" style="background: #27ae60"></span><span class="sw" style="background: #8e44ad"></span><span class="sw" style="background: #f0e6d2"></span>
          </div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.9"></audio>
      <audio id="s-p1" src="assets/sfx/pop.wav" data-start="0.62" data-volume="0.35"></audio>
      <audio id="s-p2" src="assets/sfx/pop.wav" data-start="0.72" data-volume="0.35"></audio>
      <audio id="s-p3" src="assets/sfx/pop.wav" data-start="0.82" data-volume="0.35"></audio>
      <audio id="s-p4" src="assets/sfx/pop.wav" data-start="0.92" data-volume="0.35"></audio>
      <audio id="s-p5" src="assets/sfx/pop.wav" data-start="1.02" data-volume="0.35"></audio>
      <audio id="s-p6" src="assets/sfx/pop.wav" data-start="1.12" data-volume="0.35"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="3.12" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.15;
      const t1 = GEX.split(document.getElementById("t1"));
      tl.fromTo("#p1", { x: -620, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.05);
      GEX.reveal(tl, t1.chars, 0.15, "rise", { stagger: 0.015, duration: 0.3 });
      tl.fromTo("#sws", { scaleX: 0, transformOrigin: "left center", autoAlpha: 0 }, { scaleX: 1, transformOrigin: "left center", autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 0.45);
      tl.fromTo(".sw", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3.5)", stagger: 0.1 }, 0.6);
      // los colores "laten" en ola, como seleccionando variantes
      tl.to(".sw", { keyframes: [{ scale: 1.25, duration: 0.14 }, { scale: 1, duration: 0.22 }], ease: "sine.inOut", stagger: 0.09 }, 1.6);
      tl.fromTo("#sh", { x: -120 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 2.4);
      GEX.float(tl, "#zone", 1.2, EXIT, 6, 1.6);
      tl.to(["#p1", "#sws"], { x: -700, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
