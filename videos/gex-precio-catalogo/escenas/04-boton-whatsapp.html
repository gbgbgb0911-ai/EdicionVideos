<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Precio 04 — Botón a WhatsApp</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .bub { position: relative; margin-left: 30px; padding: 18px 26px 14px; border-radius: 28px 28px 28px 8px; background: #ffffff; color: #12201f; font-weight: 700; font-size: 34px; line-height: 1.2; white-space: nowrap; }
      .bub .tk { display: block; text-align: right; font-size: 22px; color: #1f7fc4; font-weight: 800; margin-top: 2px; }
      .bub .typed { display: inline-block; min-width: 10px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="zone" id="zone">
          <div class="pill wa" id="p1">
            <span class="ic"><svg viewBox="0 0 40 40"><path d="M10 31l2-6a10 10 0 1 1 4 4Z" fill="none" stroke="#179a4a" stroke-width="3.5" stroke-linejoin="round" /><path d="M16 15c0 4 4 8 8 8l1-2-3-2-1 1c-1 0-2-1-3-3l1-1-1-3Z" fill="#179a4a" /></svg></span>
            <span id="t1">Un botón directo a WhatsApp</span><i class="shine" id="sh"></i>
          </div>
          <div class="bub" id="bub"><span class="typed" id="typed"></span><span class="tk" id="tk">✓✓</span></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.9"></audio>
      <audio id="s-click" src="assets/sfx/click.wav" data-start="0.6" data-volume="0.5"></audio>
      <audio id="s-pop" src="assets/sfx/pop.wav" data-start="0.75" data-volume="0.45"></audio>
      <audio id="s-ding" src="assets/sfx/ding.wav" data-start="2.3" data-volume="0.35"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="3.62" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.65;
      const t1 = GEX.split(document.getElementById("t1"));
      tl.fromTo("#p1", { x: -700, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.05);
      GEX.reveal(tl, t1.chars, 0.15, "rise", { stagger: 0.014, duration: 0.3 });
      // "toque" del botón
      tl.to("#p1", { keyframes: [{ scale: 0.94, duration: 0.07 }, { scale: 1.04, duration: 0.12 }, { scale: 1, duration: 0.18 }], ease: "sine.out" }, 0.58);
      tl.fromTo("#bub", { scale: 0.3, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 100%", duration: 0.4, ease: "back.out(2.4)" }, 0.75);
      // mensaje predeterminado escribiéndose
      const msg = "¡Hola! Quiero el vestido en talla M";
      const p = { n: 0 };
      const ty = document.getElementById("typed");
      ty.textContent = "";
      tl.fromTo(p, { n: 0 }, { n: msg.length, duration: 1.1, ease: "none", onUpdate: () => { ty.textContent = msg.slice(0, Math.round(p.n)); } }, 1.0);
      tl.fromTo("#tk", { autoAlpha: 0, x: -10 }, { autoAlpha: 1, x: 0, duration: 0.25, ease: "power2.out" }, 2.25);
      tl.fromTo("#sh", { x: -120 }, { x: 760, duration: 0.6, ease: "power2.inOut" }, 2.4);
      GEX.float(tl, "#zone", 1.2, EXIT, 6, 1.6);
      tl.to(["#p1", "#bub"], { x: -760, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.05 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
