<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Otro país 02 — ¿Cómo trabajamos desde países diferentes?</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .pin .av { width: 100px; height: 100px; }
      .pin .av svg { width: 54px; height: 54px; }
      .q { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #ea5a14; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 44px; border: 5px solid #ffffff; }
      #gx { left: 800px; top: 150px; width: 190px; height: 190px; font-size: 54px; }
      #sv { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; pointer-events: none; }
      #dl { position: absolute; left: 0; right: 0; top: 168px; display: flex; justify-content: center; }
      #dl .chip { font-size: 30px; padding: 8px 20px; margin-left: 40px; }
      #qq { position: absolute; left: 0; right: 0; top: 500px; text-align: center; font-weight: 800; font-size: 76px; line-height: 1.02; white-space: nowrap; }
      #qq .hl { color: #fe6820; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.2" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="8.2" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <svg id="sv" viewBox="0 0 1080 960"><path id="ln" class="route" d="M260 245 H 780" /><path id="ar" d="M300 225 L 270 245 L 300 265 M740 225 L 770 245 L 740 265" fill="none" stroke="#1fc4b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <div class="pin" id="p1" style="left: 90px; top: 40px"><span class="av o" data-ic="user" data-col="#ffffff" data-sw="4.5"></span><i></i></div>
          <div class="pin" id="p2" style="left: 90px; top: 190px"><span class="av" data-ic="user" data-col="#ffffff" data-sw="4.5"></span><i></i></div>
          <div class="pin" id="p3" style="left: 90px; top: 340px"><span class="av g" data-ic="user" data-col="#ffffff" data-sw="4.5"></span><i></i></div>
          <span class="q" id="q1" style="left: 190px; top: 20px">?</span>
          <span class="q" id="q2" style="left: 190px; top: 170px">?</span>
          <span class="q" id="q3" style="left: 190px; top: 320px">?</span>
          <div class="gxn" id="gx">GEX</div>
          <div id="dl"><span class="chip" id="dc">Países diferentes</span></div>
          <div id="qq"><span id="qt">¿CÓMO TRABAJAMOS<br />DESDE <span class="hl">PAÍSES<br />DIFERENTES?</span></span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-q" src="assets/sfx/pop.wav" data-start="3.0" data-volume="0.28"></audio>
      <audio id="s-hit" src="assets/sfx/ding.wav" data-start="4.3" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="7.78" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 7.8;
      const parts = GEX.particles(document.getElementById("fx"), 8, 1711, { x0: 300, x1: 760, y0: 290, y1: 470 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      const qt = GEX.split(document.getElementById("qt"));
      gsap.set([".q", "#ln", "#ar", "#dc"], { autoAlpha: 0 });
      tl.fromTo(".pin", { x: -150, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.1 }, 0.1);
      tl.fromTo("#gx", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.6)" }, 0.3);
      // la distancia entre ellos y GEX
      tl.fromTo("#ln", { autoAlpha: 0, scaleX: 0, transformOrigin: "50% 50%" }, { autoAlpha: 1, scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.0);
      tl.fromTo("#ln", { strokeDashoffset: 0 }, { strokeDashoffset: -224, duration: EXIT - 1.0, ease: "none" }, 1.0);
      tl.fromTo("#ar", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, immediateRender: false }, 1.4);
      tl.fromTo("#dc", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 1.5);
      tl.to(["#p1", "#p2", "#p3"], { x: -12, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.8);
      tl.to("#gx", { x: 12, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.8);
      // la misma preocupación en las tres
      tl.fromTo(".q", { scale: 0, rotation: -90, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", stagger: 0.2, immediateRender: false }, 3.0);
      tl.to(".q", { rotation: 15, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 9, stagger: 0.08 }, 3.7);
      // la pregunta
      GEX.reveal(tl, qt.words, 4.3, "rise", { stagger: 0.12, duration: 0.42 });
      GEX.punch(tl, "#qq .hl", 6.4, 1.1);
      GEX.scatter(tl, ["#p1", "#p2", "#p3", "#q1", "#q2", "#q3", "#gx", "#dc"], EXIT, 82);
      tl.to(qt.words, { y: 140, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.03 }, EXIT);
      tl.to("#sv", { autoAlpha: 0, duration: 0.2 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
