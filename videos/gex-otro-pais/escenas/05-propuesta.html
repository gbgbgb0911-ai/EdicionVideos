<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Otro país 05 — Propuesta personalizada</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #nt { left: 60px; top: 380px; width: 320px; }
      #nt .dh { height: 70px; background: #0b958b; color: #ffffff; display: flex; align-items: center; gap: 10px; padding: 0 18px; font-weight: 800; font-size: 28px; white-space: nowrap; }
      #nt .dh .ico { width: 46px; height: 46px; background: #ffffff; }
      #nt .ls { display: flex; flex-direction: column; gap: 14px; padding: 18px; }
      #nt .chip { font-size: 28px; padding: 8px 16px; align-self: flex-start; }
      .fly { position: absolute; z-index: 6; font-size: 28px; padding: 8px 16px; }
      #arr { position: absolute; left: 384px; top: 566px; font-weight: 800; font-size: 60px; line-height: 1; color: #fe6820; }
      #doc { left: 460px; top: 330px; width: 560px; }
      #doc .dh { height: 84px; background: #ea5a14; color: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-weight: 800; font-size: 34px; letter-spacing: 0.06em; white-space: nowrap; }
      #doc .dh small { font-size: 28px; letter-spacing: 0; }
      .sec { display: flex; gap: 18px; padding: 24px; border-bottom: 4px solid #dfe7e6; background: #ffffff; }
      .sec:last-child { border-bottom: 0; }
      .sec .ico { width: 84px; height: 84px; flex: none; }
      .sec .tx { flex: 1; display: flex; flex-direction: column; gap: 14px; }
      .sec b { font-weight: 800; font-size: 38px; white-space: nowrap; }
      .sec .ln { display: flex; flex-wrap: wrap; gap: 10px; }
      .sec .dl { height: 14px; border-radius: 7px; background: #dfe7e6; transform-origin: 0% 50%; }
      .sec .md { display: inline-block; width: 70px; height: 40px; border-radius: 10px; background: #d6f3f0; }
      #rv { position: absolute; left: 640px; top: 900px; font-size: 34px; padding: 10px 24px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="6.6" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="6.6" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="st3" id="st3"></div>
        <div class="doc" id="nt"><div class="dh"><span class="ico" data-ic="video" data-sw="4.5"></span>Notas del Meet</div><div class="ls"><span class="chip" id="n1">Tu negocio</span><span class="chip o" id="n2">Necesidades</span><span class="chip g" id="n3">Soluciones</span></div></div>
        <div id="arr" data-layout-allow-occlusion>→</div>
        <div class="doc" id="doc"><div class="dh">PROPUESTA<small>Para ti</small></div>
          <div class="sec" id="s1"><span class="ico" data-ic="grid"></span><span class="tx"><b>Funcionalidades</b><span class="ln"><i class="md"></i><i class="md"></i><i class="md"></i><i class="md"></i></span></span></div>
          <div class="sec" id="s2"><span class="ico" data-ic="money" data-col="#ea5a14"></span><span class="tx"><b>Presupuesto</b><span class="ln"><i class="dl" style="width: 200px"></i><i class="dl" style="width: 120px"></i></span></span></div>
          <div class="sec" id="s3"><span class="ico" data-ic="calendar" data-col="#179a4a"></span><span class="tx"><b>Tiempos de entrega</b><span class="ln"><i class="dl" style="width: 160px"></i><i class="dl" style="width: 180px"></i></span></span></div>
        </div>
        <span class="chip g" id="rv">Lista para revisar ✓</span>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-f" src="assets/sfx/whoosh.wav" data-start="1.5" data-volume="0.3"></audio>
      <audio id="s-1" src="assets/sfx/tick.wav" data-start="3.4" data-volume="0.26"></audio>
      <audio id="s-3" src="assets/sfx/tick.wav" data-start="5.0" data-volume="0.26"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="5.7" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.steps3(document.getElementById("st3"), 1);
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.2;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 8, 1771, { x0: 60, x1: 400, y0: 820, y1: 1300 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set(["#arr", "#doc", "#rv"], { autoAlpha: 0 });
      gsap.set(".sec .dl, .sec .md", { scaleX: 0 });
      tl.fromTo(".st3 > *", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.6)", stagger: 0.07 }, 0.3);
      GEX.punch(tl, ".st3 .it.cur", 0.7, 1.12);
      // lo conversado en la reunión...
      tl.fromTo("#nt", { x: -300, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.35);
      tl.fromTo("#nt .chip", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.1 }, 0.7);
      // ...se convierte en una propuesta organizada
      tl.fromTo("#arr", { x: -30, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 1.4);
      tl.to("#arr", { x: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7 }, 1.8);
      tl.fromTo("#doc", { y: 300, rotation: 4, autoAlpha: 0 }, { y: 0, rotation: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, 1.5);
      tl.to("#nt .chip", { x: 260, y: 140, scale: 0.6, duration: 0.45, ease: "power2.in", stagger: 0.12 }, 1.9);
      tl.to("#nt .chip", { autoAlpha: 0, duration: 0.1, stagger: 0.12 }, 2.3);
      tl.to("#nt .chip", { x: 0, y: 0, scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.08 }, 3.0);
      [["#s1", 3.4], ["#s2", 4.3], ["#s3", 5.0]].forEach(([id, t]) => {
        tl.to(id, { keyframes: [{ backgroundColor: "#eef9f8", duration: 0.12 }, { backgroundColor: "#ffffff", duration: 0.5 }], ease: "none" }, t);
        tl.fromTo(id + " .ico", { scale: 0.6, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)", immediateRender: false }, t);
        tl.to(id + " .dl, " + id + " .md", { scaleX: 1, duration: 0.3, ease: "power2.out", stagger: 0.08 }, t + 0.05);
      });
      tl.fromTo("#rv", { scale: 0, rotation: -15, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 5.7);
      // salida + barrido
      GEX.scatter(tl, ["#nt", "#arr", "#doc", "#rv", "#st3"], EXIT, 85);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
