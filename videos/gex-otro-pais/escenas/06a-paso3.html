<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Otro país 06a-paso3 — Paso 3</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #bg { position: absolute; left: 0; right: 0; top: 140px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
      #ic { width: 250px; height: 250px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      #ic svg { width: 150px; height: 150px; }
      #pn { font-weight: 800; font-size: 46px; letter-spacing: 0.16em; color: #1fc4b8; white-space: nowrap; }
      #tt { font-weight: 800; font-size: 104px; line-height: 1; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="2.6" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="2.6" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="bg"><div id="ic" data-ic="code" data-col="#ea5a14" data-sw="4.5"></div><div id="pn">PASO 3</div><div id="tt"><span id="tx">Avances</span></div></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-hit" src="assets/sfx/impact.wav" data-start="0.3" data-volume="0.34"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="2.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 2.2;
      const parts = GEX.particles(document.getElementById("fx"), 6, 1761, { x0: 20, x1: 170, y0: 60, y1: 920 }).concat(GEX.particles(document.getElementById("fx"), 6, 1761 + 1, { x0: 910, x1: 1060, y0: 60, y1: 920 }));
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      const tx = GEX.split(document.getElementById("tx"));
      tl.fromTo("#ic", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      tl.fromTo("#pn", { y: -40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "power3.out" }, 0.25);
      GEX.reveal(tl, tx.chars, 0.3, "drop", { stagger: 0.04, duration: 0.4 });
      tl.to("#ic", { rotation: 8, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.9);
      GEX.scatter(tl, ["#ic", "#pn"], EXIT, 1761);
      tl.to(tx.chars, { y: -160, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.02 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
