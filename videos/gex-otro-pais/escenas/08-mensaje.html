<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Otro país 08 — Comunicación, proceso claro y resultado</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 20px; top: 200px; }
      #mp { position: relative; font-size: 42px; padding: 12px 30px 12px 12px; background: #ffffff; color: #0b958b; }
      #mp .pi { width: 64px; height: 64px; background: #0b958b; }
      #mp .pi svg { width: 40px; height: 40px; }
      #sk { position: absolute; left: 10px; right: 10px; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px; background: #fe6820; transform-origin: 0% 50%; }
      #li { font-weight: 800; font-size: 36px; letter-spacing: 0.16em; color: #1fc4b8; white-space: nowrap; }
      .kp { font-size: 40px; padding: 12px 30px 12px 12px; }
      .kp .pi { width: 66px; height: 66px; }
      .kp .pi svg { width: 40px; height: 40px; }
      #k3 { font-size: 34px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="9.0" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="9.0" data-track-index="0">
        <div class="top" id="top">
          <div class="pill" id="mp"><span class="pi" data-ic="pin" data-col="#ffffff" data-sw="4.5"></span>Mismo país<i id="sk"></i></div>
          <div id="li">LO IMPORTANTE</div>
          <div class="pill kp" id="k1"><span class="pi" data-ic="chat" data-sw="4.5"></span>BUENA COMUNICACIÓN</div>
          <div class="pill o kp" id="k2"><span class="pi" data-ic="doc" data-col="#ea5a14" data-sw="4.5"></span>PROCESO CLARO</div>
          <div class="pill g kp" id="k3"><span class="pi" data-ic="check" data-col="#179a4a" data-sw="6"></span>RESULTADO ADAPTADO A TUS NECESIDADES</div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.38"></audio>
      <audio id="s-sk" src="assets/sfx/tick.wav" data-start="1.8" data-volume="0.26"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="4.4" data-volume="0.28"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="6.0" data-volume="0.28"></audio>
      <audio id="s-3" src="assets/sfx/success.wav" data-start="7.4" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.58" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.6;
      gsap.set(["#li", ".kp"], { autoAlpha: 0 });
      gsap.set("#sk", { scaleX: 0 });
      // no es estar en el mismo país...
      tl.fromTo("#mp", { y: -50, scale: 0.6, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)" }, 0.2);
      tl.to("#sk", { scaleX: 1, duration: 0.35, ease: "power3.out" }, 1.8);
      tl.to("#mp", { rotation: -3, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.1);
      // ...sino esto
      tl.fromTo("#li", { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 3.4);
      [["#k1", 4.4], ["#k2", 6.0], ["#k3", 7.4]].forEach(([id, t], i) => {
        tl.fromTo(id, { x: i % 2 ? 120 : -120, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(2)", immediateRender: false }, t);
        tl.fromTo(id + " .pi", { rotation: -150 }, { rotation: 0, duration: 0.5, ease: "back.out(2)" }, t + 0.05);
        GEX.float(tl, id, t + 0.5, EXIT, 5, 1.4 + i * 0.2);
      });
      GEX.scatter(tl, ["#mp", "#li", "#k1", "#k2", "#k3"], EXIT, 88);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
