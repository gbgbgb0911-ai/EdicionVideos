<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Proceso 05b — Revisas el MVP, luz verde y 50% restante</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #app { position: absolute; left: 80px; top: 380px; width: 600px; height: 380px; }
      #app .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .sk { border-radius: 12px; background: #eef4f3; }
      #app .h { height: 54px; background: #0b958b; }
      #app .cards { display: flex; gap: 10px; }
      #app .cards .sk { flex: 1; height: 120px; }
      #app .bt { height: 54px; width: 50%; background: #ea5a14; }
      #cli { position: absolute; left: 760px; top: 420px; width: 220px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      #cli .av { width: 160px; height: 160px; font-size: 70px; }
      #eye { position: absolute; right: 18px; top: 110px; width: 74px; height: 74px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      #eye svg { width: 46px; height: 46px; }
      #cli .chip { font-size: 30px; }
      #bw { position: absolute; left: 0; right: 0; top: 810px; display: flex; justify-content: center; }
      #bb { position: relative; padding: 18px 30px; border-radius: 30px; background: #ffffff; color: #0b958b; font-weight: 800; font-size: 36px; white-space: nowrap; }
      #bb small { display: block; font-size: 28px; color: #ea5a14; margin-bottom: 4px; }
      #lt { position: absolute; left: 120px; top: 980px; width: 170px; height: 420px; border-radius: 40px; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
      #lt i { width: 100px; height: 100px; border-radius: 50%; background: #dfe7e6; }
      #gv { position: absolute; left: 70px; top: 1420px; font-size: 34px; padding: 10px 24px; }
      #ring { position: absolute; left: 420px; top: 960px; width: 460px; height: 460px; }
      #rt { position: absolute; left: 420px; top: 960px; width: 460px; height: 460px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #rt b { font-weight: 800; font-size: 118px; line-height: 1; }
      #rt small { font-weight: 800; font-size: 34px; letter-spacing: 0.1em; color: #1fc4b8; white-space: nowrap; margin-top: 6px; }
      #rt .chip { margin-top: 12px; font-size: 30px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="12.8" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="12.8" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="stp" id="stp"></div>
        <div class="stp" id="stp2"></div>
        <div class="win" id="app"><div class="bar"><i></i><i></i><i></i><b>MVP · versión 1</b></div><div class="body"><div class="sk h"></div><div class="cards"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><div class="sk bt"></div></div></div>
        <div id="cli"><span class="av o">M</span><span id="eye" data-ic="eye" data-sw="4.5"></span><span class="chip o">Revisas</span></div>
        <div id="bw"><div id="bb"><small>“Sabes qué, Gabriel…”</small>Me gusta el camino por donde estamos yendo</div></div>
        <div id="lt"><i id="l1"></i><i id="l2"></i><i id="l3"></i></div>
        <span class="chip g" id="gv">LUZ VERDE ✓</span>
        <svg id="ring" viewBox="0 0 460 460"><circle cx="230" cy="230" r="190" fill="none" stroke="#dfe7e6" stroke-width="10" /><circle id="arc" cx="230" cy="230" r="190" fill="none" stroke="#1fc4b8" stroke-width="38" stroke-linecap="round" transform="rotate(-90 230 230)" /></svg>
        <div id="rt"><b class="num" id="pct">50%</b><small>SEGUNDO PAGO</small><span class="chip o" id="rc">50% restante</span></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-b" src="assets/sfx/pop.wav" data-start="2.4" data-volume="0.28"></audio>
      <audio id="s-g" src="assets/sfx/success.wav" data-start="6.7" data-volume="0.3"></audio>
      <audio id="s-p" src="assets/sfx/ding.wav" data-start="10.6" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="12.38" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      GEX.stepper(document.getElementById("stp"), 5);
      GEX.stepper(document.getElementById("stp2"), 6);
      const tl = gsap.timeline({ paused: true });
      const EXIT = 12.4;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 8, 1571, { x0: 900, x1: 1040, y0: 960, y1: 1500 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      const C = 2 * Math.PI * 190;
      gsap.set("#arc", { strokeDasharray: C, strokeDashoffset: C / 2 });
      gsap.set(["#stp2", "#cli", "#bb", "#lt", "#gv", "#ring", "#rt", "#rc"], { autoAlpha: 0 });
      tl.fromTo("#stp .sd", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.04 }, 0.3);
      tl.fromTo("#stp .sl", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out", stagger: 0.04 }, 0.35);
      tl.fromTo("#stp .chip", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, 0.6);
      // ves el proyecto
      tl.fromTo("#app", { x: -500, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo("#cli", { x: 300, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, 0.6);
      tl.to("#eye", { keyframes: [{ x: -14, duration: 0.4 }, { x: 10, duration: 0.5 }, { x: 0, duration: 0.4 }], ease: "sine.inOut", repeat: 1 }, 1.0);
      // "me gusta el camino..."
      tl.fromTo("#bb", { y: 60, scale: 0.4, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 2.4);
      tl.to("#bb", { rotation: -1.5, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 5 }, 3.0);
      // luz verde
      tl.fromTo("#lt", { y: 200, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, 6.3);
      tl.to("#l3", { backgroundColor: "#179a4a", scale: 1.12, duration: 0.2, ease: "back.out(3)" }, 6.7);
      tl.to("#l3", { scale: 1, duration: 0.3, ease: "sine.inOut" }, 6.9);
      tl.to("#l3", { backgroundColor: "#1fb85a", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, 7.2);
      tl.fromTo("#gv", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 6.8);
      GEX.punch(tl, "#cli .av", 6.8, 1.15);
      // 50% restante
      tl.fromTo(["#ring", "#rt"], { scale: 0.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, 9.0);
      tl.to("#arc", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 9.6);
      GEX.count(tl, document.getElementById("pct"), 50, 100, 9.6, 1.0, "", "%");
      tl.fromTo("#rc", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 9.3);
      GEX.punch(tl, "#rt b", 10.6, 1.15);
      tl.set("#stp", { autoAlpha: 0 }, 9.0);
      tl.set("#stp2", { autoAlpha: 1 }, 9.0);
      GEX.punch(tl, "#stp2 .sd.cur", 9.0, 1.3);
      GEX.punch(tl, "#stp2 .chip", 9.0, 1.1);
      GEX.punch(tl, "#stp2 .sd.cur", 10.6, 1.3);
      tl.to("#ring", { rotation: 10, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 10.9);
      GEX.float(tl, "#app", 1.0, EXIT, 5, 1.8);
      // salida + barrido
      GEX.scatter(tl, ["#app", "#cli", "#bb", "#lt", "#gv", "#ring", "#rt", "#stp2"], EXIT, 69);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
