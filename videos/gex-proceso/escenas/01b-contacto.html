<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Proceso 01b — Primer contacto: saludo y nombre</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .bbl { font-size: 40px; max-width: none; }
      .bbl.in { left: 150px; }
      .bbl.out { right: 150px; }
      .ava { position: absolute; width: 74px; height: 74px; font-size: 32px; }
      #me { right: 50px; top: 236px; width: 74px; height: 74px; border-radius: 50%; background: #ffffff; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 28px; color: #0b958b; }
      #dots { position: absolute; right: 150px; top: 250px; display: flex; gap: 10px; padding: 22px 26px; border-radius: 28px; background: #0b958b; }
      #dots i { width: 16px; height: 16px; border-radius: 50%; background: #ffffff; }
      #card { position: absolute; left: 0; right: 0; top: 640px; display: flex; justify-content: center; }
      #cc { display: flex; align-items: center; gap: 20px; padding: 18px 30px 18px 18px; border-radius: 30px; background: #ffffff; color: #0b958b; font-weight: 800; font-size: 44px; white-space: nowrap; }
      #cc .ico { width: 90px; height: 90px; background: #eef4f3; }
      #cc .chip { font-size: 34px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="9.4" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="9.4" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <span class="av o ava" id="cli" style="left: 50px; top: 90px">M</span>
          <span class="bbl in" id="b1" style="top: 90px">Hola, quiero un sistema o una web</span>
          <span id="me">GEX</span>
          <span id="dots"><i></i><i></i><i></i></span>
          <span class="bbl out" id="b2" style="top: 236px">¡Hola! Un gusto saludarte</span>
          <span class="bbl out" id="b3" style="top: 350px">¿Cuál es tu nombre?</span>
          <span class="bbl in" id="b4" style="top: 470px">María</span>
          <div id="card"><div id="cc"><span class="ico" data-ic="calendar" data-col="#ea5a14"></span>María<span class="chip g">Agendada ✓</span></div></div>
        </section>
      </div>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="0.4" data-volume="0.3"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="4.6" data-volume="0.28"></audio>
      <audio id="s-4" src="assets/sfx/pop.wav" data-start="7.0" data-volume="0.28"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="7.9" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.98" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 9.0;
      const parts = GEX.particles(document.getElementById("fx"), 10, 1501, { x0: 20, x1: 1060, y0: 560, y1: 920 });
      GEX.ambient(tl, parts, 0.5, EXIT + 0.3);
      gsap.set(["#b2", "#b3", "#b4", "#card", "#me", "#dots"], { autoAlpha: 0 });
      const msg = (id, t, from) => tl.fromTo(id, { scale: 0.3, autoAlpha: 0, transformOrigin: from }, { scale: 1, autoAlpha: 1, transformOrigin: from, duration: 0.38, ease: "back.out(2.4)", immediateRender: false }, t);
      tl.fromTo("#cli", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, 0.2);
      msg("#b1", 0.4, "0% 100%");
      tl.to("#b1", { rotation: -2, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.0);
      // escribiendo...
      tl.fromTo("#me", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 3.4);
      tl.fromTo("#dots", { scale: 0, autoAlpha: 0, transformOrigin: "100% 100%" }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, 3.6);
      tl.to("#dots i", { y: -10, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.1 }, 3.8);
      tl.to("#dots", { scale: 0, autoAlpha: 0, duration: 0.15, ease: "power2.in" }, 4.5);
      // saludo y nombre
      msg("#b2", 4.6, "100% 100%");
      tl.to("#me", { y: 114, duration: 0.4, ease: "power3.inOut" }, 5.7);
      msg("#b3", 5.8, "100% 100%");
      tl.to("#cli", { y: 380, duration: 0.4, ease: "power3.inOut" }, 6.9);
      msg("#b4", 7.0, "0% 100%");
      // queda agendada
      tl.fromTo("#card", { y: 80, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 7.8);
      tl.fromTo("#cc .ico", { rotation: -120, scale: 0 }, { rotation: 0, scale: 1, duration: 0.45, ease: "back.out(2.6)" }, 7.9);
      GEX.punch(tl, "#cc .chip", 8.25, 1.2);
      GEX.scatter(tl, ["#cli", "#b1", "#me", "#b2", "#b3", "#b4", "#card"], EXIT, 62);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
