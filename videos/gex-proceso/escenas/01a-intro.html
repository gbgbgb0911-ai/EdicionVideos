<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Proceso 01a — Así trabajo con mis clientes</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 22px; top: 200px; }
      #sub { font-weight: 800; font-size: 36px; letter-spacing: 0.16em; color: #1fc4b8; white-space: nowrap; }
      #ttl { font-weight: 800; font-size: 84px; line-height: 0.95; white-space: nowrap; }
      #ttl .hl { color: #fe6820; }
      #path { display: flex; align-items: flex-start; gap: 0; margin-top: 16px; }
      .nd { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 175px; }
      .nd .ico { width: 104px; height: 104px; background: #ffffff; }
      .nd .ico svg { width: 58%; height: 58%; }
      .nd .chip { font-size: 30px; padding: 6px 18px; }
      .cn { width: 50px; height: 8px; border-radius: 4px; background: #1fc4b8; margin-top: 48px; transform-origin: 0% 50%; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.3" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="5.3" data-track-index="0">
        <div class="top" id="top">
          <div id="sub">CÓMO TRABAJO CONTIGO</div>
          <div id="ttl"><span id="tt">De contacto a <span class="hl">entrega</span></span></div>
          <div id="path">
            <div class="nd" id="n1"><span class="ico" data-ic="chat"></span><span class="chip" id="l1">Contacto</span></div>
            <i class="cn" id="c1"></i>
            <div class="nd" id="n2"><span class="ico" data-ic="video"></span></div>
            <i class="cn" id="c2"></i>
            <div class="nd" id="n3"><span class="ico" data-ic="doc" data-col="#ea5a14"></span></div>
            <i class="cn" id="c3"></i>
            <div class="nd" id="n4"><span class="ico" data-ic="box" data-col="#179a4a"></span><span class="chip g" id="l4">Entrega</span></div>
          </div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.4"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="2.4" data-volume="0.28"></audio>
      <audio id="s-4" src="assets/sfx/ding.wav" data-start="4.0" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="4.88" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.9;
      const tt = GEX.split(document.getElementById("tt"));
      gsap.set([".nd", ".nd .chip"], { autoAlpha: 0 });
      gsap.set(".cn", { scaleX: 0 });
      tl.fromTo("#sub", { y: -40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 0.05);
      GEX.reveal(tl, tt.words, 0.2, "rise", { stagger: 0.1, duration: 0.42 });
      // del primer mensaje...
      tl.fromTo("#n1", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)", immediateRender: false }, 2.4);
      tl.fromTo("#l1", { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 2.55);
      // ...pasando por cada etapa...
      [["#c1", "#n2"], ["#c2", "#n3"], ["#c3", "#n4"]].forEach(([c, n], i) => {
        const t = 2.9 + i * 0.35;
        tl.to(c, { scaleX: 1, duration: 0.25, ease: "power2.out" }, t);
        tl.fromTo(n, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, t + 0.18);
      });
      // ...hasta la entrega
      tl.fromTo("#l4", { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 4.0);
      GEX.punch(tl, "#n4 .ico", 4.0, 1.2);
      tl.to(".nd .ico", { y: -10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.08 }, 4.25);
      GEX.scatter(tl, ["#sub", "#n1", "#c1", "#n2", "#c2", "#n3", "#c3", "#n4"], EXIT, 61);
      tl.to(tt.words, { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.03 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
