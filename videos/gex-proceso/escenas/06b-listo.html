<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Proceso 06b — Integraciones y ajustes listos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #ok { position: absolute; left: 0; right: 0; top: 110px; display: flex; justify-content: center; }
      #ok span { width: 230px; height: 230px; border-radius: 50%; background: #179a4a; display: flex; align-items: center; justify-content: center; }
      #ok svg { width: 140px; height: 140px; }
      #rows { position: absolute; left: 0; right: 0; top: 420px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
      #rows .pill { font-size: 48px; padding: 14px 36px 14px 14px; }
      #rows .pi { width: 72px; height: 72px; }
      #rows .pi svg { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.6" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="3.6" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="ok"><span data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
          <div id="rows"><div class="pill" id="r1"><span class="pi" data-ic="plug" data-sw="4.5"></span>Integraciones ✓</div><div class="pill o" id="r2"><span class="pi" data-ic="sliders" data-col="#ea5a14" data-sw="4.5"></span>Ajustes ✓</div></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="0.3" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.2;
      const parts = GEX.particles(document.getElementById("fx"), 12, 1591, { x0: 20, x1: 1060, y0: 60, y1: 920 });
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      tl.fromTo("#ok span", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 0.1);
      tl.fromTo("#ok svg", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 0.35);
      tl.fromTo("#rows .pill", { x: (i) => (i ? 300 : -300), autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(2)", stagger: 0.15 }, 0.5);
      tl.to("#ok span", { scale: 1.08, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.2);
      tl.to("#rows .pi", { rotation: 12, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5, stagger: 0.1 }, 1.3);
      GEX.scatter(tl, ["#ok", "#r1", "#r2"], EXIT, 71);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
