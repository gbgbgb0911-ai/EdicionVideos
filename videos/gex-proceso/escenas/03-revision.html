<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Proceso 03 — Envío, revisión y ajustes</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .nd { position: absolute; top: 160px; width: 180px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .nd .cir { width: 170px; height: 170px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 54px; }
      .nd .chip { font-size: 32px; }
      #gx .cir { background: #ffffff; color: #0b958b; }
      #cl .cir { background: #ea5a14; color: #ffffff; font-size: 70px; }
      #sv { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; pointer-events: none; }
      .dc { position: absolute; left: 230px; top: 150px; width: 130px; height: 170px; border-radius: 16px; background: #ffffff; z-index: 5; overflow: hidden; }
      .dc .dh { height: 34px; background: #ea5a14; }
      .dc i { display: block; height: 10px; margin: 14px 16px 0; border-radius: 5px; background: #dfe7e6; }
      .dc i.t { background: #1fc4b8; width: 55%; }
      #lens { position: absolute; left: 650px; top: 150px; width: 110px; height: 110px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; z-index: 6; border: 6px solid #1fc4b8; }
      #lens svg { width: 64px; height: 64px; }
      #opts { position: absolute; left: 0; right: 0; top: 560px; display: flex; justify-content: center; gap: 24px; }
      #opts .pill { font-size: 40px; padding: 12px 30px 12px 12px; }
      #opts .pi { width: 64px; height: 64px; }
      #opts .pi svg { width: 40px; height: 40px; }
      #fix { position: absolute; left: 0; right: 0; top: 720px; display: flex; justify-content: center; }
      #fix .chip { font-size: 36px; padding: 10px 26px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="10.8" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="10.8" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <svg id="sv" viewBox="0 0 1080 960"><path id="a1" class="route" d="M290 200 Q 540 40 790 200" /><path id="a2" class="route o" d="M790 360 Q 540 500 290 360" /></svg>
          <div class="nd" id="gx" style="left: 100px"><span class="cir">GEX</span><span class="chip">Yo</span></div>
          <div class="nd" id="cl" style="left: 800px"><span class="cir">M</span><span class="chip o">Tú</span></div>
          <div class="dc" id="dc"><div class="dh"></div><i class="t"></i><i></i><i></i><i class="t"></i><i></i></div>
          <div id="lens" data-ic="search" data-sw="5"></div>
          <div id="opts"><div class="pill g" id="o1"><span class="pi" data-ic="check" data-col="#179a4a" data-sw="6"></span>Me parece bien</div><div class="pill o" id="o2"><span class="pi" data-ic="edit" data-col="#ea5a14" data-sw="5"></span>Ajustar algo</div></div>
          <div id="fix"><span class="chip" id="fc">Ajustamos y seguimos ✓</span></div>
        </section>
      </div>
      <audio id="s-send" src="assets/sfx/whoosh.wav" data-start="2.6" data-volume="0.34"></audio>
      <audio id="s-rev" src="assets/sfx/tick.wav" data-start="4.2" data-volume="0.28"></audio>
      <audio id="s-o1" src="assets/sfx/pop.wav" data-start="6.6" data-volume="0.28"></audio>
      <audio id="s-o2" src="assets/sfx/pop.wav" data-start="8.4" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="10.38" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 10.4;
      const parts = GEX.particles(document.getElementById("fx"), 8, 1541, { x0: 20, x1: 1060, y0: 800, y1: 940 });
      GEX.ambient(tl, parts, 0.5, EXIT + 0.3);
      gsap.set(["#a1", "#a2", "#lens", "#o1", "#o2", "#fc", "#cl"], { autoAlpha: 0 });
      tl.fromTo("#gx", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)" }, 0.1);
      tl.fromTo("#dc", { scale: 0, rotation: -20, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)" }, 0.6);
      tl.to("#dc", { y: -10, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.0);
      tl.fromTo("#cl", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)", immediateRender: false }, 2.2);
      // te la envío
      tl.fromTo("#a1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, immediateRender: false }, 2.5);
      tl.fromTo("#a1", { strokeDashoffset: 0 }, { strokeDashoffset: -224, duration: EXIT - 2.5, ease: "none" }, 2.5);
      tl.to("#dc", { keyframes: [{ x: 230, y: -90, rotation: 12, duration: 0.4 }, { x: 460, y: 0, rotation: 0, duration: 0.4 }], ease: "power1.inOut" }, 2.6);
      GEX.punch(tl, "#cl .cir", 3.4, 1.12);
      // la revisas
      tl.fromTo("#lens", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 4.2);
      tl.to("#lens", { keyframes: [{ x: 50, y: 60, duration: 0.5 }, { x: 0, y: 110, duration: 0.5 }, { x: 40, y: 30, duration: 0.5 }], ease: "sine.inOut" }, 4.5);
      tl.to("#lens", { scale: 0, autoAlpha: 0, duration: 0.25, ease: "back.in(2)" }, 6.1);
      // me comunicas: bien o ajustar
      tl.fromTo("#o1", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 6.6);
      tl.fromTo("#o2", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 8.4);
      // según eso trabajamos: vuelve, se ajusta y regresa
      tl.fromTo("#a2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, immediateRender: false }, 8.8);
      tl.fromTo("#a2", { strokeDashoffset: 0 }, { strokeDashoffset: 224, duration: EXIT - 8.8, ease: "none" }, 8.8);
      tl.to("#dc", { keyframes: [{ x: 230, y: 120, rotation: -10, duration: 0.35 }, { x: 0, y: 30, rotation: 0, duration: 0.35 }, { rotation: 8, duration: 0.1 }, { rotation: -8, duration: 0.1 }, { rotation: 0, duration: 0.1 }, { x: 460, y: 0, duration: 0.45 }], ease: "power1.inOut" }, 8.9);
      tl.fromTo("#fc", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)", immediateRender: false }, 9.9);
      GEX.float(tl, "#o1", 7.1, EXIT, 6, 1.2);
      GEX.scatter(tl, ["#gx", "#cl", "#dc", "#o1", "#o2", "#fc"], EXIT, 66);
      tl.to("#sv", { autoAlpha: 0, duration: 0.2 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
