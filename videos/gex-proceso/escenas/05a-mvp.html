<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Proceso 05a — 7 días para el primer MVP funcional</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #pre { position: absolute; left: 0; right: 0; top: 390px; display: flex; justify-content: center; gap: 18px; }
      #pre .chip { font-size: 34px; padding: 10px 24px; }
      #days { position: absolute; left: 0; right: 0; top: 370px; display: flex; justify-content: center; gap: 12px; }
      .dy { width: 112px; height: 112px; border-radius: 22px; border: 6px solid #dfe7e6; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; color: #ffffff; line-height: 1; }
      .dy small { font-size: 22px; letter-spacing: 0.08em; }
      .dy b { font-size: 46px; }
      #dl { position: absolute; left: 0; right: 0; top: 500px; text-align: center; font-weight: 800; font-size: 40px; letter-spacing: 0.1em; color: #1fc4b8; white-space: nowrap; }
      #doc { left: 70px; top: 640px; width: 300px; height: 400px; }
      #doc .dh { height: 64px; background: #ea5a14; color: #ffffff; display: flex; align-items: center; padding: 0 20px; font-weight: 800; font-size: 28px; letter-spacing: 0.06em; }
      #doc .ls { display: flex; flex-direction: column; gap: 16px; padding: 22px 20px; }
      #arr { position: absolute; left: 385px; top: 790px; font-weight: 800; font-size: 90px; line-height: 1; color: #fe6820; }
      #app { position: absolute; left: 480px; top: 600px; width: 540px; height: 520px; }
      #app .body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
      .sk { border-radius: 14px; background: #dfe7e6; }
      #h1 { height: 70px; }
      .cards { display: flex; gap: 12px; }
      .cards .sk { flex: 1; height: 150px; display: flex; align-items: center; justify-content: center; }
      .cards .ico { width: 70px; height: 70px; background: #ffffff; }
      #h2 { height: 46px; width: 70%; }
      #bt { height: 70px; width: 55%; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 800; font-size: 30px; }
      #fn { position: absolute; left: 820px; top: 560px; font-size: 32px; padding: 10px 22px; z-index: 6; }
      #endw { position: absolute; left: 0; right: 0; top: 1200px; display: flex; justify-content: center; }
      #ep { font-size: 44px; padding: 14px 34px 14px 14px; }
      #ep .pi { width: 70px; height: 70px; }
      #ep .pi svg { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="11.2" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="11.2" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="stp" id="stp"></div>
        <div id="pre"><span class="chip g" id="pa">Propuesta aprobada ✓</span><span class="chip" id="pb">50% inicial ✓</span></div>
        <div id="days"></div>
        <div id="dl">7 DÍAS</div>
        <div class="doc" id="doc"><div class="dh">PROPUESTA</div><div class="ls"><i class="dl" style="width: 80%"></i><i class="dl"></i><i class="dl" style="width: 60%"></i><i class="dl" style="width: 90%"></i><i class="dl" style="width: 70%"></i></div></div>
        <div id="arr">→</div>
        <div class="win" id="app"><div class="bar"><i></i><i></i><i></i><b>MVP · versión 1</b></div>
          <div class="body"><div class="sk" id="h1"></div><div class="cards"><div class="sk" id="k1"><span class="ico" data-ic="chart"></span></div><div class="sk" id="k2"><span class="ico" data-ic="users" data-col="#ea5a14"></span></div><div class="sk" id="k3"><span class="ico" data-ic="calendar" data-col="#179a4a"></span></div></div><div class="sk" id="h2"></div><div class="sk" id="bt"><span id="btt">Guardar</span></div></div></div>
        <span class="chip g" id="fn">Funcional ✓</span>
        <div id="endw"><div class="pill o" id="ep"><span class="pi" data-ic="flag" data-col="#ea5a14" data-sw="5"></span>7 días · primer MVP funcional<i class="shine" id="sh" data-layout-allow-overflow></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-pre" src="assets/sfx/tick.wav" data-start="0.9" data-volume="0.26"></audio>
      <audio id="s-d" src="assets/sfx/pop.wav" data-start="4.6" data-volume="0.28"></audio>
      <audio id="s-tr" src="assets/sfx/whoosh.wav" data-start="6.5" data-volume="0.32"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="9.0" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="10.78" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      GEX.stepper(document.getElementById("stp"), 5);
      const D = document.getElementById("days");
      for (let i = 1; i <= 7; i++) D.innerHTML += '<div class="dy" id="d' + i + '"><small>DÍA</small><b>' + i + "</b></div>";
      const tl = gsap.timeline({ paused: true });
      const EXIT = 10.8;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1561, { x0: 60, x1: 1020, y0: 1300, y1: 1560 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set([".dy", "#dl", "#doc", "#arr", "#app", "#fn", "#ep", ".cards .ico"], { autoAlpha: 0 });
      tl.fromTo(".stp .sd", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.04 }, 0.3);
      tl.fromTo(".stp .sl", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out", stagger: 0.04 }, 0.35);
      tl.fromTo(".stp .chip", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, 0.6);
      // punto de partida: aprobado + 50%
      tl.fromTo("#pre .chip", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)", stagger: 0.25 }, 0.9);
      tl.fromTo("#doc", { x: -300, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out", immediateRender: false }, 1.4);
      GEX.float(tl, "#doc", 1.9, 6.4, 6, 1.4);
      tl.to("#pre .chip", { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.06 }, 4.2);
      // 7 días
      tl.fromTo(".dy", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.6)", stagger: 0.05, immediateRender: false }, 4.5);
      tl.fromTo("#dl", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 4.7);
      for (let i = 1; i <= 7; i++) tl.to("#d" + i, { backgroundColor: i === 7 ? "#ea5a14" : "#0b958b", borderColor: i === 7 ? "#fe6820" : "#0b958b", duration: 0.15 }, 5.0 + i * 0.18);
      GEX.punch(tl, "#d7", 6.3, 1.2);
      // de la propuesta a una primera versión funcional
      tl.fromTo("#arr", { x: -30, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 6.4);
      tl.to("#arr", { x: 12, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7 }, 6.8);
      tl.fromTo("#app", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, 6.5);
      [["#h1", "#0b958b", 7.1], ["#k1", "#eef4f3", 7.4], ["#k2", "#eef4f3", 7.6], ["#k3", "#eef4f3", 7.8], ["#h2", "#cfe9e6", 8.1], ["#bt", "#ea5a14", 8.4]].forEach(([id, c, t]) => tl.to(id, { backgroundColor: c, duration: 0.25, ease: "power2.out" }, t));
      tl.fromTo(".cards .ico", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", stagger: 0.2, immediateRender: false }, 7.45);
      tl.fromTo("#btt", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, 8.45);
      tl.fromTo("#fn", { scale: 0, rotation: -20, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 9.0);
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 9.2);
      tl.fromTo("#sh", { x: -140 }, { x: 800, duration: 0.6, ease: "power2.inOut" }, 9.7);
      tl.set("#sh", { x: -140 }, 10.35);
      GEX.float(tl, "#app", 7.0, EXIT, 5, 1.6);
      // salida + barrido
      GEX.scatter(tl, ["#days", "#dl", "#doc", "#arr", "#app", "#fn", "#ep", "#stp"], EXIT, 68);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
