<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Proceso 07b — Lo que recibes en la entrega</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #grid { position: absolute; left: 80px; top: 380px; width: 920px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
      .cd { height: 440px; border-radius: 34px; background: #ffffff; color: #0b958b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 20px; text-align: center; }
      .cd .ico { width: 124px; height: 124px; }
      .cd .ico svg { width: 60%; height: 60%; }
      .cd b { font-weight: 800; font-size: 40px; line-height: 1.1; }
      .cd .sub { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 56px; }
      .cd .chip { font-size: 30px; padding: 8px 18px; }
      .fld { padding: 10px 20px; border-radius: 16px; background: #eef4f3; font-weight: 800; font-size: 30px; white-space: nowrap; color: #0b958b; }
      #endw { position: absolute; left: 0; right: 0; top: 1330px; display: flex; justify-content: center; }
      #ep { font-size: 42px; padding: 14px 32px 14px 14px; }
      #ep .pi { width: 70px; height: 70px; }
      #ep .pi svg { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="12.0" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="12.0" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="stp" id="stp"></div>
        <div id="grid">
          <div class="cd" id="d1"><span class="ico" data-ic="grid" data-col="#ffffff" style="background: #0b958b"></span><b>Proyecto<br />terminado</b><span class="sub"><span class="chip g" id="s1">Entregado ✓</span></span></div>
          <div class="cd" id="d2"><span class="ico" data-ic="book" data-col="#ffffff" style="background: #ea5a14"></span><b>Manual<br />de uso</b><span class="sub"><span class="chip o" id="s2a">Para ti</span><span class="chip o" id="s2b">Tu equipo</span></span></div>
          <div class="cd" id="d3"><span class="ico" data-ic="key" data-col="#ffffff" style="background: #179a4a"></span><b>Credenciales<br />de administrador</b><span class="sub"><span class="fld" id="s3">admin · ••••••</span></span></div>
          <div class="cd" id="d4"><span class="ico" data-ic="share" data-col="#ffffff" style="background: #b86e00"></span><b>Permiso para<br />mostrarlo</b><span class="sub"><span class="chip a" id="s4a">¿Puedo compartirlo?</span><span class="chip g" id="s4b">Sí ✓</span></span></div>
        </div>
        <div id="endw"><div class="pill" id="ep"><span class="pi" data-ic="check" data-sw="6"></span>Todo para usar y administrar tu sistema<i class="shine" id="sh" data-layout-allow-overflow></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="1.9" data-volume="0.28"></audio>
      <audio id="s-3" src="assets/sfx/tick.wav" data-start="5.2" data-volume="0.28"></audio>
      <audio id="s-4" src="assets/sfx/ding.wav" data-start="8.4" data-volume="0.28"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="10.0" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="11.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      GEX.stepper(document.getElementById("stp"), 8);
      const tl = gsap.timeline({ paused: true });
      const EXIT = 11.6;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1611, { x0: 60, x1: 1020, y0: 1420, y1: 1570 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set([".cd", ".cd .sub > *", "#ep"], { autoAlpha: 0 });
      tl.fromTo(".stp .sd", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.04 }, 0.3);
      tl.fromTo(".stp .sl", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out", stagger: 0.04 }, 0.35);
      tl.fromTo(".stp .chip", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, 0.6);
      const card = (id, t, i) => {
        tl.fromTo(id, { y: 200, rotation: i % 2 ? 6 : -6, scale: 0.6, autoAlpha: 0 }, { y: 0, rotation: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, t);
        tl.fromTo(id + " .ico", { rotation: -150, scale: 0 }, { rotation: 0, scale: 1, duration: 0.5, ease: "back.out(2.4)", immediateRender: false }, t + 0.1);
        GEX.float(tl, id, t + 0.6, EXIT, 6, 1.4 + i * 0.15);
      };
      const sub = (sel, t) => tl.fromTo(sel, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, t);
      // proyecto terminado
      card("#d1", 0.4, 0); sub("#s1", 0.9);
      // manual para ti y tus trabajadores
      card("#d2", 1.9, 1); sub("#s2a", 3.4); sub("#s2b", 3.9);
      tl.to("#d2 .ico", { rotation: -10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.6);
      // credenciales para administrar
      card("#d3", 5.2, 2); sub("#s3", 5.8);
      tl.to("#d3 .ico svg", { rotation: 45, duration: 0.3, ease: "back.out(3)", yoyo: true, repeat: 3 }, 6.4);
      // permiso para subir contenido
      card("#d4", 8.4, 3); sub("#s4a", 9.0); sub("#s4b", 10.0);
      GEX.punch(tl, "#s4b", 10.3, 1.2);
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 10.6);
      tl.fromTo("#sh", { x: -140 }, { x: 900, duration: 0.6, ease: "power2.inOut" }, 10.95);
      // salida + barrido
      GEX.scatter(tl, ["#d1", "#d2", "#d3", "#d4", "#ep", "#stp"], EXIT, 73);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
