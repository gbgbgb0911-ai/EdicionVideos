<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Proceso 07c — Cierre con GEX</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 18px; top: 200px; }
      .logo { display: inline-flex; align-items: center; padding: 14px 28px; border-radius: 24px; background: #ffffff; }
      .logo img { display: block; width: 240px; }
      #ul { width: 280px; height: 10px; border-radius: 5px; background: #fe6820; transform-origin: 50% 50%; }
      #rc { font-size: 32px; padding: 8px 22px; }
      .sp { position: absolute; width: 14px; height: 44px; border-radius: 7px; transform: rotate(25deg); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4.5" data-track-index="0">
        <span class="sp" id="p1" style="left: 300px; top: 210px; background: #1fc4b8"></span>
        <span class="sp" id="p2" style="left: 326px; top: 230px; background: #fe6820"></span>
        <span class="sp" id="p3" style="left: 750px; top: 250px; background: #fe6820"></span>
        <span class="sp" id="p4" style="left: 776px; top: 270px; background: #1fc4b8"></span>
        <div class="top" id="top"><span class="logo" id="lg"><img src="assets/logo-v2/gex-full.png" alt="GEX" /></span><i id="ul"></i><span class="chip" id="rc">Contacto → Entrega ✓</span></div>
      </section>
      <audio id="s-lg" src="assets/sfx/pop.wav" data-start="0.15" data-volume="0.3"></audio>
      <audio id="s-sh" src="assets/sfx/shimmer.wav" data-start="0.7" data-volume="0.26"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="4.08" data-volume="0.38"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.1;
      tl.fromTo("#lg", { scale: 0.3, rotation: -8, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2.6)" }, 0.15);
      tl.fromTo("#ul", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.5);
      tl.fromTo("#rc", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, 0.8);
      tl.fromTo(".sp", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.06 }, 0.7);
      tl.to(".sp", { y: (i) => (i % 2 ? -14 : 14), duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.0);
      tl.to("#ul", { scaleX: 0.6, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.2);
      GEX.float(tl, "#lg", 1.0, EXIT, 6, 1.3);
      GEX.scatter(tl, ["#lg", "#ul", "#rc", "#p1", "#p2", "#p3", "#p4"], EXIT, 74);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
