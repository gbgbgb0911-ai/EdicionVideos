<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX 04 — Todo en un solo lugar</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root {
        --bg: #000000;
        --ink: #ffffff;
        --teal: #039991;
        --teal-hi: #1fc4b8;
        --orange: #fe6820;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 34px; }
      .title { display: flex; flex-direction: column; align-items: center; font-weight: 800; font-size: 76px; line-height: 1; white-space: nowrap; }
      .title .t { color: var(--teal-hi); font-size: 92px; }
      .panel-wrap { position: relative; width: 760px; }
      .panel { position: absolute; inset: 0; border: 6px solid var(--teal-hi); border-radius: 36px; }
      .panel-bar { display: flex; align-items: center; justify-content: space-between; height: 84px; padding: 0 34px; border-bottom: 4px solid var(--teal-hi); }
      .dots { display: flex; gap: 12px; }
      .dots i { width: 20px; height: 20px; border-radius: 50%; background: var(--teal-hi); }
      .panel-bar img { height: 40px; }
      .rows { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: 112px 40px 34px; }
      .row { display: flex; align-items: center; gap: 22px; padding: 14px 26px; border-radius: 18px; border: 4px solid var(--teal-hi); font-weight: 700; font-size: 54px; }
      .row .sq { width: 22px; height: 22px; border-radius: 6px; background: var(--orange); flex: none; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="stack" id="content">
          <div class="title" id="title"><span>TODO EN</span><span class="t">UN SOLO LUGAR</span></div>
          <div class="panel-wrap">
            <div class="panel" id="panel">
              <div class="panel-bar"><div class="dots"><i></i><i></i><i></i></div><img id="mini-logo" src="assets/logo/gex-full.png" alt="GEX" /></div>
            </div>
            <div class="rows">
              <div class="row" id="r1"><span class="sq"></span>Ventas</div>
              <div class="row" id="r2"><span class="sq"></span>Pedidos</div>
              <div class="row" id="r3"><span class="sq"></span>Inventarios</div>
              <div class="row" id="r4"><span class="sq"></span>Clientes</div>
              <div class="row" id="r5"><span class="sq"></span>Reportes</div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Scattered start offsets (relative to each row's final slot)
      const scatter = [
        { x: -100, y: -140, r: -9 },
        { x: 330, y: -40, r: 8 },
        { x: -110, y: 50, r: 6 },
        { x: 300, y: 120, r: -7 },
        { x: 80, y: 200, r: 10 },
      ];
      scatter.forEach((s, i) => {
        const id = "#r" + (i + 1);
        tl.fromTo(id, { x: s.x, y: s.y, rotation: s.r, scale: 0.5, autoAlpha: 0 }, { x: s.x, y: s.y, rotation: s.r, scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.2)" }, 0.2 + i * 0.1);
      });
      tl.fromTo("#title", { y: -40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.75);
      // Panel draws in, rows snap into their slots
      tl.fromTo("#panel", { scale: 0.85, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "expo.out" }, 1.15);
      tl.to(".row", { x: 0, y: 0, rotation: 0, duration: 0.55, ease: "power3.inOut", stagger: 0.06 }, 1.35);
      tl.fromTo("#mini-logo", { x: 30, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "circ.out" }, 2.1);
      tl.fromTo(".row .sq", { scale: 0 }, { scale: 1, duration: 0.2, ease: "back.out(3)", stagger: 0.07 }, 2.15);
      tl.to("#panel", { keyframes: [{ scale: 1.03, duration: 0.12 }, { scale: 1, duration: 0.25 }], ease: "sine.inOut" }, 2.6);
      tl.to("#content", { y: -40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 3.75);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
