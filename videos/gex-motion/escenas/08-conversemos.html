<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX 08 — Conversemos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root {
        --bg: #000000;
        --ink: #ffffff;
        --teal: #039991;
        --teal-hi: #1fc4b8;
        --orange: #fe6820;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 40px; }
      #bubble { width: 230px; height: 200px; overflow: visible; }
      .b-shape { fill: none; stroke: var(--teal-hi); stroke-width: 10; stroke-linejoin: round; }
      .b-dot { fill: var(--orange); }
      .big { font-weight: 800; font-size: 112px; line-height: 1; white-space: nowrap; }
      .big .or { color: var(--orange); }
      .logo { width: 560px; height: 156px; }
      .logo img { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="stack" id="content">
          <svg id="bubble" viewBox="0 0 230 200">
            <path class="b-shape" d="M40 10h150a30 30 0 0 1 30 30v80a30 30 0 0 1-30 30H95l-45 40v-40H40a30 30 0 0 1-30-30V40a30 30 0 0 1 30-30Z" />
            <circle class="b-dot" id="d1" cx="70" cy="80" r="14" />
            <circle class="b-dot" id="d2" cx="115" cy="80" r="14" />
            <circle class="b-dot" id="d3" cx="160" cy="80" r="14" />
          </svg>
          <div class="big" id="big">¿CONVERSEMOS<span class="or">?</span></div>
          <div class="logo" id="logo"><img src="assets/logo/gex-full.png" alt="GEX" /></div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bubble", { scale: 0.3, rotation: -15, autoAlpha: 0, transformOrigin: "20% 100%" }, { scale: 1, rotation: 0, autoAlpha: 1, transformOrigin: "20% 100%", duration: 0.45, ease: "back.out(2.2)" }, 0.12);
      // Typing dots: 3 finite bounces, staggered
      ["#d1", "#d2", "#d3"].forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { y: -18, duration: 0.18, ease: "sine.out", yoyo: true, repeat: 5 }, 0.45 + i * 0.1);
      });
      tl.fromTo("#big", { y: 50, autoAlpha: 0, scale: 0.92 }, { y: 0, autoAlpha: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 0.4);
      tl.fromTo("#logo", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 0.85);
      tl.to("#big .or", { keyframes: [{ scale: 1.3, duration: 0.12 }, { scale: 1, duration: 0.25 }], ease: "sine.inOut" }, 1.45);
      tl.to("#content", { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 2.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
