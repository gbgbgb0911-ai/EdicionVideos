<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX 02 — Tiempo perdido en tareas</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root {
        --bg: #000000;
        --ink: #ffffff;
        --teal: #039991;
        --teal-hi: #1fc4b8;
        --orange: #fe6820;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
      .title { font-weight: 700; font-size: 62px; white-space: nowrap; }
      .title .or { color: var(--orange); }
      .chips { display: flex; flex-direction: column; gap: 22px; width: 820px; }
      .chip { display: flex; align-items: center; gap: 28px; padding: 22px 34px; border: 5px solid var(--teal-hi); border-radius: 28px; font-weight: 700; font-size: 58px; white-space: nowrap; }
      .chip svg { width: 70px; height: 70px; flex: none; }
      .chip .ln { fill: none; stroke: var(--teal-hi); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .badge { display: flex; align-items: center; gap: 16px; padding: 14px 34px; border-radius: 999px; border: 6px solid var(--orange); color: var(--orange); font-weight: 800; font-size: 64px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="stack" id="content">
          <div class="title" id="title">¿CUÁNTO TIEMPO <span class="or">PIERDES</span>?</div>
          <div class="chips">
            <div class="chip" id="c1">
              <svg viewBox="0 0 64 64"><path class="ln" d="M8 20 32 8l24 12v24L32 56 8 44Z M8 20l24 12 24-12 M32 32v24" /></svg>
              Revisando pedidos
            </div>
            <div class="chip" id="c2">
              <svg viewBox="0 0 64 64"><path class="ln" d="M8 54h48 M14 54V34 M28 54V22 M42 54V28 M56 54V12" /></svg>
              Cuadrando ventas
            </div>
            <div class="chip" id="c3">
              <svg viewBox="0 0 64 64"><path class="ln" d="M8 30h20v24H8Z M36 30h20v24H36Z M22 8h20v22H22Z" /></svg>
              Controlando inventario
            </div>
            <div class="chip" id="c4">
              <svg viewBox="0 0 64 64"><path class="ln" d="M14 6h26l12 12v40H14Z M40 6v12h12 M22 30h22 M22 40h22 M22 50h14" /></svg>
              Papeles y Excel
            </div>
          </div>
          <div class="badge" id="badge">
            <svg viewBox="-50 -50 100 100" width="62" height="62"><circle r="40" fill="none" stroke="#fe6820" stroke-width="10" /><g id="b-hand"><circle r="32" fill="none" /><line x1="0" y1="4" x2="0" y2="-28" stroke="#fe6820" stroke-width="9" stroke-linecap="round" /></g></svg>
            TIEMPO PERDIDO
          </div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { y: -36, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 0.15);
      const chips = ["#c1", "#c2", "#c3", "#c4"];
      chips.forEach((id, i) => {
        const dir = i % 2 === 0 ? -1 : 1;
        tl.fromTo(id, { x: 260 * dir, autoAlpha: 0, rotation: 4 * dir }, { x: 0, autoAlpha: 1, rotation: 0, duration: 0.42, ease: "power4.out" }, 0.4 + i * 0.22);
      });
      // Pattern interrupt: chips tremble, badge slams in
      tl.to(".chip", { keyframes: [{ x: -10 }, { x: 10 }, { x: -6 }, { x: 0 }], duration: 0.3, ease: "none", stagger: 0.04 }, 1.75);
      tl.fromTo("#badge", { scale: 0.4, autoAlpha: 0, rotation: -8 }, { scale: 1, autoAlpha: 1, rotation: -3, duration: 0.4, ease: "back.out(2.4)" }, 1.95);
      tl.fromTo("#b-hand", { rotation: 0, svgOrigin: "0 0" }, { rotation: 720, svgOrigin: "0 0", duration: 1.4, ease: "sine.inOut" }, 2.0);
      tl.to("#content", { y: -40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 3.75);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
