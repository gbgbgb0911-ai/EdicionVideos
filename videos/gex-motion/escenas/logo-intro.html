<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX — Logo intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #000000;
        --teal-hi: #1fc4b8;
        --cyan: #3ee8dc;
        --orange: #fe6820;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      .scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #rays { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .ray { stroke-linecap: round; fill: none; }
      .ray-t { stroke: var(--teal-hi); stroke-width: 6; }
      .ray-c { stroke: var(--cyan); stroke-width: 3; }
      .ray-o { stroke: var(--orange); stroke-width: 8; }
      .logo { position: relative; width: 900px; height: 280px; }
      .logo img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .shine { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: url("assets/logo-v2/gex-full.png"); mask-image: url("assets/logo-v2/gex-full.png"); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
      .shine-band { position: absolute; top: -40px; left: 0; width: 260px; height: 360px; background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.85) 50%, rgba(255, 255, 255, 0) 100%); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
        <svg id="rays" viewBox="0 0 1080 1920" data-layout-allow-overflow="true">
          <!-- "/" diagonals echo the logo's cut angle -->
          <line class="ray ray-t" id="ray1" x1="140" y1="1260" x2="760" y2="640" />
          <line class="ray ray-c" id="ray2" x1="330" y1="1300" x2="950" y2="680" />
          <line class="ray ray-o" id="ray3" x1="1180" y1="460" x2="900" y2="740" />
        </svg>
        <div class="logo" id="logo">
          <img id="lg-g" src="assets/logo-v2/gex-g.png" alt="" />
          <img id="lg-e" src="assets/logo-v2/gex-e.png" alt="" />
          <img id="lg-xd" src="assets/logo-v2/gex-x-diag.png" alt="" />
          <img id="lg-xl" src="assets/logo-v2/gex-x-low.png" alt="" />
          <img id="lg-xo" src="assets/logo-v2/gex-x-orange.png" alt="GEX" />
          <div class="shine" data-layout-allow-overflow="true"><div class="shine-band" id="band"></div></div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const len = (id) => Math.hypot(...(() => { const l = document.getElementById(id); return [l.x2.baseVal.value - l.x1.baseVal.value, l.y2.baseVal.value - l.y1.baseVal.value]; })());

      // Build: rays cut across, letters assemble
      ["ray1", "ray2"].forEach((id, i) => {
        const L = len(id);
        tl.fromTo("#" + id, { strokeDasharray: `${L} ${L}`, strokeDashoffset: L, autoAlpha: 1 }, { strokeDashoffset: -L, duration: 0.7, ease: "power3.inOut" }, 0.12 + i * 0.08);
        tl.to("#" + id, { autoAlpha: 0, duration: 0.1, ease: "none" }, 0.74 + i * 0.08);
      });
      tl.fromTo("#lg-g", { x: -240, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 0.3);
      tl.fromTo("#lg-e", { y: 170, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "expo.out" }, 0.42);
      tl.fromTo("#lg-xd", { clipPath: "polygon(0% 0%, 0% 0%, 0% 0%)" }, { clipPath: "polygon(0% 0%, 230% 0%, 0% 230%)", duration: 0.45, ease: "power3.inOut" }, 0.5);
      tl.fromTo("#lg-xl", { x: -130, y: 130, autoAlpha: 0 }, { x: 0, y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(1.8)" }, 0.66);

      // Orange accent shoots in along its own diagonal
      const L3 = len("ray3");
      tl.fromTo("#ray3", { strokeDasharray: `${L3} ${L3}`, strokeDashoffset: L3, autoAlpha: 1 }, { strokeDashoffset: -L3, duration: 0.35, ease: "circ.out" }, 0.82);
      tl.to("#ray3", { autoAlpha: 0, duration: 0.08, ease: "none" }, 1.1);
      tl.fromTo("#lg-xo", { x: 380, y: -380, autoAlpha: 0 }, { x: 0, y: 0, autoAlpha: 1, duration: 0.38, ease: "back.out(2.2)" }, 0.86);

      // Impact + light sweep
      tl.to("#logo", { keyframes: [{ scale: 1.05, duration: 0.09 }, { scale: 1, duration: 0.32 }], ease: "sine.inOut" }, 1.2);
      tl.fromTo("#band", { x: -300 }, { x: 980, duration: 0.75, ease: "power2.inOut" }, 1.3);

      // Exit: zoom through
      tl.to("#logo", { scale: 1.14, autoAlpha: 0, duration: 0.32, ease: "power3.in" }, 2.66);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
