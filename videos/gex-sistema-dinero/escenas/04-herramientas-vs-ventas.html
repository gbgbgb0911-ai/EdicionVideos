<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sistema dinero 04 — Herramientas no resuelven problemas comerciales</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .lbw { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
      .row3 { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; padding-right: 60px; }
      .cd { position: relative; width: 222px; height: 280px; border-radius: 30px; background: #ffffff; color: #0b958b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
      .cd.o { border: 7px solid #fe6820; color: #c04a0f; }
      .cd .ico { width: 100px; height: 100px; }
      .cd .ico svg { width: 62%; height: 62%; }
      .cd b { font-weight: 800; font-size: 28px; line-height: 1.1; }
      .bd { position: absolute; right: -14px; top: -14px; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 5px solid #ffffff; }
      .bd svg { width: 36px; height: 36px; }
      .bd.ok { background: #179a4a; }
      .bd.no { background: #ea5a14; }
      #ne { position: absolute; left: 0; right: 0; top: 640px; display: flex; justify-content: center; }
      #ne span { width: 110px; height: 110px; border-radius: 50%; background: #ea5a14; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 80px; line-height: 1; }
      #endw { position: absolute; left: 0; right: 0; top: 1170px; display: flex; justify-content: center; }
      #ep { font-size: 44px; padding: 14px 34px 14px 14px; }
      #ep .pi { width: 70px; height: 70px; }
      #ep .pi svg { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="13.2" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="13.2" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="lbw" style="top: 270px"><span class="tag t" id="la">TECNOLOGÍA</span></div>
        <div class="row3" style="top: 340px">
          <div class="cd" id="t1"><span class="ico" data-ic="box" data-col="#ffffff" data-sw="4.5" style="background: #0b958b"></span><b>Control de<br />inventario</b><span class="bd ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
          <div class="cd" id="t2"><span class="ico" data-ic="code" data-col="#ffffff" data-sw="5" style="background: #0b958b"></span><b>Página<br />web</b><span class="bd ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
          <div class="cd" id="t3"><span class="ico" data-ic="gear" data-col="#ffffff" data-sw="4.5" style="background: #0b958b"></span><b>Operación<br />automatizada</b><span class="bd ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
        </div>
        <div id="ne"><span id="nes">≠</span></div>
        <div class="lbw" style="top: 775px"><span class="tag" id="lb">VENTAS</span></div>
        <div class="row3" style="top: 845px">
          <div class="cd o" id="p1"><span class="ico" data-ic="flag" data-col="#ffffff" data-sw="4.5" style="background: #ea5a14"></span><b>Estrategia<br />comercial</b><span class="bd no" data-ic="x" data-col="#ffffff" data-sw="6"></span></div>
          <div class="cd o" id="p2"><span class="ico" data-ic="magnet" data-col="#ffffff" data-sw="4.5" style="background: #ea5a14"></span><b>Atraer<br />clientes</b><span class="bd no" data-ic="x" data-col="#ffffff" data-sw="6"></span></div>
          <div class="cd o" id="p3"><span class="ico" data-ic="chart" data-col="#ffffff" data-sw="4.5" style="background: #ea5a14"></span><b>Demanda del<br />producto</b><span class="bd no" data-ic="x" data-col="#ffffff" data-sw="6"></span></div>
        </div>
        <div id="endw"><div class="pill o" id="ep"><span class="pi" data-ic="alert" data-col="#ea5a14" data-sw="4.5"></span>El problema sigue ahí</div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-1" src="assets/sfx/tick.wav" data-start="1.5" data-volume="0.26"></audio>
      <audio id="s-3" src="assets/sfx/tick.wav" data-start="4.7" data-volume="0.26"></audio>
      <audio id="s-ne" src="assets/sfx/impact.wav" data-start="6.4" data-volume="0.34"></audio>
      <audio id="s-ep" src="assets/sfx/ding.wav" data-start="11.6" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="12.78" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 12.8;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1911, { x0: 120, x1: 960, y0: 1290, y1: 1400 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set([".cd", ".bd", "#ne", "#lb", "#ep"], { autoAlpha: 0 });
      tl.fromTo("#la", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      const card = (id, t) => {
        tl.fromTo(id, { y: 160, scale: 0.6, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, t);
        tl.fromTo(id + " .ico", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)", immediateRender: false }, t + 0.1);
        tl.fromTo(id + " .bd", { scale: 0, rotation: -90, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, t + 0.35);
      };
      // puedes tener toda la tecnología...
      card("#t1", 1.2); card("#t2", 2.8); card("#t3", 4.4);
      tl.to("#t3 .ico svg", { rotation: 180, duration: EXIT - 4.6, ease: "none" }, 4.6);
      // ...pero no es lo mismo que vender
      tl.fromTo("#ne", { scale: 3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "power4.in", immediateRender: false }, 6.1);
      tl.fromTo("#lb", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 6.6);
      card("#p1", 7.3); card("#p2", 8.9); card("#p3", 10.3);
      tl.to("#p2 .ico svg", { y: -6, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 7 }, 9.4);
      // el problema sigue ahí
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 11.6);
      tl.to(".cd.o .bd", { scale: 1.2, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.1 }, 11.8);
      tl.to("#nes", { rotation: 10, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 6.8);
      // salida + barrido
      GEX.scatter(tl, ["#t1", "#t2", "#t3", "#ne", "#p1", "#p2", "#p3", "#ep", "#la", "#lb"], EXIT, 114);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
