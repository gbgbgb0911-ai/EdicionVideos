<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Sistema dinero 02 — La expectativa equivocada</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #own { position: absolute; left: 60px; top: 430px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      #own .av { width: 200px; height: 200px; }
      #own .av svg { width: 110px; height: 110px; }
      #own .chip { font-size: 32px; }
      #sw { position: absolute; left: 300px; top: 520px; width: 240px; height: 170px; }
      #sw .body { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      #sw .body i { height: 46px; border-radius: 8px; background: #d6f3f0; }
      #ins { position: absolute; left: 320px; top: 720px; font-size: 30px; padding: 8px 18px; }
      .td { position: absolute; border-radius: 50%; background: #ffffff; }
      #bub { position: absolute; left: 560px; top: 60px; width: 460px; height: 400px; border-radius: 60px; background: #ffffff; }
      #ch { position: absolute; left: 40px; top: 40px; width: 380px; height: 280px; }
      #exp { position: absolute; left: 650px; top: 490px; font-size: 34px; padding: 10px 24px; }
      #auto { position: absolute; left: 600px; top: 570px; font-size: 32px; padding: 10px 22px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.8" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="5.8" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="own"><span class="av o" data-ic="user" data-col="#ffffff" data-sw="4"></span><span class="chip o">Empresario</span></div>
          <div class="win" id="sw"><div class="bar"><i></i><i></i><i></i></div><div class="body"><i></i><i></i><i></i><i></i></div></div>
          <span class="chip g" id="ins">Instalado ✓</span>
          <span class="td" id="t1" style="left: 470px; top: 400px; width: 28px; height: 28px"></span>
          <span class="td" id="t2" style="left: 505px; top: 350px; width: 40px; height: 40px"></span>
          <div id="bub"><svg id="ch" viewBox="0 0 380 280"><path d="M20 20 V 250 H 360" fill="none" stroke="#cfdcdb" stroke-width="8" stroke-linecap="round" /><path id="ln" d="M40 230 C 140 220 200 160 340 40" fill="none" stroke="#ea5a14" stroke-width="10" stroke-linecap="round" stroke-dasharray="20 16" /><path id="hd" d="M300 40 L 345 36 L 335 80" fill="none" stroke="#ea5a14" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
          <span class="chip a" id="exp">Lo que espera</span>
          <span class="chip o" id="auto">¿Ventas automáticas?</span>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-sw" src="assets/sfx/pop.wav" data-start="1.0" data-volume="0.28"></audio>
      <audio id="s-b" src="assets/sfx/shimmer.wav" data-start="2.6" data-volume="0.26"></audio>
      <audio id="s-a" src="assets/sfx/ding.wav" data-start="4.0" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.38" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 5.4;
      const parts = GEX.particles(document.getElementById("fx"), 6, 1901, { x0: 20, x1: 280, y0: 60, y1: 380 });
      GEX.ambient(tl, parts, 0.4, EXIT + 0.3);
      const ln = document.getElementById("ln");
      gsap.set(["#sw", "#ins", ".td", "#bub", "#exp", "#auto", "#hd"], { autoAlpha: 0 });
      tl.fromTo("#own", { y: 200, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2)" }, 0.05);
      // implementa tecnología
      tl.fromTo("#sw", { y: -400, rotation: -10, autoAlpha: 0 }, { y: 0, rotation: 0, autoAlpha: 1, duration: 0.5, ease: "bounce.out", immediateRender: false }, 0.8);
      tl.fromTo("#ins", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 1.5);
      // y espera vender más, automáticamente
      tl.fromTo(".td", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.25, ease: "back.out(3)", stagger: 0.12, immediateRender: false }, 2.2);
      tl.fromTo("#bub", { scale: 0.3, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(1.8)", immediateRender: false }, 2.5);
      tl.fromTo(ln, { strokeDashoffset: 0, clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.inOut" }, 2.9);
      tl.to(ln, { strokeDashoffset: -72, duration: EXIT - 3.0, ease: "none" }, 3.0);
      tl.fromTo("#hd", { scale: 0, autoAlpha: 0, transformOrigin: "100% 0%" }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 3.7);
      tl.fromTo("#exp", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 3.3);
      tl.fromTo("#auto", { scale: 0, rotation: -10, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 4.0);
      tl.to("#bub", { y: -10, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.6);
      GEX.scatter(tl, ["#own", "#sw", "#ins", "#t1", "#t2", "#bub", "#exp", "#auto"], EXIT, 112);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
