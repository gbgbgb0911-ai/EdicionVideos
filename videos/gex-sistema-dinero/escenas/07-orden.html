<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Sistema dinero 07 — Primero un negocio que funcione, después tecnología</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .blk { position: absolute; left: 110px; width: 860px; height: 210px; border-radius: 34px; display: flex; align-items: center; gap: 24px; padding: 0 30px; color: #ffffff; }
      .blk .ico { width: 120px; height: 120px; background: #ffffff; flex: none; }
      .blk .ico svg { width: 62%; height: 62%; }
      .blk small { display: block; font-weight: 800; font-size: 30px; letter-spacing: 0.14em; opacity: 1; }
      .blk b { display: block; font-weight: 800; font-size: 42px; line-height: 1.05; white-space: nowrap; }
      .nb { position: absolute; left: -22px; top: -22px; width: 70px; height: 70px; border-radius: 50%; background: #ffffff; color: #0b958b; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 42px; border: 6px solid #000000; }
      #b1 { top: 600px; background: #0b958b; }
      #b2 { top: 340px; background: #ea5a14; }
      #b2 .nb { color: #ea5a14; }
      #gnd { position: absolute; left: 90px; width: 900px; top: 830px; height: 10px; border-radius: 5px; background: #dfe7e6; }
      .sp { position: absolute; width: 16px; height: 60px; border-radius: 8px; background: #fe6820; transform: rotate(25deg); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.8" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="5.8" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="gnd"></div>
          <div class="blk" id="b1"><span class="nb">1</span><span class="ico" data-ic="store" data-sw="4.5"></span><span><small>PRIMERO</small><b>Un negocio que funcione</b></span></div>
          <div class="blk" id="b2"><span class="nb">2</span><span class="ico" data-ic="gear" data-col="#ea5a14" data-sw="4.5"></span><span><small>DESPUÉS</small><b>Tecnología para mejorarlo</b></span></div>
          <span class="sp" id="s1" style="left: 960px; top: 250px"></span><span class="sp" id="s2" style="left: 990px; top: 270px; background: #1fc4b8"></span>
        </section>
      </div>
      <audio id="s-1" src="assets/sfx/impact.wav" data-start="0.55" data-volume="0.32"></audio>
      <audio id="s-2" src="assets/sfx/impact.wav" data-start="3.05" data-volume="0.32"></audio>
      <audio id="s-ok" src="assets/sfx/shimmer.wav" data-start="3.4" data-volume="0.26"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.38" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 5.4;
      const parts = GEX.particles(document.getElementById("fx"), 8, 1971, { x0: 20, x1: 1060, y0: 60, y1: 300 });
      GEX.ambient(tl, parts, 0.4, EXIT + 0.3);
      gsap.set(["#b2", ".sp"], { autoAlpha: 0 });
      tl.fromTo("#gnd", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.05);
      // primero: la base
      tl.fromTo("#b1", { y: -500, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "bounce.out" }, 0.15);
      tl.fromTo("#b1 .ico", { rotation: -120, scale: 0 }, { rotation: 0, scale: 1, duration: 0.45, ease: "back.out(2.6)" }, 0.5);
      tl.to("#b1 .ico", { scale: 1.08, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.2);
      // después: la tecnología encima
      tl.fromTo("#b2", { y: -500, rotation: -4, autoAlpha: 0 }, { y: 0, rotation: 0, autoAlpha: 1, duration: 0.5, ease: "bounce.out", immediateRender: false }, 2.65);
      tl.to("#b1", { keyframes: [{ scaleY: 0.94, duration: 0.08 }, { scaleY: 1, duration: 0.2 }], transformOrigin: "50% 100%", ease: "sine.out" }, 3.05);
      tl.fromTo("#b2 .ico svg", { rotation: 0 }, { rotation: 360, duration: EXIT - 3.0, ease: "none" }, 3.0);
      tl.fromTo(".sp", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.08, immediateRender: false }, 3.4);
      tl.to(".sp", { y: -12, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.1 }, 3.8);
      GEX.scatter(tl, ["#b2", "#b1", "#s1", "#s2"], EXIT, 118);
      tl.to("#gnd", { scaleX: 0, duration: 0.3, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
