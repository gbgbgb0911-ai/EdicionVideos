<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sistema dinero 06 — La tecnología ayuda a escalar lo que funciona</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 270px; display: flex; justify-content: center; }
      .cu { position: absolute; top: 340px; width: 90px; height: 90px; }
      .cu svg { width: 52px; height: 52px; }
      #st { position: absolute; left: 405px; top: 500px; width: 170px; height: 170px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; z-index: 3 !important; }
      #st svg { width: 100px; height: 100px; }
      #st2 { position: absolute; left: 640px; top: 520px; width: 130px; height: 130px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; z-index: 2; }
      #st2 svg { width: 76px; height: 76px; }
      #ok { position: absolute; left: 140px; top: 560px; font-size: 30px; padding: 8px 18px; }
      #sys { position: absolute; left: 330px; top: 770px; width: 320px; height: 150px; z-index: 3 !important; }
      #sys .body { display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; font-weight: 800; font-size: 30px; }
      #sys .body .ico { width: 46px; height: 46px; }
      .tr { position: absolute; top: 1060px; width: 160px; height: 100px; border-radius: 18px; border: 7px solid #1fc4b8; }
      .tk2 { position: absolute; left: 0; top: 0; width: 60px; height: 44px; margin: -22px 0 0 -30px; border-radius: 10px; background: #ffffff; z-index: 1 !important; }
      .tk2 i { position: absolute; left: 10px; right: 10px; top: 12px; height: 7px; border-radius: 4px; background: #ea5a14; }
      .tk2 b { position: absolute; left: 10px; right: 22px; top: 25px; height: 7px; border-radius: 4px; background: #cfdcdb; }
      #ef { position: absolute; left: 0; right: 0; top: 1200px; display: flex; justify-content: center; gap: 16px; }
      #ef .pill { font-size: 38px; padding: 12px 30px 12px 12px; }
      #ef .pi { width: 62px; height: 62px; }
      #ef .pi svg { width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.0" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="8.0" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">VENTAS QUE YA FUNCIONAN</span></div>
        <span class="av o cu" id="c1" style="left: 285px" data-ic="user" data-col="#ffffff" data-sw="4.5"></span>
        <span class="av cu" id="c2" style="left: 445px" data-ic="user" data-col="#ffffff" data-sw="4.5"></span>
        <span class="av g cu" id="c3" style="left: 605px" data-ic="user" data-col="#ffffff" data-sw="4.5"></span>
        <div id="st" data-ic="store" data-sw="4"></div>
        <div id="st2" data-ic="store" data-col="#ea5a14" data-sw="4"></div>
        <span class="chip g" id="ok">Funciona ✓</span>
        <div class="win" id="sys"><div class="bar"><i></i><i></i><i></i><b>Sistema</b></div><div class="body"><span class="ico" data-ic="grid" data-sw="4.5"></span>Organiza</div></div>
        <span class="tr" id="tr1" style="left: 230px"></span><span class="tr" id="tr2" style="left: 410px"></span><span class="tr" id="tr3" style="left: 590px"></span>
        <div id="tks"></div>
        <div id="ef"><div class="pill" id="e1"><span class="pi" data-ic="bolt" data-sw="4.5"></span>Más eficiente</div><div class="pill o" id="e2"><span class="pi" data-ic="chart" data-col="#ea5a14" data-sw="4.5"></span>Escalar</div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-ok" src="assets/sfx/tick.wav" data-start="2.2" data-volume="0.26"></audio>
      <audio id="s-sys" src="assets/sfx/whoosh.wav" data-start="3.0" data-volume="0.32"></audio>
      <audio id="s-e1" src="assets/sfx/pop.wav" data-start="5.0" data-volume="0.28"></audio>
      <audio id="s-e2" src="assets/sfx/success.wav" data-start="6.3" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="7.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 7.6;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#sys", "#tr1", "#tr3", "#e1", "#e2", "#st2", "#ok"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo(".cu", { y: -80, scale: 0, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)", stagger: 0.08 }, 0.3);
      tl.fromTo("#st", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2.6)" }, 0.5);
      tl.fromTo("#tr2", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "back.out(2)" }, 0.6);
      // pedidos que fluyen (deterministas)
      const box = document.getElementById("tks"), CX = [330, 490, 650], TX = [310, 490, 670];
      const ticket = (i, t, lane, viaSys) => {
        const k = document.createElement("div"); k.className = "tk2"; k.innerHTML = "<i></i><b></b>"; box.appendChild(k);
        const x0 = CX[i % 3], kf = [{ x: x0, y: 420, duration: 0 }, { x: 490, y: 585, duration: 0.35 }];
        if (viaSys) kf.push({ x: 490, y: 860, duration: 0.3 });
        kf.push({ x: TX[lane], y: 1110, duration: 0.35 });
        gsap.set(k, { x: x0, y: 420, autoAlpha: 0 });
        tl.set(k, { autoAlpha: 1 }, t);
        tl.to(k, { keyframes: kf, ease: "power1.inOut" }, t);
        tl.to(k, { scale: 0, duration: 0.15, ease: "back.in(2)" }, t + (viaSys ? 1.0 : 0.7));
        tl.set(k, { autoAlpha: 0 }, t + (viaSys ? 1.16 : 0.86));
      };
      for (let i = 0; i < 5; i++) ticket(i, 0.8 + i * 0.45, 1, false);
      tl.fromTo("#ok", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 2.2);
      // entra la tecnología: más volumen, ordenado
      tl.fromTo("#sys", { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, 3.0);
      tl.fromTo(["#tr1", "#tr3"], { scaleX: 0, autoAlpha: 0 }, { scaleX: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.1, immediateRender: false }, 3.3);
      for (let i = 0; i < 14; i++) ticket(i + 1, 3.5 + i * 0.25, i % 3, true);
      tl.to("#sys .body .ico", { rotation: 90, duration: 0.3, ease: "back.out(2)", repeat: 5, repeatDelay: 0.3 }, 3.6);
      tl.fromTo("#e1", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 5.0);
      // escalar
      tl.fromTo("#st2", { x: -150, scale: 0, autoAlpha: 0 }, { x: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 6.2);
      tl.fromTo("#e2", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 6.3);
      GEX.punch(tl, "#st", 6.2, 1.1);
      // salida + barrido
      GEX.scatter(tl, ["#c1", "#c2", "#c3", "#st", "#st2", "#ok", "#sys", "#tr1", "#tr2", "#tr3", "#ef", "#tag"], EXIT, 117);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
