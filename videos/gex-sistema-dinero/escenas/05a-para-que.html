<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Sistema dinero 05a — ¿Para qué sirve un sistema?</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #bg { position: absolute; left: 0; right: 0; top: 140px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
      #ic { position: relative; width: 240px; height: 240px; border-radius: 52px; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      #ic svg { width: 150px; height: 150px; }
      #qm { position: absolute; right: -40px; top: -40px; width: 110px; height: 110px; border-radius: 50%; background: #ea5a14; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 74px; border: 8px solid #000000; }
      #tt { font-weight: 800; font-size: 82px; line-height: 1.05; text-align: center; white-space: nowrap; }
      #tt .hl { color: #fe6820; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="2.8" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="2.8" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="bg"><div id="ic"><span data-ic="grid" data-sw="4"></span><b id="qm">?</b></div><div id="tt"><span id="tx">¿Para qué sirve<br /><span class="hl">un sistema?</span></span></div></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-q" src="assets/sfx/pop.wav" data-start="0.5" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="2.38" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 2.4;
      const parts = GEX.particles(document.getElementById("fx"), 6, 1951, { x0: 20, x1: 170, y0: 60, y1: 920 }).concat(GEX.particles(document.getElementById("fx"), 6, 1952, { x0: 910, x1: 1060, y0: 60, y1: 920 }));
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      const tx = GEX.split(document.getElementById("tx"));
      tl.fromTo("#ic", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      tl.fromTo("#qm", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, 0.5);
      tl.to("#qm", { rotation: 14, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.9);
      GEX.reveal(tl, tx.words, 0.3, "rise", { stagger: 0.09, duration: 0.4 });
      GEX.scatter(tl, ["#ic"], EXIT, 115);
      tl.to(tx.words, { y: -160, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.03 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
