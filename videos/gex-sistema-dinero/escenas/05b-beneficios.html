<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sistema dinero 05b — Beneficios reales de un sistema</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 270px; display: flex; justify-content: center; }
      #grid { position: absolute; left: 110px; top: 350px; width: 790px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .bn { height: 410px; border-radius: 32px; background: #ffffff; color: #0b958b; overflow: hidden; display: flex; flex-direction: column; }
      .bn .hd { height: 92px; display: flex; align-items: center; gap: 12px; padding: 0 18px; color: #ffffff; font-weight: 800; font-size: 30px; line-height: 1.05; }
      .bn .hd .ico { width: 62px; height: 62px; background: #ffffff; flex: none; }
      .bn .vz { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
      .bn .cp { padding: 0 18px 20px; text-align: center; font-weight: 800; font-size: 28px; }
      .bar3 { display: flex; flex-direction: column; gap: 14px; width: 240px; }
      .bar3 i { height: 30px; border-radius: 15px; background: #1fc4b8; }
      .er { font-size: 34px; padding: 10px 22px; }
      #clk { position: relative; width: 150px; height: 150px; border-radius: 50%; border: 10px solid #179a4a; }
      #clk i { position: absolute; left: 50%; bottom: 50%; width: 10px; height: 56px; margin-left: -5px; border-radius: 5px; background: #179a4a; transform-origin: 50% 100%; }
      .stk { position: absolute; right: 22px; top: 30px; display: flex; flex-direction: column; gap: 6px; }
      .stk i { width: 70px; height: 22px; border-radius: 6px; background: #e4f6ea; border: 3px solid #179a4a; }
      .dash { display: flex; align-items: flex-end; gap: 14px; height: 150px; }
      .dash i { width: 44px; border-radius: 10px 10px 0 0; background: #e8b04f; transform-origin: 50% 100%; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.2" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7.2" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">PARA QUÉ SIRVE UN SISTEMA</span></div>
        <div id="grid">
          <div class="bn" id="b1"><div class="hd" style="background: #0b958b"><span class="ico" data-ic="sliders" data-sw="4.5"></span>TRABAJAR<br />MEJOR</div><div class="vz"><div class="bar3"><i id="r1" style="width: 70%"></i><i id="r2" style="width: 100%"></i><i id="r3" style="width: 55%"></i></div></div><div class="cp">Procesos ordenados</div></div>
          <div class="bn" id="b2"><div class="hd" style="background: #ea5a14"><span class="ico" data-ic="check" data-col="#ea5a14" data-sw="6"></span>REDUCIR<br />ERRORES</div><div class="vz"><span class="chip o er" id="er">✗ Error</span></div><div class="cp">Menos confusiones</div></div>
          <div class="bn" id="b3"><div class="hd" style="background: #179a4a"><span class="ico" data-ic="clock" data-col="#179a4a" data-sw="4.5"></span>AHORRAR<br />TIEMPO</div><div class="vz"><div id="clk"><i id="hd2"></i></div><div class="stk"><i></i><i></i><i></i><i></i></div></div><div class="cp">Menos tareas manuales</div></div>
          <div class="bn" id="b4"><div class="hd" style="background: #b86e00"><span class="ico" data-ic="chart" data-col="#b86e00" data-sw="4.5"></span>MAYOR<br />CONTROL</div><div class="vz"><div class="dash"><i style="height: 60px"></i><i style="height: 110px"></i><i style="height: 80px"></i><i style="height: 140px"></i></div></div><div class="cp">Todo en un lugar</div></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="1.6" data-volume="0.28"></audio>
      <audio id="s-2" src="assets/sfx/tick.wav" data-start="3.0" data-volume="0.26"></audio>
      <audio id="s-3" src="assets/sfx/pop.wav" data-start="3.7" data-volume="0.28"></audio>
      <audio id="s-4" src="assets/sfx/success.wav" data-start="4.9" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.78" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.8;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 8, 1961, { x0: 120, x1: 880, y0: 1200, y1: 1380 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set(".bn", { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      const card = (id, t, i) => {
        tl.fromTo(id, { y: 160, rotation: i % 2 ? 5 : -5, scale: 0.6, autoAlpha: 0 }, { y: 0, rotation: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, t);
        tl.fromTo(id + " .hd .ico", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)", immediateRender: false }, t + 0.1);
      };
      // trabajar mejor: los procesos se ordenan
      card("#b1", 1.6, 0);
      gsap.set(["#r1", "#r2", "#r3"], { x: (i) => [40, -30, 60][i] });
      tl.to(["#r1", "#r2", "#r3"], { x: 0, width: "100%", duration: 0.5, ease: "back.out(1.6)", stagger: 0.1 }, 2.1);
      // reducir errores
      card("#b2", 2.6, 1);
      const er = document.getElementById("er"), ep = { v: 0 };
      tl.fromTo(ep, { v: 0 }, { v: 1, duration: 0.02, immediateRender: false, onUpdate: () => { const ok = ep.v > 0.5; er.textContent = ok ? "✓ Correcto" : "✗ Error"; er.style.backgroundColor = ok ? "#179a4a" : ""; } }, 3.0);
      GEX.punch(tl, "#er", 3.0, 1.2);
      // ahorrar tiempo: menos tareas manuales
      card("#b3", 3.6, 2);
      tl.fromTo("#hd2", { rotation: 0 }, { rotation: 720, duration: EXIT - 3.8, ease: "none" }, 3.8);
      tl.to("#b3 .stk i", { x: 80, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.2 }, 4.2);
      // mayor control
      card("#b4", 4.8, 3);
      tl.fromTo("#b4 .dash i", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.08, immediateRender: false }, 5.1);
      tl.to("#b4 .dash i", { scaleY: 0.85, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.08 }, 5.7);
      // salida + barrido
      GEX.scatter(tl, ["#b1", "#b2", "#b3", "#b4", "#tag"], EXIT, 116);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
