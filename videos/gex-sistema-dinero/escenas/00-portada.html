<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sistema dinero 00 — Portada</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 24px; top: 300px; }
      #tg { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; letter-spacing: 0.2em; color: #1fc4b8; white-space: nowrap; }
      #tg i { width: 60px; height: 8px; border-radius: 4px; background: #1fc4b8; }
      #ic { display: flex; align-items: center; gap: 16px; }
      #ic .s { width: 110px; height: 110px; border-radius: 26px; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      #ic .s svg { width: 70px; height: 70px; }
      #ic b { font-weight: 800; font-size: 80px; color: #fe6820; }
      #ic .c { width: 110px; height: 110px; border-radius: 50%; background: #ea5a14; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 800; font-size: 46px; }
      #ttl { font-weight: 800; font-size: 86px; line-height: 1.02; text-align: center; white-space: nowrap; text-transform: uppercase; }
      #ttl .hl { color: #fe6820; }
      #ul { width: 360px; height: 14px; border-radius: 7px; background: #fe6820; }
      #sub { font-size: 54px; padding: 16px 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="2" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="2" data-track-index="0">
        <div class="top" id="top">
          <div id="tg"><i></i>GEX<i></i></div>
          <div id="ic"><span class="s" data-ic="grid" data-sw="4"></span><b>≠</b><span class="c">S/</span></div>
          <div id="ttl">Un sistema<br />no te hará<br /><span class="hl">ganar dinero</span></div>
          <i id="ul"></i>
          <div class="pill plain" id="sub">Si no sabes vender</div>
        </div>
      </section>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      tl.to("#ic", { rotation: 0, duration: 2 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
