<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Automatizar 02a — Un proceso lento, complicado, mal diseñado</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #hd { position: absolute; left: 0; right: 0; top: 140px; display: flex; justify-content: center; font-weight: 800; font-size: 56px; white-space: nowrap; }
      #list { position: absolute; left: 0; right: 0; top: 270px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
      #list .pill { font-size: 64px; padding: 16px 44px 16px 16px; }
      #list .pi { width: 96px; height: 96px; }
      #list .pi svg { width: 60px; height: 60px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.6" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="4.6" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="hd"><span id="h">Si tu proceso es…</span></div>
          <div id="list">
            <div class="pill o" id="p1"><span class="pi" id="i1" data-ic="clock" data-col="#ea5a14" data-sw="5"></span>Lento</div>
            <div class="pill o" id="p2"><span class="pi" id="i2" data-ic="grid" data-col="#ea5a14" data-sw="5"></span>Complicado</div>
            <div class="pill o" id="p3"><span class="pi" id="i3" data-ic="alert" data-col="#ea5a14" data-sw="5"></span>Mal diseñado</div>
          </div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="1.3" data-volume="0.3"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="2.1" data-volume="0.3"></audio>
      <audio id="s-3" src="assets/sfx/impact.wav" data-start="3.0" data-volume="0.34"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="4.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.2;
      const fx = document.getElementById("fx");
      const parts = GEX.particles(fx, 5, 2101, { x0: 20, x1: 140, y0: 140, y1: 900 }).concat(GEX.particles(fx, 5, 2102, { x0: 940, x1: 1060, y0: 140, y1: 800 }));
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      const h = GEX.split(document.getElementById("h"));
      gsap.set(["#p1", "#p2", "#p3"], { autoAlpha: 0 });
      GEX.reveal(tl, h.words, 0.1, "rise", { stagger: 0.08, duration: 0.4 });
      [["#p1", "#i1", 1.3], ["#p2", "#i2", 2.1], ["#p3", "#i3", 3.0]].forEach(([p, ic, t], i) => {
        tl.fromTo(p, { x: i % 2 ? 900 : -900, rotation: i % 2 ? 6 : -6, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(1.8)", immediateRender: false }, t);
        tl.fromTo(ic, { scale: 0, rotation: -150 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)" }, t + 0.08);
        GEX.float(tl, p, t + 0.6, EXIT, 6, 1.2 + i * 0.12);
      });
      tl.to("#i1 svg", { rotation: 360, duration: 2.6, ease: "none", transformOrigin: "50% 50%" }, 1.5);
      tl.to("#i2", { rotation: 15, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 9 }, 2.4);
      tl.to("#p3", { keyframes: [{ x: -10, duration: 0.05 }, { x: 10, duration: 0.05 }, { x: -6, duration: 0.05 }, { x: 0, duration: 0.05 }] }, 3.45);
      GEX.scatter(tl, ["#p1", "#p2", "#p3"], EXIT, 21);
      tl.to(h.words, { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.03 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
