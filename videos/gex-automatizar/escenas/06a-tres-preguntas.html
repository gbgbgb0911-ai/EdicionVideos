<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Automatizar 06a — Tres preguntas antes de automatizar</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tg { position: absolute; left: 0; right: 0; top: 140px; display: flex; justify-content: center; }
      #tg .tag { font-size: 32px; }
      #big { position: absolute; left: 0; right: 0; top: 230px; display: flex; justify-content: center; align-items: center; gap: 24px; }
      #n3 { width: 210px; height: 210px; border-radius: 50%; background: #ea5a14; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 160px; line-height: 1; }
      #pw { font-weight: 800; font-size: 104px; line-height: 0.95; white-space: nowrap; }
      #qs { position: absolute; left: 0; right: 0; top: 520px; display: flex; justify-content: center; gap: 40px; }
      .q { width: 170px; height: 170px; border-radius: 50% 50% 50% 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 110px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.6" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="4.6" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="tg"><span class="tag" id="tag">ANTES DE AUTOMATIZAR</span></div>
          <div id="big"><span id="n3">3</span><span id="pw">preguntas</span></div>
          <div id="qs"><span class="q" id="q1" style="background: #0b958b">?</span><span class="q" id="q2" style="background: #ea5a14">?</span><span class="q" id="q3" style="background: #179a4a">?</span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-n" src="assets/sfx/impact.wav" data-start="1.6" data-volume="0.36"></audio>
      <audio id="s-q" src="assets/sfx/pop.wav" data-start="2.5" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="4.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.2;
      const parts = GEX.particles(document.getElementById("fx"), 10, 6101, { x0: 20, x1: 1060, y0: 140, y1: 900 });
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      const pw = GEX.split(document.getElementById("pw"));
      tl.fromTo("#tag", { y: -40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, 0.1);
      tl.fromTo("#n3", { scale: 0, rotation: -200 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 1.5);
      GEX.reveal(tl, pw.chars, 1.7, "drop", { stagger: 0.04, duration: 0.42 });
      ["#q1", "#q2", "#q3"].forEach((id, i) => {
        tl.fromTo(id, { y: 120, scale: 0, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.6)" }, 2.5 + i * 0.22);
        tl.to(id, { y: -14, rotation: i % 2 ? 8 : -8, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.1 + i * 0.12);
      });
      GEX.punch(tl, "#n3", 2.4, 1.1);
      GEX.scatter(tl, ["#tag", "#n3", "#q1", "#q2", "#q3"], EXIT, 61);
      tl.to(pw.chars, { y: -160, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.02 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
