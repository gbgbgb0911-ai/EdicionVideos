<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX CTA — Si quieres una página web así, escríbeme</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 14px; top: 200px; }
      .r1 { display: flex; align-items: center; gap: 22px; }
      #bw { position: relative; width: 130px; height: 104px; border-radius: 20px; background: #ffffff; flex: none; overflow: hidden; }
      #bw .bb { position: absolute; left: 0; right: 0; top: 0; height: 26px; border-bottom: 4px solid #dfe7e6; }
      #bw .bb i { position: absolute; top: 8px; width: 10px; height: 10px; border-radius: 50%; }
      #bw .l1 { position: absolute; left: 14px; top: 40px; width: 70px; height: 14px; border-radius: 7px; background: #0b958b; }
      #bw .l2 { position: absolute; left: 14px; top: 62px; width: 100px; height: 10px; border-radius: 5px; background: #cfdcdb; }
      #bw .bt { position: absolute; left: 14px; top: 80px; width: 44px; height: 14px; border-radius: 7px; background: #fe6820; }
      #q1 { font-weight: 800; font-size: 64px; white-space: nowrap; }
      #q2 { font-weight: 800; font-size: 92px; line-height: 1; white-space: nowrap; }
      #q2 .hl { color: #fe6820; }
      #ctaw { position: absolute; left: 0; right: 0; top: 500px; display: flex; justify-content: center; }
      #cta { font-size: 62px; padding: 18px 44px 18px 18px; }
      #cta .pi { width: 88px; height: 88px; }
      #cta .pi svg { width: 54px; height: 54px; }
      #rg { position: absolute; left: 50%; top: 50%; width: 460px; height: 124px; margin: -62px 0 0 -230px; border-radius: 999px; border: 8px solid #1fc4b8; }
      .dg { position: absolute; width: 16px; height: 80px; border-radius: 8px; transform: rotate(25deg); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.2" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="5.2" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <span class="dg" id="d1" style="left: 70px; top: 360px; background: #fe6820"></span>
        <span class="dg" id="d2" style="left: 100px; top: 380px; background: #1fc4b8"></span>
        <span class="dg" id="d3" style="left: 960px; top: 230px; background: #1fc4b8"></span>
        <span class="dg" id="d4" style="left: 990px; top: 250px; background: #fe6820"></span>
        <div class="top" id="top">
          <div class="r1"><div id="bw"><div class="bb"><i style="left: 12px; background: #fe6820"></i><i style="left: 28px; background: #1fc4b8"></i><i style="left: 44px; background: #cfdcdb"></i></div><i class="l1"></i><i class="l2"></i><i class="bt"></i></div><span id="q1">¿Quieres una</span></div>
          <div id="q2"><span id="q2a">página web</span> <span class="hl" id="q2b">así?</span></div>
        </div>
        <div id="ctaw"><span id="rg"></span><div class="pill" id="cta"><span class="pi" data-ic="chat" data-sw="4.5"></span><span id="ct">Escríbeme</span><i class="shine" id="sh" data-layout-allow-overflow></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.4"></audio>
      <audio id="s-asi" src="assets/sfx/pop.wav" data-start="0.95" data-volume="0.3"></audio>
      <audio id="s-cta" src="assets/sfx/whoosh.wav" data-start="1.55" data-volume="0.3"></audio>
      <audio id="s-clk" src="assets/sfx/click.wav" data-start="2.65" data-volume="0.32"></audio>
      <audio id="s-shm" src="assets/sfx/shimmer.wav" data-start="2.75" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="4.78" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.8;
      const scene = document.getElementById("scene");
      const fx = document.getElementById("fx");
      const parts = GEX.particles(fx, 6, 1101, { x0: 60, x1: 200, y0: 460, y1: 700 }).concat(GEX.particles(fx, 6, 1102, { x0: 880, x1: 1020, y0: 460, y1: 700 }));
      GEX.ambient(tl, parts, 1.6, EXIT + 0.3);
      const q1 = GEX.split(document.getElementById("q1"));
      const q2 = GEX.split(document.getElementById("q2a"));
      gsap.set(["#cta", "#rg"], { autoAlpha: 0 });
      const cur = GEX.cursor(scene);
      gsap.set(cur.c, { x: 1120, y: 760 });
      // pregunta
      tl.fromTo("#bw", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      tl.fromTo("#bw .l1, #bw .l2, #bw .bt", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power3.out", stagger: 0.08 }, 0.35);
      GEX.reveal(tl, q1.words, 0.15, "rise", { stagger: 0.08, duration: 0.4 });
      GEX.reveal(tl, q2.chars, 0.4, "drop", { stagger: 0.03, duration: 0.4 });
      tl.fromTo("#q2b", { scale: 2.2, rotation: -10, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, 0.9);
      tl.fromTo(".dg", { y: (i) => (i < 2 ? 140 : -140), autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.06 }, 0.5);
      tl.to(".dg", { y: (i) => (i % 2 ? -16 : 16), duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0.95);
      tl.to("#bw .bt", { scale: 1.25, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.2);
      GEX.float(tl, "#bw", 0.6, EXIT, 7, 1.3);
      // escríbeme
      tl.fromTo("#cta", { y: 80, scale: 0.4, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 1.55);
      tl.fromTo("#cta .pi", { rotation: -180 }, { rotation: 0, duration: 0.5, ease: "back.out(2)" }, 1.6);
      GEX.tap(tl, cur, 690, 560, 2.15, 0.5);
      tl.to("#cta", { keyframes: [{ scale: 0.92, duration: 0.08 }, { scale: 1.1, backgroundColor: "#ea5a14", duration: 0.18 }, { scale: 1, duration: 0.25 }], ease: "sine.out" }, 2.65);
      tl.to("#cta .pi svg", { attr: { stroke: "#ea5a14" }, duration: 0.15 }, 2.73);
      tl.fromTo("#sh", { x: -140 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 2.8);
      tl.set("#sh", { x: -140 }, 3.45);
      tl.to(cur.c, { x: 1120, y: 900, duration: 0.45, ease: "power2.in" }, 3.0);
      [2.75, 3.4, 4.05].forEach((t) => tl.fromTo("#rg", { scale: 1, borderWidth: 8, autoAlpha: 1 }, { scale: 1.35, borderWidth: 0, autoAlpha: 1, duration: 0.6, ease: "circ.out", immediateRender: false }, t));
      tl.set("#rg", { autoAlpha: 0 }, 4.66);
      tl.to("#cta .pi", { rotation: 12, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5 }, 3.4);
      tl.to("#q2b", { y: -10, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 3.0);
      // salida en piezas
      GEX.scatter(tl, ["#bw", "#q2b", "#d1", "#d2", "#d3", "#d4"], EXIT, 1103);
      tl.to(q1.words, { y: -140, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.03 }, EXIT);
      tl.to(q2.chars, { y: -200, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.015 }, EXIT);
      tl.to("#cta", { y: 260, scale: 0.6, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
