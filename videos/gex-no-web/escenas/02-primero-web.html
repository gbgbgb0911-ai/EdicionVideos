<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>No web 02 — Lo primero que piensa: una web</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #own { position: absolute; left: 110px; top: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      #own .av { width: 220px; height: 220px; }
      #own .av svg { width: 120px; height: 120px; }
      #own .chip { font-size: 34px; }
      #sb { position: absolute; left: 270px; top: 560px; width: 84px; height: 84px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      #sb svg { width: 50px; height: 50px; }
      #dg { position: absolute; left: 50px; top: 760px; font-size: 36px; padding: 10px 24px; }
      .td { position: absolute; border-radius: 50%; background: #ffffff; }
      #bub { position: absolute; left: 500px; top: 70px; width: 500px; height: 380px; border-radius: 60px; background: #ffffff; padding: 30px; }
      #bw { width: 100%; height: 100%; border-radius: 20px; border: 5px solid #dfe7e6; overflow: hidden; }
      #bw .bb { height: 44px; border-bottom: 4px solid #dfe7e6; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
      #bw .bb i { width: 12px; height: 12px; border-radius: 50%; background: #cfdcdb; }
      #bw .bb b { margin-left: 10px; font-weight: 800; font-size: 26px; color: #0b958b; }
      #bw .hero { margin: 16px; height: 90px; border-radius: 14px; background: #0b958b; }
      #bw .ln { display: flex; gap: 12px; margin: 0 16px; }
      #bw .ln i { flex: 1; height: 70px; border-radius: 12px; background: #d6f3f0; }
      #fst { position: absolute; left: 600px; top: 480px; font-size: 40px; padding: 12px 28px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.0" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="7.0" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="own"><span class="av o" data-ic="user" data-col="#ffffff" data-sw="4"></span><span class="chip o">Emprendedor</span></div>
          <span id="sb" data-ic="store" data-sw="4.5"></span>
          <span class="chip" id="dg">Digitalizar mi negocio</span>
          <span class="td" id="t1" style="left: 360px; top: 400px; width: 30px; height: 30px"></span>
          <span class="td" id="t2" style="left: 410px; top: 340px; width: 44px; height: 44px"></span>
          <span class="td" id="t3" style="left: 460px; top: 270px; width: 60px; height: 60px"></span>
          <div id="bub"><div id="bw"><div class="bb"><i></i><i></i><i></i><b>www.minegocio.com</b></div><div class="hero"></div><div class="ln"><i></i><i></i><i></i></div></div></div>
          <span class="chip o" id="fst">1º · Una página web</span>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-d" src="assets/sfx/pop.wav" data-start="1.6" data-volume="0.28"></audio>
      <audio id="s-b" src="assets/sfx/shimmer.wav" data-start="3.8" data-volume="0.26"></audio>
      <audio id="s-f" src="assets/sfx/ding.wav" data-start="5.0" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.6;
      const parts = GEX.particles(document.getElementById("fx"), 8, 1801, { x0: 560, x1: 1060, y0: 640, y1: 940 });
      GEX.ambient(tl, parts, 0.5, EXIT + 0.3);
      gsap.set(["#dg", ".td", "#bub", "#fst"], { autoAlpha: 0 });
      tl.fromTo("#own", { y: 200, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2)" }, 0.05);
      tl.fromTo("#sb", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 0.4);
      GEX.float(tl, "#own", 0.8, EXIT, 6, 1.4);
      // quiere digitalizar su negocio
      tl.fromTo("#dg", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)", immediateRender: false }, 1.6);
      tl.to("#dg", { rotation: -2, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.1);
      // lo primero que piensa: una web
      tl.fromTo(".td", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.25, ease: "back.out(3)", stagger: 0.12, immediateRender: false }, 3.4);
      tl.fromTo("#bub", { scale: 0.3, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(1.8)", immediateRender: false }, 3.8);
      tl.fromTo("#bw .hero, #bw .ln i", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power2.out", stagger: 0.1 }, 4.2);
      tl.fromTo("#fst", { scale: 0, rotation: -12, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.38, ease: "back.out(3)", immediateRender: false }, 5.0);
      tl.to("#bub", { y: -10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, 4.6);
      GEX.scatter(tl, ["#own", "#sb", "#dg", "#t1", "#t2", "#t3", "#bub", "#fst"], EXIT, 92);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
