<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>No web 04 — Una web no soluciona esos problemas</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 18px; top: 200px; }
      #wp { font-size: 46px; padding: 14px 34px 14px 14px; background: #ffffff; color: #0b958b; }
      #wp .pi { width: 70px; height: 70px; background: #0b958b; }
      #wp .pi svg { width: 44px; height: 44px; }
      #ar { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
      #ar i { position: absolute; left: 54px; top: 0; width: 12px; height: 100px; border-radius: 6px; background: #ffffff; }
      #ar b { position: absolute; left: 22px; top: 22px; width: 76px; height: 76px; border-radius: 50%; background: #ea5a14; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 800; border: 6px solid #ffffff; }
      #pr { display: flex; gap: 14px; }
      #pr .chip { position: relative; font-size: 36px; padding: 10px 26px; }
      #pr .chip em { position: absolute; right: -22px; top: -22px; width: 40px; height: 40px; border-radius: 50%; background: #ffffff; color: #ea5a14; font-style: normal; font-size: 28px; display: flex; align-items: center; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4.4" data-track-index="0">
        <div class="top" id="top">
          <div class="pill" id="wp"><span class="pi" data-ic="code" data-col="#ffffff" data-sw="5"></span>Página web</div>
          <div id="ar"><i></i><b>✗</b></div>
          <div id="pr"><span class="chip" id="p1">Inventario<em>?</em></span><span class="chip o" id="p2">Pedidos<em>?</em></span><span class="chip g" id="p3">Ventas<em>?</em></span></div>
        </div>
      </section>
      <audio id="s-w" src="assets/sfx/pop.wav" data-start="0.2" data-volume="0.28"></audio>
      <audio id="s-x" src="assets/sfx/tick.wav" data-start="1.5" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.98" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.0;
      gsap.set(["#ar", "#pr .chip"], { autoAlpha: 0 });
      tl.fromTo("#wp", { y: -50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)" }, 0.2);
      tl.fromTo("#wp .pi", { rotation: -180 }, { rotation: 0, duration: 0.5, ease: "back.out(2)" }, 0.25);
      tl.fromTo("#ar", { scaleY: 0, autoAlpha: 0, transformOrigin: "50% 0%" }, { scaleY: 1, autoAlpha: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.3);
      tl.fromTo("#ar b", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, 1.5);
      tl.fromTo("#pr .chip", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.38, ease: "back.out(2.4)", stagger: 0.12, immediateRender: false }, 2.1);
      tl.to("#pr em", { rotation: 15, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5, stagger: 0.06 }, 2.7);
      tl.to("#ar b", { scale: 1.12, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.2);
      GEX.scatter(tl, ["#wp", "#ar", "#p1", "#p2", "#p3"], EXIT, 95);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
