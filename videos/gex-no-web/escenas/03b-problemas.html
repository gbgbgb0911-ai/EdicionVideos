<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>No web 03b — Inventario, pedidos y ventas</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #c1 { top: 320px; } #c2 { top: 640px; } #c3 { top: 960px; }
      .qq { font-size: 30px; padding: 8px 18px; align-self: flex-start; }
      .tkts { position: relative; height: 130px; }
      .tkts .tkt { position: absolute; top: 0; }
      .eq { font-weight: 800; font-size: 46px; color: #12703a; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7.4" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">PROBLEMAS INTERNOS</span></div>
        <div class="pc" id="c1"><div class="pl" style="background: #0b958b"><span class="ico" data-ic="box" data-sw="4.5"></span>INVENTARIO</div>
          <div class="pr2"><b>¿Qué tengo disponible?</b><div class="row"><span class="bx">3</span><span class="bx e" id="e1">?</span><span class="bx">8</span><span class="bx e" id="e2">?</span><span class="bx">1</span></div><span class="chip o qq" id="q1">¿Ya se agotó?</span></div></div>
        <div class="pc" id="c2"><div class="pl" style="background: #ea5a14"><span class="ico" data-ic="receipt" data-col="#ea5a14" data-sw="4.5"></span>PEDIDOS</div>
          <div class="pr2"><b>¿Cuál va primero?</b><div class="tkts"><span class="tkt" id="k1" style="left: 0">#12<i></i><i></i></span><span class="tkt" id="k2" style="left: 110px">#15<i></i><i></i></span><span class="tkt" id="k3" style="left: 220px">#13<i></i><i></i></span><span class="tkt" id="k4" style="left: 330px">#18<i></i><i></i></span></div></div></div>
        <div class="pc" id="c3"><div class="pl" style="background: #179a4a"><span class="ico" data-ic="chart" data-col="#179a4a" data-sw="4.5"></span>VENTAS</div>
          <div class="pr2"><b>¿Cuánto vendí realmente?</b><div class="row"><span class="nb2">$<i style="font-style: normal">····</i></span><span class="eq">+</span><span class="nb2">$<i style="font-style: normal">····</i></span><span class="eq">+</span><span class="nb2">$<i style="font-style: normal">····</i></span><span class="eq" id="eq">= ?</span></div></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="2.4" data-volume="0.28"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="4.0" data-volume="0.28"></audio>
      <audio id="s-3" src="assets/sfx/pop.wav" data-start="5.4" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.98" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 7.0;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1821, { x0: 60, x1: 1020, y0: 1300, y1: 1560 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set([".pc", "#q1"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      const card = (id, t, dx) => {
        tl.fromTo(id, { x: dx, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out", immediateRender: false }, t);
        tl.fromTo(id + " .pl .ico", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)", immediateRender: false }, t + 0.1);
      };
      // inventario: no sabes qué hay
      card("#c1", 2.3, -1000);
      tl.fromTo("#c1 .bx", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.06 }, 2.5);
      tl.to(["#e1", "#e2"], { rotation: 10, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.9);
      tl.fromTo("#q1", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 3.0);
      // pedidos: desordenados
      card("#c2", 3.9, 1000);
      tl.fromTo("#c2 .tkt", { y: -120, rotation: 0, autoAlpha: 0 }, { y: (i) => [10, -6, 14, 0][i], rotation: (i) => [-8, 6, -4, 10][i], autoAlpha: 1, duration: 0.4, ease: "bounce.out", stagger: 0.08 }, 4.1);
      tl.to("#k3", { x: -40, y: 20, rotation: 14, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4.8);
      tl.to("#k1", { x: 30, rotation: -14, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.0);
      // ventas: registros sueltos
      card("#c3", 5.3, -1000);
      tl.fromTo("#c3 .nb2, #c3 .eq", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.07 }, 5.5);
      tl.to("#eq", { scale: 1.25, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 6.1);
      // salida + barrido
      GEX.scatter(tl, ["#c1", "#c2", "#c3", "#tag"], EXIT, 94);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
