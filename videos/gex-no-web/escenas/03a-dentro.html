<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>No web 03a — ¿Y si el problema está dentro?</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #sv { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; }
      .sh { fill: none; stroke: #ffffff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .q { position: absolute; width: 90px; height: 90px; border-radius: 50%; background: #ea5a14; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 60px; }
      #lens { position: absolute; left: 760px; top: 120px; width: 170px; height: 170px; border-radius: 50%; border: 12px solid #1fc4b8; z-index: 5; }
      #lens i { position: absolute; left: 130px; top: 130px; width: 22px; height: 90px; border-radius: 11px; background: #1fc4b8; transform: rotate(-45deg); transform-origin: 50% 0; }
      #lb { position: absolute; left: 0; right: 0; top: 780px; display: flex; justify-content: center; }
      #lb .chip { font-size: 40px; padding: 12px 30px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.8" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="3.8" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <svg id="sv" viewBox="0 0 1080 960"><path id="st" class="sh" d="M280 720 V 330 H 800 V 720 Z M260 330 L 300 230 H 780 L 820 330 M300 330 q 43 50 87 0 q 43 50 87 0 q 43 50 87 0 q 43 50 87 0 q 43 50 87 0 q 43 50 87 0 M470 720 V 560 H 610 V 720" /></svg>
          <span class="q" id="q1" style="left: 330px; top: 440px">?</span>
          <span class="q" id="q2" style="left: 495px; top: 410px">?</span>
          <span class="q" id="q3" style="left: 660px; top: 440px">?</span>
          <div id="lens"><i></i></div>
          <div id="lb"><span class="chip o" id="lc">Dentro del negocio</span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-q" src="assets/sfx/pop.wav" data-start="1.6" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.38" data-volume="0.4"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.4;
      const parts = GEX.particles(document.getElementById("fx"), 6, 1811, { x0: 20, x1: 240, y0: 100, y1: 900 }).concat(GEX.particles(document.getElementById("fx"), 6, 1812, { x0: 840, x1: 1060, y0: 360, y1: 900 }));
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      const st = document.getElementById("st"), L = st.getTotalLength();
      gsap.set([".q", "#lc"], { autoAlpha: 0 });
      tl.fromTo(st, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 0.05);
      // miramos dentro
      tl.fromTo("#lens", { x: 300, y: -200, autoAlpha: 0 }, { x: 0, y: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.5);
      tl.to("#lens", { keyframes: [{ x: -380, y: 280, duration: 0.5 }, { x: -220, y: 240, duration: 0.4 }, { x: -300, y: 300, duration: 0.4 }], ease: "sine.inOut" }, 1.0);
      tl.fromTo(".q", { scale: 0, rotation: -90, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", stagger: 0.12, immediateRender: false }, 1.6);
      tl.to(".q", { rotation: 14, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5, stagger: 0.06 }, 2.1);
      tl.fromTo("#lc", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.38, ease: "back.out(2.4)", immediateRender: false }, 2.0);
      GEX.scatter(tl, ["#lens", "#q1", "#q2", "#q3", "#lc"], EXIT, 93);
      tl.to("#sv", { y: 100, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
