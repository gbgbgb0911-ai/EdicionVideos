<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>No web 05b — Un sistema que centraliza la operación</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #mini { position: absolute; left: 0; right: 0; top: 300px; display: flex; justify-content: center; gap: 20px; z-index: 6 !important; }
      .mc { position: relative; width: 290px; height: 190px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #ffffff; font-weight: 800; font-size: 28px; letter-spacing: 0.08em; z-index: 5; }
      .mc .ico { width: 90px; height: 90px; background: #ffffff; }
      .mc em { position: absolute; right: -12px; top: -12px; width: 50px; height: 50px; border-radius: 50%; background: #ffffff; color: #ea5a14; font-style: normal; font-size: 32px; display: flex; align-items: center; justify-content: center; }
      #sys { position: absolute; left: 90px; top: 560px; width: 900px; }
      #mods { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; }
      .md { height: 200px; border-radius: 22px; background: #eef4f3; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 22px; }
      .md .hd { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; white-space: nowrap; }
      .md .hd .ico { width: 64px; height: 64px; background: #ffffff; }
      .md .chip { align-self: flex-start; font-size: 28px; padding: 6px 16px; }
      #endw { position: absolute; left: 0; right: 0; top: 1150px; display: flex; justify-content: center; }
      #ep { font-size: 42px; padding: 14px 32px 14px 14px; }
      #ep .pi { width: 70px; height: 70px; }
      #ep .pi svg { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="6.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="6.4" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">SISTEMA DE GESTIÓN</span></div>
        <div id="mini">
          <div class="mc" id="m1" style="background: #0b958b"><span class="ico" data-ic="box" data-sw="4.5"></span>INVENTARIO<em>?</em></div>
          <div class="mc" id="m2" style="background: #ea5a14"><span class="ico" data-ic="receipt" data-col="#ea5a14" data-sw="4.5"></span>PEDIDOS<em>?</em></div>
          <div class="mc" id="m3" style="background: #179a4a"><span class="ico" data-ic="chart" data-col="#179a4a" data-sw="4.5"></span>VENTAS<em>?</em></div>
        </div>
        <div class="win" id="sys"><div class="bar"><i></i><i></i><i></i><b>Tu sistema</b></div>
          <div id="mods">
            <div class="md" id="d1"><span class="hd"><span class="ico" data-ic="box" data-sw="4.5"></span>Inventario</span><span class="chip">Al día ✓</span></div>
            <div class="md" id="d2"><span class="hd"><span class="ico" data-ic="receipt" data-col="#ea5a14" data-sw="4.5"></span>Pedidos</span><span class="chip o">En orden ✓</span></div>
            <div class="md" id="d3"><span class="hd"><span class="ico" data-ic="chart" data-col="#179a4a" data-sw="4.5"></span>Ventas</span><span class="chip g">Total claro ✓</span></div>
            <div class="md" id="d4"><span class="hd"><span class="ico" data-ic="gear" data-col="#b86e00" data-sw="4.5"></span>Administración</span><span class="chip a">En un lugar ✓</span></div>
          </div>
        </div>
        <div id="endw"><div class="pill" id="ep"><span class="pi" data-ic="sliders" data-sw="4.5"></span>Más control de tu operación<i class="shine" id="sh" data-layout-allow-overflow></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-f" src="assets/sfx/whoosh.wav" data-start="1.4" data-volume="0.32"></audio>
      <audio id="s-m" src="assets/sfx/tick.wav" data-start="2.3" data-volume="0.26"></audio>
      <audio id="s-a" src="assets/sfx/pop.wav" data-start="3.3" data-volume="0.28"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="4.6" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.98" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.0;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1861, { x0: 60, x1: 1020, y0: 1260, y1: 1560 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set(["#sys", ".md", "#ep", ".md .chip"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      // los mismos problemas de antes...
      tl.fromTo(".mc", { y: -200, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.1 }, 0.3);
      tl.to(".mc em", { rotation: 14, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.06 }, 0.8);
      // ...entran a un sistema y se ordenan
      tl.fromTo("#sys", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, 1.3);
      [["#m1", -205, 380], ["#m2", 0, 380], ["#m3", -100, 620]].forEach(([id, dx, dy], i) => tl.to(id, { x: [-150, 160, -150][i], y: [400, 400, 620][i], scale: 0.5, autoAlpha: 0, duration: 0.45, ease: "power3.in" }, 1.5 + i * 0.12));
      ["#d1", "#d2", "#d3"].forEach((id, i) => tl.fromTo(id, { scale: 0.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, 2.0 + i * 0.15));
      tl.fromTo("#d4", { scale: 0.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, 3.3);
      tl.fromTo(".md .chip", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.18, immediateRender: false }, 3.6);
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 4.6);
      tl.fromTo("#sh", { x: -140 }, { x: 800, duration: 0.6, ease: "power2.inOut" }, 5.0);
      GEX.float(tl, "#sys", 2.4, EXIT, 5, 1.8);
      // salida + barrido
      GEX.scatter(tl, ["#sys", "#ep", "#tag"], EXIT, 97);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
