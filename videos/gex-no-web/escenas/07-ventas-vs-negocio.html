<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>No web 07 — Digitalizar tus ventas vs digitalizar tu negocio</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .pan { position: absolute; left: 40px; width: 1000px; height: 640px; border-radius: 40px; border: 7px solid #fe6820; }
      #pb { border-color: #1fc4b8; }
      .pt { position: absolute; left: 30px; top: 28px; font-size: 44px; padding: 12px 32px 12px 12px; }
      .pt .pi { width: 68px; height: 68px; }
      .pt .pi svg { width: 42px; height: 42px; }
      .wn { position: absolute; left: 30px; top: 140px; width: 600px; height: 450px; }
      .wn .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .hero { height: 70px; border-radius: 14px; background: #ea5a14; display: flex; align-items: center; padding: 0 18px; color: #ffffff; font-weight: 800; font-size: 28px; white-space: nowrap; }
      .prods { display: flex; gap: 10px; }
      .pd { flex: 1; height: 240px; border-radius: 14px; background: #fff1ea; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
      .pd .ico { width: 74px; height: 74px; background: #ffffff; }
      .pd .chip { font-size: 24px; padding: 6px 14px; }
      .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .tl2 { height: 150px; border-radius: 16px; background: #eef4f3; display: flex; align-items: center; gap: 14px; padding: 0 18px; font-weight: 800; font-size: 30px; white-space: nowrap; }
      .tl2 .ico { width: 66px; height: 66px; background: #ffffff; }
      .side { position: absolute; left: 660px; top: 150px; width: 310px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .side .row { display: flex; gap: 12px; }
      .side .av { width: 92px; height: 92px; }
      .side .av svg { width: 54px; height: 54px; }
      .side .chip { font-size: 30px; padding: 8px 18px; }
      .side .ar { font-weight: 800; font-size: 64px; line-height: 1; }
      #mid { position: absolute; left: 0; right: 0; top: 818px; display: flex; justify-content: center; z-index: 5; }
      #mid .pill { font-size: 34px; padding: 10px 28px 10px 10px; background: #ffffff; color: #0b958b; border: 6px solid #000000; }
      #mid .pi { width: 54px; height: 54px; background: #0b958b; color: #ffffff; font-weight: 800; font-size: 40px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="8.4" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="pan" id="pa" style="top: 180px">
          <div class="pill o pt" id="ta"><span class="pi" data-ic="code" data-col="#ea5a14" data-sw="5"></span>Digitalizar tus VENTAS</div>
          <div class="win wn" id="wa"><div class="bar"><i></i><i></i><i></i><b>Página web</b></div><div class="body"><div class="hero">Catálogo</div><div class="prods">
            <div class="pd"><span class="ico" data-ic="bag" data-col="#ea5a14" data-sw="4.5"></span><span class="chip o" id="buy">Comprar</span></div>
            <div class="pd"><span class="ico" data-ic="shirt" data-col="#ea5a14" data-sw="4.5"></span><span class="chip o">Comprar</span></div>
            <div class="pd"><span class="ico" data-ic="chat" data-col="#ea5a14" data-sw="4.5"></span><span class="chip o">Consultar</span></div></div></div></div>
          <div class="side" id="sa"><div class="row"><span class="av o" data-ic="user" data-col="#ffffff" data-sw="4.5"></span><span class="av a" data-ic="user" data-col="#ffffff" data-sw="4.5"></span></div><span class="ar" style="color: #fe6820">←</span><span class="chip o">Clientes</span><span class="chip o">Hacia afuera</span></div>
        </div>
        <div id="mid"><div class="pill" id="mp"><span class="pi">+</span>Se pueden complementar</div></div>
        <div class="pan" id="pb" style="top: 900px">
          <div class="pill pt" id="tb"><span class="pi" data-ic="grid" data-sw="4.5"></span>Digitalizar tu NEGOCIO</div>
          <div class="win wn" id="wb"><div class="bar"><i></i><i></i><i></i><b>Sistema interno</b></div><div class="body"><div class="tiles">
            <div class="tl2"><span class="ico" data-ic="receipt" data-sw="4.5"></span>Pedidos</div>
            <div class="tl2"><span class="ico" data-ic="box" data-sw="4.5"></span>Inventario</div>
            <div class="tl2"><span class="ico" data-ic="money" data-sw="4.5"></span>Ingresos</div>
            <div class="tl2"><span class="ico" data-ic="gear" data-sw="4.5"></span>Procesos</div></div></div></div>
          <div class="side" id="sb"><div class="row"><span class="av" data-ic="user" data-col="#ffffff" data-sw="4.5"></span><span class="av g" data-ic="users" data-col="#ffffff" data-sw="4.5"></span></div><span class="ar" style="color: #1fc4b8">←</span><span class="chip">Tu equipo</span><span class="chip">Hacia adentro</span></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-buy" src="assets/sfx/click.wav" data-start="2.2" data-volume="0.3"></audio>
      <audio id="s-b" src="assets/sfx/whoosh.wav" data-start="3.0" data-volume="0.32"></audio>
      <audio id="s-t" src="assets/sfx/tick.wav" data-start="4.2" data-volume="0.26"></audio>
      <audio id="s-m" src="assets/sfx/success.wav" data-start="5.6" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="7.98" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.0;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#pb", "#mp", "#sa > *", "#sb > *", ".tl2"], { autoAlpha: 0 });
      const cur = GEX.cursor(scene);
      gsap.set(cur.c, { x: 1120, y: 300 });
      // digitalizar tus ventas: hacia afuera
      tl.fromTo("#pa", { y: -300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo("#ta", { x: -80, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.5);
      tl.fromTo("#wa", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.7);
      tl.fromTo("#wa .pd", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.08 }, 1.0);
      tl.fromTo("#sa > *", { x: 120, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12, immediateRender: false }, 1.3);
      GEX.tap(tl, cur, 120, 610, 1.75, 0.45);
      tl.to("#buy", { keyframes: [{ scale: 0.85, duration: 0.08 }, { scale: 1.15, backgroundColor: "#179a4a", duration: 0.15 }, { scale: 1, duration: 0.2 }], ease: "sine.out" }, 2.2);
      tl.to(cur.c, { x: 1120, y: 500, duration: 0.4, ease: "power2.in" }, 2.6);
      tl.to("#sa .ar", { x: -14, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 9 }, 2.4);
      // digitalizar tu negocio: hacia adentro
      tl.fromTo("#pb", { y: 300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out", immediateRender: false }, 3.0);
      tl.fromTo("#tb", { x: -80, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 3.2);
      tl.fromTo("#wb", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)" }, 3.4);
      tl.fromTo(".tl2", { scale: 0.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.32, ease: "back.out(2.6)", stagger: 0.15, immediateRender: false }, 4.0);
      tl.fromTo("#sb > *", { x: 120, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12, immediateRender: false }, 4.3);
      tl.to("#sb .ar", { x: -14, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7 }, 5.0);
      tl.to(".tl2 .ico", { scale: 1.12, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.12 }, 5.2);
      // distintas, pero se complementan
      tl.fromTo("#mp", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.6)", immediateRender: false }, 5.6);
      tl.fromTo("#mp .pi", { rotation: -180 }, { rotation: 0, duration: 0.5, ease: "back.out(2)" }, 5.65);
      tl.to("#mp", { scale: 1.06, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 6.3);
      // salida + barrido
      GEX.scatter(tl, ["#pa", "#mp", "#pb"], EXIT, 99);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
