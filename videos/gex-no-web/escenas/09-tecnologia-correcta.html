<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>No web 09 — La tecnología correcta para tu negocio</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 22px; top: 200px; }
      #ics { position: relative; width: 900px; height: 120px; }
      .ti { position: absolute; top: 10px; width: 100px; height: 100px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      .ti svg { width: 56px; height: 56px; }
      #win { left: 400px; background: #179a4a; }
      #st { text-align: center; font-weight: 800; line-height: 1.04; white-space: nowrap; }
      #l1 { font-size: 66px; }
      #l2 { font-size: 64px; color: #fe6820; }
      .logo { display: inline-flex; align-items: center; padding: 12px 24px; border-radius: 22px; background: #ffffff; }
      .logo img { display: block; width: 200px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.6" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="5.6" data-track-index="0">
        <div class="top" id="top">
          <div id="ics">
            <span class="ti" style="left: 0" data-ic="phone" data-sw="4.5"></span>
            <span class="ti" style="left: 133px" data-ic="code" data-col="#ea5a14" data-sw="5"></span>
            <span class="ti" style="left: 266px" data-ic="chart" data-sw="4.5"></span>
            <span class="ti" id="win" data-ic="check" data-col="#ffffff" data-sw="6"></span>
            <span class="ti" style="left: 533px" data-ic="bell" data-col="#ea5a14" data-sw="4.5"></span>
            <span class="ti" style="left: 666px" data-ic="grid" data-sw="4.5"></span>
            <span class="ti" style="left: 800px" data-ic="cart" data-col="#ea5a14" data-sw="4.5"></span>
          </div>
          <div id="st"><div id="l1"><span id="a">LA TECNOLOGÍA CORRECTA</span></div><div id="l2"><span id="b">PARA TU NEGOCIO</span></div></div>
          <span class="logo" id="lg"><img src="assets/logo-v2/gex-full.png" alt="GEX" /></span>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/pop.wav" data-start="0.4" data-volume="0.26"></audio>
      <audio id="s-out1" src="assets/sfx/whoosh-out.wav" data-start="2.4" data-volume="0.3"></audio>
      <audio id="s-ok" src="assets/sfx/ding.wav" data-start="3.0" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.18" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 5.2;
      const A = GEX.split(document.getElementById("a")), B = GEX.split(document.getElementById("b"));
      const others = Array.from(document.querySelectorAll(".ti")).filter((e) => e.id !== "win");
      gsap.set(["#lg"], { autoAlpha: 0 });
      // más tecnología...
      tl.fromTo(".ti", { y: -80, scale: 0, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)", stagger: 0.12 }, 0.4);
      tl.to(others, { y: -10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.05 }, 1.3);
      // ...no: la correcta
      tl.to(others, { scale: 0, autoAlpha: 0, y: 60, duration: 0.35, ease: "back.in(2)", stagger: 0.04 }, 2.4);
      tl.to("#win", { scale: 1.3, duration: 0.4, ease: "back.out(2.6)" }, 2.9);
      tl.to("#win", { scale: 1.2, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.4);
      GEX.reveal(tl, A.words, 3.0, "rise", { stagger: 0.1, duration: 0.42 });
      GEX.reveal(tl, B.words, 3.6, "drop", { stagger: 0.12, duration: 0.42 });
      tl.fromTo("#lg", { y: 30, scale: 0.6, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)", immediateRender: false }, 4.3);
      GEX.scatter(tl, ["#win", "#lg"], EXIT, 101);
      tl.to(A.words.concat(B.words), { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.02 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
