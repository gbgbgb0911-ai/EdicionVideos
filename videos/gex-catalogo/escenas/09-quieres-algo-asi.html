<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1680" />
    <title>GEX Catálogo 09 — ¿Quieres algo así?</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-light.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/gex-light.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .scene { gap: 22px; }
      .q { font-weight: 800; font-size: 54px; line-height: 1; white-space: nowrap; }
      .box { width: 880px; padding: 26px 28px 20px; border-radius: 34px; }
      .box .ph { min-height: 92px; font-weight: 500; font-size: 38px; line-height: 1.2; color: var(--ink); }
      .box .ph { position: relative; }
      .box .hint { position: absolute; left: 0; top: 0; color: #6f7b7a; }
      .box .tools { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
      .box .lft { display: flex; gap: 12px; align-items: center; }
      .pill { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 20px; border-radius: 25px; border: 2px solid #e1e7e7; font-weight: 700; font-size: 22px; color: var(--muted); }
      .plusb { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #e1e7e7; display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--muted); }
      .send { width: 60px; height: 60px; border-radius: 50%; background: var(--teal); display: flex; align-items: center; justify-content: center; }
      .reply { display: flex; align-items: center; gap: 20px; padding: 18px 28px; border-radius: 26px; }
      .reply img { height: 46px; }
      .reply .tx { font-weight: 800; font-size: 36px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.5" data-fps="60" data-width="2160" data-height="1680">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="4.5" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div class="q" id="q">¿Y tú qué opinas?</div>
          <div class="card box" id="box">
            <div class="ph"><span class="hint" id="hint">Escribe aquí…</span><span id="typed"></span></div>
            <div class="tools">
              <div class="lft"><span class="plusb">+</span><span class="pill">Mi tienda</span></div>
              <div class="send" id="send"><svg viewBox="0 0 30 30" width="30" height="30"><path d="M15 25V6 M7 13l8-8 8 8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
            </div>
          </div>
          <div class="card reply" id="reply"><img src="assets/logo-v2/gex-full.png" alt="GEX" /><span class="tx">¡Escríbeme y lo armamos!</span></div>
          <div class="cursor" id="cur" style="position: absolute"></div>
          <div class="ripple" id="rip" style="position: absolute"></div>
        </section>
      </div>
    </div>
    <script>
      document.getElementById("cur").innerHTML = GEX.cursorSvg;
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.15;
      GEX.ambient(tl, GEX.lightParticles(document.getElementById("fx"), 10, 77, { x0: 20, x1: 1060, y0: 20, y1: 640 }), 0.1, EXIT + 0.3);
      const q = GEX.split(document.getElementById("q"));
      GEX.reveal(tl, q.words, 0.08, "rise", { stagger: 0.07 });
      tl.fromTo("#box", { y: 80, scale: 0.92, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.55, ease: "expo.out" }, 0.25);
      // Se escribe el mensaje
      tl.to("#hint", { autoAlpha: 0, duration: 0.1, ease: "none" }, 0.72);
      GEX.type(tl, "#typed", "Quiero una web así para mi tienda de ropa", 0.75, 1.3, true);
      tl.fromTo("#send", { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 1.9);
      // Enviar
      tl.fromTo("#cur", { x: 1000, y: 620, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15 }, 1.85);
      GEX.tap(tl, "#cur", "#rip", 905, 345, 1.9, 0.4);
      tl.to("#send", { keyframes: [{ scale: 0.85, duration: 0.08 }, { scale: 1.15, duration: 0.15 }, { scale: 1, duration: 0.2 }], ease: "sine.out" }, 2.3);
      tl.to("#cur", { x: 1040, y: 700, autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 2.6);
      tl.fromTo("#reply", { y: 60, scale: 0.6, autoAlpha: 0, transformOrigin: "0% 100%" }, { y: 0, scale: 1, autoAlpha: 1, transformOrigin: "0% 100%", duration: 0.45, ease: "back.out(2.2)" }, 2.55);
      GEX.float(tl, "#reply", 3.05, EXIT, 7, 1.0);
      GEX.float(tl, "#box", 2.6, EXIT, 5, 1.4);

      GEX.scatter(tl, [...q.words, "#box", "#reply"], EXIT, 23);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
