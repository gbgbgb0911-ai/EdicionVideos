<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1680" />
    <title>GEX Catálogo 07 — Antes vs ahora</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-light.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/gex-light.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .scene { flex-direction: row; align-items: flex-start; gap: 36px; padding-top: 34px; }
      .col { display: flex; flex-direction: column; gap: 9px; width: 440px; padding: 22px 24px 20px; }
      .col .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .col .cnt { font-weight: 800; font-size: 30px; white-space: nowrap; }
      .col.old .cnt { color: #c6370d; }
      .col.new .cnt { color: var(--teal); }
      .st { display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 16px; border-radius: 14px; background: #f2f5f5; font-weight: 700; font-size: 25px; white-space: nowrap; }
      .st .d { width: 30px; height: 30px; border-radius: 50%; border: 4px solid #c9d3d2; flex: none; }
      .old .st.done .d { border-color: #c6370d; background: #c6370d; }
      .new .st.done .d { border-color: var(--teal); background: var(--teal); }
      .new .st.wa { background: #e6f7ef; border: 3px solid var(--wa-dark); }
      .timer { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-weight: 800; font-size: 26px; color: var(--muted); }
      .timer b { font-variant-numeric: tabular-nums; color: var(--ink); }
      .vs { align-self: center; margin-top: -140px; font-weight: 800; font-size: 44px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5" data-fps="60" data-width="2160" data-height="1680">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div class="card col old" id="old">
            <div class="hd"><span class="badge bad">ANTES</span><span class="cnt" id="c1">0 pasos</span></div>
            <div class="st" id="a1"><span class="d"></span>Entrar a la web</div>
            <div class="st" id="a2"><span class="d"></span>Crear cuenta</div>
            <div class="st" id="a3"><span class="d"></span>Verificar correo</div>
            <div class="st" id="a4"><span class="d"></span>Armar carrito</div>
            <div class="st" id="a5"><span class="d"></span>Pasarela de pago</div>
            <div class="st" id="a6"><span class="d"></span>Confirmar pedido</div>
            <div class="timer">⏱ <b id="tm1">0:00</b></div>
          </div>
          <div class="vs" id="vs">vs</div>
          <div class="card col new" id="new">
            <div class="hd"><span class="badge good">AHORA</span><span class="cnt" id="c2">0 pasos</span></div>
            <div class="st" id="b1"><span class="d"></span>Entrar al catálogo</div>
            <div class="st" id="b2"><span class="d"></span>Elegir la prenda</div>
            <div class="st wa" id="b3"><span class="d"></span><span id="bw"></span></div>
            <div class="timer">⏱ <b id="tm2">0:00</b></div>
          </div>
        </section>
      </div>
    </div>
    <script>
      document.getElementById("bw").innerHTML = '<span style="display:inline-flex;align-items:center;gap:10px">' + GEX.waIcon(32) + "Pedir por WhatsApp</span>";
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.65;
      GEX.ambient(tl, GEX.lightParticles(document.getElementById("fx"), 8, 57, { x0: 20, x1: 1060, y0: 20, y1: 640 }), 0.1, EXIT + 0.3);
      tl.fromTo("#old", { x: -200, rotation: -4, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 0.08);
      tl.fromTo("#new", { x: 200, rotation: 4, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 0.2);
      tl.fromTo("#vs", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, 0.5);
      tl.fromTo(".st", { x: -20, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.25, ease: "power2.out", stagger: 0.04 }, 0.4);

      // Ahora: 3 pasos rápidos
      const fmt = (s) => "0:" + String(Math.round(s)).padStart(2, "0");
      const fmtM = (s) => Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");
      ["#b1", "#b2", "#b3"].forEach((id, i) => {
        tl.to(id + " .d", { backgroundColor: "#039991", borderColor: "#039991", duration: 0.15, ease: "power1.out" }, 1.0 + i * 0.3);
        tl.to(id, { keyframes: [{ scale: 1.05, duration: 0.1 }, { scale: 1, duration: 0.2 }], ease: "sine.out" }, 1.0 + i * 0.3);
      });
      const nb = { s: 0, p: 0 };
      const tm2 = document.getElementById("tm2"), c2 = document.getElementById("c2");
      tl.fromTo(nb, { s: 0, p: 0 }, { s: 15, p: 3, duration: 0.9, ease: "none", onUpdate: () => { tm2.textContent = fmt(nb.s); c2.textContent = Math.round(nb.p) + (Math.round(nb.p) === 1 ? " paso" : " pasos"); } }, 1.0);
      tl.to("#new", { keyframes: [{ scale: 1.04, duration: 0.15 }, { scale: 1, duration: 0.35 }], ease: "back.out(3)" }, 2.0);

      // Antes: 6 pasos lentos
      ["#a1", "#a2", "#a3", "#a4", "#a5", "#a6"].forEach((id, i) => {
        tl.to(id + " .d", { backgroundColor: "#c6370d", borderColor: "#c6370d", duration: 0.15, ease: "power1.out" }, 1.0 + i * 0.55);
      });
      const na = { s: 0, p: 0 };
      const tm1 = document.getElementById("tm1"), c1 = document.getElementById("c1");
      tl.fromTo(na, { s: 0, p: 0 }, { s: 480, p: 6, duration: 3.1, ease: "none", onUpdate: () => { tm1.textContent = fmtM(na.s); c1.textContent = Math.round(na.p) + (Math.round(na.p) === 1 ? " paso" : " pasos"); } }, 1.0);
      tl.to("#old", { keyframes: [{ x: -6 }, { x: 6 }, { x: 0 }], duration: 0.25, ease: "none" }, 4.15);

      GEX.scatter(tl, ["#old", "#vs", "#new"], EXIT, 17);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
