<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1680" />
    <title>GEX Catálogo 04 — Abandonaban y escribían por WhatsApp</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-light.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/gex-light.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .scene { flex-direction: row; gap: 60px; }
      .cartbox { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; width: 340px; padding: 30px 20px 26px; }
      #cart { width: 200px; height: 170px; overflow: visible; }
      .cartbox .lbl { font-weight: 800; font-size: 36px; line-height: 1.05; text-align: center; }
      .cartbox .lbl b { color: #c6370d; }
      .fly { position: absolute; left: 120px; top: 70px; width: 80px; height: 76px; }
      .stack { position: relative; width: 520px; height: 520px; }
      .ntf { position: absolute; left: 0; right: 0; display: flex; gap: 16px; align-items: flex-start; padding: 18px 22px; border-radius: 24px; background: #fff; box-shadow: var(--shadow); }
      .ntf .tx { flex: 1; }
      .ntf .tp { display: flex; justify-content: space-between; font-weight: 800; font-size: 24px; }
      .ntf .tp span { font-weight: 500; color: var(--muted); font-size: 20px; }
      .ntf .ms { font-weight: 500; font-size: 24px; margin-top: 4px; white-space: nowrap; }
      .count { position: absolute; left: -26px; top: -26px; display: flex; align-items: center; justify-content: center; min-width: 74px; height: 56px; padding: 0 12px; border-radius: 28px; background: #12201f; color: #fff; font-weight: 800; font-size: 28px; z-index: 20; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.5" data-fps="60" data-width="2160" data-height="1680">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="4.5" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div class="card cartbox" id="cartbox">
            <svg id="cart" viewBox="0 0 200 170"><path d="M10 20h30l24 96h100l20-70H52" fill="none" stroke="#12201f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="80" cy="146" r="13" fill="#12201f" /><circle cx="150" cy="146" r="13" fill="#12201f" /></svg>
            <div class="fly" id="g1"></div><div class="fly" id="g2"></div><div class="fly" id="g3"></div>
            <div class="lbl" id="lbl">Compra<br /><b>abandonada</b></div>
          </div>
          <div class="stack" id="stack" data-layout-allow-overflow="true">
            <div class="count" id="count">0</div>
          </div>
        </section>
      </div>
    </div>
    <script>
      const G = [["polo", "#7fd8cf"], ["vestido", "#ffb48a"], ["jean", "#8fb3e6"]];
      ["#g1", "#g2", "#g3"].forEach((id, i) => (document.querySelector(id).innerHTML = GEX.garment(G[i][0], G[i][1])));
      const msgs = [["Cliente", "Hola, ¿tienen este polo en M?"], ["Cliente", "¿Precio del vestido?"], ["Cliente", "No pude pagar en la web"], ["Cliente", "¿Hacen envíos a provincia?"]];
      const stack = document.getElementById("stack");
      const cards = msgs.map(([n, m], i) => {
        const d = document.createElement("div");
        d.className = "ntf";
        d.style.top = "0px";
        d.innerHTML = `${GEX.waIcon(56)}<div class="tx"><div class="tp">WhatsApp<span>ahora</span></div><div class="ms">${m}</div></div>`;
        stack.appendChild(d);
        return d;
      });

      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.15;
      GEX.ambient(tl, GEX.lightParticles(document.getElementById("fx"), 8, 27, { x0: 20, x1: 1060, y0: 20, y1: 640 }), 0.1, EXIT + 0.3);
      tl.fromTo("#cartbox", { y: 120, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.08);
      // Las prendas caen al carrito... y salen volando
      ["#g1", "#g2", "#g3"].forEach((id, i) => {
        tl.fromTo(id, { y: -160, x: (i - 1) * 40, rotation: -20 + i * 20, autoAlpha: 0 }, { y: 0, x: (i - 1) * 30, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "bounce.out" }, 0.3 + i * 0.12);
        tl.to(id, { x: (i - 1) * 260, y: -320, rotation: (i - 1) * 90 + 30, autoAlpha: 0, duration: 0.55, ease: "power3.in" }, 1.1 + i * 0.07);
      });
      tl.to("#cart", { keyframes: [{ rotation: -8 }, { rotation: 6 }, { rotation: 0 }], svgOrigin: "100 140", duration: 0.4, ease: "sine.inOut" }, 1.05);
      tl.fromTo("#lbl", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.5)" }, 1.4);

      // Notificaciones de WhatsApp apilándose
      const STEP = 108;
      cards.forEach((d, i) => {
        const t = 1.5 + i * 0.4;
        tl.fromTo(d, { y: -120, scale: 0.9, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.38, ease: "back.out(1.8)" }, t);
        cards.slice(0, i).forEach((prev, k) => {
          tl.to(prev, { y: (i - k) * STEP, scale: 1 - (i - k) * 0.03, duration: 0.38, ease: "power2.out" }, t);
        });
        tl.set(d, { zIndex: 10 + i }, t);
      });
      tl.fromTo("#count", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)" }, 1.55);
      const n = { v: 0 };
      const ct = document.getElementById("count");
      tl.fromTo(n, { v: 1 }, { v: 99, duration: 1.9, ease: "power2.in", onUpdate: () => { ct.textContent = n.v >= 99 ? "99+" : Math.round(n.v); } }, 1.6);
      tl.to("#count", { keyframes: [{ scale: 1.3, duration: 0.1 }, { scale: 1, duration: 0.3 }], ease: "back.out(3)" }, 3.5);

      tl.to("#cartbox", { x: -260, rotation: -8, autoAlpha: 0, duration: 0.32, ease: "power3.in" }, EXIT);
      tl.to("#stack", { x: 300, autoAlpha: 0, duration: 0.32, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
