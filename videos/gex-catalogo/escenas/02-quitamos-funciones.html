<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1680" />
    <title>GEX Catálogo 02 — Le quitamos funciones</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-light.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/gex-light.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .scene { flex-direction: row; gap: 56px; }
      .left { display: flex; flex-direction: column; gap: 10px; width: 420px; }
      .q { font-weight: 700; font-size: 40px; color: var(--muted); white-space: nowrap; }
      .t1 { font-weight: 800; font-size: 66px; line-height: 1; white-space: nowrap; }
      .t2 { font-weight: 800; font-size: 66px; line-height: 1; white-space: nowrap; color: var(--orange-ink); }
      .panel { position: relative; width: 470px; padding: 26px 26px 22px; }
      .panel h4 { font-weight: 800; font-size: 26px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 14px; }
      .row { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 18px; margin-bottom: 10px; border-radius: 16px; background: #f2f5f5; font-weight: 700; font-size: 28px; white-space: nowrap; }
      .row .del { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #c6370d; color: #fff; font-weight: 800; font-size: 30px; line-height: 1; }
      .row.keep { background: #e6f7ef; border: 3px solid var(--wa-dark); }
      .row.keep .ok { color: var(--wa-dark); font-weight: 800; font-size: 34px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-width="2160" data-height="1680">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div class="left">
            <div class="q" id="q">¿Y sabes qué hicimos?</div>
            <div class="t1" id="t1">LE QUITAMOS</div>
            <div class="t2" id="t2">FUNCIONES</div>
          </div>
          <div class="card panel" id="panel">
            <h4>FUNCIONES DE LA WEB</h4>
            <div class="row" id="r1">Crear cuenta <span class="del">−</span></div>
            <div class="row" id="r2">Contraseña <span class="del">−</span></div>
            <div class="row" id="r3">Pasarela de pago <span class="del">−</span></div>
            <div class="row" id="r4">Verificar correo <span class="del">−</span></div>
            <div class="row keep" id="r5"><span style="display: flex; align-items: center; gap: 12px" id="wa"></span><span class="ok">✓</span></div>
            <div class="cursor" id="cur"></div>
            <div class="ripple" id="rip"></div>
          </div>
        </section>
      </div>
    </div>
    <script>
      document.getElementById("cur").innerHTML = GEX.cursorSvg;
      document.getElementById("wa").innerHTML = GEX.waIcon(40) + "Botón WhatsApp";
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.65;
      GEX.ambient(tl, GEX.lightParticles(document.getElementById("fx"), 10, 17, { x0: 20, x1: 1060, y0: 20, y1: 640 }), 0.1, EXIT + 0.3);
      const q = GEX.split(document.getElementById("q"));
      const t1 = GEX.split(document.getElementById("t1"));
      const t2 = GEX.split(document.getElementById("t2"));
      GEX.reveal(tl, q.words, 0.08, "rise", { stagger: 0.06 });
      GEX.reveal(tl, t1.chars, 0.35, "pop", { stagger: 0.03 });
      GEX.reveal(tl, t2.chars, 0.6, "drop", { stagger: 0.035, duration: 0.5 });

      tl.fromTo("#panel", { x: 140, rotation: 4, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 0.2);
      tl.fromTo(".row", { x: 40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.06 }, 0.45);
      // Cursor borra una a una (coordenadas dentro del panel)
      tl.fromTo("#cur", { x: 470, y: 420, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, 0.9);
      ["#r1", "#r2", "#r3", "#r4"].forEach((id, i) => {
        const t = 1.0 + i * 0.42;
        GEX.tap(tl, "#cur", "#rip", 410, 92 + 74 * i, t, i === 0 ? 0.35 : 0.2);
        tl.to(id, { x: 260, rotation: 8, autoAlpha: 0, duration: 0.28, ease: "power3.in" }, t + (i === 0 ? 0.42 : 0.27));
      });
      tl.to("#cur", { x: 520, y: 260, autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 2.85);
      // El botón de WhatsApp sube a ocupar el lugar y late
      tl.to("#r5", { y: -296, duration: 0.45, ease: "back.out(1.6)" }, 2.75);
      // El botón de WhatsApp queda y late
      tl.to("#r5", { keyframes: [{ scale: 1.08, duration: 0.15 }, { scale: 1, duration: 0.3 }], ease: "back.out(3)" }, 2.75);
      tl.to("#r5", { scale: 1.03, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.15);
      tl.to(t2.chars, { y: -10, duration: 0.15, ease: "sine.out", yoyo: true, repeat: 1, stagger: 0.03 }, 2.4);

      GEX.scatter(tl, [...q.words, ...t1.chars, ...t2.chars], EXIT, 3);
      tl.to("#panel", { x: 220, rotation: 6, autoAlpha: 0, duration: 0.32, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
