<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Delivery 03 — Carga manual reducida 95%</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 22px; top: 300px; }
      .br { width: 660px; display: flex; flex-direction: column; gap: 10px; }
      .br .lb { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 40px; white-space: nowrap; }
      .br .lb b { color: #fe6820; }
      .br .tr { height: 46px; border-radius: 23px; border: 5px solid #dfe7e6; overflow: hidden; }
      .br .tr i { display: block; height: 100%; width: 100%; border-radius: 18px; background: #fe6820; transform-origin: 0% 50%; }
      #big { font-weight: 800; font-size: 150px; line-height: 1; color: #1fc4b8; white-space: nowrap; }
      #solo { font-size: 42px; padding: 12px 30px 12px 12px; }
      #solo .pi { width: 66px; height: 66px; }
      #solo .pi svg { width: 42px; height: 42px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="8.4" data-track-index="0">
        <div class="top" id="top">
          <div class="br" id="b1"><span class="lb">Operaciones manuales<b class="num" id="v1">100%</b></span><span class="tr"><i id="f1"></i></span></div>
          <div class="br" id="b2"><span class="lb">Carga laboral<b class="num" id="v2">100%</b></span><span class="tr"><i id="f2"></i></span></div>
          <div id="big" class="num">−0%</div>
          <div class="pill g" id="solo"><span class="pi" data-ic="bot" data-col="#179a4a" data-sw="4.5"></span>El negocio se atiende solo</div>
        </div>
      </section>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="0.4" data-volume="0.28"></audio>
      <audio id="s-dn" src="assets/sfx/whoosh-out.wav" data-start="3.3" data-volume="0.3"></audio>
      <audio id="s-95" src="assets/sfx/impact.wav" data-start="4.6" data-volume="0.32"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="6.2" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="7.98" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.0;
      gsap.set(["#big", "#solo"], { autoAlpha: 0 });
      gsap.set(["#f1", "#f2"], { scaleX: 0 });
      // antes: todo manual
      tl.fromTo(".br", { x: -100, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.15 }, 0.4);
      tl.to(["#f1", "#f2"], { scaleX: 1, duration: 0.7, ease: "power2.out", stagger: 0.15 }, 0.7);
      tl.to(".br .tr", { x: 4, duration: 0.07, yoyo: true, repeat: 9, ease: "none" }, 1.8);
      // se reduce en un 95%
      tl.to(["#f1", "#f2"], { scaleX: 0.05, duration: 1.2, ease: "power3.inOut", stagger: 0.1 }, 3.4);
      GEX.count(tl, document.getElementById("v1"), 100, 5, 3.4, 1.2, "", "%");
      GEX.count(tl, document.getElementById("v2"), 100, 5, 3.5, 1.2, "", "%");
      tl.fromTo("#big", { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)", immediateRender: false }, 3.5);
      GEX.count(tl, document.getElementById("big"), 0, 95, 3.6, 1.0, "−", "%");
      GEX.punch(tl, "#big", 4.6, 1.15);
      // el negocio se atiende solo
      tl.fromTo("#solo", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 6.2);
      tl.to("#solo .pi", { rotation: 12, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 6.7);
      tl.to("#big", { y: -8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.0);
      GEX.scatter(tl, ["#b1", "#b2", "#big", "#solo"], EXIT, 153);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
