<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Excel 01a — Excel es increíble, pero… (sobre cámara)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { gap: 26px; top: 200px; }
      .r1 { display: flex; align-items: center; gap: 20px; }
      .xi { width: 110px; height: 110px; border-radius: 26px; background: #179a4a; position: relative; flex: none; }
      .xi::before { content: ""; position: absolute; left: 20px; right: 20px; top: 20px; bottom: 20px; border-radius: 6px; background: #ffffff; background-image: linear-gradient(90deg, transparent 30%, #179a4a 30%, #179a4a 37%, transparent 37%, transparent 63%, #179a4a 63%, #179a4a 70%, transparent 70%), linear-gradient(transparent 28%, #179a4a 28%, #179a4a 36%, transparent 36%, transparent 64%, #179a4a 64%, #179a4a 72%, transparent 72%); }
      #t1 { font-weight: 800; font-size: 64px; white-space: nowrap; }
      #ok { font-size: 34px; padding: 10px 20px; }
      .r2 { display: flex; align-items: center; gap: 14px; height: 110px; }
      .mx { width: 70px; height: 70px; border-radius: 16px; background: #179a4a; position: relative; }
      .mx::before { content: ""; position: absolute; left: 13px; right: 13px; top: 13px; bottom: 13px; border-radius: 4px; background: #ffffff; background-image: linear-gradient(90deg, transparent 30%, #179a4a 30%, #179a4a 37%, transparent 37%, transparent 63%, #179a4a 63%, #179a4a 70%, transparent 70%), linear-gradient(transparent 28%, #179a4a 28%, #179a4a 36%, transparent 36%, transparent 64%, #179a4a 64%, #179a4a 72%, transparent 72%); }
      #grow { font-size: 36px; padding: 12px 24px; margin-left: 10px; }
      .r3 { display: flex; gap: 16px; }
      .r3 .pill { font-size: 46px; padding: 14px 32px 14px 14px; }
      .r3 .pi { width: 70px; height: 70px; }
      .r3 .pi svg { width: 44px; height: 44px; }
      .dn { font-weight: 800; font-size: 50px; margin-left: 4px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7.5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="top" id="top">
          <div class="r1"><span class="xi" id="xi"></span><span id="t1">Excel es increíble</span><span class="chip g" id="ok">✓</span></div>
          <div class="r2" id="r2"><span class="mx"></span><span class="mx"></span><span class="mx"></span><span class="mx"></span><span class="mx"></span><span class="mx"></span><span class="chip" id="grow">Tu negocio crece ↗</span></div>
          <div class="r3"><div class="pill o" id="c1"><span class="pi" data-ic="clock" data-col="#ea5a14" data-sw="5"></span>Tiempo<span class="dn">↓</span></div><div class="pill o" id="c2"><span class="pi" data-ic="money" data-col="#ea5a14" data-sw="4.5"></span>Dinero<span class="dn">↓</span></div></div>
          <div class="r3"><div class="pill o" id="c3"><span class="pi" data-ic="sliders" data-col="#ea5a14" data-sw="5"></span>Control<span class="dn">↓</span></div></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.4"></audio>
      <audio id="s-ok" src="assets/sfx/pop.wav" data-start="0.7" data-volume="0.28"></audio>
      <audio id="s-g" src="assets/sfx/tick.wav" data-start="2.0" data-volume="0.26"></audio>
      <audio id="s-c1" src="assets/sfx/pop.wav" data-start="4.3" data-volume="0.28"></audio>
      <audio id="s-c3" src="assets/sfx/impact.wav" data-start="5.5" data-volume="0.34"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="7.08" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 7.1;
      const t1 = GEX.split(document.getElementById("t1"));
      gsap.set([".mx", "#grow", "#c1", "#c2", "#c3"], { autoAlpha: 0 });
      tl.fromTo("#xi", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      GEX.reveal(tl, t1.words, 0.15, "rise", { stagger: 0.08, duration: 0.4 });
      tl.fromTo("#ok", { scale: 0, rotation: -60, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, 0.7);
      tl.to("#xi", { rotation: 8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.0);
      // el negocio crece: más y más hojas
      tl.fromTo(".mx", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.18, immediateRender: false }, 2.0);
      tl.fromTo("#grow", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 2.4);
      tl.to(".mx", { y: -8, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5, stagger: 0.06 }, 3.2);
      // tiempo, dinero, control
      [["#c1", 4.3], ["#c2", 4.9], ["#c3", 5.5]].forEach(([id, t], i) => {
        tl.fromTo(id, { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, t);
        tl.to(id + " .dn", { y: 10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, t + 0.4);
      });
      GEX.scatter(tl, ["#xi", "#ok", "#r2", "#c1", "#c2", "#c3"], EXIT, 1);
      tl.to(t1.words, { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.03 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
