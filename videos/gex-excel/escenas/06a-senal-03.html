<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Excel — Señal 03</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #hd { position: absolute; left: 0; right: 0; top: 130px; display: flex; justify-content: center; align-items: center; gap: 28px; }
      #bd { position: relative; width: 200px; height: 200px; border-radius: 50%; background: #179a4a; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
      #bd small { font-weight: 800; font-size: 26px; letter-spacing: 0.16em; }
      #bd b { font-weight: 800; font-size: 100px; line-height: 0.9; }
      #ring { position: absolute; inset: -18px; border-radius: 50%; border: 6px dashed #179a4a; }
      .tt { display: flex; flex-direction: column; }
      #l1 { font-weight: 800; font-size: 60px; line-height: 1.05; white-space: nowrap; }
      #l2 { font-weight: 800; font-size: 72px; line-height: 1.05; color: #1fc4b8; white-space: nowrap; }
      #chips { position: absolute; left: 40px; right: 40px; top: 450px; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
      .cc { font-size: 38px; padding: 12px 26px; gap: 12px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.2" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="4.2" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="hd"><div id="bd"><span id="ring"></span><small>SEÑAL</small><b>03</b></div><div class="tt"><span id="l1">DEPENDES DEMASIADO</span><span id="l2">DE UNA PERSONA</span></div></div>
          <div id="chips"><span class="chip  cc" id="k0">📁 Archivos</span><span class="chip o cc" id="k1">ƒx Fórmulas</span><span class="chip a cc" id="k2">🔒 Cierres</span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-hit" src="assets/sfx/impact.wav" data-start="0.35" data-volume="0.38"></audio>
      <audio id="s-c" src="assets/sfx/pop.wav" data-start="1.5" data-volume="0.28"></audio>
      <audio id="s-c2" src="assets/sfx/tick.wav" data-start="2.9" data-volume="0.26"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.78" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.80;
      const fx = document.getElementById("fx");
      const parts = GEX.particles(fx, 5, 303, { x0: 20, x1: 140, y0: 140, y1: 900 }).concat(GEX.particles(fx, 5, 309, { x0: 940, x1: 1060, y0: 140, y1: 800 }));
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      const l1 = GEX.split(document.getElementById("l1")), l2 = GEX.split(document.getElementById("l2"));
      gsap.set(".cc", { autoAlpha: 0 });
      tl.fromTo("#bd", { scale: 0, rotation: -200 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.2)" }, 0.05);
      tl.fromTo("#bd b", { scale: 2.2, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "power4.in" }, 0.15);
      tl.fromTo("#ring", { rotation: 0 }, { rotation: 180, duration: EXIT, ease: "none" }, 0);
      GEX.reveal(tl, l1.words, 0.3, "rise", { stagger: 0.07, duration: 0.4 });
      GEX.reveal(tl, l2.chars, 0.55, "drop", { stagger: 0.025, duration: 0.4 });
      GEX.punch(tl, "#bd", 1.2, 1.1);
      tl.fromTo("#k0", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)", immediateRender: false }, 1.5);
      tl.fromTo("#k1", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)", immediateRender: false }, 2.2);
      tl.fromTo("#k2", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)", immediateRender: false }, 2.9);
      tl.to(".cc", { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.1 }, 3.4);
      GEX.scatter(tl, ["#bd", ".cc"], EXIT, 3);
      tl.to(l1.words.concat(l2.chars), { y: -160, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.01 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
