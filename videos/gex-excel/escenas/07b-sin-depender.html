<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Excel 07b — Sin depender de una sola persona</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #row { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; align-items: center; gap: 30px; }
      #sys { width: 230px; height: 230px; border-radius: 40px; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      #sys svg { width: 150px; height: 150px; }
      .ppl { display: flex; flex-direction: column; gap: 14px; }
      .pp { display: flex; align-items: center; gap: 14px; }
      .pp .av { width: 76px; height: 76px; font-size: 30px; }
      .pp .chip { font-size: 30px; }
      #msg { position: absolute; left: 0; right: 0; top: 560px; display: flex; justify-content: center; }
      #msg .pill { font-size: 48px; padding: 14px 34px 14px 14px; }
      #msg .pi { width: 72px; height: 72px; }
      #msg .pi svg { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.4" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="3.4" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="row"><div id="sys" data-ic="grid" data-sw="4"></div><div class="ppl"><div class="pp" id="p1"><span class="av">C</span><span class="chip g">✓</span></div><div class="pp" id="p2"><span class="av o">A</span><span class="chip g">✓</span></div><div class="pp" id="p3"><span class="av g">L</span><span class="chip g">✓</span></div></div></div>
          <div id="msg"><div class="pill g" id="mp"><span class="pi" data-ic="check" data-col="#179a4a" data-sw="6"></span>El negocio no depende de uno<i class="shine" id="sh"></i></div></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-p" src="assets/sfx/pop.wav" data-start="0.5" data-volume="0.3"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="1.2" data-volume="0.32"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="2.98" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.0;
      const parts = GEX.particles(document.getElementById("fx"), 10, 7201, { x0: 20, x1: 1060, y0: 120, y1: 900 });
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      tl.fromTo("#sys", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      tl.fromTo(".pp", { x: 200, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12 }, 0.4);
      tl.fromTo("#mp", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)" }, 1.1);
      tl.fromTo("#sh", { x: -140 }, { x: 800, duration: 0.6, ease: "power2.inOut" }, 1.6);
      tl.set("#sh", { x: -140 }, 2.25);
      tl.to("#sys", { rotation: 6, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.0);
      GEX.scatter(tl, ["#sys", "#p1", "#p2", "#p3", "#mp"], EXIT, 72);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
