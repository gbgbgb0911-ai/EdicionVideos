<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Excel 01b — 3 señales</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #hd { position: absolute; left: 0; right: 0; top: 130px; display: flex; justify-content: center; align-items: center; gap: 24px; }
      #n3 { width: 190px; height: 190px; border-radius: 50%; background: #ea5a14; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 140px; line-height: 1; }
      #sw { font-weight: 800; font-size: 100px; line-height: 0.95; white-space: nowrap; }
      #cards { position: absolute; left: 0; right: 0; top: 400px; display: flex; justify-content: center; gap: 26px; }
      .cd { width: 230px; height: 230px; border-radius: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .cd small { font-weight: 800; font-size: 26px; letter-spacing: 0.14em; }
      .cd b { font-weight: 800; font-size: 104px; line-height: 0.95; }
      #sub { position: absolute; left: 0; right: 0; top: 700px; display: flex; justify-content: center; }
      #sub .chip { font-size: 36px; padding: 12px 26px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.8" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="3.8" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="hd"><span id="n3">3</span><span id="sw">señales</span></div>
          <div id="cards"><div class="cd" id="d1" style="background: #ea5a14"><small>SEÑAL</small><b>01</b></div><div class="cd" id="d2" style="background: #0b958b"><small>SEÑAL</small><b>02</b></div><div class="cd" id="d3" style="background: #179a4a"><small>SEÑAL</small><b>03</b></div></div>
          <div id="sub"><span class="chip gr" id="sc">¿Ya llegaste a ese punto?</span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-hit" src="assets/sfx/impact.wav" data-start="0.2" data-volume="0.38"></audio>
      <audio id="s-p" src="assets/sfx/pop.wav" data-start="0.9" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.38" data-volume="0.4"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.4;
      const parts = GEX.particles(document.getElementById("fx"), 10, 1201, { x0: 20, x1: 1060, y0: 120, y1: 900 });
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      const sw = GEX.split(document.getElementById("sw"));
      gsap.set("#sc", { autoAlpha: 0 });
      tl.fromTo("#n3", { scale: 0, rotation: -200 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      GEX.reveal(tl, sw.chars, 0.2, "drop", { stagger: 0.04, duration: 0.4 });
      ["#d1", "#d2", "#d3"].forEach((id, i) => {
        tl.fromTo(id, { y: 200, rotation: (i - 1) * 15, autoAlpha: 0 }, { y: 0, rotation: (i - 1) * 4, autoAlpha: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.9 + i * 0.18);
        tl.to(id, { y: -12, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.6 + i * 0.12);
      });
      tl.fromTo("#sc", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 1.9);
      GEX.scatter(tl, ["#n3", "#d1", "#d2", "#d3", "#sc"], EXIT, 12);
      tl.to(sw.chars, { y: -160, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.02 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
