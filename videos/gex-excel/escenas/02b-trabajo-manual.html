<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Excel 02b — Moviendo información entre archivos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #av { position: absolute; left: 470px; top: 640px; width: 140px; height: 140px; font-size: 54px; z-index: 5; border: 8px solid #000000; }
      .fly { position: absolute; left: 0; top: 0; font-size: 28px; padding: 8px 18px; z-index: 7; }
      .hlc { position: absolute; border: 5px solid #fe6820; border-radius: 6px; z-index: 6; }
      #stat { position: absolute; left: 0; right: 0; top: 1240px; display: flex; justify-content: center; gap: 16px; }
      #stat .chip { font-size: 38px; padding: 12px 26px; }
      #endw { position: absolute; left: 0; right: 0; top: 1360px; display: flex; justify-content: center; }
      #endw .pill { font-size: 48px; padding: 14px 34px 14px 14px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="8.5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">SEÑAL 01 · TRABAJO MANUAL</span></div>
        <div class="xl" id="sv" style="left: 60px; top: 290px; width: 450px"></div>
        <div class="xl" id="ss" style="left: 570px; top: 290px; width: 450px"></div>
        <div class="xl" id="sg" style="left: 315px; top: 820px; width: 450px"></div>
        <span class="av" id="av">A</span>
        <span class="chip o fly" id="fa">−3 u</span><span class="chip o fly" id="fb">$45</span><span class="chip o fly" id="fc">−1 u</span>
        <div id="stat"><span class="chip a" id="h1">⏱ <span class="num" id="hv">0</span> h por día</span><span class="chip o" id="h2">$ que estás pagando</span></div>
        <div id="endw"><div class="pill o plain" id="ep">Solo para mover datos de un lado a otro<i class="shine" id="sh"></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-t1" src="assets/sfx/tick.wav" data-start="1.3" data-volume="0.26"></audio>
      <audio id="s-t2" src="assets/sfx/tick.wav" data-start="2.5" data-volume="0.26"></audio>
      <audio id="s-t3" src="assets/sfx/tick.wav" data-start="3.7" data-volume="0.26"></audio>
      <audio id="s-h" src="assets/sfx/pop.wav" data-start="4.6" data-volume="0.28"></audio>
      <audio id="s-x" src="assets/sfx/impact.wav" data-start="6.4" data-volume="0.36"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.08" data-volume="0.4"></audio>
    </div>
    <script>
      document.getElementById("sv").innerHTML = GEX.sheet("ventas.xlsx", ["Fecha", "Producto", "Monto"], [["Lun", "Polo", "$45"], ["Lun", "Gorra", "$20"], ["Mar", "Polo", "$45"], ["Mar", "…", "…"]]);
      document.getElementById("ss").innerHTML = GEX.sheet("stock.xlsx", ["Producto", "Cantidad"], [["Polo", "37"], ["Gorra", "12"], ["Casaca", "8"], ["…", "…"]]);
      document.getElementById("sg").innerHTML = GEX.sheet("gastos.xlsx", ["Concepto", "Monto"], [["Proveedor", "$300"], ["Luz", "$80"], ["Envíos", "$45"], ["…", "…"]]);
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.1;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set([".fly", "#h1", "#h2", "#ep", "#av"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#sv", { x: -600, rotation: -6, autoAlpha: 0 }, { x: 0, rotation: -2, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.25);
      tl.fromTo("#ss", { x: 600, rotation: 6, autoAlpha: 0 }, { x: 0, rotation: 2, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.35);
      tl.fromTo("#sg", { y: 700, autoAlpha: 0 }, { y: 0, rotation: -1, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.45);
      tl.fromTo("#av", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(3)", immediateRender: false }, 0.9);
      // alguien copia datos de una hoja a otra… una y otra vez
      const moves = [["#fa", 300, 620, 870, 560, 1.3], ["#fb", 300, 620, 620, 1100, 2.5], ["#fc", 300, 620, 870, 560, 3.7]];
      moves.forEach(([id, x0, y0, x1, y1, t]) => {
        tl.fromTo(id, { x: x0, y: y0 - 180, scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.2, ease: "back.out(3)", immediateRender: false }, t);
        tl.to(id, { x: x1 - 60, y: y1 - 180, duration: 0.6, ease: "power2.inOut" }, t + 0.2);
        tl.to(id, { scale: 0.4, autoAlpha: 0, duration: 0.15 }, t + 0.85);
        tl.to("#av", { keyframes: [{ x: x1 > 600 ? 40 : -40, duration: 0.3 }, { x: 0, duration: 0.3 }], ease: "sine.inOut" }, t);
      });
      tl.to(["#sv", "#ss", "#sg"], { y: -6, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.1 }, 1.3);
      // horas que se van
      tl.fromTo("#h1", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 4.6);
      const hv = document.getElementById("hv"), h = { v: 0 };
      tl.to(h, { v: 2, duration: 1.2, ease: "power1.out", onUpdate: () => { hv.textContent = h.v.toFixed(1).replace(".0", ""); } }, 4.7);
      tl.fromTo("#h2", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 5.2);
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 6.4);
      tl.fromTo("#sh", { x: -140 }, { x: 900, duration: 0.6, ease: "power2.inOut" }, 6.9);
      tl.set("#sh", { x: -140 }, 7.55);
      // salida + barrido
      GEX.scatter(tl, ["#sv", "#ss", "#sg", "#av", "#h1", "#h2", "#ep", "#tag"], EXIT, 22);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
