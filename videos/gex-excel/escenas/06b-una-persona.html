<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Excel 06b — Todo depende de una persona</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #ln { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
      #key { position: absolute; left: 390px; top: 520px; width: 300px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 3; }
      #key .av { width: 210px; height: 210px; font-size: 80px; border: 10px solid #000000; }
      #key b { font-weight: 800; font-size: 40px; white-space: nowrap; }
      #key small { font-size: 26px; padding: 6px 16px; }
      #abs { position: absolute; left: 400px; top: 500px; font-size: 32px; padding: 10px 22px; z-index: 5; }
      .it { position: absolute; width: 340px; padding: 16px 18px; border-radius: 22px; background: #ffffff; color: var(--teal); font-weight: 800; font-size: 28px; line-height: 1.25; z-index: 2; }
      .it small { display: block; font-size: 22px; color: #c94a0c; }
      .cw { position: absolute; top: 1080px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 200px; }
      .cw .av { width: 130px; height: 130px; font-size: 48px; }
      .cw .qm { position: absolute; right: 18px; top: -16px; width: 60px; height: 60px; border-radius: 50%; background: #ea5a14; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 40px; }
      .wt { position: absolute; left: 470px; font-size: 30px; padding: 10px 22px; }
      #endw { position: absolute; left: 0; right: 0; top: 1400px; display: flex; justify-content: center; }
      #endw .pill { font-size: 50px; padding: 16px 36px 16px 16px; }
      #endw .pi { width: 76px; height: 76px; }
      #endw .pi svg { width: 48px; height: 48px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.8" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="8.8" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">SEÑAL 03 · TODO ESTÁ EN SU CABEZA</span></div>
        <svg id="ln" viewBox="0 0 1080 1920"><path id="l1" d="M540 620 L240 380" /><path id="l2" d="M540 620 L840 380" /><path id="l3" d="M540 620 L240 880" /><path id="l4" d="M540 620 L840 880" /></svg>
        <div class="it" id="i1" style="left: 50px; top: 300px">📁 Dónde están los archivos</div>
        <div class="it" id="i2" style="left: 690px; top: 300px">ƒx =SUMA(B2:B90)<small>⚠ No tocar esta fórmula</small></div>
        <div class="it" id="i3" style="left: 50px; top: 830px">🔒 Cómo se hace el cierre</div>
        <div class="it" id="i4" style="left: 690px; top: 830px">ventas_FINAL_v3.xlsx<small>¿o ventas_FINAL_real.xlsx?</small></div>
        <div id="key"><span class="av" id="ka">C</span><b>Carlos</b><span class="chip" id="ks">el que sabe todo</span></div>
        <span class="chip gr" id="abs">Hoy no vino</span>
        <div class="cw" id="w1" style="left: 80px"><span class="av o">A</span><span class="qm">?</span></div>
        <div class="cw" id="w2" style="left: 800px"><span class="av g">L</span><span class="qm">?</span></div>
        <span class="chip a wt" id="t1" style="top: 1110px">⏱ Cierre: en espera</span>
        <span class="chip a wt" id="t2" style="top: 1200px">⏱ Reporte: en espera</span>
        <div id="endw"><div class="pill o" id="ep"><span class="pi" data-ic="clock" data-col="#ea5a14" data-sw="5"></span>Todo se vuelve más lento<i class="shine" id="sh"></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-k" src="assets/sfx/pop.wav" data-start="0.4" data-volume="0.3"></audio>
      <audio id="s-i" src="assets/sfx/tick.wav" data-start="1.1" data-volume="0.26"></audio>
      <audio id="s-a" src="assets/sfx/impact.wav" data-start="4.4" data-volume="0.36"></audio>
      <audio id="s-q" src="assets/sfx/pop.wav" data-start="5.2" data-volume="0.28"></audio>
      <audio id="s-e" src="assets/sfx/tick.wav" data-start="6.9" data-volume="0.26"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.38" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      document.querySelectorAll("#ln path").forEach((p) => { p.setAttribute("stroke", "#1fc4b8"); p.setAttribute("stroke-width", "8"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-dasharray", "400"); });
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.4;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set([".it", "#abs", ".cw", ".wt", "#ep"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#ka", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.6)" }, 0.35);
      tl.fromTo(["#key b", "#ks"], { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.1 }, 0.6);
      // todo pasa por su cabeza
      ["#i1", "#i2", "#i3", "#i4"].forEach((id, i) => {
        const t = 1.0 + i * 0.6;
        tl.fromTo("#l" + (i + 1), { strokeDashoffset: 400 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, t);
        tl.fromTo(id, { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, t + 0.2);
      });
      tl.to("#ka", { scale: 1.06, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.0);
      // si esa persona falta…
      tl.to("#ka", { backgroundColor: "#6f807f", duration: 0.3 }, 4.4);
      tl.fromTo("#abs", { scale: 0, rotation: -12, autoAlpha: 0 }, { scale: 1, rotation: -6, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 4.4);
      tl.to("#ln path", { strokeDashoffset: 400, duration: 0.4, ease: "power2.in", stagger: 0.05 }, 4.6);
      tl.to(".it", { keyframes: [{ x: -8, duration: 0.05 }, { x: 8, duration: 0.05 }, { x: 0, duration: 0.05 }], repeat: 1 }, 4.7);
      tl.fromTo(".cw", { y: 120, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.12, immediateRender: false }, 5.2);
      tl.fromTo(".cw .qm", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.12 }, 5.5);
      tl.to(".cw .qm", { rotation: 15, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 7 }, 5.9);
      tl.fromTo(".wt", { scale: 0.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.6)", stagger: 0.2, immediateRender: false }, 5.8);
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 6.9);
      tl.to("#ep .pi svg", { rotation: 360, duration: 1.2, ease: "none", transformOrigin: "50% 50%" }, 7.2);
      tl.fromTo("#sh", { x: -140 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 7.4);
      tl.set("#sh", { x: -140 }, 8.05);
      // salida + barrido
      GEX.scatter(tl, ["#i1", "#i2", "#i3", "#i4", "#key", "#abs", "#w1", "#w2", "#t1", "#t2", "#ep", "#tag"], EXIT, 62);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
