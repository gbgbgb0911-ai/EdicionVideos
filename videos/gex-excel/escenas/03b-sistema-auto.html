<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Excel 03b — En un sistema se actualiza solo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #sale { position: absolute; left: 190px; top: 300px; width: 700px; height: 130px; display: flex; align-items: center; gap: 18px; padding: 0 26px; border-radius: 30px; background: #ffffff; color: var(--teal); font-weight: 800; font-size: 38px; white-space: nowrap; }
      #sale .ico { width: 84px; height: 84px; }
      #sync { position: absolute; left: 480px; top: 480px; width: 120px; height: 120px; border-radius: 50%; background: #0b958b; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 70px; }
      .ln { position: absolute; top: 600px; width: 8px; height: 110px; border-radius: 4px; background: #1fc4b8; transform-origin: 50% 0%; }
      .tile { position: absolute; top: 720px; width: 290px; height: 300px; border-radius: 30px; background: #ffffff; color: var(--teal); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: 6px solid #ffffff; }
      .tile .ico { width: 90px; height: 90px; }
      .tile small { font-weight: 800; font-size: 26px; letter-spacing: 0.1em; }
      .tile b { font-weight: 800; font-size: 60px; line-height: 1; white-space: nowrap; }
      #now { position: absolute; left: 0; right: 0; top: 1080px; display: flex; justify-content: center; }
      #now .pill { font-size: 50px; padding: 16px 36px 16px 16px; }
      #now .pi { width: 76px; height: 76px; }
      #now .pi svg { width: 48px; height: 48px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.6" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="5.6" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">EN UN SISTEMA</span></div>
        <div id="sale"><span class="ico" data-ic="cart" data-col="#ea5a14"></span>Venta: 3 polos · $135</div>
        <div id="sync">↻</div>
        <i class="ln" id="n1" style="left: 216px"></i><i class="ln" id="n2" style="left: 536px"></i><i class="ln" id="n3" style="left: 856px"></i>
        <div class="tile" id="t1" style="left: 75px"><span class="ico" data-ic="chart"></span><small>VENTAS HOY</small><b class="num" id="v1">$1,205</b></div>
        <div class="tile" id="t2" style="left: 395px"><span class="ico" data-ic="box" data-col="#ea5a14"></span><small>STOCK POLO</small><b class="num" id="v2">37</b></div>
        <div class="tile" id="t3" style="left: 715px"><span class="ico" data-ic="cash"></span><small>CAJA</small><b class="num" id="v3">$860</b></div>
        <div id="now"><div class="pill g" id="np"><span class="pi" data-ic="check" data-col="#179a4a" data-sw="6"></span>Actualizado: ahora mismo<i class="shine" id="sh"></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-s" src="assets/sfx/pop.wav" data-start="0.6" data-volume="0.3"></audio>
      <audio id="s-sh" src="assets/sfx/shimmer.wav" data-start="1.3" data-volume="0.3"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="3.3" data-volume="0.33"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 5.2;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set("#np", { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo(".tile", { y: 300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)", stagger: 0.1 }, 0.3);
      tl.fromTo("#sale", { y: -300, scale: 0.6, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)" }, 0.6);
      tl.fromTo("#sync", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, 1.1);
      tl.fromTo("#sync", { rotation: 0 }, { rotation: 720, duration: 1.4, ease: "power2.inOut" }, 1.2);
      tl.fromTo(".ln", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out", stagger: 0.08 }, 1.3);
      // todo se actualiza solo y a la vez
      [["#t1", "#v1", 1205, 1340, "$"], ["#t2", "#v2", 37, 34, ""], ["#t3", "#v3", 860, 995, "$"]].forEach(([t, v, a, b, p], i) => {
        tl.to(t, { keyframes: [{ borderColor: "#1fc4b8", scale: 1.05, duration: 0.15 }, { borderColor: "#ffffff", scale: 1, duration: 0.4 }], ease: "none" }, 1.6 + i * 0.25);
        GEX.count(tl, document.querySelector(v), a, b, 1.6 + i * 0.25, 0.6, p);
      });
      tl.fromTo("#np", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 3.3);
      tl.fromTo("#sh", { x: -140 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 3.8);
      tl.set("#sh", { x: -140 }, 4.45);
      tl.to(".tile", { y: -8, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.1 }, 3.6);
      // salida + barrido
      GEX.scatter(tl, ["#sale", "#sync", "#t1", "#t2", "#t3", "#np", "#tag"], EXIT, 32);
      tl.to(".ln", { scaleY: 0, duration: 0.2 }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
