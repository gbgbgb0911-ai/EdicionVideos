<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Excel 07a — Información centralizada</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      .fl { position: absolute; top: 300px; display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 10px; border-radius: 18px; background: #ffffff; color: var(--teal); font-weight: 800; font-size: 24px; white-space: nowrap; }
      .fl .xico { width: 40px; height: 40px; }
      #w { position: absolute; left: 190px; top: 470px; width: 700px; height: 420px; }
      #mods { position: absolute; left: 24px; top: 90px; right: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .md { height: 140px; border-radius: 22px; background: var(--soft); display: flex; align-items: center; gap: 14px; padding: 0 20px; font-weight: 800; font-size: 34px; white-space: nowrap; }
      .md .ico { width: 72px; height: 72px; background: #ffffff; }
      #lk { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
      .wk { position: absolute; top: 1010px; width: 260px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .wk .av { width: 130px; height: 130px; font-size: 48px; border: 8px solid #000000; }
      .wk .chip { font-size: 28px; }
      #endw { position: absolute; left: 0; right: 0; top: 1330px; display: flex; justify-content: center; }
      #endw .pill { font-size: 46px; padding: 14px 34px 14px 14px; }
      #endw .pi { width: 72px; height: 72px; }
      #endw .pi svg { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="6.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="6.4" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">INFORMACIÓN CENTRALIZADA</span></div>
        <div class="fl" id="f1" style="left: 40px"><span class="xico"></span>ventas.xlsx</div>
        <div class="fl" id="f2" style="left: 300px"><span class="xico"></span>stock.xlsx</div>
        <div class="fl" id="f3" style="left: 545px"><span class="xico"></span>gastos.xlsx</div>
        <div class="fl" id="f4" style="left: 800px"><span class="xico"></span>cierre.xlsx</div>
        <div class="win" id="w"><div class="bar"><i></i><i></i><i></i><b>Sistema de gestión</b></div>
          <div id="mods"><div class="md" id="m1"><span class="ico" data-ic="chart"></span>Ventas</div><div class="md" id="m2"><span class="ico" data-ic="box" data-col="#ea5a14"></span>Stock</div><div class="md" id="m3"><span class="ico" data-ic="receipt"></span>Gastos</div><div class="md" id="m4"><span class="ico" data-ic="lock" data-col="#ea5a14"></span>Cierres</div></div>
        </div>
        <svg id="lk" viewBox="0 0 1080 1920"><path id="k1" d="M200 1010 L360 890" /><path id="k2" d="M540 1010 L540 890" /><path id="k3" d="M880 1010 L720 890" /></svg>
        <div class="wk" id="w1" style="left: 70px"><span class="av">C</span><span class="chip g">✓ Cierres</span></div>
        <div class="wk" id="w2" style="left: 410px"><span class="av o">A</span><span class="chip g">✓ Ventas</span></div>
        <div class="wk" id="w3" style="left: 750px"><span class="av g">L</span><span class="chip g">✓ Stock</span></div>
        <div id="endw"><div class="pill" id="ep"><span class="pi" data-ic="users" data-sw="4.5"></span>Cada uno ve lo que necesita<i class="shine" id="sh"></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-f" src="assets/sfx/whoosh.wav" data-start="1.1" data-volume="0.36"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="1.8" data-volume="0.32"></audio>
      <audio id="s-w" src="assets/sfx/pop.wav" data-start="2.8" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.98" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      document.querySelectorAll("#lk path").forEach((p) => { p.setAttribute("stroke", "#1fc4b8"); p.setAttribute("stroke-width", "8"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-dasharray", "12 12"); });
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.0;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#w", ".md", "#lk", ".wk", "#ep"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo(".fl", { y: -200, rotation: (i) => (i % 2 ? 8 : -8), autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "bounce.out", stagger: 0.08 }, 0.3);
      // los archivos entran al sistema
      tl.fromTo("#w", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, 0.9);
      [["#f1", 340], ["#f2", 100], ["#f3", -100], ["#f4", -340]].forEach(([id, dx], i) => tl.to(id, { x: dx, y: 340, scale: 0.3, rotation: 0, autoAlpha: 0, duration: 0.45, ease: "power3.in" }, 1.1 + i * 0.06));
      tl.fromTo(".md", { scale: 0.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)", stagger: 0.1, immediateRender: false }, 1.6);
      // cada persona autorizada consulta lo suyo
      tl.fromTo(".wk", { y: 120, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.12, immediateRender: false }, 2.8);
      tl.fromTo("#lk", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, 3.2);
      tl.fromTo("#lk path", { strokeDashoffset: 0 }, { strokeDashoffset: 96, duration: 2.6, ease: "none" }, 3.2);
      [["#m4", 3.4], ["#m1", 3.7], ["#m2", 4.0]].forEach(([id, t]) => tl.to(id, { keyframes: [{ backgroundColor: "#d6f3f0", scale: 1.04, duration: 0.15 }, { backgroundColor: "#eef4f3", scale: 1, duration: 0.4 }], ease: "none" }, t));
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 4.3);
      tl.fromTo("#sh", { x: -140 }, { x: 800, duration: 0.6, ease: "power2.inOut" }, 4.8);
      tl.set("#sh", { x: -140 }, 5.45);
      // salida + barrido
      GEX.scatter(tl, ["#w", "#w1", "#w2", "#w3", "#ep", "#tag"], EXIT, 71);
      tl.to("#lk", { autoAlpha: 0, duration: 0.2 }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
