<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Excel 04b — Esperar para conocer tus números</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #own { position: absolute; left: 60px; top: 300px; display: flex; align-items: center; gap: 18px; }
      #own .av { width: 130px; height: 130px; font-size: 48px; }
      #q { position: relative; padding: 18px 28px; border-radius: 30px 30px 30px 8px; background: #ffffff; color: var(--teal); font-weight: 800; font-size: 40px; white-space: nowrap; }
      #rep { position: absolute; left: 60px; top: 500px; width: 960px; height: 260px; padding: 28px 34px; border-radius: 32px; background: #ffffff; color: var(--teal); }
      #rep .hd { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 38px; white-space: nowrap; }
      #rep .hd .ico { width: 80px; height: 80px; }
      #rep .hd .chip { margin-left: auto; font-size: 28px; }
      #bar { height: 34px; margin-top: 30px; border-radius: 17px; background: var(--soft); overflow: hidden; }
      #bar i { display: block; height: 100%; border-radius: 17px; background: #fe6820; }
      #pct { margin-top: 12px; font-weight: 800; font-size: 30px; color: #c94a0c; }
      #tlx { position: absolute; left: 60px; top: 820px; width: 960px; display: flex; justify-content: space-between; align-items: center; }
      #tlx .line { position: absolute; left: 60px; right: 60px; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px; background: #2a3a39; }
      .stp { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 300px; }
      .stp .dot { width: 70px; height: 70px; border-radius: 50%; background: #6f807f; display: flex; align-items: center; justify-content: center; }
      .stp .dot svg { width: 42px; height: 42px; }
      .stp b { font-weight: 800; font-size: 30px; white-space: nowrap; }
      #late { position: absolute; left: 0; right: 0; top: 1080px; display: flex; justify-content: center; }
      #late .chip { font-size: 36px; padding: 12px 26px; }
      #endw { position: absolute; left: 0; right: 0; top: 1200px; display: flex; justify-content: center; }
      #endw .pill { font-size: 48px; padding: 16px 36px 16px 16px; }
      #endw .pi { width: 76px; height: 76px; font-weight: 800; font-size: 50px; color: #ea5a14; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.8" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="8.8" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">SEÑAL 02 · ESPERAR LOS NÚMEROS</span></div>
        <div id="own"><span class="av">D</span><span id="q">¿Cuánto vendimos hoy?</span></div>
        <div id="rep"><div class="hd"><span class="ico" data-ic="doc"></span>Reporte de ventas<span class="chip a" id="st">Preparando…</span></div><div id="bar"><i id="bi"></i></div><div id="pct" class="num">0%</div></div>
        <div id="tlx"><i class="line"></i>
          <div class="stp" id="p1"><span class="dot" data-ic="clock" data-col="#ffffff" data-sw="5"></span><b>Cierre del día</b></div>
          <div class="stp" id="p2"><span class="dot" data-ic="doc" data-col="#ffffff" data-sw="5"></span><b>Que terminen el reporte</b></div>
          <div class="stp" id="p3"><span class="dot" data-ic="calendar" data-col="#ffffff" data-sw="5"></span><b>Fin de semana</b></div>
        </div>
        <div id="late"><span class="chip gr" id="lt">Datos de hace 5 días</span></div>
        <div id="endw"><div class="pill o" id="ep"><span class="pi">↩</span>Decidiendo mirando hacia atrás<i class="shine" id="sh"></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-q" src="assets/sfx/pop.wav" data-start="0.5" data-volume="0.28"></audio>
      <audio id="s-1" src="assets/sfx/tick.wav" data-start="2.0" data-volume="0.26"></audio>
      <audio id="s-2" src="assets/sfx/tick.wav" data-start="3.8" data-volume="0.26"></audio>
      <audio id="s-3" src="assets/sfx/tick.wav" data-start="5.6" data-volume="0.26"></audio>
      <audio id="s-x" src="assets/sfx/impact.wav" data-start="6.9" data-volume="0.38"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.38" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.4;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#lt", "#ep"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#own .av", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 0.3);
      tl.fromTo("#q", { scale: 0.4, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 100%", duration: 0.4, ease: "back.out(2.6)" }, 0.5);
      tl.fromTo("#rep", { y: 300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.8);
      tl.fromTo("#tlx", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 1.2);
      tl.fromTo(".stp", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12 }, 1.2);
      // el reporte avanza muy lento mientras pasa el tiempo
      tl.fromTo("#bi", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: 5.0, ease: "power1.in" }, 1.2);
      const pc = document.getElementById("pct"), p = { v: 0 };
      tl.to(p, { v: 100, duration: 5.0, ease: "power1.in", onUpdate: () => { pc.textContent = Math.round(p.v) + "%"; } }, 1.2);
      [["#p1", 2.0], ["#p2", 3.8], ["#p3", 5.6]].forEach(([id, t]) => {
        tl.to(id + " .dot", { backgroundColor: "#ea5a14", scale: 1.15, duration: 0.25, ease: "back.out(3)" }, t);
        tl.to(id + " .dot", { scale: 1, duration: 0.25 }, t + 0.25);
      });
      tl.to("#q", { rotation: -2, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 5 }, 4.2);
      // llega el reporte… con datos viejos
      tl.to("#st", { backgroundColor: "#6f807f", duration: 0.2 }, 6.3);
      const st = document.getElementById("st"), k = { v: 0 };
      tl.to(k, { v: 1, duration: 0.01, onUpdate: () => { st.textContent = k.v > 0.5 ? "Listo… tarde" : "Preparando…"; } }, 6.3);
      tl.fromTo("#lt", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 6.4);
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 6.9);
      tl.to("#ep .pi", { x: -10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 7.3);
      tl.fromTo("#sh", { x: -140 }, { x: 800, duration: 0.6, ease: "power2.inOut" }, 7.4);
      tl.set("#sh", { x: -140 }, 8.05);
      // salida + barrido
      GEX.scatter(tl, ["#own", "#rep", "#p1", "#p2", "#p3", "#lt", "#ep", "#tag"], EXIT, 42);
      tl.to("#tlx .line", { scaleX: 0, duration: 0.25 }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
