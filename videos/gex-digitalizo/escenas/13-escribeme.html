<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Digitalizo 13 — Escríbeme</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 26px; }
      .q1 { font-weight: 700; font-size: 62px; white-space: nowrap; }
      .q2 { font-weight: 800; font-size: 76px; line-height: 1; white-space: nowrap; color: var(--teal-hi); }
      .chat { position: relative; width: 760px; height: 300px; }
      .msg { position: absolute; padding: 18px 30px; border-radius: 30px; font-weight: 700; font-size: 40px; white-space: nowrap; }
      .msg.me { right: 0; border: 5px solid var(--teal-hi); border-bottom-right-radius: 8px; }
      .msg.them { left: 0; border: 5px solid var(--orange); border-bottom-left-radius: 8px; }
      #m1 { top: 0; } #m2 { top: 110px; } #typing { top: 216px; }
      .dots { display: flex; gap: 10px; }
      .dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--orange); }
      .cta { display: flex; align-items: center; gap: 26px; }
      .big { font-weight: 800; font-size: 136px; line-height: 1; white-space: nowrap; }
      #plane { width: 120px; height: 120px; flex: none; overflow: visible; }
      .logo { position: relative; width: 420px; height: 131px; }
      .logo img { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.5" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="stack" id="content">
          <div class="q1" id="q1">¿ESTÁS BUSCANDO</div>
          <div class="q2" id="q2">DIGITALIZAR TU NEGOCIO?</div>
          <div class="chat" id="chat" data-layout-allow-overflow="true">
            <div class="msg me" id="m1">Hola, quiero digitalizar mi negocio</div>
            <div class="msg them" id="m2">¡Hola! Conversemos</div>
            <div class="msg them" id="typing"><div class="dots"><i id="d1"></i><i id="d2"></i><i id="d3"></i></div></div>
          </div>
          <div class="cta">
            <div class="big or" id="big">ESCRÍBEME</div>
            <svg id="plane" viewBox="0 0 120 120"><path class="ln" d="M10 56 110 12 86 108 58 70Z M58 70 110 12 M58 70v34l14-22" /></svg>
          </div>
          <div class="logo" id="logo"><img src="assets/logo-v2/gex-full.png" alt="GEX" /></div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.2;
      GEX.ambient(tl, GEX.particles(document.getElementById("fx"), 14, 131, { y0: 120, y1: 1400 }), 0.1, EXIT + 0.25);
      const q1 = GEX.split(document.getElementById("q1"));
      const q2 = GEX.split(document.getElementById("q2"));
      const big = GEX.split(document.getElementById("big"));

      GEX.reveal(tl, q1.words, 0.08, "rise", { stagger: 0.07 });
      GEX.reveal(tl, q2.words, 0.3, "drop", { stagger: 0.08, duration: 0.55 });
      // Conversación de chat
      tl.fromTo("#m1", { x: 120, scale: 0.6, autoAlpha: 0, transformOrigin: "100% 100%" }, { x: 0, scale: 1, autoAlpha: 1, transformOrigin: "100% 100%", duration: 0.4, ease: "back.out(2)" }, 0.8);
      tl.fromTo("#typing", { scale: 0.5, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 100%", duration: 0.3, ease: "back.out(2)" }, 1.2);
      ["#d1", "#d2", "#d3"].forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { y: -12, duration: 0.16, ease: "sine.out", yoyo: true, repeat: 3 }, 1.3 + i * 0.08);
      });
      tl.to("#typing", { y: -106, scale: 0.6, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 1.95);
      tl.fromTo("#m2", { x: -120, scale: 0.6, autoAlpha: 0, transformOrigin: "0% 100%" }, { x: 0, scale: 1, autoAlpha: 1, transformOrigin: "0% 100%", duration: 0.4, ease: "back.out(2)" }, 2.05);

      // CTA
      GEX.reveal(tl, big.chars, 2.3, "pop", { stagger: 0.04 });
      tl.fromTo("#plane", { x: -80, y: 60, rotation: -20, scale: 0, autoAlpha: 0 }, { x: 0, y: 0, rotation: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)" }, 2.6);
      tl.to("#plane", { keyframes: [{ x: 12, y: -10, duration: 0.3 }, { x: 0, y: 0, duration: 0.3 }], ease: "sine.inOut" }, 3.05);
      tl.to(big.chars, { y: -18, duration: 0.18, ease: "sine.out", yoyo: true, repeat: 1, stagger: 0.035 }, 3.3);
      tl.fromTo("#logo", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 2.85);

      // Final: el avión sale volando y todo se dispersa
      tl.to("#plane", { x: 500, y: -400, rotation: 15, autoAlpha: 0, duration: 0.35, ease: "power3.in" }, EXIT - 0.05);
      GEX.scatter(tl, [...q1.words, ...q2.words, "#m1", "#m2", ...big.chars], EXIT, 71);
      tl.to("#logo", { scale: 1.12, autoAlpha: 0, duration: 0.28, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
