<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Digitalizo 10 — Problemas reales</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .stack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .small { font-weight: 700; font-size: 62px; white-space: nowrap; }
      .big { font-weight: 800; font-size: 150px; line-height: 1; white-space: nowrap; color: var(--teal-hi); }
      .mid { font-weight: 800; font-size: 84px; line-height: 1.05; white-space: nowrap; }
      .hl { position: relative; display: inline-block; padding: 0 14px; }
      .hl .mark { position: absolute; left: 0; right: 0; bottom: 4px; height: 26px; border-radius: 8px; background: var(--orange); z-index: -1; }
      .hl .txt { position: relative; }
      #lens { position: absolute; left: 0; top: 0; width: 200px; height: 200px; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.5" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="stack" id="content" style="z-index: 1">
          <div class="small" id="s1">ANTES DE DESARROLLAR</div>
          <div class="big" id="b1">ENTIENDO</div>
          <div class="mid" id="m1">TUS PROBLEMAS</div>
          <div class="mid"><span class="hl" id="hl"><span class="mark" id="mark"></span><span class="txt" id="m2">REALES</span></span></div>
          <svg id="lens" viewBox="0 0 200 200" data-layout-allow-overflow="true"><circle class="lw" cx="80" cy="80" r="62" stroke-width="10" /><path class="lw" d="M126 126l56 56" stroke-width="16" /></svg>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.15;
      GEX.ambient(tl, GEX.particles(document.getElementById("fx"), 12, 101, { y0: 140, y1: 1300 }), 0.1, EXIT + 0.3);
      const s1 = GEX.split(document.getElementById("s1"));
      const b1 = GEX.split(document.getElementById("b1"));
      const m1 = GEX.split(document.getElementById("m1"));
      const m2 = GEX.split(document.getElementById("m2"));
      GEX.reveal(tl, s1.words, 0.1, "rise", { stagger: 0.08 });
      GEX.reveal(tl, b1.chars, 0.35, "flip", { stagger: 0.035 });
      GEX.reveal(tl, m1.words, 0.8, "slide", { stagger: 0.1 });
      GEX.reveal(tl, m2.chars, 1.05, "drop", { stagger: 0.05, duration: 0.55 });
      tl.fromTo("#mark", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, transformOrigin: "left center", duration: 0.4, ease: "power4.inOut" }, 1.5);
      // La lupa barre el texto y se posa sobre "REALES"
      tl.fromTo("#lens", { x: -60, y: 120, scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.4)" }, 1.2);
      tl.to("#lens", { keyframes: [{ x: 640, y: 160, duration: 0.5 }, { x: 120, y: 250, duration: 0.45 }, { x: 560, y: 300, duration: 0.5 }], ease: "sine.inOut" }, 1.5);
      tl.to("#lens", { rotation: 12, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.95 - 0.95);
      GEX.punch(tl, "#hl", 2.5, 1.12);
      tl.to(b1.chars, { y: -14, duration: 0.18, ease: "sine.out", yoyo: true, repeat: 1, stagger: 0.04 }, 2.2);

      GEX.scatter(tl, [...s1.words, ...b1.chars, ...m1.words, "#hl"], EXIT, 41);
      tl.to("#lens", { autoAlpha: 0, scale: 0, duration: 0.25, ease: "back.in(2)" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
