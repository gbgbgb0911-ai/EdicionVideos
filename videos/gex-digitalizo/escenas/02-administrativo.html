<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Digitalizo 02 — Primero lo administrativo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .target { position: relative; width: 300px; height: 300px; margin-bottom: 26px; }
      .target svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .small { font-weight: 700; font-size: 64px; white-space: nowrap; }
      .big { font-weight: 800; font-size: 128px; line-height: 1; white-space: nowrap; }
      .big2 { font-weight: 800; font-size: 118px; line-height: 1; white-space: nowrap; color: var(--teal-hi); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.5" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="stack" id="content">
          <div class="target" id="target">
            <!-- carpeta/clipboard administrativo -->
            <svg id="clip" viewBox="0 0 120 120"><path class="lw" d="M34 22h52v86H34Z M48 14h24v14H48Z M46 50h28 M46 66h28 M46 82h18" /></svg>
            <!-- mira que fija el objetivo -->
            <svg id="aim" viewBox="0 0 120 120">
              <circle class="lo" cx="60" cy="60" r="54" stroke-dasharray="40 18" />
              <path class="lo" d="M60 -6v20 M60 106v20 M-6 60h20 M106 60h20" />
            </svg>
            <svg id="lock" viewBox="0 0 120 120"><circle class="lo" cx="60" cy="60" r="58" /></svg>
          </div>
          <div class="small" id="s1">LO PRIMERO QUE ATACO</div>
          <div class="big" id="b1">LA PARTE</div>
          <div class="big2" id="b2">ADMINISTRATIVA</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.15;
      GEX.ambient(tl, GEX.particles(document.getElementById("fx"), 14, 22, { y0: 140, y1: 1300 }), 0.1, EXIT + 0.3);
      const s1 = GEX.split(document.getElementById("s1"));
      const b1 = GEX.split(document.getElementById("b1"));
      const b2 = GEX.split(document.getElementById("b2"));

      tl.fromTo("#clip", { scale: 0, rotation: 15, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)" }, 0.1);
      // La mira gira, se cierra y fija
      tl.fromTo("#aim", { scale: 2.2, rotation: -160, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.75, ease: "expo.out" }, 0.25);
      tl.fromTo("#lock", { scale: 0.8, autoAlpha: 1 }, { scale: 1.6, autoAlpha: 0, duration: 0.45, ease: "circ.out" }, 0.95);
      GEX.punch(tl, "#clip", 0.95, 1.18);
      tl.to("#aim", { rotation: 90, duration: EXIT - 1.1, ease: "none" }, 1.1);
      GEX.float(tl, "#target", 1.0, EXIT, 12, 1.4);

      GEX.reveal(tl, s1.words, 0.35, "rise", { stagger: 0.07 });
      GEX.reveal(tl, b1.words, 0.8, "slide", { stagger: 0.1 });
      GEX.reveal(tl, b2.chars, 1.0, "flip", { stagger: 0.03, duration: 0.4 });
      tl.to(b2.chars, { color: "#fe6820", duration: 0.12, yoyo: true, repeat: 1, stagger: 0.03, ease: "none" }, 2.0);

      GEX.scatter(tl, [...s1.words, ...b1.words, ...b2.chars], EXIT, 5);
      tl.to("#target", { scale: 0, rotation: 90, autoAlpha: 0, duration: 0.3, ease: "back.in(2)" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
