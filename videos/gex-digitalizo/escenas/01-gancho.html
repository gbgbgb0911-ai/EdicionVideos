<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Digitalizo 01 — Gancho</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .icon { position: relative; width: 260px; height: 260px; margin-bottom: 20px; }
      .icon svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .t1 { font-weight: 800; font-size: 96px; line-height: 1; white-space: nowrap; }
      .t2 { font-weight: 800; font-size: 150px; line-height: 1; white-space: nowrap; color: var(--teal-hi); }
      .t3 { font-weight: 800; font-size: 96px; line-height: 1; white-space: nowrap; }
      #t3 .or { display: inline-block; }
      .bar { width: 640px; height: 16px; border-radius: 8px; background: var(--orange); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.5" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div class="stack" id="content">
          <div class="icon" id="icon">
            <!-- papel -->
            <svg id="doc" viewBox="0 0 120 120"><path class="lw" d="M28 10h44l20 20v80H28Z M72 10v20h20 M40 52h40 M40 68h40 M40 84h26" /></svg>
            <!-- pantalla digital -->
            <svg id="screen" viewBox="0 0 120 120">
              <rect class="ln" x="8" y="18" width="104" height="72" rx="8" />
              <path class="ln" d="M44 108h32 M60 90v18" />
              <rect id="sb1" x="24" y="56" width="14" height="22" rx="3" fill="#1fc4b8" />
              <rect id="sb2" x="44" y="44" width="14" height="34" rx="3" fill="#1fc4b8" />
              <rect id="sb3" x="64" y="50" width="14" height="28" rx="3" fill="#1fc4b8" />
              <rect id="sb4" x="84" y="32" width="14" height="46" rx="3" fill="#fe6820" />
            </svg>
          </div>
          <div class="t1" id="t1">¿QUÉ</div>
          <div class="t2" id="t2">DIGITALIZO</div>
          <div class="bar" id="bar"></div>
          <div class="t3" id="t3">EN UN <span class="or">NEGOCIO</span>?</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const D = 3.5, EXIT = 3.15;
      GEX.ambient(tl, GEX.particles(document.getElementById("fx"), 16, 11, { y0: 140, y1: 1300 }), 0.1, EXIT + 0.3);

      const t1 = GEX.split(document.getElementById("t1"));
      const t2 = GEX.split(document.getElementById("t2"));
      const t3 = GEX.split(document.getElementById("t3"));

      // Icono: papel entra, gira y se convierte en pantalla
      tl.fromTo("#doc", { scale: 0.3, rotation: -20, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)" }, 0.1);
      tl.to("#doc", { rotationY: 90, transformPerspective: 800, duration: 0.22, ease: "power2.in" }, 0.85);
      tl.set("#doc", { autoAlpha: 0 }, 1.07);
      tl.fromTo("#screen", { rotationY: -90, transformPerspective: 800, autoAlpha: 0 }, { rotationY: 0, transformPerspective: 800, autoAlpha: 1, duration: 0.3, ease: "back.out(2)" }, 1.07);
      tl.fromTo(["#sb1", "#sb2", "#sb3", "#sb4"], { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, transformOrigin: "50% 100%", duration: 0.35, ease: "back.out(2.5)", stagger: 0.07 }, 1.25);
      tl.to(["#sb1", "#sb2", "#sb3", "#sb4"], { scaleY: 0.55, transformOrigin: "50% 100%", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.12 }, 1.75);
      GEX.float(tl, "#icon", 0.5, EXIT, 14, 1.3);

      // Texto
      GEX.reveal(tl, t1.words, 0.3, "rise");
      GEX.reveal(tl, t2.chars, 0.5, "pop", { stagger: 0.04, duration: 0.4 });
      tl.fromTo("#bar", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, transformOrigin: "left center", duration: 0.45, ease: "power4.inOut" }, 0.95);
      GEX.reveal(tl, t3.words, 1.1, "drop", { stagger: 0.1, duration: 0.6 });
      tl.to(t2.chars, { y: -18, duration: 0.18, ease: "sine.out", yoyo: true, repeat: 1, stagger: 0.035 }, 1.9);
      GEX.punch(tl, "#t3 .or", 2.4, 1.07);

      // Salida en piezas
      GEX.scatter(tl, [...t1.words, ...t2.chars, ...t3.words], EXIT, 3);
      tl.to(["#icon", "#bar"], { scale: 0, autoAlpha: 0, duration: 0.3, ease: "back.in(2)" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
