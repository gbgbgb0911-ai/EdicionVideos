<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Reuniones 06 — Primera enviada, dos en camino</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .zone { gap: 14px; }
      .cl { position: relative; display: flex; align-items: center; gap: 18px; width: 620px; padding: 16px 22px; border-radius: 26px; background: #ffffff; }
      .cl .nm { font-weight: 800; font-size: 34px; color: #0b958b; white-space: nowrap; width: 150px; }
      .cl .st { flex: 1; display: flex; align-items: center; gap: 12px; }
      .bar { flex: 1; height: 18px; border-radius: 9px; background: #dfe7e6; overflow: hidden; }
      .bar b { display: block; height: 100%; background: var(--orange); }
      .lbl { font-weight: 800; font-size: 26px; color: #c94a0c; white-space: nowrap; }
      .sent { display: inline-flex; align-items: center; gap: 10px; padding: 8px 20px; border-radius: 999px; background: var(--wa); font-weight: 800; font-size: 30px; white-space: nowrap; }
      #plane { position: absolute; left: 180px; top: 14px; width: 56px; height: 56px; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="zone" id="zone">
          <div class="pill plain" id="p1"><span id="t1">Propuestas</span><i class="shine" id="sh"></i></div>
          <div class="cl" id="c1"><span class="nm">Cliente 1</span><span class="st"><span class="sent" id="sent">Enviada ✓</span></span><svg id="plane" viewBox="0 0 56 56"><path d="M4 26 52 6 42 50 28 34Z" fill="#ea5a14" /><path d="M28 34 52 6 M28 34v16l8-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" /></svg></div>
          <div class="cl" id="c2"><span class="nm">Cliente 2</span><span class="st"><span class="bar"><b id="b2"></b></span><span class="lbl">armando…</span></span></div>
          <div class="cl" id="c3"><span class="nm">Cliente 3</span><span class="st"><span class="bar"><b id="b3"></b></span><span class="lbl">armando…</span></span></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.8"></audio>
      <audio id="s-r" src="assets/sfx/pop.wav" data-start="0.4" data-volume="0.35"></audio>
      <audio id="s-fly" src="assets/sfx/whoosh.wav" data-start="0.95" data-volume="0.8"></audio>
      <audio id="s-ding" src="assets/sfx/ding.wav" data-start="1.35" data-volume="0.4"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="4.12" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.15;
      const t1 = GEX.split(document.getElementById("t1"));
      tl.fromTo("#p1", { x: -440, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power4.out" }, 0.05);
      GEX.reveal(tl, t1.chars, 0.15, "rise", { stagger: 0.02, duration: 0.3 });
      tl.fromTo(".cl", { x: -700, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(1.4)", stagger: 0.12 }, 0.35);
      tl.set("#sent", { autoAlpha: 0 }, 0);
      // cliente 1: el avión sale volando y queda "Enviada"
      tl.fromTo("#plane", { x: 0, y: 0, rotation: 0, autoAlpha: 1 }, { x: 0, y: 0, autoAlpha: 1, duration: 0.01 }, 0.5);
      tl.to("#plane", { keyframes: [{ x: -14, y: 8, rotation: -8, duration: 0.2, ease: "power2.out" }, { x: 640, y: -260, rotation: 10, autoAlpha: 0, duration: 0.55, ease: "power3.in" }] }, 0.85);
      tl.fromTo("#sent", { scale: 0.3, autoAlpha: 0, transformOrigin: "0% 50%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 50%", duration: 0.4, ease: "back.out(2.6)" }, 1.3);
      tl.to("#sent", { scale: 1.05, transformOrigin: "0% 50%", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.9);
      // clientes 2 y 3: barras avanzando
      tl.fromTo("#b2", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 0.75, transformOrigin: "left center", duration: EXIT - 0.8, ease: "power1.out" }, 0.8);
      tl.fromTo("#b3", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 0.45, transformOrigin: "left center", duration: EXIT - 0.9, ease: "power1.out" }, 0.9);
      tl.fromTo("#sh", { x: -120 }, { x: 420, duration: 0.55, ease: "power2.inOut" }, 2.4);
      GEX.scatter(tl, ["#p1", "#c1", "#c2", "#c3"], EXIT, 11);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
