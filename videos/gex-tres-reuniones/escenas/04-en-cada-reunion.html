<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Reuniones 04 — Qué hago en cada reunión</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .zone { gap: 14px; }
      .head { font-weight: 800; font-size: 30px; letter-spacing: 0.14em; padding: 8px 18px; border-radius: 10px; background: var(--orange); white-space: nowrap; }
      .st { display: flex; align-items: center; gap: 16px; padding: 12px 30px 12px 12px; border-radius: 999px; background: var(--teal); font-weight: 800; font-size: 40px; white-space: nowrap; }
      .st .n { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: #ffffff; flex: none; }
      .st .n svg { width: 40px; height: 40px; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="zone" id="zone">
          <div class="head" id="head">EN CADA REUNIÓN ENTIENDO</div>
          <div class="st" id="s1"><span class="n"><svg viewBox="0 0 40 40"><g id="gear"><path d="M20 8v-4 M20 36v-4 M8 20H4 M36 20h-4 M11.5 11.5 8.7 8.7 M31.3 31.3l-2.8-2.8 M11.5 28.5l-2.8 2.8 M31.3 8.7l-2.8 2.8" stroke="#0b958b" stroke-width="4" stroke-linecap="round" /><circle cx="20" cy="20" r="9" fill="none" stroke="#0b958b" stroke-width="4" /></g></svg></span>Cómo funciona el negocio</div>
          <div class="st" id="s2"><span class="n"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#0b958b" stroke-width="4" /><circle cx="20" cy="20" r="8" fill="none" stroke="#ea5a14" stroke-width="4" /><circle id="bull" cx="20" cy="20" r="3" fill="#ea5a14" /></svg></span>Qué necesita el cliente</div>
          <div class="st" id="s3"><span class="n"><svg viewBox="0 0 40 40"><path d="M14 26c0-4-5-6-5-12a11 11 0 0 1 22 0c0 6-5 8-5 12Z M15 31h10 M17 36h6" fill="none" stroke="#0b958b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><g id="rays"><path d="M20 -2v-4 M4 4 1 1 M36 4l3-3" stroke="#ea5a14" stroke-width="3.5" stroke-linecap="round" /></g></svg></span>Cómo resolver sus problemas</div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.8"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="0.5" data-volume="0.45"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="1.6" data-volume="0.45"></audio>
      <audio id="s-3" src="assets/sfx/pop.wav" data-start="2.7" data-volume="0.45"></audio>
      <audio id="s-ding" src="assets/sfx/ding.wav" data-start="3.1" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="4.62" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.65;
      tl.fromTo("#head", { x: -560, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power4.out" }, 0.05);
      ["#s1", "#s2", "#s3"].forEach((id, i) => {
        const t = 0.45 + i * 1.1;
        tl.fromTo(id, { x: -720, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(1.5)" }, t);
        tl.fromTo(id + " .n", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, t + 0.1);
        GEX.float(tl, id, t + 0.6, EXIT, 4, 1.3 + i * 0.12);
      });
      tl.fromTo("#gear", { rotation: 0, svgOrigin: "20 20" }, { rotation: 360, svgOrigin: "20 20", duration: EXIT - 0.6, ease: "none" }, 0.6);
      tl.fromTo("#bull", { scale: 1, svgOrigin: "20 20" }, { scale: 1.8, svgOrigin: "20 20", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.8);
      tl.fromTo("#rays", { autoAlpha: 0, scale: 0.5, svgOrigin: "20 14" }, { autoAlpha: 1, scale: 1, svgOrigin: "20 14", duration: 0.3, ease: "back.out(3)" }, 3.05);
      tl.to("#rays", { scale: 1.25, svgOrigin: "20 14", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.4);
      GEX.scatter(tl, ["#head", "#s1", "#s2", "#s3"], EXIT, 9);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
