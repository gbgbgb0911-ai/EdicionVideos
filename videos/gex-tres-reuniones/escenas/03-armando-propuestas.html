<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Reuniones 03 — Armando las propuestas</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .shower { display: flex; align-items: center; gap: 10px; padding: 10px 22px 10px 12px; border-radius: 999px; background: #ffffff; color: #0b958b; font-weight: 800; font-size: 28px; white-space: nowrap; margin-left: 6px; }
      .shower svg { width: 40px; height: 40px; overflow: visible; }
      .doc { position: relative; width: 420px; padding: 26px 28px 24px; border-radius: 28px; background: #ffffff; margin-left: 6px; }
      .doc .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .doc .hd b { font-weight: 800; font-size: 30px; color: #0b958b; letter-spacing: 0.08em; }
      .doc .hd img { height: 30px; }
      .ln { height: 14px; border-radius: 7px; background: #cfdcdb; margin-bottom: 12px; }
      .ln b { display: block; height: 100%; border-radius: 7px; background: var(--teal); }
      .prog { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
      .prog .bar { flex: 1; height: 18px; border-radius: 9px; background: #dfe7e6; overflow: hidden; }
      .prog .bar b { display: block; height: 100%; background: var(--orange); }
      .prog .pc { font-weight: 800; font-size: 28px; color: #c94a0c; font-variant-numeric: tabular-nums; width: 70px; text-align: right; }
      .pen { position: absolute; left: 0; top: 0; width: 60px; height: 60px; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="zone" id="zone">
          <div class="shower" id="shower"><svg viewBox="0 0 40 40"><path id="d1" d="M10 6c4 6 6 9 6 12a6 6 0 0 1-12 0c0-3 2-6 6-12Z" fill="#1fc4b8" /><path id="d2" d="M28 14c3 5 5 7 5 10a5 5 0 0 1-10 0c0-3 2-5 5-10Z" fill="#1fc4b8" /></svg>después de la ducha</div>
          <div class="pill" id="p1">
            <span class="ic"><svg viewBox="0 0 40 40"><path d="M10 4h14l8 8v24H10Z M24 4v8h8 M15 20h12 M15 26h12 M15 32h7" fill="none" stroke="#0b958b" stroke-width="3.5" stroke-linejoin="round" /></svg></span>
            <span id="t1">Armando las propuestas</span><i class="shine" id="sh"></i>
          </div>
          <div class="doc" id="doc">
            <div class="hd"><b>PROPUESTA</b><img src="assets/logo-v2/gex-full.png" alt="GEX" /></div>
            <div class="ln" style="width: 92%"><b id="l1"></b></div>
            <div class="ln" style="width: 76%"><b id="l2"></b></div>
            <div class="ln" style="width: 84%"><b id="l3"></b></div>
            <div class="ln" style="width: 58%"><b id="l4"></b></div>
            <div class="prog"><span class="bar"><b id="pb"></b></span><span class="pc" id="pc">0%</span></div>
            <svg class="pen" id="pen" viewBox="0 0 60 60"><path d="M10 50l6-16 26-26 10 10-26 26Z" fill="#ea5a14" /><path d="M10 50l6-16 10 10Z" fill="#ffffff" stroke="#ea5a14" stroke-width="3" stroke-linejoin="round" /></svg>
          </div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.8"></audio>
      <audio id="s-pop" src="assets/sfx/pop.wav" data-start="0.1" data-volume="0.4"></audio>
      <audio id="s-doc" src="assets/sfx/pop.wav" data-start="0.7" data-volume="0.4"></audio>
      <audio id="s-k1" src="assets/sfx/tick.wav" data-start="1.0" data-volume="0.3"></audio>
      <audio id="s-k2" src="assets/sfx/tick.wav" data-start="1.35" data-volume="0.3"></audio>
      <audio id="s-k3" src="assets/sfx/tick.wav" data-start="1.7" data-volume="0.3"></audio>
      <audio id="s-k4" src="assets/sfx/tick.wav" data-start="2.05" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="3.62" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.65;
      const t1 = GEX.split(document.getElementById("t1"));
      tl.fromTo("#shower", { y: -40, scale: 0.5, autoAlpha: 0, transformOrigin: "0% 50%" }, { y: 0, scale: 1, autoAlpha: 1, transformOrigin: "0% 50%", duration: 0.4, ease: "back.out(2.4)" }, 0.08);
      tl.fromTo(["#d1", "#d2"], { y: -14 }, { y: 6, duration: 0.5, ease: "sine.in", repeat: 5, stagger: 0.18 }, 0.2);
      tl.fromTo("#p1", { x: -660, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.3);
      GEX.reveal(tl, t1.chars, 0.4, "rise", { stagger: 0.014, duration: 0.3 });
      tl.fromTo("#doc", { y: 60, rotation: -3, autoAlpha: 0 }, { y: 0, rotation: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.65);
      // líneas que se "escriben" con el lápiz
      ["#l1", "#l2", "#l3", "#l4"].forEach((id, i) => {
        const t = 0.95 + i * 0.35;
        tl.fromTo(id, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, transformOrigin: "left center", duration: 0.32, ease: "power1.inOut" }, t);
      });
      tl.fromTo("#pen", { x: 18, y: 37, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15 }, 0.9);
      tl.to("#pen", { keyframes: [
        { x: 353, y: 37, duration: 0.32 }, { x: 18, y: 63, duration: 0.03 },
        { x: 295, y: 63, duration: 0.32 }, { x: 18, y: 89, duration: 0.03 },
        { x: 324, y: 89, duration: 0.32 }, { x: 18, y: 115, duration: 0.03 },
        { x: 229, y: 115, duration: 0.32 },
      ], ease: "none" }, 0.95);
      tl.to("#pen", { x: 300, y: 100, rotation: 12, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.4);
      const p = { v: 0 };
      const pc = document.getElementById("pc");
      tl.fromTo("#pb", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 0.7, transformOrigin: "left center", duration: 1.8, ease: "power1.inOut" }, 1.0);
      tl.fromTo(p, { v: 0 }, { v: 70, duration: 1.8, ease: "power1.inOut", onUpdate: () => { pc.textContent = Math.round(p.v) + "%"; } }, 1.0);
      tl.fromTo("#sh", { x: -120 }, { x: 640, duration: 0.6, ease: "power2.inOut" }, 2.2);
      GEX.float(tl, "#doc", 1.2, EXIT, 6, 1.5);
      GEX.scatter(tl, ["#shower", "#p1", "#doc"], EXIT, 7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
