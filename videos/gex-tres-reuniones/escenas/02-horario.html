<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Reuniones 02 — De 4 a 7, ahora 7:40</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .tline { position: relative; width: 640px; padding: 22px 26px 18px; border-radius: 28px; background: #ffffff; margin-left: 6px; }
      .track { display: flex; gap: 8px; height: 26px; }
      .seg { flex: 1; border-radius: 13px; background: #dfe7e6; overflow: hidden; }
      .seg b { display: block; height: 100%; background: var(--teal); }
      .lbls { display: flex; justify-content: space-between; margin-top: 10px; font-weight: 800; font-size: 28px; color: #0b958b; }
      .now { display: flex; align-items: center; gap: 16px; padding: 14px 30px 14px 14px; border-radius: 999px; background: var(--orange); font-weight: 800; font-size: 46px; white-space: nowrap; }
      .now svg { width: 70px; height: 70px; overflow: visible; }
      .now small { font-weight: 700; font-size: 30px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="zone" id="zone">
          <div class="pill plain" id="p1"><span id="t1">De 4:00 a 7:00 PM</span><i class="shine" id="sh"></i></div>
          <div class="tline" id="tline">
            <div class="track"><span class="seg"><b id="g1"></b></span><span class="seg"><b id="g2"></b></span><span class="seg"><b id="g3"></b></span></div>
            <div class="lbls"><span>4</span><span>5</span><span>6</span><span>7</span></div>
          </div>
          <div class="now" id="now">
            <svg viewBox="-35 -35 70 70"><circle r="31" fill="#ffffff" /><g id="hh"><circle r="20" fill="none" /><line x1="0" y1="3" x2="0" y2="-16" stroke="#ea5a14" stroke-width="6" stroke-linecap="round" /></g><g id="hm"><circle r="26" fill="none" /><line x1="0" y1="3" x2="0" y2="-24" stroke="#ea5a14" stroke-width="4" stroke-linecap="round" /></g><circle r="4" fill="#ea5a14" /></svg>
            <span><small>Grabando a las</small> 7:40 PM</span>
          </div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.9"></audio>
      <audio id="s-t1" src="assets/sfx/tick.wav" data-start="0.95" data-volume="0.45"></audio>
      <audio id="s-t2" src="assets/sfx/tick.wav" data-start="1.35" data-volume="0.45"></audio>
      <audio id="s-t3" src="assets/sfx/tick.wav" data-start="1.75" data-volume="0.45"></audio>
      <audio id="s-now" src="assets/sfx/pop.wav" data-start="2.05" data-volume="0.5"></audio>
      <audio id="s-ding" src="assets/sfx/ding.wav" data-start="2.85" data-volume="0.35"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="4.12" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.15;
      const t1 = GEX.split(document.getElementById("t1"));
      tl.fromTo("#p1", { x: -560, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.05);
      GEX.reveal(tl, t1.chars, 0.15, "rise", { stagger: 0.018, duration: 0.3 });
      tl.fromTo("#tline", { scaleX: 0, transformOrigin: "left center", autoAlpha: 0 }, { scaleX: 1, transformOrigin: "left center", autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 0.45);
      // cada reunión llena una hora
      ["#g1", "#g2", "#g3"].forEach((id, i) => {
        tl.fromTo(id, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, transformOrigin: "left center", duration: 0.38, ease: "power2.inOut" }, 0.6 + i * 0.4);
      });
      tl.to("#tline", { keyframes: [{ scale: 1.03, duration: 0.1 }, { scale: 1, duration: 0.25 }], transformOrigin: "left center", ease: "sine.inOut" }, 1.8);
      // reloj corre hasta 7:40
      tl.fromTo("#now", { x: -160, scale: 0.5, autoAlpha: 0, transformOrigin: "0% 50%" }, { x: 0, scale: 1, autoAlpha: 1, transformOrigin: "0% 50%", duration: 0.45, ease: "back.out(2.2)" }, 2.0);
      tl.fromTo("#hm", { rotation: 0, svgOrigin: "0 0" }, { rotation: 360 * 3 + 240, svgOrigin: "0 0", duration: 0.85, ease: "power3.out" }, 2.05);
      tl.fromTo("#hh", { rotation: 120, svgOrigin: "0 0" }, { rotation: 230, svgOrigin: "0 0", duration: 0.85, ease: "power3.out" }, 2.05);
      tl.to("#now", { keyframes: [{ scale: 1.08, duration: 0.1 }, { scale: 1, duration: 0.3 }], transformOrigin: "0% 50%", ease: "back.out(3)" }, 2.85);
      tl.fromTo("#sh", { x: -120 }, { x: 560, duration: 0.6, ease: "power2.inOut" }, 3.1);
      GEX.float(tl, "#zone", 1.2, EXIT, 6, 1.6);
      GEX.scatter(tl, ["#p1", "#tline", "#now"], EXIT, 5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
