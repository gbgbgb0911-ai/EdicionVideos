<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Reuniones 05 — Estructura de la propuesta</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/gex-subtle.css" />
    <script src="assets/gex-fx.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .doc { position: relative; width: 600px; padding: 24px 26px 20px; border-radius: 30px; background: #ffffff; }
      .doc .hd { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; margin-bottom: 10px; border-bottom: 4px solid #dfe7e6; }
      .doc .hd b { font-weight: 800; font-size: 34px; color: #0b958b; letter-spacing: 0.06em; }
      .doc .hd img { height: 36px; }
      .row { display: flex; align-items: center; gap: 14px; height: 52px; font-weight: 700; font-size: 31px; color: #0b958b; white-space: nowrap; }
      .box { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; border: 4px solid #0b958b; flex: none; }
      .box svg { width: 26px; height: 26px; }
      .row.hot { color: #c94a0c; }
      .row.hot .box { border-color: #ea5a14; }
      .stamp { position: absolute; right: -30px; bottom: -26px; padding: 12px 24px; border-radius: 16px; background: var(--orange); font-weight: 800; font-size: 36px; letter-spacing: 0.1em; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7" data-track-index="0">
        <div class="zone" id="zone">
          <div class="doc" id="doc">
            <div class="hd"><b>PROPUESTA</b><img src="assets/logo-v2/gex-full.png" alt="GEX" /></div>
            <div class="row"><span class="box"></span>Detalles de la solución</div>
            <div class="row"><span class="box"></span>La propuesta</div>
            <div class="row hot"><span class="box"></span>Cotización del proyecto</div>
            <div class="row"><span class="box"></span>Métodos de pago</div>
            <div class="row"><span class="box"></span>Formas de pago</div>
            <div class="row"><span class="box"></span>Planes de mantenimiento</div>
            <div class="row"><span class="box"></span>Detalles del servicio</div>
            <div class="stamp" id="stamp">CONCRETA ✓</div>
          </div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.8"></audio>
      <audio id="s-k1" src="assets/sfx/tick.wav" data-start="0.75" data-volume="0.45"></audio>
      <audio id="s-k2" src="assets/sfx/tick.wav" data-start="1.4" data-volume="0.45"></audio>
      <audio id="s-k3" src="assets/sfx/tick.wav" data-start="2.05" data-volume="0.45"></audio>
      <audio id="s-k4" src="assets/sfx/tick.wav" data-start="2.7" data-volume="0.45"></audio>
      <audio id="s-k5" src="assets/sfx/tick.wav" data-start="3.35" data-volume="0.45"></audio>
      <audio id="s-k6" src="assets/sfx/tick.wav" data-start="4.0" data-volume="0.45"></audio>
      <audio id="s-k7" src="assets/sfx/tick.wav" data-start="4.65" data-volume="0.45"></audio>
      <audio id="s-stamp" src="assets/sfx/click.wav" data-start="5.25" data-volume="0.6"></audio>
      <audio id="s-ding" src="assets/sfx/ding.wav" data-start="5.3" data-volume="0.4"></audio>
      <audio id="s-out" src="assets/sfx/whoosh.wav" data-start="6.62" data-volume="0.7"></audio>
    </div>
    <script>
      const ck = (c) => `<svg viewBox="0 0 26 26"><path d="M5 14l5 5 11-12" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      document.querySelectorAll(".row").forEach((r) => (r.querySelector(".box").innerHTML = ck(r.classList.contains("hot") ? "#ea5a14" : "#0b958b")));
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.65;
      tl.fromTo("#doc", { x: -700, rotation: -6, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 0.05);
      tl.fromTo(".row", { x: -30, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.25, ease: "power2.out", stagger: 0.04 }, 0.35);
      // se marca un punto cada 0.65s (ritmo de la lista hablada)
      document.querySelectorAll(".row").forEach((r, i) => {
        const t = 0.75 + i * 0.65;
        tl.fromTo(r.querySelector(".box svg"), { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(3)" }, t);
        tl.to(r, { keyframes: [{ x: 12, duration: 0.12 }, { x: 0, duration: 0.25 }], ease: "sine.out" }, t);
      });
      tl.fromTo("#stamp", { scale: 2.6, rotation: -20, autoAlpha: 0 }, { scale: 1, rotation: -6, autoAlpha: 1, duration: 0.25, ease: "power4.in" }, 5.02);
      tl.to("#doc", { keyframes: [{ y: 8 }, { y: -4 }, { y: 0 }], duration: 0.2, ease: "none" }, 5.27);
      tl.to("#stamp", { scale: 1.06, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.6);
      tl.to("#doc", { x: -760, rotation: -8, autoAlpha: 0, duration: 0.33, ease: "power3.in" }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
