<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Taba Wash 07 — Escríbeme</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #q { position: absolute; left: 0; right: 0; top: 140px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
      #q span { font-weight: 800; font-size: 48px; white-space: nowrap; line-height: 1.15; }
      #q2 { color: #1fc4b8; }
      #ic { position: absolute; left: 0; right: 0; top: 300px; display: flex; justify-content: center; gap: 30px; }
      #ic .ico { width: 120px; height: 120px; background: #ffffff; }
      #ctaw { position: absolute; left: 0; right: 0; top: 470px; display: flex; justify-content: center; }
      #cta { font-size: 64px; padding: 20px 50px 20px 20px; }
      #cta .pi { width: 96px; height: 96px; }
      #cta .pi svg { width: 62px; height: 62px; }
      #sys { position: absolute; left: 0; right: 0; top: 660px; display: flex; justify-content: center; align-items: center; gap: 18px; }
      #lgc { padding: 12px 26px; border-radius: 22px; background: #ffffff; }
      #lgc img { display: block; height: 50px; }
      #sys .chip { font-size: 34px; padding: 12px 26px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.5" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="8.5" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="q"><span id="q1">¿Pierden tiempo en</span><span id="q2">procesos manuales?</span></div>
          <div id="ic"><span class="ico" id="i1" data-ic="doc" data-col="#ea5a14"></span><span class="ico" id="i2" data-ic="receipt"></span><span class="ico" id="i3" data-ic="clock" data-col="#ea5a14"></span></div>
          <div id="ctaw"><div class="pill g" id="cta"><span class="pi" data-ic="wa" data-col="#179a4a" data-sw="4"></span>Escríbeme<i class="shine" id="sh"></i></div></div>
          <div id="sys"><span id="lgc"><img src="assets/logo-v2/gex-full.png" alt="GEX" /></span><span class="chip" id="sc">Se soluciona con un sistema ✓</span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-i" src="assets/sfx/tick.wav" data-start="1.3" data-volume="0.28"></audio>
      <audio id="s-cta" src="assets/sfx/pop.wav" data-start="4.4" data-volume="0.32"></audio>
      <audio id="s-tap" src="assets/sfx/click.wav" data-start="5.05" data-volume="0.4"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="6.6" data-volume="0.33"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.08" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.1;
      const fx = document.getElementById("fx");
      const parts = GEX.particles(fx, 5, 7101, { x0: 30, x1: 140, y0: 140, y1: 900 }).concat(GEX.particles(fx, 5, 7102, { x0: 940, x1: 1040, y0: 140, y1: 800 }));
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      const q1 = GEX.split(document.getElementById("q1")), q2 = GEX.split(document.getElementById("q2"));
      gsap.set(["#cta", "#lgc", "#sc"], { autoAlpha: 0 });
      GEX.reveal(tl, q1.words, 0.1, "rise", { stagger: 0.07, duration: 0.4 });
      GEX.reveal(tl, q2.words, 0.5, "pop", { stagger: 0.1, duration: 0.4 });
      ["#i1", "#i2", "#i3"].forEach((id, i) => {
        tl.fromTo(id, { y: 80, scale: 0, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)" }, 1.3 + i * 0.15);
        tl.to(id, { rotation: i % 2 ? 10 : -10, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.0 + i * 0.1);
      });
      tl.fromTo("#cta", { scale: 0.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(2.6)", immediateRender: false }, 4.4);
      tl.fromTo("#cta .pi", { rotation: -180 }, { rotation: 0, duration: 0.5, ease: "back.out(2)" }, 4.45);
      const cur = GEX.cursor(document.getElementById("ctaw"));
      tl.fromTo(cur.c, { x: 760, y: 160, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, 4.5);
      GEX.tap(tl, cur, 560, 40, 4.65, 0.4);
      tl.to("#cta", { keyframes: [{ scale: 0.93, duration: 0.08 }, { scale: 1.06, duration: 0.2 }, { scale: 1, duration: 0.2 }], ease: "sine.out" }, 5.05);
      tl.fromTo("#sh", { x: -140 }, { x: 600, duration: 0.6, ease: "power2.inOut" }, 5.2);
      tl.set("#sh", { x: -140 }, 5.85);
      tl.to(cur.c, { x: 760, y: 160, autoAlpha: 0, duration: 0.35 }, 5.5);
      // los procesos manuales se convierten en sistema
      ["#i1", "#i2", "#i3"].forEach((id, i) => tl.to(id, { y: 360, x: (1 - i) * 120 - 200, scale: 0.2, autoAlpha: 0, duration: 0.45, ease: "power3.in" }, 6.0 + i * 0.05));
      tl.fromTo("#lgc", { scale: 0.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)", immediateRender: false }, 6.4);
      tl.fromTo("#sc", { x: 60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 6.6);
      tl.to("#cta", { scale: 1.05, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 6.8);
      GEX.scatter(tl, ["#cta", "#lgc", "#sc"], EXIT, 71);
      tl.to(q1.words.concat(q2.words), { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.02 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
