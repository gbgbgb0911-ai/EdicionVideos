<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Taba Wash 02a — Antes: registro a mano y dos tickets</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #cust { position: absolute; left: 60px; top: 290px; display: flex; align-items: center; gap: 16px; padding: 14px 30px 14px 14px; border-radius: 999px; background: #ffffff; color: var(--teal); font-weight: 800; font-size: 36px; white-space: nowrap; }
      #cust .sh { width: 110px; height: 55px; }
      #timer { position: absolute; right: 60px; top: 300px; font-size: 38px; padding: 12px 26px; }
      #timer i { width: 40px; height: 40px; display: inline-block; }
      #form { position: absolute; left: 130px; top: 430px; width: 820px; height: 540px; padding: 34px 44px; border-radius: 16px; background: #ffffff; color: var(--teal); }
      #form h3 { font-weight: 800; font-size: 40px; letter-spacing: 0.12em; margin-bottom: 14px; }
      .fl { position: relative; display: flex; align-items: center; gap: 18px; height: 96px; border-bottom: 4px solid #cfe3e1; }
      .fl b { width: 170px; font-weight: 800; font-size: 32px; white-space: nowrap; }
      .fl .ink { position: relative; width: 470px; height: 60px; overflow: hidden; }
      .fl .ink svg { width: 470px; height: 60px; }
      .fl .cov { position: absolute; left: 0; top: 0; width: 470px; height: 60px; background: #ffffff; }
      #pen { position: absolute; left: 0; top: 0; width: 80px; height: 80px; z-index: 5; }
      .tk { position: absolute; top: 1080px; width: 400px; height: 300px; padding: 26px 30px; background: #ffffff; color: var(--teal); }
      .tk h4 { font-weight: 800; font-size: 30px; letter-spacing: 0.08em; white-space: nowrap; }
      .tk .sq { width: 340px; height: 44px; margin-top: 18px; }
      #t1 { left: 70px; border-radius: 14px; border-top: 14px dashed #fe6820; }
      #t2 { left: 610px; border-radius: 14px 70px 70px 14px; border-left: 14px solid #1fc4b8; }
      #t2 .hole { position: absolute; right: 36px; top: 50%; width: 34px; height: 34px; margin-top: -17px; border-radius: 50%; border: 6px solid #cfdcdb; }
      #x2 { position: absolute; left: 470px; top: 1170px; width: 140px; height: 140px; border-radius: 50%; background: var(--orange); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 64px; z-index: 6; }
      #endw { position: absolute; left: 0; right: 0; top: 1440px; display: flex; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="10" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="10" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">ANTES · TODO A MANO</span></div>
        <div id="cust"><span class="av">C</span>Llega un cliente<span class="sh" data-shoe="#fe6820"></span></div>
        <span class="chip a" id="timer"><i data-ic="clock" data-col="#ffffff"></i><span class="num" id="tv">0:00</span></span>
        <div id="form">
          <h3>REGISTRO</h3>
          <div class="fl"><b>Nombre</b><span class="ink"><svg viewBox="0 0 470 60"><path d="M6 40c20-30 30 10 50-6s24-16 40 0 30-22 50-4 20 14 40-2 30-10 44 6" fill="none" stroke="#0b958b" stroke-width="6" stroke-linecap="round" /></svg><i class="cov"></i></span></div>
          <div class="fl"><b>Celular</b><span class="ink"><svg viewBox="0 0 470 60"><path d="M6 36c14-20 24 8 36-4s22-14 34 2 26-18 40-2 18 12 34-4 26-8 40 6 24-16 40 0" fill="none" stroke="#0b958b" stroke-width="6" stroke-linecap="round" /></svg><i class="cov"></i></span></div>
          <div class="fl"><b>Servicio</b><span class="ink"><svg viewBox="0 0 470 60"><path d="M6 40c18-26 28 6 46-6s26-12 40 2 30-20 48-2 22 10 38-4" fill="none" stroke="#0b958b" stroke-width="6" stroke-linecap="round" /></svg><i class="cov"></i></span></div>
          <div class="fl"><b>Detalle</b><span class="ink"><svg viewBox="0 0 470 60"><path d="M6 38c16-22 26 8 40-4s24-14 38 0 28-20 44-2 20 12 36-4 28-10 42 4 22-14 38 0 24 10 40-4" fill="none" stroke="#0b958b" stroke-width="6" stroke-linecap="round" /></svg><i class="cov"></i></span></div>
          <svg id="pen" viewBox="0 0 60 60"><path d="M10 50l6-16 26-26 10 10-26 26Z" fill="#ea5a14" /><path d="M10 50l6-16 10 10Z" fill="#ffffff" stroke="#ea5a14" stroke-width="3" stroke-linejoin="round" /></svg>
        </div>
        <div class="tk" id="t1"><h4>TICKET 1 · SERVICIO</h4><svg class="sq" viewBox="0 0 340 44"><path d="M4 30c16-20 26 6 40-4s22-12 34 0 26-16 40-2 18 10 32-4" fill="none" stroke="#0b958b" stroke-width="6" stroke-linecap="round" /></svg><svg class="sq" viewBox="0 0 340 44"><path d="M4 28c12-16 22 6 34-4s20-10 30 2 24-14 36-2" fill="none" stroke="#0b958b" stroke-width="6" stroke-linecap="round" /></svg><svg class="sq" viewBox="0 0 340 44"><path d="M4 30c14-18 24 6 38-4s22-12 32 0" fill="none" stroke="#ea5a14" stroke-width="6" stroke-linecap="round" /></svg></div>
        <div class="tk" id="t2"><h4>TICKET 2 · CALZADO</h4><svg class="sq" viewBox="0 0 340 44"><path d="M4 30c16-20 26 6 40-4s22-12 34 0 26-16 40-2" fill="none" stroke="#0b958b" stroke-width="6" stroke-linecap="round" /></svg><svg class="sq" viewBox="0 0 340 44"><path d="M4 28c12-16 22 6 34-4s20-10 30 2 24-14 36-2 18 8 30-2" fill="none" stroke="#0b958b" stroke-width="6" stroke-linecap="round" /></svg><span class="hole"></span></div>
        <div id="x2">x2</div>
        <div id="endw"><div class="pill o" id="endp"><span class="pi" data-ic="alert" data-col="#ea5a14" data-sw="5"></span>Con cada cliente<i class="shine" id="sh"></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-c" src="assets/sfx/pop.wav" data-start="0.7" data-volume="0.3"></audio>
      <audio id="s-w" src="assets/sfx/tick.wav" data-start="1.4" data-volume="0.25"></audio>
      <audio id="s-t" src="assets/sfx/pop.wav" data-start="4.6" data-volume="0.3"></audio>
      <audio id="s-x2" src="assets/sfx/impact.wav" data-start="6.0" data-volume="0.38"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="9.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons(); GEX.shoes();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 9.6;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 8, 2201, { x0: 40, x1: 1040, y0: 260, y1: 1560 });
      GEX.ambient(tl, parts, 0.4, EXIT + 0.3);
      gsap.set(["#t1", "#t2", "#x2", "#endp"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#cust", { x: -700 }, { x: 0, duration: 0.6, ease: "power3.out" }, 0.6);
      tl.fromTo("#cust .sh", { rotation: -10 }, { rotation: 6, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.6);
      tl.fromTo("#timer", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)" }, 1.1);
      tl.fromTo("#form", { y: 500, rotation: 6, autoAlpha: 0 }, { y: 0, rotation: -2, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 0.9);
      // escribiendo a mano, línea por línea (lento)
      const lines = document.querySelectorAll(".fl");
      const x0 = 214, ys = [102, 198, 294, 390];
      tl.fromTo("#pen", { x: 219, y: ys[0] - 25, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15 }, 1.3);
      lines.forEach((l, i) => {
        const t = 1.4 + i * 0.75;
        tl.fromTo(l.querySelector(".cov"), { x: 0 }, { x: 470, duration: 0.7, ease: "none" }, t);
        tl.fromTo("#pen", { x: 219, y: ys[i] - 25 }, { x: 640, y: ys[i] - 25, duration: 0.7, ease: "none", immediateRender: false }, t);
        tl.to("#pen", { rotation: 8, duration: 0.08, ease: "sine.inOut", yoyo: true, repeat: 7 }, t);
      });
      tl.to("#pen", { autoAlpha: 0, duration: 0.2 }, 4.45);
      const tv = document.getElementById("tv"), tm = { v: 0 };
      tl.to(tm, { v: 180, duration: 4.6, ease: "none", onUpdate: () => { const s = Math.round(tm.v); tv.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " min"; } }, 1.3);
      tl.to("#timer", { scale: 1.08, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.0);
      // dos tickets
      tl.fromTo("#t1", { y: -300, rotation: -12, autoAlpha: 0 }, { y: 0, rotation: -4, autoAlpha: 1, duration: 0.6, ease: "bounce.out", immediateRender: false }, 4.6);
      tl.fromTo("#t2", { y: -300, rotation: 12, autoAlpha: 0 }, { y: 0, rotation: 4, autoAlpha: 1, duration: 0.6, ease: "bounce.out", immediateRender: false }, 5.0);
      tl.fromTo(".tk .sq", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.35, ease: "none", stagger: 0.2 }, 5.2);
      tl.fromTo("#x2", { scale: 0, rotation: -90, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(3)", immediateRender: false }, 6.0);
      tl.to("#x2", { scale: 1.12, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 6.6);
      tl.fromTo("#endp", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 7.4);
      tl.fromTo("#sh", { x: -140 }, { x: 600, duration: 0.6, ease: "power2.inOut" }, 8.0);
      tl.set("#sh", { x: -140 }, 8.65);
      tl.to(["#t1", "#t2"], { y: -10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.2 }, 7.6);
      // salida + barrido
      GEX.scatter(tl, ["#cust", "#timer", "#form", "#t1", "#x2", "#t2", "#endp", "#tag"], EXIT, 22);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
