<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Taba Wash 02b — Antes: identificar sin fotos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #tk { position: absolute; left: 60px; top: 290px; width: 560px; padding: 22px 28px; border-radius: 14px 60px 60px 14px; background: #ffffff; border-left: 14px solid #1fc4b8; color: var(--teal); }
      #tk h4 { font-weight: 800; font-size: 28px; letter-spacing: 0.08em; }
      #tk p { font-weight: 500; font-size: 40px; white-space: nowrap; margin-top: 6px; }
      #timer { position: absolute; right: 60px; top: 320px; font-size: 38px; padding: 12px 26px; }
      #timer i { width: 40px; height: 40px; display: inline-block; }
      .board { position: absolute; left: 60px; width: 960px; height: 12px; border-radius: 6px; background: #ffffff; }
      .sl { position: absolute; width: 210px; height: 105px; }
      .sl svg { width: 100%; height: 100%; }
      .q { position: absolute; left: 70px; top: -42px; font-size: 24px; padding: 4px 14px; }
      #lens { position: absolute; left: 0; top: 0; width: 240px; height: 240px; z-index: 8; }
      #lens svg { width: 100%; height: 100%; overflow: visible; }
      #bub { position: absolute; left: 0; top: 0; z-index: 9; font-size: 30px; }
      .ask { position: absolute; z-index: 9; font-size: 34px; padding: 12px 24px; }
      #scuff { position: absolute; width: 90px; height: 50px; z-index: 3; }
      #endw { position: absolute; left: 0; right: 0; top: 1350px; display: flex; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="8.5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">ANTES · SIN FOTOS</span></div>
        <div id="tk"><h4>TICKET 2 · CALZADO</h4><p>“zapatilla blanca, talla 40”</p></div>
        <span class="chip a" id="timer"><i data-ic="clock" data-col="#ffffff"></i><span class="num" id="tv">0 min</span></span>
        <div id="shelf"></div>
        <div id="lens"><svg viewBox="0 0 100 100"><circle cx="40" cy="40" r="30" fill="none" stroke="#ffffff" stroke-width="8" /><path d="M62 62l28 28" stroke="#fe6820" stroke-width="12" stroke-linecap="round" /></svg></div>
        <span class="chip o" id="bub">¿Esta?</span>
        <span class="chip ask" id="a1" style="left: 600px; top: 470px">¿De quién es?</span>
        <span class="chip o ask" id="a2" style="left: 90px; top: 1250px">¿Llegó así o se dañó aquí?</span>
        <svg id="scuff" viewBox="0 0 90 50"><path d="M6 30l14-14 6 16 14-18 8 18 14-16 6 14 14-12" fill="none" stroke="#ea5a14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <div id="endw"><div class="pill o" id="endp"><span class="pi" data-ic="clock" data-col="#ea5a14" data-sw="5"></span>Tiempo perdido buscando<i class="shine" id="sh"></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-t1" src="assets/sfx/tick.wav" data-start="1.6" data-volume="0.28"></audio>
      <audio id="s-t2" src="assets/sfx/tick.wav" data-start="2.8" data-volume="0.28"></audio>
      <audio id="s-q" src="assets/sfx/pop.wav" data-start="4.6" data-volume="0.3"></audio>
      <audio id="s-x" src="assets/sfx/impact.wav" data-start="6.5" data-volume="0.38"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.08" data-volume="0.4"></audio>
    </div>
    <script>
      // estante con pares parecidos
      const COLS = ["#f2f4f4", "#f2f4f4", "#1fc4b8", "#f2f4f4", "#fe6820", "#f2f4f4", "#f2f4f4", "#cfd8d7", "#f2f4f4", "#179a4a", "#f2f4f4", "#f2f4f4"];
      const shelf = document.getElementById("shelf");
      const SX = (i) => 70 + (i % 4) * 238, SY = (i) => 600 + Math.floor(i / 4) * 230;
      COLS.forEach((c, i) => {
        const s = document.createElement("div");
        s.className = "sl"; s.id = "z" + i;
        s.style.left = SX(i) + "px"; s.style.top = SY(i) + "px";
        s.innerHTML = GEX.shoe(c, c === "#f2f4f4" || c === "#cfd8d7" ? "#9aaeac" : "#ffffff");
        shelf.appendChild(s);
        const q = document.createElement("span");
        q.className = "chip gr q"; q.textContent = "?"; s.appendChild(q);
      });
      [0, 1, 2].forEach((r) => { const b = document.createElement("div"); b.className = "board"; b.style.top = (600 + r * 230 + 108) + "px"; shelf.appendChild(b); });
      GEX.shoes(); GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.1;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#bub", "#a1", "#a2", "#scuff", "#endp", "#lens"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#tk", { x: -700, rotation: -6 }, { x: 0, rotation: -2, duration: 0.55, ease: "power3.out" }, 0.3);
      tl.fromTo("#timer", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)" }, 0.6);
      tl.fromTo(".board", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", stagger: 0.08 }, 0.4);
      tl.fromTo(".sl", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "bounce.out", stagger: 0.04 }, 0.6);
      // la lupa revisa cada par blanco
      const stops = [0, 1, 3, 5, 6, 8];
      tl.fromTo("#lens", { x: 900, y: 1300, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, immediateRender: false }, 1.2);
      stops.forEach((k, i) => {
        const t = 1.3 + i * 0.55;
        tl.to("#lens", { x: SX(k) - 10, y: SY(k) - 70, duration: 0.3, ease: "power2.inOut" }, t);
        tl.fromTo("#bub", { x: SX(k) + 120, y: SY(k) - 70, scale: 0.5, autoAlpha: 0 }, { x: SX(k) + 120, y: SY(k) - 70, scale: 1, autoAlpha: 1, duration: 0.15, ease: "back.out(3)", immediateRender: false }, t + 0.3);
        tl.to("#bub", { autoAlpha: 0, duration: 0.1 }, t + 0.5);
        tl.to("#z" + k, { keyframes: [{ x: -8, duration: 0.06 }, { x: 8, duration: 0.06 }, { x: 0, duration: 0.06 }] }, t + 0.32);
      });
      const tv = document.getElementById("tv"), tm = { v: 0 };
      tl.to(tm, { v: 15, duration: 5.0, ease: "power1.in", onUpdate: () => { tv.textContent = Math.round(tm.v) + " min"; } }, 1.3);
      tl.to("#timer", { scale: 1.08, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 9 }, 2.0);
      // dudas
      tl.fromTo("#a1", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, 4.6);
      tl.set("#scuff", { left: SX(6) + 70, top: SY(6) + 20 }, 0);
      tl.fromTo("#scuff", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 5.2);
      tl.fromTo("#a2", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, 5.4);
      tl.to("#lens", { x: SX(6) - 10, y: SY(6) - 70, duration: 0.35, ease: "power2.inOut" }, 5.0);
      tl.to(["#a1", "#a2"], { rotation: -3, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 5 }, 5.9);
      tl.fromTo("#endp", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 6.5);
      GEX.punch(tl, "#timer", 6.5, 1.2);
      tl.fromTo("#sh", { x: -140 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 7.0);
      tl.set("#sh", { x: -140 }, 7.65);
      // salida + barrido
      GEX.scatter(tl, ["#tk", "#timer", "#lens", "#a1", "#a2", "#endp", "#tag", "#scuff"], EXIT, 23);
      tl.to(".sl, .board", { y: 600, autoAlpha: 0, duration: 0.35, ease: "power3.in", stagger: 0.015 }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
