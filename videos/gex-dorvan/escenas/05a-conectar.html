<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Dorvan 05a — Conectar áreas, coordinación y control</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #topw { position: absolute; left: 0; right: 0; top: 90px; display: flex; justify-content: center; }
      #rp { background: #ffffff; color: #0b958b; font-size: 44px; padding: 14px 34px 14px 14px; }
      #rp .pi { width: 68px; height: 68px; background: #0b958b; }
      #rp .pi svg { width: 42px; height: 42px; }
      #sv { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; pointer-events: none; }
      #cards { position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; gap: 30px; }
      .cd { width: 310px; height: 360px; border-radius: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; font-weight: 800; font-size: 40px; line-height: 1.1; text-align: center; white-space: nowrap; }
      .cd .ico { width: 150px; height: 150px; background: #ffffff; }
      .cd .ico svg { width: 62%; height: 62%; }
      .duo { display: flex; align-items: center; gap: 10px; height: 150px; }
      .duo b { width: 84px; height: 84px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 52px; }
      .duo i { width: 50px; height: 8px; border-radius: 4px; background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.6" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="8.6" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <svg id="sv" viewBox="0 0 1080 960"><path id="l1" class="route" d="M540 200 V 260 H 195 V 325" /><path id="l2" class="route" d="M540 200 V 325" /><path id="l3" class="route" d="M540 200 V 260 H 885 V 325" /></svg>
          <div id="topw"><div class="pill" id="rp"><span class="pi" data-ic="doc" data-col="#ffffff" data-sw="4.5"></span>Registrar pedidos</div></div>
          <div id="cards">
            <div class="cd" id="d1" style="background: #ea5a14"><span class="duo"><b style="color: #ea5a14">1</b><i></i><b style="color: #0b958b">4</b></span>Conectar<br />áreas</div>
            <div class="cd" id="d2" style="background: #0b958b"><span class="ico" id="sy" data-ic="sync" data-sw="4.5"></span>Mejor<br />coordinación</div>
            <div class="cd" id="d3" style="background: #179a4a"><span class="ico" data-ic="chart" data-col="#179a4a" data-sw="4.5"></span>Control para<br />el dueño</div>
          </div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="3.2" data-volume="0.28"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="5.0" data-volume="0.28"></audio>
      <audio id="s-3" src="assets/sfx/ding.wav" data-start="6.4" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.2;
      const parts = GEX.particles(document.getElementById("fx"), 8, 1401, { x0: 20, x1: 300, y0: 60, y1: 300 }).concat(GEX.particles(document.getElementById("fx"), 6, 1402, { x0: 780, x1: 1060, y0: 60, y1: 300 }));
      GEX.ambient(tl, parts, 0.4, EXIT + 0.3);
      gsap.set([".cd", "#l1", "#l2", "#l3"], { autoAlpha: 0 });
      tl.fromTo("#rp", { y: -80, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      tl.fromTo("#rp .pi", { rotation: -180 }, { rotation: 0, duration: 0.5, ease: "back.out(2)" }, 0.1);
      GEX.float(tl, "#rp", 0.6, EXIT, 6, 1.3);
      // va más allá de registrar
      [["#d1", "#l1", 3.2], ["#d2", "#l2", 5.0], ["#d3", "#l3", 6.4]].forEach(([id, ln, t], i) => {
        tl.fromTo(ln, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, immediateRender: false }, t - 0.15);
        tl.fromTo(ln, { strokeDashoffset: 0 }, { strokeDashoffset: -140, duration: EXIT - t, ease: "none" }, t - 0.15);
        tl.fromTo(id, { y: 200, rotation: (i - 1) * 14, autoAlpha: 0 }, { y: 0, rotation: (i - 1) * 3, autoAlpha: 1, duration: 0.45, ease: "back.out(2.2)", immediateRender: false }, t);
        GEX.float(tl, id, t + 0.5, EXIT, 8, 1.1 + i * 0.2);
      });
      tl.fromTo("#d1 .duo b", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)", stagger: 0.12 }, 3.3);
      tl.fromTo("#d1 .duo i", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 3.45);
      tl.to("#d1 .duo i", { scaleX: 0.5, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 7 }, 3.9);
      tl.fromTo("#sy svg", { rotation: 0 }, { rotation: 540, duration: EXIT - 5.0, ease: "none" }, 5.0);
      tl.fromTo("#d3 .ico", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)" }, 6.5);
      GEX.scatter(tl, ["#rp", "#d1", "#d2", "#d3"], EXIT, 51);
      tl.to("#sv", { autoAlpha: 0, duration: 0.2 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
