<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dorvan 02b — Cualquiera podía tocar precios y pagos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #card { position: absolute; left: 90px; top: 300px; width: 900px; }
      .f { display: flex; align-items: center; gap: 22px; height: 150px; padding: 0 34px; border-bottom: 4px solid var(--line); }
      .f:last-child { border-bottom: 0; }
      .f .ico { width: 84px; height: 84px; }
      .f .tx { display: flex; flex-direction: column; gap: 6px; }
      .val { position: relative; display: flex; align-items: center; gap: 18px; }
      .val b { position: relative; font-weight: 800; font-size: 48px; white-space: nowrap; }
      .val .sk { position: absolute; left: -6px; width: 128px; top: 26px; height: 7px; border-radius: 4px; background: #fe6820; transform-origin: 0% 50%; }
      .val .chip { font-size: 40px; padding: 6px 20px; }
      #lock { position: absolute; left: 790px; top: 400px; width: 170px; height: 170px; border-radius: 50%; background: #ea5a14; display: flex; align-items: center; justify-content: center; border: 8px solid #ffffff; z-index: 6; }
      #lock svg { width: 96px; height: 96px; }
      #ppl { position: absolute; left: 0; right: 0; top: 820px; display: flex; justify-content: center; gap: 120px; }
      .pp { position: relative; }
      .pp .av { width: 120px; height: 120px; font-size: 50px; }
      .pp .ed { position: absolute; right: -12px; bottom: -6px; width: 54px; height: 54px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      .pp .ed svg { width: 32px; height: 32px; }
      #ln { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
      #endw { position: absolute; left: 0; right: 0; top: 1030px; display: flex; justify-content: center; }
      #ep { font-size: 42px; padding: 14px 32px 14px 14px; }
      #ep .pi { width: 68px; height: 68px; }
      #ep .pi svg { width: 42px; height: 42px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="6.6" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="6.6" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">Y ADEMÁS…</span></div>
        <svg id="ln" viewBox="0 0 1080 1920"><path class="route o" d="M300 815 L420 680" /><path class="route o" d="M540 815 L540 680" /><path class="route o" d="M780 815 L660 680" /></svg>
        <div class="win" id="card"><div class="bar"><i></i><i></i><i></i><b>Pedido #104 · Grabado acrílico</b></div>
          <div class="f" id="r1"><span class="ico" data-ic="money"></span><span class="tx"><span class="lbl" data-layout-ignore>PRECIO</span><span class="val"><b>$350<i class="sk" id="sk1"></i></b><span class="chip o" id="nv1">$200</span></span></span></div>
          <div class="f" id="r2"><span class="ico" data-ic="cash"></span><span class="tx"><span class="lbl" data-layout-ignore>PAGO · ADELANTO</span><span class="val"><b>$150<i class="sk" id="sk2"></i></b><span class="chip o" id="nv2">$0</span></span></span></div>
        </div>
        <div id="lock" data-ic="lock" data-col="#ffffff" data-sw="5"></div>
        <div id="ppl"><div class="pp" id="w1"><span class="av">J</span><span class="ed" data-ic="edit" data-col="#ea5a14" data-sw="5"></span></div><div class="pp" id="w2"><span class="av o">R</span><span class="ed" data-ic="edit" data-col="#ea5a14" data-sw="5"></span></div><div class="pp" id="w3"><span class="av g">S</span><span class="ed" data-ic="edit" data-col="#ea5a14" data-sw="5"></span></div></div>
        <div id="endw"><div class="pill o" id="ep"><span class="pi" data-ic="shield" data-col="#ea5a14" data-sw="4.5"></span>Precios y pagos: solo con autorización<i class="shine" id="sh" data-layout-allow-overflow></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-c1" src="assets/sfx/click.wav" data-start="2.0" data-volume="0.32"></audio>
      <audio id="s-c2" src="assets/sfx/click.wav" data-start="3.0" data-volume="0.32"></audio>
      <audio id="s-lk" src="assets/sfx/impact.wav" data-start="4.2" data-volume="0.36"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.2;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1331, { x0: 60, x1: 1020, y0: 1160, y1: 1520 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set(["#nv1", "#nv2", "#lock", "#ep", "#ln", ".pp"], { autoAlpha: 0 });
      gsap.set([".sk"], { scaleX: 0 });
      const cur = GEX.cursor(scene);
      gsap.set(cur.c, { x: 1120, y: 900 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#card", { y: 400, rotation: 4, autoAlpha: 0 }, { y: 0, rotation: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo(".f", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out", stagger: 0.12 }, 0.6);
      // cualquier trabajador tiene acceso
      tl.fromTo(".pp", { y: 120, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)", stagger: 0.1, immediateRender: false }, 0.9);
      tl.fromTo("#ln", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, immediateRender: false }, 1.3);
      tl.fromTo("#ln path", { strokeDashoffset: 0 }, { strokeDashoffset: -140, duration: EXIT - 1.3, ease: "none" }, 1.3);
      tl.to(".pp .ed", { rotation: -15, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 9, stagger: 0.07 }, 1.4);
      // precio y pago alterados
      GEX.tap(tl, cur, 220, 485, 1.6, 0.4);
      tl.to("#sk1", { scaleX: 1, duration: 0.25, ease: "power3.out" }, 2.05);
      tl.fromTo("#nv1", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 2.15);
      GEX.tap(tl, cur, 220, 635, 2.6, 0.4);
      tl.to("#sk2", { scaleX: 1, duration: 0.25, ease: "power3.out" }, 3.05);
      tl.fromTo("#nv2", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 3.15);
      tl.to("#card", { keyframes: [{ x: -14, duration: 0.06 }, { x: 14, duration: 0.08 }, { x: -8, duration: 0.08 }, { x: 0, duration: 0.08 }], ease: "none" }, 3.4);
      tl.to(cur.c, { x: 1120, y: 1000, duration: 0.4, ease: "power2.in" }, 3.5);
      // hacía falta bloquearlo
      tl.fromTo("#lock", { scale: 3, rotation: -30, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.3, ease: "power4.in", immediateRender: false }, 3.95);
      GEX.punch(tl, "#card", 4.25, 1.03);
      tl.to(["#nv1", "#nv2"], { scale: 0, autoAlpha: 0, duration: 0.25, ease: "back.in(2)", stagger: 0.06 }, 4.35);
      tl.to(".sk", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.25, ease: "power3.in", stagger: 0.06 }, 4.4);
      tl.to("#lock", { rotation: 10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 4.6);
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 4.6);
      tl.fromTo("#sh", { x: -140 }, { x: 900, duration: 0.7, ease: "power2.inOut" }, 5.1);
      tl.set("#sh", { x: -140 }, 5.85);
      // salida + barrido
      GEX.scatter(tl, ["#card", "#lock", "#w1", "#w2", "#w3", "#ep", "#tag"], EXIT, 22);
      tl.to("#ln", { autoAlpha: 0, duration: 0.2 }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
