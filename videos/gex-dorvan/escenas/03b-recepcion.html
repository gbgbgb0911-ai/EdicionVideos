<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dorvan 03b — Recepción registra el pedido</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #card { position: absolute; left: 90px; top: 300px; width: 900px; }
      .f { display: flex; align-items: center; gap: 22px; height: 120px; padding: 0 30px; border-bottom: 4px solid var(--line); }
      .f .ico { width: 76px; height: 76px; }
      .f .tx { display: flex; flex-direction: column; gap: 4px; }
      .f .lbl { font-size: 28px; }
      .f .v { font-weight: 800; font-size: 42px; white-space: nowrap; min-height: 50px; }
      .f .chip { font-size: 34px; padding: 6px 20px; }
      .ft { display: flex; align-items: center; justify-content: space-between; height: 130px; padding: 0 30px; }
      #sal { font-size: 34px; padding: 10px 22px; }
      #btn { position: relative; display: inline-flex; align-items: center; gap: 12px; padding: 16px 34px; border-radius: 999px; background: #0b958b; color: #ffffff; font-weight: 800; font-size: 38px; white-space: nowrap; }
      #btn b { font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.2" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7.2" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">RECEPCIÓN</span></div>
        <div class="win" id="card"><div class="bar"><i></i><i></i><i></i><b>Nuevo pedido</b></div>
          <div class="f" id="f1"><span class="ico" data-ic="doc"></span><span class="tx"><span class="lbl">PEDIDO</span><span class="v" id="v1"></span></span></div>
          <div class="f" id="f2"><span class="ico" data-ic="money"></span><span class="tx"><span class="lbl">PRECIO</span><span class="v" id="v2"></span></span></div>
          <div class="f" id="f3"><span class="ico" data-ic="cash" data-col="#179a4a"></span><span class="tx"><span class="lbl">ADELANTO</span><span class="v" id="v3"></span></span></div>
          <div class="f" id="f4"><span class="ico" data-ic="calendar" data-col="#ea5a14"></span><span class="tx"><span class="lbl">FECHA DE ENTREGA</span><span class="v" id="v4"></span></span></div>
          <div class="f" id="f5"><span class="ico" data-ic="layers"></span><span class="tx"><span class="lbl">ÁREA</span><span class="chip o" id="v5">LÁSER · PISO 1</span></span></div>
          <div class="ft"><span class="chip a" id="sal">Saldo: $200</span><span id="btn"><b id="bt">Registrar</b></span></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-t1" src="assets/sfx/tick.wav" data-start="1.4" data-volume="0.26"></audio>
      <audio id="s-t3" src="assets/sfx/tick.wav" data-start="3.3" data-volume="0.26"></audio>
      <audio id="s-clk" src="assets/sfx/click.wav" data-start="5.75" data-volume="0.32"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="5.85" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.78" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.8;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1351, { x0: 60, x1: 1020, y0: 1180, y1: 1540 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set(["#v5", "#sal", ".f .v"], { autoAlpha: 0 });
      const cur = GEX.cursor(scene);
      gsap.set(cur.c, { x: 1120, y: 1300 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#card", { y: 500, rotation: 4, autoAlpha: 0 }, { y: 0, rotation: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo(".f", { x: -50, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "power3.out", stagger: 0.07 }, 0.6);
      tl.fromTo("#btn", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)" }, 1.0);
      // se llena cada dato cuando se menciona
      const fill = (row, t, fn) => {
        tl.to(row, { keyframes: [{ backgroundColor: "#d6f3f0", duration: 0.15 }, { backgroundColor: "#ffffff", duration: 0.6 }], ease: "none" }, t);
        tl.fromTo(row + " .ico", { scale: 0.6, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)", immediateRender: false }, t);
        tl.fromTo(row + " .v", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, immediateRender: false }, t + 0.1);
        fn(t);
      };
      fill("#f1", 1.4, (t) => GEX.type(tl, document.getElementById("v1"), "Grabado en acrílico", t + 0.1, 0.7));
      fill("#f2", 2.5, (t) => GEX.count(tl, document.getElementById("v2"), 0, 350, t + 0.1, 0.5, "$"));
      fill("#f3", 3.3, (t) => GEX.count(tl, document.getElementById("v3"), 0, 150, t + 0.1, 0.5, "$"));
      fill("#f4", 4.3, (t) => GEX.type(tl, document.getElementById("v4"), "Viernes 14", t + 0.1, 0.45));
      fill("#f5", 5.0, (t) => tl.fromTo("#v5", { scale: 0, autoAlpha: 0, transformOrigin: "0% 50%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 50%", duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, t + 0.1));
      tl.fromTo("#sal", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 3.8);
      // registrar
      GEX.tap(tl, cur, 860, 1035, 5.3, 0.45);
      tl.to("#btn", { keyframes: [{ scale: 0.9, duration: 0.08 }, { scale: 1.12, backgroundColor: "#179a4a", duration: 0.16 }, { scale: 1, duration: 0.25 }], ease: "sine.out" }, 5.75);
      const bt = document.getElementById("bt");
      const bp = { v: 0 };
      tl.fromTo(bp, { v: 0 }, { v: 1, duration: 0.02, onUpdate: () => { bt.textContent = bp.v > 0.5 ? "✓ Registrado" : "Registrar"; } }, 5.82);
      GEX.punch(tl, "#card", 5.85, 1.03);
      tl.to(cur.c, { x: 1120, y: 1400, duration: 0.4, ease: "power2.in" }, 6.1);
      // salida + barrido
      GEX.scatter(tl, ["#card", "#tag"], EXIT, 32);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
