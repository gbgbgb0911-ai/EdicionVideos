<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dorvan 03d — Cada área ve y actualiza sus pedidos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      .pnl { left: 90px; width: 900px; border-radius: 30px; }
      .pnl .ph { height: 78px; padding: 0 26px; font-size: 32px; letter-spacing: 0.04em; }
      .pnl .ph span { display: inline-flex; align-items: center; gap: 12px; }
      .pnl .ph .ico { width: 52px; height: 52px; background: #ffffff; }
      .pnl .ph small { font-size: 28px; font-weight: 800; letter-spacing: 0; }
      .pnl .pr { position: relative; height: 100px; padding: 0 26px; font-size: 36px; }
      .pnl .pr .chip { font-size: 28px; padding: 8px 18px; }
      .pnl .pr .bar { position: absolute; left: 26px; right: 26px; bottom: 12px; height: 8px; border-radius: 4px; background: #e6eeed; }
      .pnl .pr .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 4px; background: #1fc4b8; transform-origin: 0% 50%; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.0" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7.0" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">CADA ÁREA, SUS PEDIDOS</span></div>
        <div class="pnl" id="pn4" style="top: 300px"><div class="ph"><span><span class="ico" data-ic="hammer" data-sw="4.5"></span>PISO 4 · TALLER</span><small id="c4">Pendientes: 2</small></div>
          <div class="pr"><span>#098 Mueble</span><span class="chip">En proceso</span><span class="bar"><i class="b6"></i></span></div>
          <div class="pr" id="r105"><span>#105 Pizarra</span><span class="chip a" id="s105">Pendiente</span><span class="bar"><i id="b105"></i></span></div>
          <div class="pr"><span>#106 Letrero</span><span class="chip a">Pendiente</span><span class="bar"><i class="b0"></i></span></div>
        </div>
        <div class="pnl o" id="pn1" style="top: 720px"><div class="ph"><span><span class="ico" data-ic="laser" data-col="#ea5a14" data-sw="4.5"></span>PISO 1 · LÁSER</span><small id="c1">Pendientes: 2</small></div>
          <div class="pr"><span>#101 Llaveros</span><span class="chip g">Listo ✓</span><span class="bar"><i></i></span></div>
          <div class="pr" id="r104"><span>#104 Grabado</span><span class="chip a" id="s104">Pendiente</span><span class="bar"><i id="b104"></i></span></div>
          <div class="pr"><span>#107 Corte MDF</span><span class="chip a">Pendiente</span><span class="bar"><i class="b0"></i></span></div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-c1" src="assets/sfx/click.wav" data-start="2.75" data-volume="0.32"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="4.05" data-volume="0.3"></audio>
      <audio id="s-t" src="assets/sfx/tick.wav" data-start="4.7" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.6;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1371, { x0: 60, x1: 1020, y0: 1160, y1: 1540 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set(".b6", { scaleX: 0.6 });
      gsap.set([".b0", "#b104", "#b105"], { scaleX: 0 });
      const cur = GEX.cursor(scene);
      gsap.set(cur.c, { x: 1120, y: 1200 });
      // cambio de estado seek-safe (texto + color)
      const swap = (id, t, a, b) => {
        const el = document.getElementById(id), p = { v: 0 };
        tl.fromTo(p, { v: 0 }, { v: 1, duration: 0.02, onUpdate: () => { const s = p.v > 0.5 ? b : a; el.textContent = s[0]; el.style.backgroundColor = s[1]; }, immediateRender: false }, t);
        GEX.punch(tl, "#" + id, t, 1.2);
      };
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#pn4", { y: -300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo("#pn1", { y: 400, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.4);
      tl.fromTo(".pr", { x: -50, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "power3.out", stagger: 0.07 }, 0.7);
      tl.fromTo(".ph .ico", { rotation: -120, scale: 0 }, { rotation: 0, scale: 1, duration: 0.45, ease: "back.out(2.6)", stagger: 0.12 }, 0.6);
      tl.to(".chip.a", { scale: 1.06, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.1 }, 1.3);
      // láser avanza el #104
      GEX.tap(tl, cur, 860, 925, 2.3, 0.45);
      swap("s104", 2.75, ["Pendiente", "#b86e00"], ["En proceso", "#0b958b"]);
      swap("c1", 2.75, ["Pendientes: 2", ""], ["Pendientes: 1", ""]);
      tl.fromTo("#b104", { scaleX: 0 }, { scaleX: 0.5, duration: 0.5, ease: "power2.out", immediateRender: false }, 2.8);
      tl.to("#r104", { keyframes: [{ backgroundColor: "#eef9f8", duration: 0.12 }, { backgroundColor: "#ffffff", duration: 0.5 }], ease: "none" }, 2.75);
      GEX.tap(tl, cur, 860, 925, 3.6, 0.3);
      swap("s104", 4.05, ["En proceso", "#0b958b"], ["Listo ✓", "#179a4a"]);
      tl.to("#b104", { scaleX: 1, backgroundColor: "#179a4a", duration: 0.4, ease: "power2.out" }, 4.05);
      tl.to(cur.c, { x: 1120, y: 1300, duration: 0.4, ease: "power2.in" }, 4.3);
      // taller actualiza el #105 desde su piso
      swap("s105", 4.7, ["Pendiente", "#b86e00"], ["En proceso", "#0b958b"]);
      swap("c4", 4.7, ["Pendientes: 2", ""], ["Pendientes: 1", ""]);
      tl.fromTo("#b105", { scaleX: 0 }, { scaleX: 0.4, duration: 0.5, ease: "power2.out", immediateRender: false }, 4.75);
      tl.to("#r105", { keyframes: [{ backgroundColor: "#eef9f8", duration: 0.12 }, { backgroundColor: "#ffffff", duration: 0.5 }], ease: "none" }, 4.7);
      GEX.float(tl, "#pn4", 1.0, EXIT, 5, 1.8);
      GEX.float(tl, "#pn1", 1.2, EXIT, 5, 1.6);
      // salida + barrido
      tl.to("#pn4", { x: -1000, rotation: -6, autoAlpha: 0, duration: 0.35, ease: "power3.in" }, EXIT);
      tl.to("#pn1", { x: 1000, rotation: 6, autoAlpha: 0, duration: 0.35, ease: "power3.in" }, EXIT);
      tl.to("#tag", { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
