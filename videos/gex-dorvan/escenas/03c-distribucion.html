<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dorvan 03c — Cada pedido llega al panel de su piso</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      .fl { left: 470px; width: 540px; }
      .fl.big { height: 280px; }
      .fl.sm { height: 90px; }
      .fl .fnum { left: 16px; top: 18px; width: 80px; height: 80px; font-size: 48px; }
      .fl .fname { left: 14px; top: 124px; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 28px; }
      .fl .fname .ico { width: 50px; height: 50px; }
      .fl .fgrey { left: 20px; top: 24px; font-size: 28px; }
      .pnl { left: 140px; top: 14px; width: 382px; height: 240px; }
      .pr .nw { visibility: hidden; }
      .pnl .pr { height: 80px; font-size: 30px; }
      .pnl .pr .chip { font-size: 24px; }
      .pnl .ph { height: 56px; font-size: 26px; }
      #rec { position: absolute; left: 50px; top: 890px; width: 330px; height: 218px; border: 6px solid #ffffff; border-radius: 22px; }
      #rec .rl { position: absolute; left: 0; right: 0; top: 18px; display: flex; justify-content: center; align-items: center; gap: 10px; font-weight: 800; font-size: 30px; letter-spacing: 0.08em; white-space: nowrap; }
      #rec .rl .ico { width: 52px; height: 52px; background: #ffffff; }
      #gnd { position: absolute; left: 30px; width: 1020px; top: 1124px; height: 8px; border-radius: 4px; background: #dfe7e6; }
      #sv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
      .tk { left: 75px; top: 996px; }
      #leg { position: absolute; left: 0; right: 0; top: 1190px; display: flex; justify-content: center; gap: 24px; }
      #leg .pill { font-size: 38px; padding: 12px 28px 12px 12px; }
      #leg .pi { width: 62px; height: 62px; }
      #leg .pi svg { width: 40px; height: 40px; }
      .nb { position: absolute; left: 66px; top: 6px; height: 40px; padding: 0 12px; border-radius: 999px; background: #ffffff; color: #ea5a14; font-weight: 800; font-size: 24px; display: flex; align-items: center; border: 4px solid #ea5a14; }
      #nb4 { color: #0b958b; border-color: #0b958b; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="10.0" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="10.0" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">CADA PEDIDO A SU PISO</span></div>
        <svg id="sv" viewBox="0 0 1080 1920"><path id="r1" class="route o" d="M380 1024 H 470" /><path id="r4" class="route" d="M380 960 H 430 V 516 H 470" /></svg>
        <div class="fl big t" id="p4" style="top: 320px"><span class="fnum" id="n4">4</span><span class="nb" id="nb4">+1</span><span class="fname"><span class="ico" data-ic="hammer" data-sw="4.5"></span>TALLER</span>
          <div class="pnl" id="pn4"><div class="ph"><span>PANEL · PISO 4</span></div><div class="pr"><span>#098 Mueble</span><span class="chip">En curso</span></div><div class="pr" id="q4"><span class="nw">#105 Pizarra</span><span class="chip nw">NUEVO</span></div></div></div>
        <div class="fl sm" id="p3" style="top: 616px"><span class="fgrey">PISO 3</span></div>
        <div class="fl sm" id="p2" style="top: 722px"><span class="fgrey">PISO 2</span></div>
        <div class="fl big o" id="p1" style="top: 828px"><span class="fnum" id="n1">1</span><span class="nb" id="nb1">+1</span><span class="fname"><span class="ico" data-ic="laser" data-col="#ea5a14" data-sw="4.5"></span>LÁSER</span>
          <div class="pnl o" id="pn1"><div class="ph"><span>PANEL · PISO 1</span></div><div class="pr"><span>#101 Llaveros</span><span class="chip">En curso</span></div><div class="pr" id="q1"><span class="nw">#104 Grabado</span><span class="chip o nw">NUEVO</span></div></div></div>
        <div id="rec"><div class="rl"><span class="ico" data-ic="doc"></span>RECEPCIÓN</div></div>
        <div id="gnd"></div>
        <span class="tk o" id="ka" data-layout-allow-overlap><i>LÁSER</i>#104 Grabado</span>
        <span class="tk" id="kb" data-layout-allow-overlap><i>TALLER</i>#105 Pizarra</span>
        <div id="leg"><div class="pill o" id="la"><span class="pi" data-ic="laser" data-col="#ea5a14" data-sw="5"></span>Láser → Piso 1</div><div class="pill" id="lb"><span class="pi" data-ic="hammer" data-sw="5"></span>Taller → Piso 4</div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-a" src="assets/sfx/whoosh.wav" data-start="2.5" data-volume="0.34"></audio>
      <audio id="s-a2" src="assets/sfx/ding.wav" data-start="3.45" data-volume="0.3"></audio>
      <audio id="s-b" src="assets/sfx/whoosh.wav" data-start="6.0" data-volume="0.34"></audio>
      <audio id="s-b2" src="assets/sfx/ding.wav" data-start="7.05" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="9.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 9.6;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1361, { x0: 60, x1: 1020, y0: 1320, y1: 1560 });
      GEX.ambient(tl, parts, 0.8, EXIT + 0.3);
      gsap.set(["#r1", "#r4", ".tk", "#la", "#lb", ".nb"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#gnd", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.25);
      ["#p1", "#p2", "#p3", "#p4"].forEach((id, i) => tl.fromTo(id, { y: 160, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(1.8)" }, 0.3 + i * 0.1));
      tl.fromTo(".pnl", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.15 }, 0.8);
      tl.fromTo("#rec", { x: -200, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2)" }, 0.6);
      // "y aquí viene lo interesante": recepción se enciende
      tl.to("#rec", { keyframes: [{ borderColor: "#1fc4b8", scale: 1.05, duration: 0.2 }, { scale: 1, duration: 0.3 }, { borderColor: "#ffffff", duration: 0.4 }], ease: "sine.inOut" }, 1.1);
      tl.to("#rec .ico", { rotation: 12, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.2);
      // envía un pedido y aterriza en su panel
      const send = (k, route, legs, row, nb, num, panel, leg, col, t0, t1) => {
        tl.fromTo(k, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, t0);
        tl.fromTo(route, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, immediateRender: false }, t1 - 0.15);
        tl.fromTo(route, { strokeDashoffset: 0 }, { strokeDashoffset: -224, duration: EXIT - t1, ease: "none" }, t1 - 0.15);
        tl.to(k, { keyframes: legs, ease: "power2.inOut" }, t1);
        const land = t1 + legs.reduce((a, l) => a + l.duration, 0);
        tl.to(k, { scale: 0.4, autoAlpha: 0, duration: 0.18, ease: "power2.in" }, land);
        tl.fromTo(row + " .nw", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, land + 0.05);
        tl.to(row, { keyframes: [{ backgroundColor: col, duration: 0.12 }, { backgroundColor: "#ffffff", duration: 0.6 }], ease: "none" }, land + 0.05);
        GEX.punch(tl, panel, land + 0.05, 1.05);
        GEX.punch(tl, num, land + 0.05, 1.25);
        tl.fromTo(nb, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, land + 0.15);
        tl.to(row + " .chip.nw", { scale: 1.12, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, land + 0.6);
        tl.fromTo(leg, { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, land + 0.25);
        return land;
      };
      send("#ka", "#r1", [{ x: 547, scale: 0.92, duration: 0.95 }], "#q1", "#nb1", "#n1", "#pn1", "#la", "#fff1ea", 2.0, 2.5);
      send("#kb", "#r4", [{ x: 210, scale: 0.88, duration: 0.3 }, { y: -508, duration: 0.5 }, { x: 547, scale: 0.92, duration: 0.25 }], "#q4", "#nb4", "#n4", "#pn4", "#lb", "#eef9f8", 5.8, 6.0);
      GEX.float(tl, "#la", 4.4, EXIT, 6, 1.2);
      GEX.float(tl, "#lb", 7.8, EXIT, 6, 1.1);
      // salida + barrido
      GEX.scatter(tl, ["#p4", "#p3", "#p2", "#p1", "#rec", "#la", "#lb", "#tag"], EXIT, 33);
      tl.to(["#sv", "#gnd"], { autoAlpha: 0, duration: 0.2 }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
