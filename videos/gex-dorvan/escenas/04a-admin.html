<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dorvan 04a — Administración supervisa todo desde un solo lugar</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #w { position: absolute; left: 60px; top: 300px; width: 960px; }
      #tiles { display: flex; gap: 16px; padding: 22px 22px 8px; }
      .tl { flex: 1; height: 180px; border-radius: 24px; background: var(--soft); padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; }
      .tl .lbl { font-size: 24px; line-height: 1.15; white-space: normal; }
      .tl b { font-weight: 800; font-size: 54px; white-space: nowrap; }
      #t1 b { color: #0b958b; } #t2 b { color: #12703a; } #t3 b { color: #c04a0f; }
      .lh { display: flex; justify-content: space-between; align-items: center; padding: 18px 26px 6px; }
      .lh .lbl { font-size: 26px; }
      .rw { display: flex; align-items: center; gap: 14px; height: 86px; padding: 0 26px; border-top: 4px solid var(--line); font-weight: 800; font-size: 34px; white-space: nowrap; }
      .rw .nm { flex: 1; }
      .rw .chip { font-size: 26px; padding: 7px 16px; }
      .src { position: absolute; font-size: 30px; padding: 10px 22px; z-index: 6; }
      #endw { position: absolute; left: 0; right: 0; top: 1150px; display: flex; justify-content: center; }
      #ep { font-size: 44px; padding: 14px 34px 14px 14px; }
      #ep .pi { width: 70px; height: 70px; }
      #ep .pi svg { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.6" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="8.6" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">ADMINISTRACIÓN</span></div>
        <div class="win" id="w"><div class="bar"><i></i><i></i><i></i><b>Panel general</b></div>
          <div id="tiles">
            <div class="tl" id="t1"><span class="lbl">INGRESOS</span><b class="num" id="v1">$0</b></div>
            <div class="tl" id="t2"><span class="lbl">ADELANTOS</span><b class="num" id="v2">$0</b></div>
            <div class="tl" id="t3"><span class="lbl">SALDOS PENDIENTES</span><b class="num" id="v3">$0</b></div>
          </div>
          <div class="lh"><span class="lbl">TODOS LOS PEDIDOS</span><span class="lbl">4</span></div>
          <div class="rw"><span class="nm">#104 Grabado</span><span class="chip o">Piso 1</span><span class="chip g">Listo</span></div>
          <div class="rw"><span class="nm">#105 Pizarra</span><span class="chip">Piso 4</span><span class="chip">En proceso</span></div>
          <div class="rw"><span class="nm">#106 Letrero</span><span class="chip">Piso 4</span><span class="chip a">Pendiente</span></div>
          <div class="rw"><span class="nm">#107 Corte MDF</span><span class="chip o">Piso 1</span><span class="chip a">Pendiente</span></div>
        </div>
        <span class="chip a src" id="sr" style="left: 70px; top: 1120px">Recepción</span>
        <span class="chip o src" id="s1" style="left: 430px; top: 1120px">Piso 1</span>
        <span class="chip src" id="s4" style="left: 800px; top: 1120px">Piso 4</span>
        <div id="endw"><div class="pill" id="ep"><span class="pi" data-ic="layers" data-sw="4.5"></span>Todo en un solo lugar<i class="shine" id="sh" data-layout-allow-overflow></i></div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-l" src="assets/sfx/tick.wav" data-start="1.4" data-volume="0.26"></audio>
      <audio id="s-i" src="assets/sfx/ding.wav" data-start="3.4" data-volume="0.28"></audio>
      <audio id="s-s" src="assets/sfx/pop.wav" data-start="4.7" data-volume="0.28"></audio>
      <audio id="s-m" src="assets/sfx/shimmer.wav" data-start="6.25" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.2;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1381, { x0: 60, x1: 1020, y0: 1260, y1: 1540 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set([".src", "#ep", ".tl b"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#w", { y: 500, rotation: 4, autoAlpha: 0 }, { y: 0, rotation: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo(".tl", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.08 }, 0.6);
      // todos los pedidos, de ambos pisos
      tl.fromTo(".rw", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.32, ease: "power3.out", stagger: 0.12 }, 1.4);
      tl.fromTo(".rw .chip", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.06 }, 1.55);
      // ingresos, adelantos, saldos
      [["#t1", "v1", 4850, 3.4], ["#t2", "v2", 1920, 4.0], ["#t3", "v3", 2930, 4.7]].forEach(([id, v, n, t]) => {
        tl.to(id, { keyframes: [{ backgroundColor: "#d6f3f0", scale: 1.05, duration: 0.15 }, { backgroundColor: "#eef4f3", scale: 1, duration: 0.45 }], ease: "none" }, t);
        tl.fromTo(id + " b", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, immediateRender: false }, t);
        GEX.count(tl, document.getElementById(v), 0, n, t, 0.7, "$");
      });
      tl.to("#t3", { keyframes: [{ backgroundColor: "#ffe1d1", duration: 0.2 }, { backgroundColor: "#eef4f3", duration: 0.4 }], ease: "none", repeat: 1 }, 5.5);
      // todo llega a un solo lugar
      [["#sr", -200], ["#s1", 0], ["#s4", 200]].forEach(([id, dx], i) => {
        tl.fromTo(id, { x: dx, y: 120, scale: 0.5, autoAlpha: 0 }, { x: 0, y: 0, scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, 5.8 + i * 0.08);
        tl.to(id, { x: 480 - parseInt(document.querySelector(id).style.left), y: -420, scale: 0.3, autoAlpha: 0, duration: 0.4, ease: "power3.in" }, 6.25 + i * 0.06);
      });
      GEX.punch(tl, "#w", 6.7, 1.03);
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 6.8);
      tl.fromTo("#sh", { x: -140 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 7.3);
      tl.set("#sh", { x: -140 }, 7.95);
      GEX.float(tl, "#w", 1.0, 6.6, 5, 1.8);
      // salida + barrido
      GEX.scatter(tl, ["#w", "#ep", "#tag"], EXIT, 41);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
