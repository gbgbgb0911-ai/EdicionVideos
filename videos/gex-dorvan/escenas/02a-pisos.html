<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dorvan 02a — Láser en el piso 1, taller en el 4</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      .fl { left: 200px; width: 680px; }
      .fl.big { height: 260px; }
      .fl.sm { height: 100px; }
      .fl .fnum { left: 26px; top: 26px; width: 110px; height: 110px; font-size: 66px; }
      .fl .fname { left: 26px; top: 168px; font-size: 40px; }
      .fl .fname .ico { width: 58px; height: 58px; }
      .fl .fgrey { left: 26px; top: 28px; font-size: 32px; }
      .fl .av { position: absolute; left: 310px; top: 128px; width: 100px; height: 100px; font-size: 42px; }
      .bub { top: 30px; left: 400px; }
      #gnd { position: absolute; left: 140px; width: 800px; top: 1096px; height: 8px; border-radius: 4px; background: #dfe7e6; }
      #sv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
      #ppr { position: absolute; left: 96px; top: 1000px; width: 64px; height: 80px; border-radius: 10px; background: #ffffff; z-index: 5; }
      #ppr i { position: absolute; left: 12px; right: 12px; height: 7px; border-radius: 4px; background: #0b958b; }
      #clk { position: absolute; left: 60px; top: 650px; font-size: 30px; z-index: 6; }
      #distw { position: absolute; left: 0; right: 0; top: 1150px; display: flex; justify-content: center; }
      #dist { font-size: 40px; padding: 12px 28px 12px 12px; }
      #dist .pi { width: 64px; height: 64px; }
      #dist .pi svg { width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8.0" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="8.0" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">EL PROBLEMA</span></div>
        <svg id="sv" viewBox="0 0 1080 1920"><path id="st" class="route" d="" /><path id="dm" d="M940 440 V 1060 M924 462 L940 440 L956 462 M924 1038 L940 1060 L956 1038" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <div class="fl big" id="p4" style="top: 300px"><span class="fnum" id="n4">4</span><span class="fname" id="fn4"><span class="ico" data-ic="hammer" data-sw="4.5"></span>TALLER</span><span class="av" id="a4">L</span><span class="bub" id="b4" data-layout-allow-overlap>¿Ya está listo?</span></div>
        <div class="fl sm" id="p3" style="top: 580px"><span class="fgrey">PISO 3</span></div>
        <div class="fl sm" id="p2" style="top: 700px"><span class="fgrey">PISO 2</span></div>
        <div class="fl big" id="p1" style="top: 820px"><span class="fnum" id="n1">1</span><span class="fname" id="fn1"><span class="ico" data-ic="laser" data-col="#ea5a14" data-sw="4.5"></span>LÁSER</span><span class="av o" id="a1">C</span><span class="bub" id="b1" data-layout-allow-overlap>¿Cuál pedido?</span></div>
        <div id="gnd"></div>
        <div id="ppr"><i style="top: 16px"></i><i style="top: 32px"></i><i style="top: 48px; right: 26px"></i></div>
        <span class="chip o" id="clk">⏱</span>
        <div id="distw"><div class="pill" id="dist"><span class="pi" data-ic="stairs" data-sw="5"></span>3 pisos de distancia</div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="1.25" data-volume="0.3"></audio>
      <audio id="s-4" src="assets/sfx/pop.wav" data-start="2.95" data-volume="0.3"></audio>
      <audio id="s-p" src="assets/sfx/whoosh.wav" data-start="4.85" data-volume="0.3"></audio>
      <audio id="s-b" src="assets/sfx/tick.wav" data-start="5.9" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="7.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      // escalera en zigzag a la izquierda del edificio
      let d = "M80 1090", y = 1090;
      for (let i = 0; i < 10; i++) { y -= 78; d += " V " + y + " H " + (i % 2 ? 80 : 170); }
      document.getElementById("st").setAttribute("d", d);
      const tl = gsap.timeline({ paused: true });
      const EXIT = 7.6;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      const parts = GEX.particles(document.getElementById("fx"), 10, 1321, { x0: 60, x1: 1020, y0: 1250, y1: 1560 });
      GEX.ambient(tl, parts, 0.6, EXIT + 0.3);
      gsap.set(["#fn1", "#fn4", "#a1", "#a4", "#b1", "#b4", "#ppr", "#clk", "#dist", "#dm"], { autoAlpha: 0 });
      gsap.set(["#n1", "#n4"], { backgroundColor: "#6f807f" });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#gnd", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.25);
      ["#p1", "#p2", "#p3", "#p4"].forEach((id, i) => tl.fromTo(id, { y: 160, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(1.8)" }, 0.3 + i * 0.1));
      tl.fromTo("#st", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 0.7);
      tl.fromTo("#st", { strokeDashoffset: 0 }, { strokeDashoffset: -280, duration: EXIT - 0.7, ease: "none" }, 0.7);
      // piso 1: láser
      const area = (n, col, t) => {
        tl.to("#p" + n, { borderColor: col, duration: 0.2 }, t);
        tl.to("#n" + n, { backgroundColor: col === "#fe6820" ? "#ea5a14" : "#0b958b", duration: 0.2 }, t);
        GEX.punch(tl, "#n" + n, t, 1.2);
        tl.fromTo("#fn" + n, { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t + 0.1);
        tl.fromTo("#a" + n, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, t + 0.2);
        GEX.float(tl, "#a" + n, t + 0.6, EXIT, 7, 1.2);
      };
      area(1, "#fe6820", 1.2);
      tl.to("#fn1 .ico", { rotation: 12, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 7 }, 1.6);
      area(4, "#1fc4b8", 2.9);
      tl.to("#fn4 .ico", { keyframes: [{ rotation: -30, duration: 0.15 }, { rotation: 0, duration: 0.2 }], repeat: 4, ease: "power2.in" }, 3.3);
      // distancia entre áreas
      tl.fromTo("#dm", { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 50%" }, { autoAlpha: 1, scaleY: 1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, 4.2);
      tl.fromTo("#dist", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 4.3);
      // el pedido sube a pie... y se queda a medio camino
      tl.fromTo("#ppr", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 4.8);
      tl.to("#ppr", { keyframes: [{ y: -78, x: 0, duration: 0.18 }, { y: -156, duration: 0.18 }, { y: -234, duration: 0.2 }, { y: -312, duration: 0.24 }], ease: "power1.inOut" }, 4.95);
      tl.to("#ppr", { rotation: 10, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 5 }, 5.8);
      tl.fromTo("#clk", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 5.85);
      tl.to("#clk", { rotation: 15, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 6.2);
      tl.fromTo("#b4", { scale: 0, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, 5.9);
      tl.fromTo("#b1", { scale: 0, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, 6.3);
      tl.to(["#b4", "#b1"], { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.15 }, 6.7);
      // salida + barrido
      GEX.scatter(tl, ["#p4", "#p3", "#p2", "#p1", "#ppr", "#clk", "#dist", "#tag"], EXIT, 21);
      tl.to(["#sv", "#gnd"], { autoAlpha: 0, duration: 0.2 }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
