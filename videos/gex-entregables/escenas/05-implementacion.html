<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Entregables 05 — Implementación y capacitación</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root { --bg: #000000; --ink: #ffffff; --teal-hi: #1fc4b8; --orange: #fe6820; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 38px; }
      .head { display: flex; align-items: center; gap: 28px; }
      .badge { display: flex; align-items: center; justify-content: center; width: 140px; height: 140px; border-radius: 50%; border: 8px solid var(--orange); color: var(--orange); font-weight: 800; font-size: 68px; flex: none; }
      .ttl { display: flex; flex-direction: column; font-weight: 800; font-size: 80px; line-height: 0.98; white-space: nowrap; }
      .ttl .t { color: var(--teal-hi); }
      .row { display: flex; align-items: center; gap: 22px; }
      .opt { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 380px; padding: 30px 16px 28px; border: 5px solid var(--teal-hi); border-radius: 30px; }
      .opt svg { width: 120px; height: 120px; }
      .opt .h { font-weight: 800; font-size: 50px; white-space: nowrap; }
      .opt .d { font-weight: 500; font-size: 34px; color: var(--teal-hi); white-space: nowrap; }
      .or { font-weight: 800; font-size: 64px; color: var(--orange); }
      .ln { fill: none; stroke: var(--teal-hi); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .lo { fill: none; stroke: var(--orange); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .team { display: flex; align-items: center; gap: 22px; font-weight: 700; font-size: 50px; white-space: nowrap; }
      .team svg { width: 160px; height: 70px; }
      .p { fill: none; stroke: #ffffff; stroke-width: 6; stroke-linecap: round; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.5" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="stack" id="content">
          <div class="head">
            <div class="badge" id="badge">03</div>
            <div class="ttl" id="ttl"><span>IMPLEMENTACIÓN</span><span class="t">Y CAPACITACIÓN</span></div>
          </div>
          <div class="row">
            <div class="opt" id="o1">
              <svg viewBox="0 0 64 64"><path class="ln" d="M8 28h48 M10 28l4-12h36l4 12 M12 28v26h40V28 M26 54V40h12v14" /><path class="lo" d="M48 4a8 8 0 0 0-8 8c0 6 8 13 8 13s8-7 8-13a8 8 0 0 0-8-8Z" /></svg>
              <div class="h">En tu local</div>
              <div class="d">Voy y lo dejo listo</div>
            </div>
            <div class="or" id="or">o</div>
            <div class="opt" id="o2">
              <svg viewBox="0 0 64 64"><path class="ln" d="M6 18h36v28H6Z M42 27l16-9v28l-16-9" /><path class="lo" d="M16 32l6 6 12-12" /></svg>
              <div class="h">A distancia</div>
              <div class="d">Guías + Meet</div>
            </div>
          </div>
          <div class="team" id="team">
            <svg viewBox="0 0 160 70">
              <g id="pp1"><circle class="p" cx="30" cy="22" r="12" /><path class="p" d="M10 66c2-14 10-20 20-20s18 6 20 20" /></g>
              <g id="pp2"><circle class="p" cx="80" cy="18" r="13" /><path class="p" d="M58 66c2-16 11-23 22-23s20 7 22 23" /></g>
              <g id="pp3"><circle class="p" cx="130" cy="22" r="12" /><path class="p" d="M110 66c2-14 10-20 20-20s18 6 20 20" /></g>
            </svg>
            Para ti y tu equipo
          </div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#badge", { scale: 0.3, rotation: -90, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.12);
      tl.fromTo("#ttl", { x: 80, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "expo.out" }, 0.25);
      tl.fromTo("#o1", { x: -160, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.75);
      tl.fromTo("#or", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)" }, 1.0);
      tl.fromTo("#o2", { x: 160, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 1.1);
      tl.fromTo("#team", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 1.9);
      tl.fromTo(["#pp1", "#pp2", "#pp3"], { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2.4)", stagger: 0.1 }, 2.0);
      tl.to(["#o1", "#o2"], { keyframes: [{ scale: 1.04, duration: 0.12 }, { scale: 1, duration: 0.25 }], ease: "sine.inOut", stagger: 0.12 }, 2.6);
      tl.to("#content", { y: -40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 4.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
