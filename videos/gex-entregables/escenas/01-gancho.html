<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Entregables 01 — Gancho</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root { --bg: #000000; --ink: #ffffff; --teal-hi: #1fc4b8; --orange: #fe6820; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 24px; }
      #box { width: 300px; height: 280px; overflow: visible; }
      .ln { fill: none; stroke: var(--teal-hi); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .win { fill: none; stroke: var(--orange); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .l1 { font-weight: 800; font-size: 96px; line-height: 1; white-space: nowrap; }
      .l2 { font-weight: 800; font-size: 118px; line-height: 1; white-space: nowrap; color: var(--orange); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.5" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="stack" id="content">
          <svg id="box" viewBox="0 0 300 280">
            <!-- system window rising out of the box -->
            <g id="win">
              <rect class="win" x="80" y="70" width="140" height="100" rx="14" />
              <path class="win" d="M80 98h140 M102 124h70 M102 146h50" />
            </g>
            <path class="ln" d="M40 140h220v120H40Z M150 140v120" />
            <g id="lid"><path class="ln" d="M30 140l20-40h200l20 40" /></g>
          </svg>
          <div class="l1" id="l1">¿QUÉ TE ENTREGO</div>
          <div class="l2" id="l2">EXACTAMENTE?</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#box", { y: 60, scale: 0.6, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)" }, 0.12);
      tl.fromTo("#l1", { y: 50, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.fromTo("#l2", { scale: 1.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "expo.out" }, 0.55);
      // Lid pops open, the system window rises out
      tl.fromTo("#lid", { rotation: 0, svgOrigin: "30 140" }, { rotation: -32, svgOrigin: "30 140", duration: 0.35, ease: "back.out(2.5)" }, 0.95);
      tl.fromTo("#win", { y: 80, autoAlpha: 0 }, { y: -60, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 1.05);
      tl.to("#win", { keyframes: [{ y: -50, duration: 0.5 }, { y: -60, duration: 0.5 }], ease: "sine.inOut" }, 1.6);
      tl.to("#l2", { keyframes: [{ scale: 1.08, duration: 0.12 }, { scale: 1, duration: 0.28 }], ease: "sine.inOut" }, 1.3);
      tl.to("#content", { y: -40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 3.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
