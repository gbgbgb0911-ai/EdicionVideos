<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Entregables 07 — No es un programa, es una solución</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root { --bg: #000000; --ink: #ffffff; --teal-hi: #1fc4b8; --orange: #fe6820; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 44px; }
      .no { position: relative; font-weight: 700; font-size: 78px; white-space: nowrap; }
      .no .strike { position: absolute; left: -16px; right: -16px; top: 52%; height: 12px; margin-top: -6px; border-radius: 6px; background: var(--orange); }
      .yes { display: flex; flex-direction: column; align-items: center; font-weight: 800; line-height: 1; white-space: nowrap; }
      .yes .s { font-size: 80px; }
      .yes .big { font-size: 168px; color: var(--teal-hi); }
      #bulb { width: 150px; height: 150px; overflow: visible; }
      .lb { fill: none; stroke: var(--orange); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.5" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="stack" id="content">
          <div class="no" id="no">NO ES SOLO UN PROGRAMA<span class="strike" id="strike"></span></div>
          <svg id="bulb" viewBox="0 0 100 100">
            <path class="lb" d="M36 70c0-10-12-16-12-32a26 26 0 0 1 52 0c0 16-12 22-12 32Z M38 80h24 M42 90h16" />
            <g id="rays"><path class="lb" d="M50 0v-8 M10 14l-6-6 M90 14l6-6 M0 40h-8 M100 40h8" /></g>
          </svg>
          <div class="yes" id="yes"><span class="s" id="ys">ES UNA</span><span class="big" id="yb">SOLUCIÓN</span></div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#no", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.12);
      tl.fromTo("#strike", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, transformOrigin: "left center", duration: 0.3, ease: "power4.out" }, 0.75);
      tl.to("#no", { autoAlpha: 0.45, duration: 0.3, ease: "power1.out" }, 0.95);
      tl.fromTo("#bulb", { scale: 0.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)" }, 1.05);
      tl.fromTo("#rays", { scale: 0.5, autoAlpha: 0, svgOrigin: "50 40" }, { scale: 1, autoAlpha: 1, svgOrigin: "50 40", duration: 0.35, ease: "expo.out" }, 1.3);
      tl.fromTo("#ys", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 1.2);
      tl.fromTo("#yb", { scale: 1.35, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.5, ease: "expo.out" }, 1.35);
      tl.to("#yb", { keyframes: [{ scale: 1.05, duration: 0.12 }, { scale: 1, duration: 0.3 }], ease: "sine.inOut" }, 2.2);
      tl.to("#content", { y: -40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 3.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
