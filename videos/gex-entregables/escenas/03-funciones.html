<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Entregables 03 — Funciones y control</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root { --bg: #000000; --ink: #ffffff; --teal-hi: #1fc4b8; --orange: #fe6820; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 40px; }
      .head { display: flex; align-items: center; gap: 30px; }
      .badge { display: flex; align-items: center; justify-content: center; width: 150px; height: 150px; border-radius: 50%; border: 8px solid var(--orange); color: var(--orange); font-weight: 800; font-size: 72px; flex: none; }
      .ttl { display: flex; flex-direction: column; font-weight: 800; font-size: 92px; line-height: 0.98; white-space: nowrap; }
      .ttl .t { color: var(--teal-hi); }
      .grid { display: grid; grid-template-columns: 400px 400px; gap: 24px; }
      .mod { display: flex; align-items: center; gap: 20px; padding: 24px 24px; border: 5px solid var(--teal-hi); border-radius: 28px; font-weight: 700; font-size: 46px; }
      .mod svg { width: 66px; height: 66px; flex: none; }
      .mod .name { flex: 1; }
      .ln { fill: none; stroke: var(--teal-hi); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .sw { position: relative; width: 74px; height: 42px; border-radius: 21px; border: 4px solid rgba(255, 255, 255, 0.55); flex: none; }
      .sw .fill { position: absolute; inset: -4px; border-radius: 21px; background: var(--orange); }
      .sw .knob { position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #ffffff; }
      .note { font-weight: 500; font-size: 44px; color: var(--teal-hi); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="stack" id="content">
          <div class="head">
            <div class="badge" id="badge">02</div>
            <div class="ttl" id="ttl"><span>FUNCIONES</span><span class="t">Y CONTROL</span></div>
          </div>
          <div class="grid">
            <div class="mod" id="m1">
              <svg viewBox="0 0 64 64"><path class="ln" d="M8 20 32 8l24 12v24L32 56 8 44Z M8 20l24 12 24-12 M32 32v24" /></svg>
              <span class="name">Pedidos</span>
              <div class="sw"><div class="fill"></div><div class="knob"></div></div>
            </div>
            <div class="mod" id="m2">
              <svg viewBox="0 0 64 64"><path class="ln" d="M8 54h48 M14 54V34 M28 54V22 M42 54V28 M56 54V12" /></svg>
              <span class="name">Ventas</span>
              <div class="sw"><div class="fill"></div><div class="knob"></div></div>
            </div>
            <div class="mod" id="m3">
              <svg viewBox="0 0 64 64"><path class="ln" d="M8 30h20v24H8Z M36 30h20v24H36Z M22 8h20v22H22Z" /></svg>
              <span class="name">Inventario</span>
              <div class="sw"><div class="fill"></div><div class="knob"></div></div>
            </div>
            <div class="mod" id="m4">
              <svg viewBox="0 0 64 64"><path class="ln" d="M32 30a11 11 0 1 0 0-22 11 11 0 0 0 0 22Z M12 56c2-12 10-18 20-18s18 6 20 18" /></svg>
              <span class="name">Clientes</span>
              <div class="sw"><div class="fill"></div><div class="knob"></div></div>
            </div>
          </div>
          <div class="note" id="note">Activas solo lo que necesitas</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#badge", { scale: 0.3, rotation: -90, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.12);
      tl.fromTo("#ttl", { x: 80, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "expo.out" }, 0.25);
      ["#m1", "#m2", "#m3", "#m4"].forEach((id, i) => {
        tl.fromTo(id, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.38, ease: "back.out(1.8)" }, 0.6 + i * 0.12);
      });
      // Switches flip on one by one
      document.querySelectorAll(".mod").forEach((m, i) => {
        const t = 1.4 + i * 0.22;
        tl.fromTo(m.querySelector(".knob"), { x: 0 }, { x: 32, duration: 0.22, ease: "power3.out" }, t);
        tl.fromTo(m.querySelector(".fill"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15, ease: "none" }, t);
        tl.to(m, { keyframes: [{ scale: 1.04, duration: 0.1 }, { scale: 1, duration: 0.2 }], ease: "sine.inOut" }, t + 0.05);
      });
      tl.fromTo("#note", { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "circ.out" }, 2.4);
      tl.to("#content", { y: -40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 3.75);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
