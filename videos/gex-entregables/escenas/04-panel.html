<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Entregables 04 — Panel administrativo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root { --bg: #000000; --ink: #ffffff; --teal-hi: #1fc4b8; --orange: #fe6820; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 32px; }
      .title { display: flex; flex-direction: column; align-items: center; font-weight: 800; font-size: 72px; line-height: 1; white-space: nowrap; }
      .title .t { color: var(--teal-hi); font-size: 88px; }
      .dash { width: 860px; border: 6px solid var(--teal-hi); border-radius: 34px; overflow: hidden; }
      .bar { display: flex; align-items: center; justify-content: space-between; height: 76px; padding: 0 30px; border-bottom: 4px solid var(--teal-hi); }
      .dots { display: flex; gap: 12px; }
      .dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--teal-hi); }
      .bar img { height: 40px; }
      .body { display: flex; gap: 26px; padding: 30px; }
      .kpis { display: flex; flex-direction: column; gap: 22px; width: 300px; }
      .kpi { padding: 18px 24px; border: 4px solid rgba(255, 255, 255, 0.5); border-radius: 22px; }
      .kpi .lbl { font-weight: 500; font-size: 32px; color: var(--teal-hi); }
      .kpi .val { font-weight: 800; font-size: 76px; line-height: 1; font-variant-numeric: tabular-nums; }
      .kpi .val .up { color: var(--orange); font-size: 44px; }
      .chart { flex: 1; display: flex; align-items: flex-end; gap: 16px; height: 300px; padding: 0 6px; border-bottom: 4px solid rgba(255, 255, 255, 0.5); }
      .chart i { flex: 1; border-radius: 10px 10px 0 0; background: var(--teal-hi); }
      .chart i.hot { background: var(--orange); }
      .nope { display: flex; gap: 22px; align-items: center; font-weight: 700; font-size: 46px; white-space: nowrap; }
      .chip { position: relative; padding: 10px 28px; border: 4px solid rgba(255, 255, 255, 0.55); border-radius: 999px; color: rgba(255, 255, 255, 0.75); }
      .strike { position: absolute; left: -8px; right: -8px; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px; background: var(--orange); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.5" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="stack" id="content">
          <div class="title" id="title"><span>TU PANEL</span><span class="t">ADMINISTRATIVO</span></div>
          <div class="dash" id="dash">
            <div class="bar"><div class="dots"><i></i><i></i><i></i></div><img src="assets/logo-v2/gex-full.png" alt="GEX" /></div>
            <div class="body">
              <div class="kpis">
                <div class="kpi" id="kp1"><div class="lbl">Ventas del mes</div><div class="val"><span id="v1">0</span> <span class="up">▲</span></div></div>
                <div class="kpi" id="kp2"><div class="lbl">Pedidos hoy</div><div class="val" id="v2">0</div></div>
              </div>
              <div class="chart" id="chart"><i style="height: 38%"></i><i style="height: 52%"></i><i style="height: 45%"></i><i style="height: 66%"></i><i style="height: 58%"></i><i style="height: 80%"></i><i class="hot" style="height: 96%"></i></div>
            </div>
          </div>
          <div class="nope" id="nope">
            <span>Sin buscar en</span>
            <span class="chip" id="c1">papeles<span class="strike" id="s1"></span></span>
            <span class="chip" id="c2">Excel<span class="strike" id="s2"></span></span>
          </div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { y: -40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.12);
      tl.fromTo("#dash", { y: 80, scale: 0.92, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.55, ease: "expo.out" }, 0.3);
      tl.fromTo(".kpi", { x: -50, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "power2.out", stagger: 0.12 }, 0.65);
      tl.fromTo("#chart i", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, transformOrigin: "50% 100%", duration: 0.5, ease: "power3.out", stagger: 0.07 }, 0.75);
      const n = { a: 0, b: 0 };
      const v1 = document.getElementById("v1"), v2 = document.getElementById("v2");
      tl.fromTo(n, { a: 0, b: 0 }, { a: 1284, b: 37, duration: 1.2, ease: "power2.out", onUpdate: () => { v1.textContent = String(Math.round(n.a)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); v2.textContent = Math.round(n.b); } }, 0.8);
      tl.fromTo("#nope", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "circ.out" }, 2.0);
      tl.fromTo(["#s1", "#s2"], { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, transformOrigin: "left center", duration: 0.25, ease: "power4.out", stagger: 0.18 }, 2.45);
      tl.to(["#c1", "#c2"], { autoAlpha: 0.55, duration: 0.25, ease: "power1.out", stagger: 0.18 }, 2.6);
      tl.to("#content", { y: -40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 4.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
