<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Entregables 09 — Conversemos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root { --bg: #000000; --ink: #ffffff; --teal-hi: #1fc4b8; --orange: #fe6820; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 34px; }
      .q { font-weight: 700; font-size: 58px; white-space: nowrap; }
      .row { display: flex; align-items: center; gap: 26px; }
      #bubble { width: 130px; height: 113px; overflow: visible; flex: none; }
      .b-shape { fill: none; stroke: var(--teal-hi); stroke-width: 9; stroke-linejoin: round; }
      .b-dot { fill: var(--orange); }
      .big { font-weight: 800; font-size: 100px; line-height: 1; white-space: nowrap; }
      .logo { position: relative; width: 640px; height: 199px; }
      .logo img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .shine { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: url("assets/logo-v2/gex-full.png"); mask-image: url("assets/logo-v2/gex-full.png"); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
      .shine-band { position: absolute; top: -30px; left: 0; width: 200px; height: 260px; background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.85) 50%, rgba(255, 255, 255, 0) 100%); }
      .tag { font-weight: 500; font-size: 44px; letter-spacing: 0.12em; color: var(--teal-hi); white-space: nowrap; }
      .tag b { font-weight: 800; color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="stack" id="content">
          <div class="q" id="q">¿Tu negocio necesita algo así?</div>
          <div class="row">
            <svg id="bubble" viewBox="0 0 230 200">
              <path class="b-shape" d="M40 10h150a30 30 0 0 1 30 30v80a30 30 0 0 1-30 30H95l-45 40v-40H40a30 30 0 0 1-30-30V40a30 30 0 0 1 30-30Z" />
              <circle class="b-dot" id="d1" cx="70" cy="80" r="15" />
              <circle class="b-dot" id="d2" cx="115" cy="80" r="15" />
              <circle class="b-dot" id="d3" cx="160" cy="80" r="15" />
            </svg>
            <div class="big" id="big">CONVERSEMOS</div>
          </div>
          <div class="logo" id="logo">
            <img src="assets/logo-v2/gex-full.png" alt="GEX" />
            <div class="shine" data-layout-allow-overflow="true"><div class="shine-band" id="band"></div></div>
          </div>
          <div class="tag" id="tag">SOLUCIONES <b>A TU MEDIDA</b></div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#q", { y: -30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.12);
      tl.fromTo("#bubble", { scale: 0.3, rotation: -15, autoAlpha: 0, transformOrigin: "20% 100%" }, { scale: 1, rotation: 0, autoAlpha: 1, transformOrigin: "20% 100%", duration: 0.45, ease: "back.out(2.2)" }, 0.45);
      tl.fromTo("#big", { x: 60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "expo.out" }, 0.55);
      ["#d1", "#d2", "#d3"].forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { y: -18, duration: 0.18, ease: "sine.out", yoyo: true, repeat: 5 }, 0.85 + i * 0.1);
      });
      tl.fromTo("#logo", { y: 50, scale: 0.85, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(1.6)" }, 1.1);
      tl.fromTo("#band", { x: -260 }, { x: 760, duration: 0.7, ease: "power2.inOut" }, 1.6);
      tl.fromTo("#tag", { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power2.out" }, 1.75);
      tl.to("#content", { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 3.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
