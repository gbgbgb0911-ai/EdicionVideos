<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GEX Entregables 06 — Si nadie sabe usarlo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      :root { --bg: #000000; --ink: #ffffff; --teal-hi: #1fc4b8; --orange: #fe6820; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Outfit", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 80px 520px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .mask { overflow: hidden; padding: 14px 40px 30px; }
      .a { font-weight: 700; font-size: 70px; white-space: nowrap; }
      .b { font-weight: 800; font-size: 104px; line-height: 1.05; white-space: nowrap; color: var(--teal-hi); }
      .c { font-weight: 800; font-size: 94px; line-height: 1.05; white-space: nowrap; color: var(--orange); }
      .rule { width: 180px; height: 12px; border-radius: 6px; background: var(--ink); margin: 10px 0; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="stack" id="content">
          <div class="mask" data-layout-allow-overflow="true"><div class="a" id="a">DE NADA SIRVE</div></div>
          <div class="mask" data-layout-allow-overflow="true"><div class="b" id="b">UN BUEN SISTEMA</div></div>
          <div class="rule" id="rule"></div>
          <div class="mask" data-layout-allow-overflow="true"><div class="c" id="c">SI NADIE SABE</div></div>
          <div class="mask" data-layout-allow-overflow="true"><div class="c" id="d">USARLO</div></div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a", { yPercent: 150 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, 0.12);
      tl.fromTo("#b", { yPercent: 150 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, 0.3);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.inOut" }, 0.7);
      tl.fromTo("#c", { yPercent: -150 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, 0.95);
      tl.fromTo("#d", { yPercent: -150 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, 1.1);
      tl.to("#d", { keyframes: [{ x: -12 }, { x: 12 }, { x: -6 }, { x: 0 }], duration: 0.3, ease: "none" }, 1.6);
      tl.to("#content", { y: -40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 2.75);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
