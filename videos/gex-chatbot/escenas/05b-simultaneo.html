<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Chatbot 05b — Varias conversaciones a la vez</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 280px; display: flex; justify-content: center; }
      #bot { position: absolute; left: 430px; top: 660px; width: 200px; height: 200px; border-radius: 50%; background: #0b958b; border: 10px solid #ffffff; display: flex; align-items: center; justify-content: center; z-index: 3 !important; }
      #bot svg { width: 120px; height: 120px; }
      #sv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
      .cv { position: absolute; width: 290px; height: 104px; border-radius: 26px; background: #ffffff; display: flex; align-items: center; gap: 12px; padding: 0 14px; z-index: 2 !important; }
      .cv .av { width: 68px; height: 68px; font-size: 28px; }
      .cv .st { font-weight: 800; font-size: 25px; color: #0b958b; white-space: nowrap; }
      .cv .ok { display: none; }
      #endw { position: absolute; left: 0; right: 0; top: 1200px; display: flex; justify-content: center; padding-right: 40px; }
      #ep { font-size: 42px; padding: 14px 32px 14px 14px; }
      #ep .pi { width: 68px; height: 68px; }
      #ep .pi svg { width: 42px; height: 42px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="5.4" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag t" id="tag">VARIAS A LA VEZ</span></div>
        <svg id="sv" viewBox="0 0 1080 1920"></svg>
        <div id="cvs"></div>
        <div id="bot" data-ic="bot" data-col="#ffffff" data-sw="4"></div>
        <div id="endw"><div class="pill g" id="ep"><span class="pi" data-ic="check" data-col="#179a4a" data-sw="6"></span>Sin hacer esperar</div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-c" src="assets/sfx/pop.wav" data-start="0.9" data-volume="0.28"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="2.7" data-volume="0.3"></audio>
      <audio id="s-e" src="assets/sfx/ding.wav" data-start="3.6" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="4.98" data-volume="0.4"></audio>
    </div>
    <script>
      const P = [[120, 400, "o", "A"], [620, 400, "", "B"], [90, 720, "g", "C"], [650, 720, "a", "D"], [140, 1040, "", "E"], [610, 1040, "o", "F"]];
      const cvs = document.getElementById("cvs"), sv = document.getElementById("sv");
      P.forEach(([x, y, c, l], i) => {
        cvs.innerHTML += '<div class="cv" id="v' + i + '" style="left: ' + x + "px; top: " + y + 'px"><span class="av ' + c + '">' + l + '</span><span class="st" id="t' + i + '">Escribiendo…</span></div>';
        sv.innerHTML += '<path id="r' + i + '" class="route" d="M' + (x + 145) + " " + (y + 52) + ' L 530 760" />';
      });
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 5.0;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set([".cv", "#sv path", "#ep"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#bot", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.4);
      // muchos clientes escriben a la vez
      tl.fromTo(".cv", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)", stagger: 0.08, immediateRender: false }, 0.9);
      tl.fromTo("#sv path", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, stagger: 0.04, immediateRender: false }, 1.6);
      tl.fromTo("#sv path", { strokeDashoffset: 0 }, { strokeDashoffset: -140, duration: EXIT - 1.6, ease: "none" }, 1.6);
      tl.to("#bot svg", { rotation: 360, duration: 1.0, ease: "power2.inOut" }, 1.7);
      // y todos reciben respuesta al mismo tiempo
      P.forEach((p, i) => {
        const el = document.getElementById("t" + i), q = { v: 0 };
        tl.fromTo(q, { v: 0 }, { v: 1, duration: 0.02, immediateRender: false, onUpdate: () => { el.textContent = q.v > 0.5 ? "Respondido ✓" : "Escribiendo…"; el.style.color = q.v > 0.5 ? "#12703a" : "#0b958b"; } }, 2.7);
      });
      tl.to(".cv", { keyframes: [{ scale: 1.08, duration: 0.12 }, { scale: 1, duration: 0.25 }], ease: "sine.out" }, 2.7);
      tl.to(".cv", { backgroundColor: "#e4f6ea", duration: 0.2 }, 2.7);
      tl.fromTo("#ep", { y: 60, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 3.6);
      tl.to(".cv", { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.05 }, 3.4);
      // salida + barrido
      GEX.scatter(tl, ["#v0", "#v1", "#v2", "#v3", "#v4", "#v5", "#bot", "#ep", "#tag"], EXIT, 128);
      tl.to("#sv", { autoAlpha: 0, duration: 0.2 }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
