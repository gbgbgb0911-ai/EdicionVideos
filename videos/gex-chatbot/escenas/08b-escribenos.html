<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Chatbot 08b — Implementa un chatbot: escríbenos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #ph { left: 120px; top: 70px; width: 380px; height: 760px; }
      .m { font-size: 26px; }
      #right { position: absolute; left: 560px; top: 200px; display: flex; flex-direction: column; align-items: flex-start; gap: 26px; }
      #right b { font-weight: 800; font-size: 54px; line-height: 1.05; white-space: nowrap; }
      #right b .hl { color: #1fc4b8; }
      #cta { font-size: 56px; padding: 16px 40px 16px 16px; }
      #cta .pi { width: 80px; height: 80px; }
      #cta .pi svg { width: 50px; height: 50px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.2" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="4.2" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div class="phone" id="ph"><div class="ph"><span class="ico" data-ic="bot" data-col="#179a4a" data-sw="4.5"></span>Tu chatbot</div>
            <div class="pb"><div class="m" id="m1">Hola, ¿tienen stock?</div><div class="m b" id="m2"><small>ASISTENTE IA</small>¡Hola! Sí, te cuento…</div></div></div>
          <div id="right"><b><span id="tx">Chatbot en<br />tu <span class="hl">WhatsApp</span></span></b><div class="pill o" id="cta"><span class="pi" data-ic="chat" data-col="#ea5a14" data-sw="4.5"></span>Escríbenos<i class="shine" id="sh" data-layout-allow-overflow></i></div></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-m" src="assets/sfx/pop.wav" data-start="0.7" data-volume="0.28"></audio>
      <audio id="s-clk" src="assets/sfx/click.wav" data-start="2.5" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.78" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.8;
      const tx = GEX.split(document.getElementById("tx"));
      gsap.set(["#m1", "#m2", "#cta"], { autoAlpha: 0 });
      const cur = GEX.cursor(document.getElementById("scene"));
      gsap.set(cur.c, { x: 1120, y: 700 });
      tl.fromTo("#ph", { x: -400, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.05);
      tl.fromTo("#m1", { scale: 0.4, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 100%", duration: 0.32, ease: "back.out(2.4)", immediateRender: false }, 0.5);
      tl.fromTo("#m2", { scale: 0.4, autoAlpha: 0, transformOrigin: "100% 100%" }, { scale: 1, autoAlpha: 1, transformOrigin: "100% 100%", duration: 0.32, ease: "back.out(2.4)", immediateRender: false }, 0.9);
      GEX.reveal(tl, tx.words, 0.4, "rise", { stagger: 0.1, duration: 0.4 });
      tl.fromTo("#cta", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 1.6);
      GEX.tap(tl, cur, 760, 470, 2.05, 0.45);
      tl.to("#cta", { keyframes: [{ scale: 0.92, duration: 0.08 }, { scale: 1.08, duration: 0.16 }, { scale: 1, duration: 0.25 }], ease: "sine.out" }, 2.5);
      tl.fromTo("#sh", { x: -140 }, { x: 600, duration: 0.6, ease: "power2.inOut" }, 2.7);
      tl.set("#sh", { x: -140 }, 3.35);
      tl.to(cur.c, { x: 1120, y: 800, duration: 0.4, ease: "power2.in" }, 2.9);
      GEX.scatter(tl, ["#ph", "#cta"], EXIT, 132);
      tl.to(tx.words, { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.03 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
