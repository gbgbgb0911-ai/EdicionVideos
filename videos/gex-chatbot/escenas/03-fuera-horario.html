<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Chatbot 03 — ¿Quién responde fuera del horario?</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #top { position: absolute; left: 0; right: 0; top: 280px; display: flex; justify-content: center; align-items: center; gap: 18px; }
      #top .av { width: 90px; height: 90px; }
      #top .av svg { width: 52px; height: 52px; }
      #fin { font-size: 36px; padding: 10px 24px; }
      #ph { left: 220px; top: 410px; width: 600px; height: 820px; }
      .m { font-size: 30px; max-width: 92%; }
      .m small { font-size: 22px; letter-spacing: 0.06em; }
      .m .tk { display: block; margin-top: 4px; font-size: 22px; color: #6f807f; text-align: right; }
      #pend { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 32px; padding: 10px 24px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7.4" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="top"><span class="av o" id="wkr" data-ic="headset" data-col="#ffffff" data-sw="4.5"></span><span class="chip o" id="fin">17:00 · Fin de jornada</span></div>
        <div class="phone" id="ph"><div class="ph"><span class="ico" data-ic="wa" data-col="#179a4a" data-sw="4.5"></span>Tu WhatsApp</div>
          <div class="pb">
            <div class="m" id="m1"><small>NOCHE · 22:47 · SIN RESPUESTA</small>¿Tienen stock?</div>
            <div class="m" id="m2"><small>DOMINGO · 10:15 · SIN RESPUESTA</small>¿Hacen envíos?</div>
            <div class="m" id="m3"><small>FERIADO · 16:30 · SIN RESPUESTA</small>¿Cuál es el precio?</div>
            <span class="chip o" id="pend">3 clientes sin respuesta</span>
          </div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-out1" src="assets/sfx/whoosh-out.wav" data-start="1.6" data-volume="0.3"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="3.0" data-volume="0.28"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="5.0" data-volume="0.28"></audio>
      <audio id="s-p" src="assets/sfx/ding.wav" data-start="6.6" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.98" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 7.0;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set([".m", "#pend"], { autoAlpha: 0 });
      // termina la jornada
      tl.fromTo("#top > *", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.1 }, 0.3);
      tl.fromTo("#ph", { y: 500, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.5);
      tl.to("#wkr", { x: -500, rotation: -20, duration: 0.5, ease: "power3.in" }, 1.6);
      tl.set("#wkr", { autoAlpha: 0 }, 2.1);
      tl.to("#fin", { x: -54, duration: 0.3, ease: "power2.out" }, 2.0);
      tl.to("#fin", { scale: 1.06, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.4);
      // los clientes siguen escribiendo
      [["#m1", 3.0], ["#m2", 5.0], ["#m3", 5.8]].forEach(([id, t]) => {
        tl.fromTo(id, { x: -80, scale: 0.6, autoAlpha: 0, transformOrigin: "0% 100%" }, { x: 0, scale: 1, autoAlpha: 1, duration: 0.38, ease: "back.out(2.4)", immediateRender: false }, t);
        tl.to(id, { x: 8, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, t + 0.4);
      });
      tl.fromTo("#pend", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 6.6);
      tl.to("#ph", { x: 6, duration: 0.06, yoyo: true, repeat: 5, ease: "none" }, 6.6);
      // salida + barrido
      GEX.scatter(tl, ["#ph", "#fin"], EXIT, 124);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
