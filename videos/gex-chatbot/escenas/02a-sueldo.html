<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Chatbot 02a — Sueldo mínimo S/1,230</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #bg { position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #lb { font-weight: 800; font-size: 40px; letter-spacing: 0.16em; color: #1fc4b8; white-space: nowrap; }
      #row { display: flex; align-items: center; gap: 26px; }
      #cn { width: 170px; height: 170px; border-radius: 50%; background: #ea5a14; border: 8px solid #ffffff; display: flex; align-items: center; justify-content: center; }
      #cn svg { width: 110px; height: 110px; }
      #am { font-weight: 800; font-size: 170px; line-height: 1; white-space: nowrap; }
      #pm { font-size: 46px; padding: 12px 30px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.8" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="3.8" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="bg"><div id="lb">PERÚ · SUELDO MÍNIMO</div><div id="row"><span id="cn" data-ic="coin" data-col="#ffffff" data-sw="4"></span><span id="am" class="num">S/ 0</span></div><span class="chip o" id="pm">mensuales</span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-n" src="assets/sfx/impact.wav" data-start="2.2" data-volume="0.34"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.38" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.4;
      const parts = GEX.particles(document.getElementById("fx"), 6, 2001, { x0: 20, x1: 170, y0: 60, y1: 920 }).concat(GEX.particles(document.getElementById("fx"), 6, 2002, { x0: 910, x1: 1060, y0: 60, y1: 920 }));
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      gsap.set("#pm", { autoAlpha: 0 });
      tl.fromTo("#lb", { y: -40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#cn", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.3);
      tl.to("#cn", { rotationY: 360, duration: 1.2, ease: "power1.inOut" }, 0.9);
      tl.fromTo("#am", { x: 60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 0.5);
      GEX.count(tl, document.getElementById("am"), 0, 1230, 1.1, 1.1, "S/ ");
      GEX.punch(tl, "#am", 2.2, 1.1);
      tl.fromTo("#pm", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 2.4);
      GEX.scatter(tl, ["#lb", "#cn", "#am", "#pm"], EXIT, 122);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
