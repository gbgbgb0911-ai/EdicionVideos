<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Chatbot 04a — Entra el chatbot con IA</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #bg { position: absolute; left: 0; right: 0; top: 130px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
      #ic { position: relative; width: 270px; height: 270px; border-radius: 50%; background: #0b958b; display: flex; align-items: center; justify-content: center; border: 10px solid #ffffff; }
      #ic svg { width: 170px; height: 170px; }
      #ia { position: absolute; right: -30px; top: -10px; font-size: 40px; padding: 10px 22px; }
      .sp { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fe6820; }
      #tt { font-weight: 800; font-size: 88px; line-height: 1.05; text-align: center; white-space: nowrap; }
      #tt .hl { color: #1fc4b8; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.2" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="3.2" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="bg"><div id="ic"><span data-ic="bot" data-col="#ffffff" data-sw="4"></span><span class="chip o" id="ia">IA</span><i class="sp" style="left: -40px; top: 40px"></i><i class="sp" style="left: -10px; bottom: -20px; background: #1fc4b8"></i><i class="sp" style="right: -40px; bottom: 30px"></i></div><div id="tt"><span id="tx">Chatbot con <span class="hl">IA</span></span></div></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-sh" src="assets/sfx/shimmer.wav" data-start="0.5" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="2.78" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 2.8;
      const parts = GEX.particles(document.getElementById("fx"), 6, 2011, { x0: 20, x1: 170, y0: 60, y1: 920 }).concat(GEX.particles(document.getElementById("fx"), 6, 2012, { x0: 910, x1: 1060, y0: 60, y1: 920 }));
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      const tx = GEX.split(document.getElementById("tx"));
      gsap.set(["#ia", ".sp"], { autoAlpha: 0 });
      tl.fromTo("#ic", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.2)" }, 0.05);
      tl.fromTo("#ia", { scale: 0, rotation: -30, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 0.5);
      tl.fromTo(".sp", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.08, immediateRender: false }, 0.6);
      tl.to(".sp", { y: -14, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5, stagger: 0.08 }, 1.0);
      tl.to("#ic svg", { rotation: 8, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.0);
      GEX.reveal(tl, tx.words, 0.4, "rise", { stagger: 0.12, duration: 0.42 });
      GEX.scatter(tl, ["#ic"], EXIT, 125);
      tl.to(tx.words, { y: -160, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.03 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
