<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Digitalizar 01 — Gancho: sistema vs personas</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { top: 300px; left: 60px; right: 140px; gap: 22px; }
      #tg { font-size: 30px; }
      #cmp { position: relative; display: flex; align-items: center; gap: 26px; height: 330px; }
      .cd { width: 300px; height: 300px; border-radius: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      .cd .ico { width: 140px; height: 140px; background: #ffffff; }
      .cd b { font-weight: 800; font-size: 40px; white-space: nowrap; }
      #cs { background: #0b958b; }
      #cp { background: #ea5a14; }
      .cd .bd { position: absolute; top: -16px; right: -16px; width: 72px; height: 72px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 46px; color: #ea5a14; }
      .cd .bd svg { width: 44px; height: 44px; }
      .cd { position: relative; }
      #vs { font-weight: 800; font-size: 54px; color: #ffffff; }
      #ne { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 50px; white-space: nowrap; }
      #ne .o { color: #fe6820; }
      #ne .t { color: #1fc4b8; }
      #aud { position: absolute; left: 60px; right: 140px; top: 330px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
      #rl { display: flex; gap: 22px; }
      #rl .chip { font-size: 44px; padding: 12px 28px 12px 12px; gap: 14px; }
      #rl .chip .ico { width: 70px; height: 70px; background: #ffffff; }
      #at { font-size: 62px; padding: 18px 44px 18px 18px; }
      #at .pi { width: 88px; height: 88px; }
      #at .pi svg { width: 54px; height: 54px; }
      #rg { position: absolute; left: 50%; top: 50%; width: 600px; height: 124px; margin: -62px 0 0 -300px; border-radius: 999px; border: 8px solid #1fc4b8; }
      #atw { position: relative; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="11.6" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="11.6" data-track-index="0">
        <div class="top" id="top">
          <span class="tag" id="tg">EL MAYOR PROBLEMA AL DIGITALIZAR</span>
          <div id="cmp">
            <div class="cd" id="cs"><span class="ico" data-ic="grid" data-col="#0b958b" data-sw="4.5"></span><b>El sistema</b><span class="bd" id="bs" data-ic="check" data-col="#179a4a" data-sw="6"></span></div>
            <span id="vs">vs</span>
            <div class="cd" id="cp"><span class="ico" data-ic="users" data-col="#ea5a14" data-sw="4.5"></span><b>Las personas</b><span class="bd" id="bp">?</span></div>
          </div>
          <div id="ne"><span class="t" id="n1">Contratarlo</span><span id="n2">≠</span><span class="o" id="n3">Que lo usen</span></div>
        </div>
        <div id="aud">
          <div id="rl"><span class="chip o" id="r1"><span class="ico" data-ic="user" data-col="#ea5a14" data-sw="4.5"></span>Dueño</span><span class="chip" id="r2"><span class="ico" data-ic="building" data-col="#0b958b" data-sw="4.5"></span>Administrador</span></div>
          <div id="atw"><span id="rg"></span><div class="pill o" id="at"><span class="pi" data-ic="bell" data-col="#ea5a14" data-sw="4.5"></span>Presta atención<i class="shine" id="sh" data-layout-allow-overflow></i></div></div>
        </div>
        <span class="sl" id="sl1" style="left: 110px; top: 560px"></span><span class="sl" id="sl2" style="left: 930px; top: 640px"></span>
        <span class="sp" id="sp1" style="left: 120px; top: 900px"></span><span class="sp" id="sp2" style="left: 900px; top: 380px"></span><span class="sp" id="sp3" style="left: 860px; top: 940px"></span>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.15" data-volume="0.4"></audio>
      <audio id="s-p" src="assets/sfx/ding.wav" data-start="4.6" data-volume="0.28"></audio>
      <audio id="s-r" src="assets/sfx/pop.wav" data-start="7.6" data-volume="0.26"></audio>
      <audio id="s-at" src="assets/sfx/impact.wav" data-start="9.9" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="11.18" data-volume="0.36"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 11.2;
      gsap.set(["#cp", "#vs", "#ne > *", "#bs", "#bp", "#r1", "#r2", "#at", "#rg", ".sp"], { autoAlpha: 0 });
      const TG = GEX.split(document.getElementById("tg"));
      // el mayor problema al digitalizar
      tl.fromTo("#tg", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)" }, 0.15);
      GEX.reveal(tl, TG.words, 0.2, "rise", { stagger: 0.08, duration: 0.32 });
      // ...no sea el sistema que contrates
      tl.fromTo("#cs", { x: -260, rotation: -10, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)" }, 2.4);
      tl.fromTo("#cs .ico", { rotation: -120 }, { rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 2.45);
      tl.fromTo("#bs", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 3.2);
      // sino las personas
      tl.fromTo("#vs", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 4.3);
      tl.fromTo("#cp", { x: 260, rotation: 10, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, 4.5);
      tl.fromTo("#bp", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 5.0);
      tl.to("#cp", { scale: 1.1, duration: 0.3, ease: "back.out(2)" }, 5.4);
      tl.to("#cs", { scale: 0.92, duration: 0.3, ease: "power2.out" }, 5.4);
      tl.to("#bp", { rotation: 14, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 5.6);
      tl.fromTo("#ne > *", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.32, ease: "back.out(2.4)", stagger: 0.18, immediateRender: false }, 5.6);
      GEX.punch(tl, "#n3", 6.3, 1.12);
      tl.to(["#cs", "#cp"], { y: -10, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.15 }, 6.2);
      // cambio: dueño o administrador
      GEX.scatter(tl, ["#tg", "#cs", "#vs", "#cp", "#ne"], 7.1, 201);
      tl.fromTo("#r1", { x: -240, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 7.6);
      tl.fromTo("#r2", { x: 240, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 8.3);
      tl.fromTo("#rl .chip .ico", { rotation: -120 }, { rotation: 0, duration: 0.45, ease: "back.out(2.4)", stagger: 0.7 }, 7.65);
      tl.to("#rl .chip", { y: -8, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.18 }, 8.8);
      // presta atención
      tl.fromTo("#at", { y: 60, scale: 0.4, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 9.8);
      tl.to("#at .pi svg", { rotation: 16, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 7, transformOrigin: "50% 10%" }, 10.1);
      tl.fromTo("#sh", { x: -140 }, { x: 760, duration: 0.6, ease: "power2.inOut" }, 10.2);
      [10.1, 10.5].forEach((t) => tl.fromTo("#rg", { scale: 1, borderWidth: 8, autoAlpha: 1 }, { scale: 1.25, borderWidth: 0, autoAlpha: 1, duration: 0.4, ease: "circ.out", immediateRender: false }, t));
      tl.set("#rg", { autoAlpha: 0 }, 10.92);
      // ambiente
      tl.fromTo(".sl", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.1 }, 0.4);
      tl.to(".sl", { y: 26, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 8, stagger: 0.3 }, 0.7);
      tl.fromTo(".sp", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.12, immediateRender: false }, 2.6);
      tl.to(".sp", { y: -36, x: 16, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.2 }, 2.9);
      GEX.scatter(tl, ["#r1", "#r2", "#at", ".sl", ".sp"], EXIT, 203);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
