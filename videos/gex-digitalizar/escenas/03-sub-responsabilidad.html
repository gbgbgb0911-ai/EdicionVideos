<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Digitalizar 03 — Subtítulos responsabilidad</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .ck .pp { font-size: 50px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.0" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7.0" data-track-index="0">
        <div id="cap"></div>
      </section>
      <audio id="s-in" src="assets/sfx/pop.wav" data-start="0.02" data-volume="0.2"></audio>
      <audio id="s-hl" src="assets/sfx/tick.wav" data-start="0.7" data-volume="0.2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      GEX.captions(tl, document.getElementById("cap"), [["Y aquí viene", 0, 0.7], ["algo importante:", 0.7, 1.6, [1]], ["no toda", 1.6, 2.1, [1]], ["la responsabilidad", 2.1, 2.8, [1]], ["es de tus trabajadores.", 2.8, 4.0], ["Como dueño", 4.4, 5.0, [1]], ["o administrador,", 5.0, 5.7], ["también tienes", 5.7, 6.2], ["que involucrarte.", 6.2, 6.9, [1]]]);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
