<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Digitalizar 05 — Los problemas recaen sobre el desarrollador</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .wk { top: 90px; width: 110px; }
      .wk .hd { width: 100px; height: 100px; }
      .wk > .bd { margin-left: -26px; top: -58px; }
      #k1 { left: 110px; } #k2 { left: 250px; }
      #sys { position: absolute; left: 100px; top: 290px; width: 280px; height: 210px; border-radius: 28px; background: #ffffff; color: #0b958b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 30px; }
      #sys .ico { width: 100px; height: 100px; background: #eef4f3; }
      .al { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: #ea5a14; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 36px; border: 5px solid #ffffff; }
      #a1 { left: 340px; top: 270px; } #a2 { left: 80px; top: 460px; }
      #ad { left: 450px; top: 150px; width: 150px; }
      #ad .hd { width: 130px; height: 130px; }
      #pt { position: absolute; left: 600px; top: 210px; width: 80px; height: 10px; border-radius: 5px; background: #fe6820; }
      #pt:after { content: ""; position: absolute; right: -14px; top: -11px; border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 22px solid #fe6820; }
      #dev { position: absolute; left: 720px; top: 110px; width: 260px; height: 330px; border-radius: 30px; background: #0b958b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      #dev .ico { width: 120px; height: 120px; background: #ffffff; }
      #dev b { font-weight: 800; font-size: 25px; letter-spacing: 0.02em; }
      .tk { position: absolute; left: 520px; top: 380px; width: 60px; height: 60px; border-radius: 50%; background: #ea5a14; border: 5px solid #ffffff; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 34px; z-index: 5 !important; }
      #row { position: absolute; left: 0; right: 0; top: 640px; display: flex; justify-content: center; align-items: center; gap: 18px; }
      #row .chip { font-size: 32px; padding: 12px 26px 12px 12px; gap: 12px; }
      #row .chip .ico { width: 56px; height: 56px; background: #ffffff; }
      #or { width: 70px; height: 70px; border-radius: 50%; background: #ffffff; color: #0b958b; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 50px; padding-bottom: 8px; }
      #qn { position: absolute; left: 0; right: 0; top: 570px; text-align: center; font-weight: 800; font-size: 34px; color: #1fc4b8; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="6.6" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="6.6" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div class="per wk" id="k1"><span class="hd" data-ic="user" data-col="#ffffff" data-sw="4"></span><span class="bd">?</span></div>
          <div class="per wk" id="k2"><span class="hd" data-ic="user" data-col="#ffffff" data-sw="4" style="background: #179a4a"></span><span class="bd">?</span></div>
          <div id="sys"><span class="ico" data-ic="grid" data-sw="4.5"></span>Sistema</div>
          <span class="al" id="a1">!</span><span class="al" id="a2">!</span>
          <div class="per o" id="ad"><span class="hd" data-ic="user" data-col="#ffffff" data-sw="4"></span><b>DUEÑO</b></div>
          <span id="pt"></span>
          <div id="dev"><span class="ico" data-ic="code" data-sw="4.5"></span><b>DESARROLLADOR</b></div>
          <span class="tk" id="t1">!</span><span class="tk" id="t2">!</span><span class="tk" id="t3">!</span>
          <div id="qn">¿Uso incorrecto o falla del sistema?</div>
          <div id="row"><span class="chip a" id="c1"><span class="ico" data-ic="users" data-col="#b86e00" data-sw="4.5"></span>Problema de adopción</span><span id="or">o</span><span class="chip" id="c2"><span class="ico" data-ic="tool" data-col="#0b958b" data-sw="4.5"></span>Error técnico</span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.4"></audio>
      <audio id="s-al" src="assets/sfx/pop.wav" data-start="1.9" data-volume="0.24"></audio>
      <audio id="s-hit" src="assets/sfx/impact.wav" data-start="4.45" data-volume="0.28"></audio>
      <audio id="s-q" src="assets/sfx/tick.wav" data-start="5.0" data-volume="0.24"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="6.18" data-volume="0.36"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.2;
      gsap.set([".wk .bd", ".al", ".tk", "#pt", "#qn", "#row > *", "#ad"], { autoAlpha: 0 });
      tl.fromTo(".wk", { y: -120, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.1 }, 0.1);
      tl.fromTo("#sys", { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#dev", { x: 300, rotation: 8, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.5);
      tl.fromTo("#dev .ico", { rotation: -120 }, { rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 0.55);
      // el personal no usa correctamente el sistema
      tl.fromTo(".wk .bd", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.28, ease: "back.out(3)", stagger: 0.12, immediateRender: false }, 1.4);
      tl.fromTo(".al", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.15, immediateRender: false }, 1.9);
      tl.to(".al", { scale: 1.15, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.1 }, 2.3);
      tl.to("#sys", { x: 6, duration: 0.06, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.0);
      tl.to(".wk .bd", { rotation: 14, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.1 }, 2.4);
      // la administración apunta al desarrollador
      tl.fromTo("#ad", { y: -160, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(2)", immediateRender: false }, 3.2);
      tl.fromTo("#pt", { scaleX: 0, transformOrigin: "0% 50%", autoAlpha: 1 }, { scaleX: 1, autoAlpha: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.6);
      tl.fromTo(".tk", { x: (i) => -420 + i * 30, y: (i) => -20 + i * 30, scale: 0.4, autoAlpha: 1 }, { x: 250, y: (i) => -80 + i * 40, scale: 1, autoAlpha: 1, duration: 0.5, ease: "power2.in", stagger: 0.12, immediateRender: false }, 3.85);
      tl.to(".tk", { scale: 0, duration: 0.15, ease: "power2.in", stagger: 0.12 }, 4.35);
      tl.set(".tk", { autoAlpha: 0 }, 4.8);
      tl.to("#dev", { keyframes: [{ x: -12, duration: 0.06 }, { x: 12, duration: 0.06 }, { x: -8, duration: 0.06 }, { x: 8, duration: 0.06 }, { x: 0, duration: 0.06 }] }, 4.45);
      // pero no todo es del personal: distinguir
      tl.fromTo("#qn", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 4.9);
      tl.fromTo("#row > *", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)", stagger: 0.15, immediateRender: false }, 5.05);
      tl.to("#or", { scale: 1.12, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.6);
      tl.to(".wk .hd, #ad .hd", { y: -6, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.1 }, 3.0);
      GEX.scatter(tl, ["#k1", "#k2", "#sys", ".al", "#ad", "#pt", "#dev", "#qn", "#row"], EXIT, 227);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
