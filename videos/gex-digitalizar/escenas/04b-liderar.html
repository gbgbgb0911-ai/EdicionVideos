<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Digitalizar 04b — Liderar el cambio: 4 responsabilidades</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 270px; display: flex; justify-content: center; padding-right: 80px; }
      #ad { left: 420px; top: 390px; width: 160px; }
      #ad .hd { width: 140px; height: 140px; }
      .wk { top: 430px; width: 120px; }
      .wk .hd { width: 100px; height: 100px; }
      .wk > .bd { margin-left: -26px; top: -60px; }
      #k1 { left: 150px; } #k2 { left: 280px; } #k3 { left: 610px; } #k4 { left: 740px; }
      #ln { position: absolute; left: 200px; top: 478px; width: 600px; height: 8px; border-radius: 4px; background: #1fc4b8; z-index: 0 !important; }
      #steps { position: absolute; left: 120px; top: 650px; width: 760px; display: flex; flex-direction: column; gap: 16px; }
      .it { font-size: 38px; }
      .it .ico svg { width: 62%; height: 62%; }
      #cmpw { position: absolute; left: 0; right: 0; top: 1140px; display: flex; justify-content: center; align-items: center; gap: 20px; padding-right: 80px; }
      #cmpw .chip { font-size: 40px; padding: 12px 30px; }
      #im { position: relative; }
      #im i { position: absolute; left: 16px; right: 16px; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: #ffffff; transform-origin: 0% 50%; }
      #arw { width: 70px; height: 10px; border-radius: 5px; background: #ffffff; position: relative; }
      #arw:after { content: ""; position: absolute; right: -14px; top: -11px; border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 22px solid #ffffff; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.8" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7.8" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">LIDERAR EL CAMBIO</span></div>
        <span id="ln"></span>
        <div class="per o" id="ad"><span class="hd" data-ic="user" data-col="#ffffff" data-sw="4"></span><b>DUEÑO</b></div>
        <div class="per wk" id="k1"><span class="hd" data-ic="user" data-col="#ffffff" data-sw="4"></span><span class="bd q">?</span><span class="bd ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
        <div class="per wk" id="k2"><span class="hd" data-ic="user" data-col="#ffffff" data-sw="4" style="background: #179a4a"></span><span class="bd q">?</span><span class="bd ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
        <div class="per wk" id="k3"><span class="hd" data-ic="user" data-col="#ffffff" data-sw="4" style="background: #6f807f"></span><span class="bd q">?</span><span class="bd ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
        <div class="per wk" id="k4"><span class="hd" data-ic="user" data-col="#ffffff" data-sw="4"></span><span class="bd q">?</span><span class="bd ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
        <div id="steps">
          <div class="it" id="i1"><span class="n">1</span><span class="ico" data-ic="bulb" data-col="#ea5a14" data-sw="4.5"></span>Explicar por qué<span class="ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
          <div class="it" id="i2"><span class="n">2</span><span class="ico" data-ic="book" data-sw="4.5"></span>Capacitar al personal<span class="ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
          <div class="it" id="i3"><span class="n">3</span><span class="ico" data-ic="chat" data-col="#179a4a" data-sw="4.5"></span>Escuchar dificultades<span class="ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
          <div class="it" id="i4"><span class="n">4</span><span class="ico" data-ic="users" data-col="#ea5a14" data-sw="4.5"></span>Acompañar la adaptación<span class="ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></div>
        </div>
        <div id="cmpw"><span class="chip gr" id="im">Imponer<i></i></span><span id="arw"></span><span class="chip g" id="li">Liderar</span></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.42"></audio>
      <audio id="s-1" src="assets/sfx/tick.wav" data-start="0.9" data-volume="0.24"></audio>
      <audio id="s-3" src="assets/sfx/tick.wav" data-start="3.0" data-volume="0.24"></audio>
      <audio id="s-4" src="assets/sfx/success.wav" data-start="4.6" data-volume="0.26"></audio>
      <audio id="s-li" src="assets/sfx/ding.wav" data-start="6.5" data-volume="0.26"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="7.38" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 7.4;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set([".it", ".it .ok", ".wk .bd", "#cmpw > *"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#ad", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)" }, 0.15);
      tl.fromTo(".wk", { y: 80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2.2)", stagger: 0.08 }, 0.35);
      tl.fromTo("#ln", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.45);
      tl.fromTo(".wk .bd.q", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.28, ease: "back.out(3)", stagger: 0.06, immediateRender: false }, 0.7);
      tl.to(".wk .hd, #ad .hd", { y: -8, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 13, stagger: 0.1 }, 1.0);
      const step = (id, t) => {
        tl.fromTo(id, { x: -120, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t);
        tl.fromTo(id + " .ico", { rotation: -120 }, { rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, t + 0.05);
        tl.fromTo(id + " .ok", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.28, ease: "back.out(3)", immediateRender: false }, t + 0.4);
      };
      const ok = (ids, t) => ids.forEach((k, i) => {
        tl.set(k + " .bd.q", { autoAlpha: 0 }, t + i * 0.08);
        tl.fromTo(k + " .bd.ok", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.28, ease: "back.out(3)", immediateRender: false }, t + i * 0.08);
      });
      // explicar por qué · capacitar · escuchar · acompañar
      step("#i1", 0.9); GEX.punch(tl, "#ad .hd", 1.0, 1.1);
      step("#i2", 2.0); ok(["#k1", "#k2"], 2.5);
      step("#i3", 3.0); tl.to("#ad", { x: -14, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.2);
      step("#i4", 4.3); ok(["#k3", "#k4"], 4.6);
      tl.to("#ln", { scaleY: 1.6, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.7);
      tl.to(".it", { x: 8, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.08 }, 5.2);
      // imponer -> liderar
      tl.fromTo("#im", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.32, ease: "back.out(2.4)", immediateRender: false }, 6.0);
      tl.fromTo("#im i", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 6.3);
      tl.fromTo("#arw", { scaleX: 0, transformOrigin: "0% 50%", autoAlpha: 1 }, { scaleX: 1, autoAlpha: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 6.35);
      tl.fromTo("#li", { scale: 0.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.38, ease: "back.out(3)", immediateRender: false }, 6.5);
      tl.to("#li", { scale: 1.08, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.9);
      GEX.scatter(tl, ["#tag", "#ad", "#k1", "#k2", "#k3", "#k4", "#ln", "#steps", "#cmpw"], EXIT, 223);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
