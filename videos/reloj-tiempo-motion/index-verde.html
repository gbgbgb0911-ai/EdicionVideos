<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Reloj tiempo — overlay 2s</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #f5f3ee;
        --ink-dim: rgba(245, 243, 238, 0.55);
        --accent: #ffb547;
        --accent-glow: rgba(255, 181, 71, 0.55);
        --shadow: rgba(0, 0, 0, 0.45);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #00FF00;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #00FF00;
      }
      #clock-scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 80px 420px;
      }
      #clock-wrap {
        width: 640px;
        height: 640px;
        
      }
      #clock {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .face-ring {
        fill: none;
        stroke: var(--ink);
        stroke-width: 14;
      }
      .tick {
        stroke: var(--ink);
        stroke-linecap: round;
      }
      .tick-major {
        stroke-width: 12;
      }
      .tick-minor {
        stroke-width: 6;
        stroke: var(--ink-dim);
      }
      .progress {
        fill: none;
        stroke: var(--accent);
        stroke-width: 18;
        stroke-linecap: round;
      }
      .hand {
        stroke: var(--ink);
        stroke-linecap: round;
      }
      #hand-hour .hand {
        stroke-width: 22;
      }
      #hand-minute .hand {
        stroke-width: 14;
      }
      .hub {
        fill: var(--accent);
      }
      .flash {
        fill: none;
        stroke: var(--accent);
        stroke-width: 6;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="2"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <section id="clock-scene" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <div id="clock-wrap">
          <svg id="clock" viewBox="-320 -320 640 640">
            <!-- impact ring (behind) -->
            <circle id="flash" class="flash" r="280" />
            <!-- face -->
            <g id="face">
              <circle class="face-ring" r="280" />
              <g id="ticks">
                <line class="tick tick-major" x1="0" y1="-250" x2="0" y2="-212" transform="rotate(0)" />
                <line class="tick tick-minor" x1="0" y1="-250" x2="0" y2="-228" transform="rotate(30)" />
                <line class="tick tick-minor" x1="0" y1="-250" x2="0" y2="-228" transform="rotate(60)" />
                <line class="tick tick-major" x1="0" y1="-250" x2="0" y2="-212" transform="rotate(90)" />
                <line class="tick tick-minor" x1="0" y1="-250" x2="0" y2="-228" transform="rotate(120)" />
                <line class="tick tick-minor" x1="0" y1="-250" x2="0" y2="-228" transform="rotate(150)" />
                <line class="tick tick-major" x1="0" y1="-250" x2="0" y2="-212" transform="rotate(180)" />
                <line class="tick tick-minor" x1="0" y1="-250" x2="0" y2="-228" transform="rotate(210)" />
                <line class="tick tick-minor" x1="0" y1="-250" x2="0" y2="-228" transform="rotate(240)" />
                <line class="tick tick-major" x1="0" y1="-250" x2="0" y2="-212" transform="rotate(270)" />
                <line class="tick tick-minor" x1="0" y1="-250" x2="0" y2="-228" transform="rotate(300)" />
                <line class="tick tick-minor" x1="0" y1="-250" x2="0" y2="-228" transform="rotate(330)" />
              </g>
              <!-- progress arc: starts at 12 o'clock, runs clockwise -->
              <circle id="progress" class="progress" r="192" transform="rotate(-90)" />
              <!-- hands -->
              <g id="hand-hour"><circle r="110" fill="none" /><line class="hand" x1="0" y1="18" x2="0" y2="-110" /></g>
              <g id="hand-minute"><circle r="170" fill="none" /><line class="hand" x1="0" y1="26" x2="0" y2="-170" /></g>
              <circle class="hub" r="20" />
            </g>
          </svg>
        </div>
      </section>
    </div>
    <script>
      const ARC = 2 * Math.PI * 192;
      const tl = gsap.timeline({ paused: true });

      // Build: clock punches in, ticks cascade clockwise
      tl.fromTo(
        "#clock-wrap",
        { scale: 0.55, autoAlpha: 0, rotation: -12 },
        { scale: 1, autoAlpha: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)" },
        0.1,
      );
      tl.fromTo(
        "#ticks line",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.12, stagger: 0.025, ease: "power1.out" },
        0.18,
      );

      // Signature move: hands spin, accelerate, slam to 10:10
      tl.fromTo(
        "#hand-minute",
        { rotation: -660, svgOrigin: "0 0" },
        { rotation: 60, svgOrigin: "0 0", duration: 1.0, ease: "expo.inOut" },
        0.3,
      );
      tl.fromTo(
        "#hand-hour",
        { rotation: 245, svgOrigin: "0 0" },
        { rotation: 305, svgOrigin: "0 0", duration: 1.0, ease: "expo.inOut" },
        0.3,
      );
      tl.fromTo("#progress", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, ease: "none" }, 0.32);
      tl.fromTo(
        "#progress",
        { strokeDasharray: `${ARC} ${ARC * 2}`, strokeDashoffset: ARC },
        { strokeDasharray: `${ARC} ${ARC * 2}`, strokeDashoffset: 0, duration: 1.0, ease: "expo.inOut" },
        0.3,
      );

      // Impact at the stop: mechanical tick + pulse + ring flash
      tl.to(
        "#hand-minute",
        { keyframes: [{ rotation: 68 }, { rotation: 60 }], duration: 0.14, ease: "none" },
        1.3,
      );
      tl.to(
        "#face",
        { keyframes: [{ scale: 1.07, duration: 0.09 }, { scale: 1, duration: 0.22 }], svgOrigin: "0 0", ease: "sine.inOut" },
        1.3,
      );
      tl.fromTo(
        "#flash",
        { scale: 1, autoAlpha: 0.9, svgOrigin: "0 0" },
        { scale: 1.32, autoAlpha: 0, svgOrigin: "0 0", duration: 0.4, ease: "circ.out" },
        1.3,
      );

      // Resolve: quick exit, fully clear by 2.0s
      tl.to("#clock-wrap", { scale: 1.08, autoAlpha: 0, duration: 0.24, ease: "power3.in" }, 1.76);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
