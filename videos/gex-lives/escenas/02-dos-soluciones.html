<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Lives 02-dos-soluciones — Soluciones</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #hd { position: absolute; left: 0; right: 0; top: 60px; display: flex; justify-content: center; align-items: center; gap: 18px; }
      #hd b { font-weight: 800; font-size: 54px; white-space: nowrap; }
      #hd .hl { color: #fe6820; }
      .logo { display: inline-flex; align-items: center; padding: 10px 22px; border-radius: 20px; background: #ffffff; }
      .logo img { display: block; width: 170px; }
      .sol { position: absolute; top: 210px; width: 400px; height: 500px; }
      #s1 { left: 80px; background: #0b958b; }
      #s2 { left: 600px; background: #ea5a14; }
      #or { position: absolute; left: 490px; top: 400px; width: 100px; height: 100px; border-radius: 50%; background: #ffffff; color: #0b958b; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 46px; z-index: 5; border: 6px solid #000000; }
      #ft { position: absolute; left: 0; right: 0; top: 770px; display: flex; justify-content: center; }
      #ft .chip { font-size: 36px; padding: 10px 26px; background: #ffffff; color: #0b958b; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.6" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="3.6" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="hd"><b><span class="hl">2</span> soluciones</b></div>
          <div class="sol" id="s1"><small>OPCIÓN 1</small><span class="ico" data-ic="bot" data-sw="4"></span><b>Chatbot<br />con IA</b></div>
          <div id="or">o</div>
          <div class="sol" id="s2"><small>OPCIÓN 2</small><span class="ico" data-ic="code" data-col="#ea5a14" data-sw="4.5"></span><b>Página web<br />de ventas</b></div>
          <div id="ft"><span class="chip">Elige la que necesites</span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.4"></audio>
      <audio id="s-a" src="assets/sfx/pop.wav" data-start="0.4" data-volume="0.28"></audio>
      <audio id="s-b" src="assets/sfx/ding.wav" data-start="1.6" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.18" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.2;
      gsap.set(["#ft > *"], { autoAlpha: 0 });
      tl.fromTo("#hd > *", { y: -50, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.38, ease: "back.out(2.4)", stagger: 0.1 }, 0.05);
      tl.fromTo("#s1", { x: -300, rotation: -8, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.3);
      tl.fromTo("#s2", { x: 300, rotation: 8, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.45);
      tl.fromTo("#or", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 0.7);
      tl.fromTo(".sol .ico", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)", stagger: 0.15 }, 0.5);
      tl.to(["#s1", "#s2"], { y: -12, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.2 }, 1.4);
      tl.fromTo("#ft > *", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.38, ease: "back.out(2.4)", immediateRender: false }, 1.6);
      GEX.scatter(tl, ["#hd", "#s1", "#or", "#s2", "#ft"], EXIT, 163);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
