<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Lives 05 — WhatsApp solo para concretar la compra</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 270px; display: flex; justify-content: center; }
      #wb { left: 120px; top: 360px; width: 455px; height: 640px; }
      #dt { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
      #dt .img { height: 180px; border-radius: 18px; background: #fff1ea; display: flex; align-items: center; justify-content: center; }
      #dt .img svg { width: 120px; height: 120px; }
      #dt .nm { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 34px; }
      #dt .nm b { color: #ea5a14; }
      #dt .rw { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 28px; }
      .sz { width: 56px; height: 56px; border-radius: 14px; border: 4px solid #0b958b; display: flex; align-items: center; justify-content: center; font-size: 26px; }
      .sz.on { background: #0b958b; color: #ffffff; }
      #wab { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 12px; height: 84px; border-radius: 22px; background: #179a4a; color: #ffffff; font-weight: 800; font-size: 32px; white-space: nowrap; }
      #wab .ico { width: 54px; height: 54px; background: #ffffff; }
      #ph { left: 600px; top: 360px; width: 340px; height: 640px; }
      #ph .ph { font-size: 26px; padding: 0 16px; }
      #ph .ph .ico { width: 52px; height: 52px; }
      #msg { max-width: 100%; font-size: 27px; }
      #msg .dd { display: inline-block; margin-left: 8px; font-size: 22px; color: #179a4a; }
      #inp { position: absolute; left: 14px; right: 14px; bottom: 18px; height: 70px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 22px; color: #0b958b; font-weight: 700; font-size: 24px; white-space: nowrap; overflow: hidden; }
      #inp .snd { width: 54px; height: 54px; border-radius: 50%; background: #179a4a; display: flex; align-items: center; justify-content: center; flex: none; }
      #inp .snd svg { width: 30px; height: 30px; }
      #sinw { position: absolute; left: 0; right: 0; top: 1050px; display: flex; justify-content: center; padding-right: 60px; }
      #sinw .pill { font-size: 40px; padding: 12px 30px 12px 12px; }
      #sinw .pi { width: 62px; height: 62px; }
      #sinw .pi svg { width: 40px; height: 40px; }
      #rg { position: absolute; left: 347px; top: 852px; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 8px solid #fe6820; }
      .sp { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fe6820; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.6" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="7.6" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">PÁGINA WEB + WHATSAPP</span></div>
        <div class="wb" id="wb"><div class="wbar"><i></i><i></i><i></i>tutienda.com</div>
          <div id="dt"><div class="img" data-ic="shirt" data-col="#ea5a14" data-sw="4"></div><div class="nm">Polo clásico<b>S/ 89</b></div>
            <div class="rw">Talla <span class="sz">S</span><span class="sz on" id="szm">M</span><span class="sz">L</span></div>
            <div id="wab"><span class="ico" data-ic="wa" data-col="#179a4a" data-sw="4.5"></span>Pedir por WhatsApp</div></div>
        </div>
        <div class="phone" id="ph"><div class="ph"><span class="ico" data-ic="wa" data-col="#179a4a" data-sw="4.5"></span>Tu tienda</div>
          <div class="pb"><div class="m b" id="msg">Hola, quiero el Polo clásico en talla M <span class="dd">✓✓</span></div>
            <div id="inp"><span id="it">Hola, quiero el Polo…</span><span class="snd" data-ic="send" data-col="#ffffff" data-sw="4.5"></span></div></div></div>
        <div id="rg"></div>
        <span class="sp" id="p1" style="left: 575px; top: 800px"></span><span class="sp" id="p2" style="left: 575px; top: 870px"></span><span class="sp" id="p3" style="left: 560px; top: 930px"></span>
        <div id="sinw"><div class="pill g" id="sinp"><span class="pi" data-ic="check" data-col="#179a4a" data-sw="6"></span>Solo para concretar la compra</div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-tap" src="assets/sfx/click.wav" data-start="1.95" data-volume="0.3"></audio>
      <audio id="s-msg" src="assets/sfx/pop.wav" data-start="3.0" data-volume="0.28"></audio>
      <audio id="s-ok" src="assets/sfx/ding.wav" data-start="3.9" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="7.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 7.2;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#msg", "#inp", "#sinp", "#rg", ".sp"], { autoAlpha: 0 });
      const cur = GEX.cursor(scene);
      gsap.set(cur.c, { x: 1120, y: 1200 });
      tl.fromTo("#tag", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#wb", { x: -400, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo("#ph", { x: 400, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.45);
      GEX.punch(tl, "#szm", 1.0, 1.2);
      tl.to("#wab", { scale: 1.05, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.2);
      // toca "Pedir por WhatsApp"
      GEX.tap(tl, cur, 347, 842, 1.55, 0.4);
      tl.fromTo("#rg", { scale: 0.3, autoAlpha: 1 }, { scale: 1.6, borderWidth: 1, autoAlpha: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 1.95);
      tl.set("#rg", { autoAlpha: 0 }, 2.35);
      tl.fromTo(".sp", { scale: 0, autoAlpha: 1 }, { scale: 1, x: 50, autoAlpha: 1, duration: 0.35, ease: "power3.out", stagger: 0.05, immediateRender: false }, 2.0);
      tl.to(".sp", { scale: 0, duration: 0.15, ease: "power2.in" }, 2.45);
      tl.set(".sp", { autoAlpha: 0 }, 2.62);
      tl.to(cur.c, { x: 1120, y: 1300, duration: 0.4, ease: "power2.in" }, 2.2);
      // mensaje listo en WhatsApp
      tl.fromTo("#inp", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 2.2);
      GEX.punch(tl, "#inp .snd", 2.8, 1.25);
      tl.fromTo("#msg", { y: 40, scale: 0.6, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, 3.0);
      const p = { v: 0 }, it = document.getElementById("it");
      tl.fromTo(p, { v: 0 }, { v: 1, duration: 0.02, immediateRender: false, onUpdate: () => { it.textContent = p.v > 0.5 ? "Mensaje" : "Hola, quiero el Polo…"; } }, 3.0);
      tl.fromTo("#msg .dd", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, 3.4);
      // solo para concretar la compra
      tl.fromTo("#sinp", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 3.9);
      // ambiente
      tl.to("#ph", { y: -10, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 4 }, 3.4);
      tl.to("#wb", { y: 8, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.4);
      tl.to("#wab", { scale: 1.04, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, 4.4);
      tl.to("#sinp", { scale: 1.04, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4.6);
      GEX.scatter(tl, ["#wb", "#ph", "#sinw", "#tag"], EXIT, 177);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
