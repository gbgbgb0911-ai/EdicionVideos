<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Lives 01b — Respondes tarde y pierdes la venta</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #lv { left: 90px; top: 70px; width: 360px; height: 760px; }
      #ch { position: absolute; left: 500px; top: 70px; width: 500px; height: 620px; border-radius: 36px; background: #eef4f3; overflow: hidden; }
      #ch .hd { height: 80px; background: #179a4a; color: #ffffff; display: flex; align-items: center; gap: 12px; padding: 0 20px; font-weight: 800; font-size: 30px; }
      #ch .hd .ico { width: 52px; height: 52px; background: #ffffff; }
      #ch .bd { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
      .m { font-size: 30px; }
      .m small { font-size: 22px; }
      #wt { display: flex; align-items: center; gap: 12px; align-self: center; font-weight: 800; font-size: 30px; color: #b86e00; }
      #wt .ico { width: 52px; height: 52px; background: #ffffff; }
      #lost { position: absolute; left: 540px; top: 720px; font-size: 40px; padding: 12px 28px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.8" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="5.8" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div class="lv" id="lv"><span class="live"><i></i>EN VIVO</span><span class="seller" id="sl" data-ic="user" data-col="#ffffff" data-sw="4"></span><span class="prod" data-ic="shirt" data-col="#ea5a14" data-sw="4.5"></span><span class="cm" id="v1" style="top: 560px">¡Me encanta!</span><span class="cm" id="v2" style="top: 620px">¿Hay en azul?</span></div>
          <div id="ch"><div class="hd"><span class="ico" data-ic="wa" data-col="#179a4a" data-sw="4.5"></span>WhatsApp</div>
            <div class="bd">
              <div class="m" id="m1"><small>CLIENTE · 20:05</small>¿Precio del polo?</div>
              <div id="wt"><span class="ico" id="ck" data-ic="clock" data-col="#b86e00" data-sw="4.5"></span><span id="wtt">Sin respuesta…</span></div>
              <div class="m b" id="m2"><small>TÚ · 20:31</small>Está a S/ 89</div>
              <div class="m" id="m3"><small>CLIENTE · 20:32</small>Ya lo compré en otro lado</div>
            </div></div>
          <span class="chip o" id="lost">Venta perdida ✗</span>
        </section>
      </div>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="0.4" data-volume="0.26"></audio>
      <audio id="s-2" src="assets/sfx/tick.wav" data-start="3.2" data-volume="0.26"></audio>
      <audio id="s-3" src="assets/sfx/pop.wav" data-start="4.0" data-volume="0.26"></audio>
      <audio id="s-l" src="assets/sfx/impact.wav" data-start="4.8" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.38" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 5.4;
      gsap.set(["#m1", "#wt", "#m2", "#m3", "#lost", ".cm"], { autoAlpha: 0 });
      tl.fromTo("#lv", { x: -400, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.05);
      tl.fromTo("#ch", { x: 400, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.15);
      // el live sigue (comentarios, vendedor activo)
      tl.to("#sl", { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 15 }, 0.5);
      tl.fromTo(".cm", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.8, immediateRender: false }, 1.0);
      // el cliente pregunta... y espera
      tl.fromTo("#m1", { scale: 0.4, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 100%", duration: 0.32, ease: "back.out(2.4)", immediateRender: false }, 0.4);
      tl.fromTo("#wt", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, immediateRender: false }, 1.0);
      tl.fromTo("#ck svg", { rotation: 0 }, { rotation: 720, duration: 2.2, ease: "none" }, 1.0);
      // respondes demasiado tarde
      tl.fromTo("#m2", { scale: 0.4, autoAlpha: 0, transformOrigin: "100% 100%" }, { scale: 1, autoAlpha: 1, transformOrigin: "100% 100%", duration: 0.32, ease: "back.out(2.4)", immediateRender: false }, 3.2);
      tl.fromTo("#m3", { scale: 0.4, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 100%", duration: 0.32, ease: "back.out(2.4)", immediateRender: false }, 4.0);
      tl.fromTo("#lost", { scale: 2.4, rotation: -10, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.3, ease: "power4.in", immediateRender: false }, 4.6);
      GEX.scatter(tl, ["#lv", "#ch", "#lost"], EXIT, 162);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
