<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Lives 08 — Más tiempo para vender, menos interrupciones</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      .top { top: 300px; gap: 6px; left: 60px; right: 140px; }
      #r1 { position: relative; width: 760px; height: 250px; margin-bottom: 10px; }
      #lvb { position: absolute; left: 50%; top: 0; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; }
      #sel { width: 150px; height: 150px; border-radius: 50%; background: #ea5a14; display: flex; align-items: center; justify-content: center; }
      #sel svg { width: 92px; height: 92px; }
      #bdg { display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-radius: 16px; background: #ea5a14; font-weight: 800; font-size: 40px; letter-spacing: 0.08em; white-space: nowrap; }
      #bdg i { width: 20px; height: 20px; border-radius: 50%; background: #ffffff; }
      #prd { width: 110px; height: 110px; border-radius: 26px; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      #prd svg { width: 72px; height: 72px; }
      .q { position: absolute; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 18px; border-radius: 16px; background: #ffffff; color: #0b958b; font-weight: 800; font-size: 30px; white-space: nowrap; }
      .q .ok { width: 40px; height: 40px; border-radius: 50%; background: #179a4a; display: flex; align-items: center; justify-content: center; }
      .q .ok svg { width: 24px; height: 24px; }
      .ln { font-weight: 800; font-size: 70px; line-height: 1.02; letter-spacing: 0.01em; white-space: nowrap; }
      .ln.t { color: #1fc4b8; }
      .ln.o { color: #fe6820; }
      .sl { position: absolute; width: 12px; height: 90px; border-radius: 6px; background: #fe6820; transform: rotate(24deg); }
      .sp { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #1fc4b8; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="6.4" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="6.4" data-track-index="0">
        <div class="top" id="top">
          <div id="r1">
            <div id="lvb"><span id="sel" data-ic="user" data-col="#ffffff" data-sw="4"></span><span id="bdg"><i></i>EN VIVO</span><span id="prd" data-ic="shirt" data-col="#ea5a14" data-sw="4.5"></span></div>
          </div>
          <div class="ln" id="l1">MÁS TIEMPO</div>
          <div class="ln t" id="l2">PARA VENDER,</div>
          <div class="ln" id="l3">MENOS</div>
          <div class="ln o" id="l4">INTERRUPCIONES.</div>
        </div>
        <span class="q" id="q1" style="left: 170px; top: 478px">¿Precio?<span class="ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></span>
        <span class="q" id="q2" style="left: 640px; top: 478px">¿Talla M?<span class="ok" data-ic="check" data-col="#ffffff" data-sw="6"></span></span>
        <span class="sl" id="sl1" style="left: 150px; top: 330px"></span><span class="sl" id="sl2" style="left: 900px; top: 340px"></span>
        <span class="sp" id="sp1" style="left: 100px; top: 700px"></span><span class="sp" id="sp2" style="left: 960px; top: 780px"></span><span class="sp" id="sp3" style="left: 110px; top: 900px"></span>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.1" data-volume="0.4"></audio>
      <audio id="s-q" src="assets/sfx/tick.wav" data-start="1.3" data-volume="0.24"></audio>
      <audio id="s-l2" src="assets/sfx/ding.wav" data-start="2.0" data-volume="0.26"></audio>
      <audio id="s-l4" src="assets/sfx/impact.wav" data-start="3.6" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.98" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 6.0;
      const W = [1, 2, 3, 4].map((i) => GEX.split(document.getElementById("l" + i)));
      gsap.set([".q", ".q .ok"], { autoAlpha: 0 });
      // vendedor en vivo
      tl.fromTo("#sel", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.4)" }, 0.1);
      tl.fromTo("#bdg", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.38, ease: "back.out(2.6)" }, 0.2);
      tl.fromTo("#prd", { scale: 0, rotation: 90 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.4)" }, 0.3);
      tl.to("#bdg i", { scale: 0.55, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 17 }, 0.6);
      tl.to("#sel", { y: -10, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 13 }, 0.6);
      tl.to("#prd", { rotation: 8, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.8);
      // consultas atendidas sin interrumpir
      tl.fromTo(".q", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.6)", stagger: 0.15, immediateRender: false }, 0.7);
      tl.fromTo(".q .ok", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.28, ease: "back.out(3)", stagger: 0.15, immediateRender: false }, 1.3);
      tl.to("#q1", { x: -50, y: -14, rotation: -6, duration: 1.4, ease: "sine.inOut" }, 1.6);
      tl.to("#q2", { x: 50, y: -14, rotation: 6, duration: 1.4, ease: "sine.inOut" }, 1.6);
      tl.to("#q1", { x: -260, scale: 0, duration: 0.28, ease: "back.in(2)" }, 2.75);
      tl.to("#q2", { x: 260, scale: 0, duration: 0.28, ease: "back.in(2)" }, 2.82);
      tl.set(".q", { autoAlpha: 0 }, 3.12);
      // titular por palabra
      GEX.reveal(tl, W[0].words, 1.2, "rise", { stagger: 0.1, duration: 0.36 });
      GEX.reveal(tl, W[1].words, 1.8, "pop", { stagger: 0.12, duration: 0.36 });
      GEX.punch(tl, "#l2", 2.2, 1.1);
      GEX.reveal(tl, W[2].words, 2.9, "rise", { stagger: 0.1, duration: 0.36 });
      GEX.reveal(tl, W[3].words, 3.45, "drop", { stagger: 0.1, duration: 0.5 });
      GEX.punch(tl, "#l4", 3.95, 1.1);
      // ambiente
      tl.fromTo(".sl", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.1 }, 0.4);
      tl.to(".sl", { y: 26, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 4, stagger: 0.3 }, 0.7);
      tl.fromTo(".sp", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.12 }, 2.2);
      tl.to(".sp", { y: -40, x: 20, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.2 }, 2.5);
      tl.to(["#l1", "#l2", "#l3", "#l4"], { y: -6, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 2, stagger: 0.12 }, 4.3);
      GEX.scatter(tl, ["#lvb", "#l1", "#l2", "#l3", "#l4", ".sl", ".sp"], EXIT, 181);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
