<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Lives 04b — Página web de ventas: el cliente ve todo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 270px; display: flex; justify-content: center; }
      #lv { left: 80px; top: 360px; width: 360px; height: 640px; }
      #lk { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 8px; border-radius: 999px; background: #ffffff; color: #0b958b; font-weight: 800; font-size: 24px; white-space: nowrap; }
      #lk .ico { width: 40px; height: 40px; background: #0b958b; }
      #pf { position: absolute; left: 470px; top: 360px; width: 470px; height: 300px; border-radius: 30px; background: #ffffff; color: #0b958b; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
      #pf .r { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 32px; }
      #pf .av { width: 90px; height: 90px; }
      #pf .av svg { width: 52px; height: 52px; }
      #pf i { display: block; height: 14px; border-radius: 7px; background: #dfe7e6; }
      #pf .chip { align-self: flex-start; font-size: 26px; padding: 8px 16px; }
      #wb { left: 470px; top: 360px; width: 470px; height: 640px; }
      #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; }
      .pcx { height: 250px; border-radius: 18px; background: #eef4f3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 26px; }
      .pcx .ico { width: 90px; height: 90px; background: #ffffff; }
      #dt { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #ffffff; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
      #dt .img { height: 200px; border-radius: 18px; background: #fff1ea; display: flex; align-items: center; justify-content: center; }
      #dt .img svg { width: 130px; height: 130px; }
      #dt .nm { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 34px; }
      #dt .nm b { color: #ea5a14; }
      #dt .rw { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 24px; }
      .sz { width: 56px; height: 56px; border-radius: 14px; border: 4px solid #0b958b; display: flex; align-items: center; justify-content: center; font-size: 26px; }
      .sz.on { background: #0b958b; color: #ffffff; }
      .co { width: 48px; height: 48px; border-radius: 50%; border: 4px solid #dfe7e6; }
      #dt .inf i { display: block; height: 12px; border-radius: 6px; background: #dfe7e6; margin-top: 10px; }
      #sinw { position: absolute; left: 0; right: 0; top: 1050px; display: flex; justify-content: center; padding-right: 80px; }
      #sinw .pill { font-size: 38px; padding: 12px 30px 12px 12px; }
      #sinw .pi { width: 62px; height: 62px; }
      #sinw .pi svg { width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="13.0" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="13.0" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">OPCIÓN 2 · PÁGINA WEB DE VENTAS</span></div>
        <div class="lv" id="lv"><span class="live"><i></i>EN VIVO</span><span class="seller" id="sl" data-ic="user" data-col="#ffffff" data-sw="4"></span><span class="prod" data-ic="shirt" data-col="#ea5a14" data-sw="4.5"></span><span id="lk"><span class="ico" data-ic="link" data-col="#ffffff" data-sw="5"></span>tutienda.com</span></div>
        <div id="pf"><div class="r"><span class="av o" data-ic="user" data-col="#ffffff" data-sw="4.5"></span>Tu perfil</div><i style="width: 80%"></i><i style="width: 60%"></i><span class="chip" id="pl">tutienda.com</span></div>
        <div class="wb" id="wb"><div class="wbar"><i></i><i></i><i></i>tutienda.com</div>
          <div id="grid"><div class="pcx"><span class="ico" data-ic="shirt" data-col="#ea5a14" data-sw="4.5"></span>S/ 89</div><div class="pcx"><span class="ico" data-ic="bag" data-sw="4.5"></span>S/ 120</div><div class="pcx"><span class="ico" data-ic="shirt" data-sw="4.5"></span>S/ 75</div><div class="pcx"><span class="ico" data-ic="bag" data-col="#179a4a" data-sw="4.5"></span>S/ 99</div></div>
          <div id="dt"><div class="img" data-ic="shirt" data-col="#ea5a14" data-sw="4"></div><div class="nm">Polo clásico<b>S/ 89</b></div>
            <div class="rw" id="rs">Talla <span class="sz">S</span><span class="sz on">M</span><span class="sz">L</span></div>
            <div class="rw" id="rc">Color <span class="co" style="background: #0b958b"></span><span class="co" style="background: #ea5a14"></span><span class="co" style="background: #ffffff"></span></div>
            <div class="inf" id="inf"><i style="width: 90%"></i><i style="width: 70%"></i></div></div>
        </div>
        <div id="sinw"><div class="pill g" id="sinp"><span class="pi" data-ic="check" data-col="#179a4a" data-sw="6"></span>Sin escribirte para preguntar</div></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-lk" src="assets/sfx/pop.wav" data-start="1.3" data-volume="0.26"></audio>
      <audio id="s-tap" src="assets/sfx/click.wav" data-start="5.0" data-volume="0.3"></audio>
      <audio id="s-dt" src="assets/sfx/whoosh.wav" data-start="7.2" data-volume="0.28"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="10.5" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="12.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 12.6;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#lk", "#pf", "#wb", "#dt", "#rs", "#rc", "#inf", "#sinp", ".pcx"], { autoAlpha: 0 });
      const cur = GEX.cursor(scene);
      gsap.set(cur.c, { x: 1120, y: 1200 });
      tl.fromTo("#tag", { y: -60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#lv", { x: -400, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.to("#sl", { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 37 }, 0.8);
      // compartes el enlace en el live...
      tl.fromTo("#lk", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.38, ease: "back.out(2.6)", immediateRender: false }, 1.3);
      tl.to("#lk", { scale: 1.08, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.8);
      // ...o en tu perfil
      tl.fromTo("#pf", { x: 300, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out", immediateRender: false }, 2.9);
      GEX.punch(tl, "#pl", 3.5, 1.15);
      // el cliente entra
      GEX.tap(tl, cur, 250, 945, 4.55, 0.45);
      tl.to("#pf", { x: 300, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, 5.0);
      tl.fromTo("#wb", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, 5.2);
      tl.to(cur.c, { x: 1120, y: 1300, duration: 0.4, ease: "power2.in" }, 5.3);
      // ve los productos
      tl.fromTo(".pcx", { scale: 0.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.32, ease: "back.out(2.6)", stagger: 0.1, immediateRender: false }, 5.6);
      tl.to(".pcx:first-child", { scale: 1.06, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.6);
      // precios, tallas, colores, información
      tl.fromTo("#dt", { y: 640, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out", immediateRender: false }, 7.2);
      GEX.punch(tl, "#dt .nm b", 7.7, 1.2);
      tl.set(".pcx", { autoAlpha: 0 }, 7.68);
      tl.fromTo("#rs", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 7.9);
      tl.fromTo("#rc", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 8.5);
      tl.fromTo("#inf", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, 9.2);
      tl.fromTo("#inf i", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "power2.out", stagger: 0.15 }, 9.2);
      tl.to(".co", { scale: 1.15, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.1 }, 8.8);
      // sin tener que escribirte
      tl.fromTo("#sinp", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, 10.5);
      // salida + barrido
      GEX.scatter(tl, ["#lv", "#wb", "#sinw", "#tag"], EXIT, 165);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
