<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Lives 01a — Interrumpes el live para responder</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #lv { left: 90px; top: 70px; width: 360px; height: 760px; }
      #rsp { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 26px; padding: 8px 16px; white-space: nowrap; }
      #wa { position: absolute; left: 520px; top: 80px; width: 100px; height: 100px; border-radius: 50%; background: #179a4a; display: flex; align-items: center; justify-content: center; }
      #wa svg { width: 64px; height: 64px; }
      #cnt { position: absolute; left: 600px; top: 64px; min-width: 60px; height: 52px; padding: 0 12px; border-radius: 26px; background: #ea5a14; color: #ffffff; font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center; border: 5px solid #000000; }
      .nm { position: absolute; left: 520px; padding: 14px 22px; border-radius: 22px; background: #ffffff; color: #0b958b; font-weight: 800; font-size: 34px; white-space: nowrap; }
      #end { position: absolute; left: 520px; top: 700px; font-size: 38px; padding: 12px 26px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="6.0" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="6.0" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div class="lv" id="lv"><span class="live" id="lvc"><i></i><b id="lvt">EN VIVO</b></span><span class="seller" id="sl" data-ic="user" data-col="#ffffff" data-sw="4"></span><span class="prod" data-ic="shirt" data-col="#ea5a14" data-sw="4.5"></span><span class="chip a" id="rsp">Respondiendo…</span></div>
          <span id="wa" data-ic="wa" data-col="#ffffff" data-sw="4"></span><span id="cnt" class="num">0</span>
          <span class="nm" id="n1" style="top: 230px">¿Precio?</span>
          <span class="nm" id="n2" style="top: 340px">¿Hay talla M?</span>
          <span class="nm" id="n3" style="top: 450px">¿Hacen envíos?</span>
          <span class="nm" id="n4" style="top: 560px">¿Qué colores hay?</span>
          <span class="chip o" id="end">Interrumpes el live</span>
        </section>
      </div>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="0.6" data-volume="0.26"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="2.2" data-volume="0.26"></audio>
      <audio id="s-3" src="assets/sfx/pop.wav" data-start="3.6" data-volume="0.26"></audio>
      <audio id="s-e" src="assets/sfx/ding.wav" data-start="4.8" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="5.58" data-volume="0.38"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 5.6;
      gsap.set([".nm", "#rsp", "#end"], { autoAlpha: 0 });
      const lvt = document.getElementById("lvt"), lvc = document.getElementById("lvc");
      const state = (t, paused) => { const p = { v: 0 }; tl.fromTo(p, { v: 0 }, { v: 1, duration: 0.02, immediateRender: false, onUpdate: () => { const on = p.v > 0.5 ? paused : !paused; lvt.textContent = on ? "PAUSA" : "EN VIVO"; lvc.style.backgroundColor = on ? "#b86e00" : "#ea5a14"; } }, t); };
      tl.fromTo("#lv", { x: -400, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.05);
      tl.fromTo(["#wa", "#cnt"], { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)", stagger: 0.1 }, 0.3);
      GEX.count(tl, document.getElementById("cnt"), 0, 12, 0.6, 4.0, "", "");
      tl.to("#sl", { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 15 }, 0.5);
      // llegan mensajes y el live se detiene una y otra vez
      [["#n1", 0.6], ["#n2", 2.2], ["#n3", 3.6], ["#n4", 4.2]].forEach(([id, t], i) => {
        tl.fromTo(id, { x: 80, scale: 0.6, autoAlpha: 0, transformOrigin: "0% 50%" }, { x: 0, scale: 1, autoAlpha: 1, duration: 0.32, ease: "back.out(2.4)", immediateRender: false }, t);
        if (i < 3) {
          state(t + 0.2, true);
          tl.fromTo("#rsp", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.25, ease: "back.out(3)", immediateRender: false }, t + 0.25);
          tl.to("#sl", { scale: 0.85, duration: 0.2 }, t + 0.2);
          tl.to("#rsp", { scale: 0, autoAlpha: 0, duration: 0.2 }, t + 1.1);
          tl.to("#sl", { scale: 1, duration: 0.25, ease: "back.out(2)" }, t + 1.1);
          state(t + 1.15, false);
        }
      });
      tl.fromTo("#end", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)", immediateRender: false }, 4.8);
      GEX.scatter(tl, ["#lv", "#wa", "#cnt", "#n1", "#n2", "#n3", "#n4", "#end"], EXIT, 161);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
