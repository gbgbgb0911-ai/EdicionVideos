<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Trip 03b — Antes: pedidos mezclados y desorden</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      .od { position: absolute; top: 300px; width: 465px; height: 250px; padding: 22px 24px; border-radius: 28px; background: #ffffff; color: var(--teal); }
      .od h4 { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 32px; white-space: nowrap; }
      .od p { position: relative; height: 50px; margin-top: 8px; font-weight: 700; font-size: 30px; white-space: nowrap; }
      .od p span { position: absolute; left: 0; top: 0; }
      #A { left: 60px; border-top: 12px solid #1fc4b8; }
      #B { left: 555px; border-top: 12px solid #fe6820; }
      #qq { position: absolute; left: 470px; top: 560px; font-size: 40px; padding: 10px 26px; z-index: 5; }
      #ql { position: absolute; left: 60px; top: 650px; font-weight: 800; font-size: 30px; color: #1fc4b8; letter-spacing: 0.08em; }
      .dv { position: absolute; top: 710px; width: 200px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .dv .av { width: 120px; height: 120px; font-size: 44px; border: 6px solid #ffffff; }
      .dv b { font-weight: 800; font-size: 30px; }
      .dv .n { position: absolute; left: 30px; top: -10px; width: 52px; height: 52px; border-radius: 50%; background: #ffffff; color: #0b958b; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 28px; }
      #say { position: absolute; left: 520px; top: 930px; font-size: 32px; padding: 12px 24px; z-index: 5; }
      #res { position: absolute; left: 0; right: 0; top: 1060px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
      #res .pill { font-size: 46px; padding: 14px 34px 14px 14px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="9.5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="9.5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">ANTES · SE MEZCLABA TODO</span></div>
        <div class="od" id="A"><h4><span class="chip">A</span>Pollería</h4><p><span id="a1">📍 Av. Lima 123</span></p><p><span id="a2">Cobrar $30</span></p></div>
        <div class="od" id="B"><h4><span class="chip o">B</span>Farmacia</h4><p><span id="b1">📍 Jr. Sol 45</span></p><p><span id="b2">Cobrar $12</span></p></div>
        <span class="chip o" id="qq">¿?</span>
        <span id="ql">ORDEN DE LOS DRIVERS</span>
        <div class="dv" id="d0" style="left: 60px"><span class="av">JR</span><b>Juan</b><span class="n">1</span></div>
        <div class="dv" id="d1" style="left: 300px"><span class="av o">AN</span><b>Ana</b><span class="n">2</span></div>
        <div class="dv" id="d2" style="left: 540px"><span class="av g">LU</span><b>Luis</b><span class="n">3</span></div>
        <div class="dv" id="d3" style="left: 780px"><span class="av a">MA</span><b>Marco</b><span class="n">4</span></div>
        <span class="chip o" id="say">“¡Me tocaba a mí!”</span>
        <div id="res">
          <div class="pill o" id="r1"><span class="pi" data-ic="x" data-col="#ea5a14" data-sw="6"></span>Errores</div>
          <div class="pill o" id="r2"><span class="pi" data-ic="clock" data-col="#ea5a14" data-sw="5"></span>Demoras</div>
          <div class="pill o" id="r3"><span class="pi" data-ic="alert" data-col="#ea5a14" data-sw="5"></span>Molestias entre drivers</div>
        </div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-sw" src="assets/sfx/tick.wav" data-start="1.3" data-volume="0.28"></audio>
      <audio id="s-g" src="assets/sfx/impact.wav" data-start="2.1" data-volume="0.34"></audio>
      <audio id="s-d" src="assets/sfx/pop.wav" data-start="4.6" data-volume="0.3"></audio>
      <audio id="s-r" src="assets/sfx/impact.wav" data-start="6.6" data-volume="0.36"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="9.08" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 9.1;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#qq", "#say", "#r1", "#r2", "#r3"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#A", { x: -600, rotation: -6 }, { x: 0, rotation: -2, duration: 0.5, ease: "power4.out" }, 0.25);
      tl.fromTo("#B", { x: 600, rotation: 6 }, { x: 0, rotation: 2, duration: 0.5, ease: "power4.out" }, 0.35);
      // los datos se cruzan entre pedidos
      const swap = (ida, idb, ta, tb, t) => {
        const a = document.querySelector(ida), b = document.querySelector(idb), p = { v: 0 };
        tl.to([ida, idb], { y: -26, autoAlpha: 0, duration: 0.2, ease: "power2.in" }, t);
        tl.to(p, { v: 1, duration: 0.01, onUpdate: () => { a.textContent = p.v > 0.5 ? tb : ta; b.textContent = p.v > 0.5 ? ta : tb; } }, t + 0.2);
        tl.fromTo([ida, idb], { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, t + 0.22);
        tl.to([ida, idb], { color: "#c94a0c", duration: 0.1 }, t + 0.22);
      };
      swap("#a1", "#b1", "📍 Av. Lima 123", "📍 Jr. Sol 45", 1.3);
      swap("#a2", "#b2", "Cobrar $30", "Cobrar $12", 1.6);
      tl.to(["#A", "#B"], { keyframes: [{ x: -10, duration: 0.05 }, { x: 10, duration: 0.05 }, { x: -6, duration: 0.05 }, { x: 0, duration: 0.05 }], repeat: 1 }, 2.1);
      tl.fromTo("#qq", { scale: 0, rotation: -30, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 2.15);
      tl.to("#qq", { rotation: 10, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.5);
      // el orden de los drivers se desarma
      tl.fromTo("#ql", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 3.0);
      tl.fromTo(".dv", { y: 120, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.08 }, 3.1);
      tl.to("#d0", { x: 480, duration: 0.5, ease: "power2.inOut" }, 4.0);
      tl.to("#d2", { x: -480, duration: 0.5, ease: "power2.inOut" }, 4.0);
      tl.to("#d1", { x: 480, duration: 0.5, ease: "power2.inOut" }, 4.2);
      tl.to("#d3", { x: -480, duration: 0.5, ease: "power2.inOut" }, 4.2);
      tl.fromTo("#say", { scale: 0, autoAlpha: 0, transformOrigin: "0% 100%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 100%", duration: 0.35, ease: "back.out(3)", immediateRender: false }, 4.6);
      tl.to("#say", { rotation: -3, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 5 }, 5.0);
      tl.to(".dv .av", { y: -8, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5, stagger: 0.07 }, 4.8);
      // consecuencias
      [["#r1", 6.6], ["#r2", 7.1], ["#r3", 7.6]].forEach(([id, t], i) => {
        tl.fromTo(id, { x: i % 2 ? 800 : -800, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(1.8)", immediateRender: false }, t);
        GEX.punch(tl, id, t + 0.42, 1.08);
      });
      // salida + barrido
      GEX.scatter(tl, ["#A", "#B", "#qq", "#ql", "#d0", "#d1", "#d2", "#d3", "#say", "#r1", "#r2", "#r3", "#tag"], EXIT, 32);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
