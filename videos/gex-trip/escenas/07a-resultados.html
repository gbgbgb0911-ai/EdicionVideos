<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Trip 07a — El resultado</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #hd { position: absolute; left: 0; right: 0; top: 140px; display: flex; justify-content: center; }
      #hd span { font-weight: 800; font-size: 72px; white-space: nowrap; }
      #hd .o { color: #fe6820; }
      #list { position: absolute; left: 0; right: 0; top: 270px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      #list .pill { font-size: 38px; padding: 10px 30px 10px 10px; }
      #list .pi { width: 58px; height: 58px; }
      #list .pi svg { width: 36px; height: 36px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="9" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="9" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="hd"><span id="h">¿El <span class="o">resultado</span>?</span></div>
          <div id="list">
            <div class="pill" id="p1"><span class="pi" data-ic="headset" data-sw="5"></span>Menos carga para la central</div>
            <div class="pill o" id="p2"><span class="pi" data-ic="moto" data-col="#ea5a14" data-sw="4.5"></span>Más autonomía para los drivers</div>
            <div class="pill" id="p3"><span class="pi" data-ic="grid" data-sw="5"></span>Pedidos e información ordenados</div>
            <div class="pill o" id="p4"><span class="pi" data-ic="money" data-col="#ea5a14" data-sw="4.5"></span>Registro económico de cada servicio</div>
            <div class="pill g" id="p5"><span class="pi" data-ic="sliders" data-col="#179a4a" data-sw="5"></span>Más control para el administrador</div>
          </div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-1" src="assets/sfx/pop.wav" data-start="1.4" data-volume="0.3"></audio>
      <audio id="s-2" src="assets/sfx/pop.wav" data-start="3.6" data-volume="0.3"></audio>
      <audio id="s-3" src="assets/sfx/tick.wav" data-start="5.5" data-volume="0.28"></audio>
      <audio id="s-4" src="assets/sfx/success.wav" data-start="6.6" data-volume="0.33"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="8.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 8.6;
      const fx = document.getElementById("fx");
      const parts = GEX.particles(fx, 5, 7101, { x0: 20, x1: 110, y0: 140, y1: 900 }).concat(GEX.particles(fx, 5, 7102, { x0: 970, x1: 1060, y0: 140, y1: 800 }));
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      const h = GEX.split(document.getElementById("h"));
      gsap.set(["#p1", "#p2", "#p3", "#p4", "#p5"], { autoAlpha: 0 });
      GEX.reveal(tl, h.chars, 0.05, "drop", { stagger: 0.03, duration: 0.4 });
      [["#p1", 1.4], ["#p2", 3.6], ["#p3", 4.6], ["#p4", 5.5], ["#p5", 6.6]].forEach(([id, t], i) => {
        tl.fromTo(id, { x: i % 2 ? 900 : -900, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(1.7)", immediateRender: false }, t);
        tl.fromTo(id + " .pi", { scale: 0, rotation: -150 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)" }, t + 0.08);
        GEX.float(tl, id, t + 0.7, EXIT, 4, 1.3 + i * 0.1);
      });
      GEX.punch(tl, "#p5", 7.1, 1.08);
      GEX.scatter(tl, ["#p1", "#p2", "#p3", "#p4", "#p5"], EXIT, 71);
      tl.to(h.chars, { y: -120, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.02 }, EXIT);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
