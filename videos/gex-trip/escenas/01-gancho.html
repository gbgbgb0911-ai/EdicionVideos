<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Trip 01 — Gancho</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #brand { position: absolute; left: 0; right: 0; top: 110px; display: flex; justify-content: center; align-items: center; gap: 18px; }
      #brand .ico { width: 100px; height: 100px; background: #ffffff; }
      #brand b { font-weight: 800; font-size: 84px; line-height: 1; letter-spacing: 0.04em; }
      #brand small { font-weight: 800; font-size: 34px; color: #1fc4b8; }
      #brand .tag { font-size: 24px; padding: 6px 14px; }
      .wa { position: absolute; left: 60px; display: flex; align-items: center; gap: 10px; padding: 10px 20px 10px 10px; border-radius: 22px 22px 22px 6px; background: #179a4a; font-weight: 700; font-size: 26px; white-space: nowrap; }
      .wa i { width: 34px; height: 34px; display: inline-block; }
      #cnt { position: absolute; left: 70px; top: 700px; font-size: 32px; padding: 10px 22px; }
      #sys { position: absolute; left: 560px; top: 270px; width: 460px; height: 410px; }
      #sys .bar { font-size: 28px; padding: 14px 20px; }
      .sr { display: flex; align-items: center; gap: 10px; margin: 10px 18px 0; padding: 0 14px; height: 52px; border-radius: 14px; background: var(--soft); font-weight: 700; font-size: 24px; white-space: nowrap; }
      .sr span:first-child { flex: 1; }
      .sr b { font-weight: 800; color: #c94a0c; }
      #tot { display: flex; justify-content: space-between; align-items: center; margin: 14px 18px 0; padding: 0 16px; height: 64px; border-radius: 16px; background: #0b958b; color: #ffffff; font-weight: 800; font-size: 28px; }
      #tot b { font-size: 34px; }
      #keys { position: absolute; left: 0; right: 0; top: 760px; display: flex; justify-content: center; gap: 14px; }
      #keys .pill { font-size: 32px; padding: 10px 26px 10px 10px; }
      #keys .pi { width: 50px; height: 50px; }
      #keys .pi svg { width: 32px; height: 32px; }
      #old { position: absolute; left: 0; right: 0; top: 770px; display: flex; justify-content: center; }
      #old .chip { position: relative; font-size: 34px; padding: 12px 26px; }
      #oldx { position: absolute; left: -8px; right: -8px; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px; background: #ffffff; }
      #how { position: absolute; left: 0; right: 0; top: 860px; display: flex; justify-content: center; font-weight: 800; font-size: 36px; color: #1fc4b8; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="13" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="13" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="brand"><span class="ico" id="bi" data-ic="moto" data-sw="4"></span><div><span class="tag" id="tag">CASO REAL</span><div><b id="bn">TRIP</b> <small>delivery</small></div></div></div>
          <div id="msgs"></div>
          <span class="chip o" id="cnt"><span class="num" id="cv">+0</span>&nbsp;mensajes</span>
          <div class="win" id="sys">
            <div class="bar"><i></i><i></i><i></i><b>Sistema Trip</b></div>
            <div class="sr"><span>#1832 · Pollería</span><span class="chip g" style="font-size: 20px; padding: 4px 10px">✓</span><b>$8</b></div>
            <div class="sr"><span>#1833 · Farmacia</span><span class="chip g" style="font-size: 20px; padding: 4px 10px">✓</span><b>$6</b></div>
            <div class="sr"><span>#1834 · Burger</span><span class="chip g" style="font-size: 20px; padding: 4px 10px">✓</span><b>$7</b></div>
            <div class="sr"><span>#1835 · Market</span><span class="chip g" style="font-size: 20px; padding: 4px 10px">✓</span><b>$9</b></div>
            <div id="tot"><span>Contabilizado</span><b class="num" id="tv">$0</b></div>
          </div>
          <div id="old"><span class="chip gr" id="oc">Asignación manual de pedidos<i id="oldx"></i></span></div>
          <div id="keys"><div class="pill" id="k1"><span class="pi" data-ic="money" data-sw="4.5"></span>Cuentas en el sistema</div><div class="pill o" id="k2"><span class="pi" data-ic="x" data-col="#ea5a14" data-sw="6"></span>Sin asignación manual</div></div>
          <div id="how">Te muestro cómo ↓</div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-p" src="assets/sfx/pop.wav" data-start="0.6" data-volume="0.28"></audio>
      <audio id="s-su" src="assets/sfx/whoosh.wav" data-start="5.0" data-volume="0.4"></audio>
      <audio id="s-ok" src="assets/sfx/success.wav" data-start="5.8" data-volume="0.32"></audio>
      <audio id="s-x" src="assets/sfx/impact.wav" data-start="9.0" data-volume="0.36"></audio>
      <audio id="s-k" src="assets/sfx/pop.wav" data-start="10.0" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="12.58" data-volume="0.4"></audio>
    </div>
    <script>
      const TX = ["Pedido: 2 pollos, Av. Lima…", "¿Cuánto cobraste?", "Entregado ✓ $8", "Otro pedido urgente", "¿Quién lo llevó?", "Cobré $12 en efectivo", "Falta pagar envío", "Pedido #… ¿ya salió?"];
      const msgs = document.getElementById("msgs");
      TX.forEach((t, i) => {
        const d = document.createElement("div");
        d.className = "wa"; d.id = "m" + i; d.style.top = (270 + i * 52) + "px"; d.style.left = (60 + (i % 3) * 20) + "px";
        d.innerHTML = '<i data-ic="wa" data-col="#ffffff" data-sw="4"></i>' + t;
        msgs.appendChild(d);
      });
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 12.6;
      const parts = GEX.particles(document.getElementById("fx"), 10, 1101, { x0: 30, x1: 1050, y0: 120, y1: 940 });
      GEX.ambient(tl, parts, 0.3, EXIT + 0.3);
      gsap.set(["#sys", "#keys .pill", "#old", "#how"], { autoAlpha: 0 });
      tl.fromTo("#bi", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      tl.fromTo("#bi svg", { x: -30 }, { x: 0, duration: 0.5, ease: "back.out(2)" }, 0.1);
      tl.fromTo("#tag", { y: -30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)" }, 0.15);
      tl.fromTo("#bn, #brand small", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.08 }, 0.2);
      // cientos de mensajes
      TX.forEach((_, i) => {
        tl.fromTo("#m" + i, { x: -500, scale: 0.7, autoAlpha: 0 }, { x: 0, scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(1.8)" }, 0.6 + i * 0.32);
        tl.to("#m" + i, { y: -4, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.0 + i * 0.32);
      });
      tl.fromTo("#cnt", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.6)" }, 0.9);
      const cv = document.getElementById("cv"), c = { v: 0 };
      tl.to(c, { v: 300, duration: 3.6, ease: "power1.in", onUpdate: () => { cv.textContent = "+" + Math.round(c.v); } }, 1.0);
      tl.to("#cnt", { scale: 1.1, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.6);
      // hoy: todo registrado y contabilizado
      tl.fromTo("#sys", { x: 500, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out", immediateRender: false }, 4.8);
      TX.forEach((_, i) => tl.to("#m" + i, { x: 600, y: 60 - i * 30, scale: 0.2, autoAlpha: 0, duration: 0.45, ease: "power3.in" }, 5.0 + i * 0.04));
      tl.to("#cnt", { scale: 0, autoAlpha: 0, duration: 0.25, ease: "back.in(2)" }, 5.1);
      tl.fromTo("#sys .sr", { x: 60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.12 }, 5.4);
      GEX.count(tl, document.getElementById("tv"), 0, 1284, 5.8, 1.2, "$");
      GEX.punch(tl, "#tot", 7.0, 1.06);
      tl.to("#sys", { x: -250, duration: 0.6, ease: "power3.inOut" }, 7.6);
      // y no solo eso: adiós asignación manual
      tl.fromTo("#old", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 8.4);
      tl.fromTo("#oldx", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.3, ease: "power4.out" }, 8.95);
      tl.to("#old", { y: 120, rotation: 8, autoAlpha: 0, duration: 0.35, ease: "power3.in" }, 9.5);
      tl.fromTo("#k1", { x: -600, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(1.8)", immediateRender: false }, 9.85);
      tl.fromTo("#k2", { x: 600, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(1.8)", immediateRender: false }, 10.0);
      tl.fromTo("#how", { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, immediateRender: false }, 11.6);
      tl.to("#how", { y: 10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 11.9);
      GEX.float(tl, "#bi", 0.8, EXIT, 6, 1.5);
      GEX.scatter(tl, ["#bi", "#tag", "#bn", "#sys", "#k1", "#k2", "#how"], EXIT, 11);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
