<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Trip 05a — Desarrollamos un sistema</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #row { position: absolute; left: 0; right: 0; top: 230px; display: flex; justify-content: center; align-items: center; gap: 30px; }
      #lgc { padding: 22px 34px; border-radius: 30px; background: #ffffff; }
      #lgc img { display: block; height: 80px; }
      #arr { font-weight: 800; font-size: 90px; color: #fe6820; }
      #tp { display: flex; align-items: center; gap: 16px; padding: 18px 34px 18px 18px; border-radius: 999px; background: #0b958b; font-weight: 800; font-size: 60px; white-space: nowrap; }
      #tp .pi { width: 96px; height: 96px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      #tp .pi svg { width: 64px; height: 64px; }
      #sub { position: absolute; left: 0; right: 0; top: 470px; display: flex; justify-content: center; }
      #sub .pill { font-size: 44px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.8" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="3.8" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="row"><span id="lgc"><img src="assets/logo-v2/gex-full.png" alt="GEX" /></span><span id="arr">→</span><span id="tp"><span class="pi" data-ic="moto" data-sw="4"></span>Sistema Trip</span></div>
          <div id="sub"><div class="pill o plain" id="sp"><span id="st">Otra forma de trabajar</span><i class="shine" id="sh"></i></div></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-sh" src="assets/sfx/shimmer.wav" data-start="0.7" data-volume="0.3"></audio>
      <audio id="s-p" src="assets/sfx/pop.wav" data-start="1.5" data-volume="0.3"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.38" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.4;
      const parts = GEX.particles(document.getElementById("fx"), 12, 5101, { x0: 30, x1: 1050, y0: 140, y1: 900 });
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      const st = GEX.split(document.getElementById("st"));
      tl.fromTo("#lgc", { scale: 0.3, rotation: -8, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      tl.fromTo("#arr", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, 0.45);
      tl.to("#arr", { x: 14, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.9);
      tl.fromTo("#tp", { scale: 0.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.7);
      tl.fromTo("#tp .pi svg", { x: -40 }, { x: 0, duration: 0.6, ease: "back.out(2)" }, 0.8);
      tl.fromTo("#sp", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)" }, 1.5);
      GEX.reveal(tl, st.words, 1.6, "rise", { stagger: 0.06, duration: 0.35 });
      tl.fromTo("#sh", { x: -140 }, { x: 640, duration: 0.6, ease: "power2.inOut" }, 2.1);
      tl.set("#sh", { x: -140 }, 2.75);
      GEX.scatter(tl, ["#lgc", "#arr", "#tp", "#sp"], EXIT, 51);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
