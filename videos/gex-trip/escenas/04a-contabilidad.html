<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=1920" />
    <title>Trip 04a — Otro problema: la contabilidad</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <link rel="stylesheet" href="assets/split.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #wrap { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; align-items: center; gap: 30px; }
      #ic { width: 220px; height: 220px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; flex: none; }
      #ic svg { width: 140px; height: 140px; }
      .tx { display: flex; flex-direction: column; gap: 6px; }
      #t1 { font-weight: 800; font-size: 46px; white-space: nowrap; }
      #t2 { font-weight: 800; font-size: 84px; color: #fe6820; line-height: 1; white-space: nowrap; }
      #clk { align-self: flex-start; font-size: 32px; padding: 10px 22px; }
      #ml { position: absolute; left: 0; right: 0; top: 560px; display: flex; justify-content: center; gap: 18px; }
      .bb { width: 120px; height: 70px; border-radius: 20px 20px 20px 6px; background: #179a4a; display: flex; align-items: center; justify-content: center; }
      .bb i { width: 44px; height: 44px; display: inline-block; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.6" data-fps="60" data-width="2160" data-height="1920">
      <div id="c">
        <section id="scene" class="scene clip" data-start="0" data-duration="3.6" data-track-index="0">
          <div class="fx-layer" id="fx"></div>
          <div id="wrap"><div id="ic" data-ic="money" data-col="#ea5a14" data-sw="4"></div><div class="tx"><span class="chip a" id="clk">Al final del día</span><span id="t1">venía otro problema:</span><span id="t2">la contabilidad</span></div></div>
          <div id="ml"><span class="bb"><i data-ic="wa" data-col="#ffffff"></i></span><span class="bb"><i data-ic="wa" data-col="#ffffff"></i></span><span class="bb"><i data-ic="wa" data-col="#ffffff"></i></span><span class="bb"><i data-ic="wa" data-col="#ffffff"></i></span><span class="bb"><i data-ic="wa" data-col="#ffffff"></i></span></div>
        </section>
      </div>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-hit" src="assets/sfx/impact.wav" data-start="0.9" data-volume="0.36"></audio>
      <audio id="s-p" src="assets/sfx/pop.wav" data-start="1.6" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="3.18" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 3.2;
      const parts = GEX.particles(document.getElementById("fx"), 10, 4101, { x0: 30, x1: 1050, y0: 140, y1: 900 });
      GEX.ambient(tl, parts, 0.2, EXIT + 0.3);
      const t2 = GEX.split(document.getElementById("t2"));
      tl.fromTo("#ic", { scale: 0, rotation: -160 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.05);
      tl.fromTo("#clk", { y: -30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)" }, 0.15);
      tl.fromTo("#t1", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "power3.out" }, 0.3);
      GEX.reveal(tl, t2.chars, 0.6, "drop", { stagger: 0.03, duration: 0.4 });
      GEX.punch(tl, "#t2", 1.3, 1.08);
      tl.fromTo(".bb", { y: 80, scale: 0, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.6)", stagger: 0.08 }, 1.6);
      tl.to(".bb", { y: -8, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.06 }, 2.1);
      tl.to("#ic", { rotation: 10, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.8);
      GEX.scatter(tl, ["#ic", "#clk", "#t1", "#t2", ".bb"], EXIT, 41);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
