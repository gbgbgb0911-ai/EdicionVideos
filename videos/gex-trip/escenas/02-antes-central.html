<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Trip 02 — Antes: la central coordinando a mano</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      #cen { position: absolute; left: 60px; top: 290px; width: 960px; height: 130px; display: flex; align-items: center; gap: 20px; padding: 0 26px; border-radius: 32px; background: #ffffff; color: var(--teal); font-weight: 800; font-size: 40px; white-space: nowrap; }
      #cen .ico { width: 90px; height: 90px; }
      #q { margin-left: auto; font-size: 32px; padding: 10px 22px; }
      #inl { position: absolute; left: 60px; top: 460px; font-weight: 800; font-size: 28px; color: #1fc4b8; letter-spacing: 0.08em; }
      .wa { position: absolute; left: 60px; width: 470px; display: flex; align-items: center; gap: 10px; padding: 12px 18px 12px 12px; border-radius: 22px 22px 22px 6px; background: #179a4a; font-weight: 700; font-size: 26px; white-space: nowrap; overflow: hidden; }
      .wa i { width: 34px; height: 34px; display: inline-block; flex: none; }
      .wa b { font-weight: 800; }
      #dv { position: absolute; left: 560px; top: 460px; width: 460px; height: 620px; }
      #dv .bar { font-size: 28px; padding: 14px 20px; }
      .dr { position: absolute; left: 14px; width: 432px; height: 120px; padding: 12px 14px; border-radius: 18px; background: var(--soft); display: flex; flex-direction: column; justify-content: center; gap: 6px; }
      .dr .t1 { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 28px; white-space: nowrap; }
      .dr .av { width: 46px; height: 46px; font-size: 20px; }
      .dr .t2 { display: flex; gap: 8px; }
      .dr .chip { font-size: 20px; padding: 4px 12px; }
      #scan { position: absolute; left: 6px; top: 0; width: 448px; height: 130px; border-radius: 22px; border: 6px solid #fe6820; }
      #punta { position: absolute; left: 0; right: 0; top: 1130px; display: flex; justify-content: center; }
      #caos { position: absolute; left: 260px; top: 1250px; padding: 18px 60px; border-radius: 20px; border: 10px solid #fe6820; color: #fe6820; font-weight: 800; font-size: 120px; letter-spacing: 0.12em; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="11" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="11" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">ANTES · LA CENTRAL</span></div>
        <div id="cen"><span class="ico" data-ic="headset"></span>Central<span class="chip o" id="q">En cola: <span class="num" id="qv">&nbsp;0</span></span></div>
        <span id="inl">PEDIDOS POR WHATSAPP</span>
        <div id="msgs"></div>
        <div class="win" id="dv"><div class="bar"><i></i><i></i><i></i><b>¿Qué driver está libre?</b></div><div id="drs"></div><div id="scan"></div></div>
        <div id="punta"><div class="pill o" id="pp"><span class="pi" data-ic="alert" data-col="#ea5a14" data-sw="5"></span>Hora de alta demanda<i class="shine" id="sh"></i></div></div>
        <div id="caos">CAOS</div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-p" src="assets/sfx/pop.wav" data-start="0.8" data-volume="0.28"></audio>
      <audio id="s-t1" src="assets/sfx/tick.wav" data-start="2.3" data-volume="0.26"></audio>
      <audio id="s-t2" src="assets/sfx/tick.wav" data-start="3.7" data-volume="0.26"></audio>
      <audio id="s-x" src="assets/sfx/impact.wav" data-start="9.1" data-volume="0.4"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="10.58" data-volume="0.4"></audio>
    </div>
    <script>
      const M = [["Pollería", "2 pollos a Av. Lima"], ["Farmacia", "entregar receta"], ["Burger Box", "3 combos, urgente"], ["Minimarket", "compra a domicilio"], ["Pollería", "otro pedido más"], ["Panadería", "torta de cumpleaños"], ["Farmacia", "¿ya salió mi pedido?"], ["Burger Box", "2 pedidos nuevos"]];
      const msgs = document.getElementById("msgs");
      M.forEach(([n, t], i) => {
        const d = document.createElement("div");
        d.className = "wa"; d.id = "m" + i; d.style.top = (510 + (i % 8) * 72) + "px";
        d.innerHTML = '<i data-ic="wa" data-col="#ffffff" data-sw="4"></i><b>' + n + ":</b>&nbsp;" + t;
        msgs.appendChild(d);
      });
      const D = [["JR", "", "Juan", "Ocupado", "a", "Zona norte", "—"], ["AN", "o", "Ana", "Libre", "g", "Zona centro", "12 min"], ["LU", "g", "Luis", "Libre", "g", "Zona sur", "4 min"], ["MA", "a", "Marco", "Ocupado", "a", "Zona este", "—"]];
      const drs = document.getElementById("drs");
      D.forEach(([ini, c, nm, st, sc, z, w], i) => {
        const d = document.createElement("div");
        d.className = "dr"; d.style.top = (84 + i * 132) + "px";
        d.innerHTML = '<div class="t1"><span class="av ' + c + '">' + ini + "</span>" + nm + '</div><div class="t2"><span class="chip ' + sc + '">' + st + '</span><span class="chip">📍 ' + z + '</span><span class="chip o">⏱ ' + w + "</span></div>";
        drs.appendChild(d);
      });
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 10.6;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#pp", "#caos", "#scan"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#cen", { y: -300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.25);
      tl.fromTo("#inl", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 0.6);
      tl.fromTo("#dv", { x: 600, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 1.2);
      // pedidos que no paran de entrar
      const qv = document.getElementById("qv"), q = { v: 0 };
      M.forEach((_, i) => {
        const t = i < 4 ? 0.8 + i * 0.7 : 6.2 + (i - 4) * 0.4;
        tl.fromTo("#m" + i, { x: -600, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      });
      tl.to(q, { v: 4, duration: 2.8, ease: "steps(4)", onUpdate: () => { qv.textContent = " " + Math.round(q.v); } }, 0.8);
      tl.to(q, { v: 12, duration: 2.6, ease: "steps(8)", onUpdate: () => { qv.textContent = " " + Math.round(q.v); } }, 6.2);
      tl.to("#q", { scale: 1.12, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 9 }, 6.4);
      // revisando drivers uno por uno
      tl.fromTo("#scan", { y: 79, autoAlpha: 0 }, { y: 79, autoAlpha: 1, duration: 0.2, immediateRender: false }, 2.2);
      [79, 211, 343, 475, 211, 343].forEach((y, i) => tl.to("#scan", { y: y, duration: 0.35, ease: "power2.inOut" }, 2.4 + i * 0.6));
      tl.to(".dr .chip", { scale: 1.08, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.05 }, 2.6);
      // hora punta: caos
      tl.fromTo("#pp", { y: 50, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, 8.6);
      tl.fromTo("#caos", { scale: 3, rotation: -25, autoAlpha: 0 }, { scale: 1, rotation: -8, autoAlpha: 1, duration: 0.25, ease: "power4.in", immediateRender: false }, 9.05);
      tl.to(["#cen", "#dv", ".wa"], { keyframes: [{ x: -10, duration: 0.05 }, { x: 10, duration: 0.05 }, { x: -6, duration: 0.05 }, { x: 0, duration: 0.05 }], repeat: 2 }, 9.3);
      tl.fromTo("#sh", { x: -140 }, { x: 700, duration: 0.6, ease: "power2.inOut" }, 9.6);
      tl.set("#sh", { x: -140 }, 10.25);
      // salida + barrido
      GEX.scatter(tl, ["#cen", "#dv", "#pp", "#caos", "#tag", "#inl"], EXIT, 21);
      tl.to(".wa", { x: -700, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.02 }, EXIT);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
