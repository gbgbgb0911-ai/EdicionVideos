<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Trip 03a — Antes: asignar reenviando mensajes</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/sis.css" />
    <script src="assets/gex-fx.js"></script>
    <script src="assets/sis.js"></script>
    <style>
      @font-face { font-family: "Outfit"; font-weight: 500; src: url("assets/fonts/Outfit-500.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 700; src: url("assets/fonts/Outfit-700.woff2") format("woff2"); }
      @font-face { font-family: "Outfit"; font-weight: 800; src: url("assets/fonts/Outfit-800.woff2") format("woff2"); }
      #tagw { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
      .ch { position: absolute; left: 60px; width: 960px; border-radius: 32px; background: #ffffff; overflow: hidden; color: var(--teal); }
      .ch .hd { display: flex; align-items: center; gap: 14px; height: 96px; padding: 0 26px; background: #179a4a; color: #ffffff; font-weight: 800; font-size: 36px; white-space: nowrap; }
      .ch .hd .av { width: 60px; height: 60px; font-size: 24px; background: #ffffff; color: #179a4a; }
      .ch .bd { position: relative; height: 300px; padding: 22px; background: var(--soft); }
      .msg { position: absolute; left: 22px; max-width: 760px; padding: 16px 22px; border-radius: 22px 22px 22px 6px; background: #ffffff; font-weight: 700; font-size: 32px; line-height: 1.3; white-space: nowrap; }
      .msg small { display: block; font-weight: 800; font-size: 22px; color: #6f807f; letter-spacing: 0.06em; }
      #fw { position: absolute; left: 640px; top: 520px; display: flex; align-items: center; gap: 10px; padding: 14px 26px 14px 14px; border-radius: 999px; background: #0b958b; font-weight: 800; font-size: 34px; white-space: nowrap; z-index: 6; }
      #fw .pi { width: 54px; height: 54px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; }
      #fw .pi svg { width: 34px; height: 34px; }
      #fly { position: absolute; left: 82px; top: 438px; z-index: 8; color: #0b958b; }
      #cnt { position: absolute; left: 0; right: 0; top: 1430px; display: flex; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5" data-fps="60" data-width="1080" data-height="1920">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="fx-layer" id="fx"></div>
        <div id="tagw"><span class="tag" id="tag">ANTES · ASIGNAR = REENVIAR</span></div>
        <div class="ch" id="c1" style="top: 290px"><div class="hd"><span class="av">P</span>Pollería → Central</div><div class="bd"><div class="msg" id="o1" style="top: 30px">Pedido: 2 pollos<br />Av. Lima 123 · cobrar $30</div><div class="msg" id="o2" style="top: 170px">Pedido: 1 pollo · Jr. Sol 45</div></div></div>
        <div id="fw"><span class="pi" data-ic="fwd" data-sw="4.5"></span>Reenviar</div>
        <div class="ch" id="c2" style="top: 860px"><div class="hd"><span class="av">J</span>Central → Driver Juan</div><div class="bd"><div class="msg" id="r1" style="top: 30px"><small>↪ REENVIADO</small>Pedido: 2 pollos · Av. Lima 123 · cobrar $30</div><div class="msg" id="r2" style="top: 170px"><small>↪ REENVIADO</small>Pedido: 1 pollo · Jr. Sol 45</div></div></div>
        <div class="msg" id="fly">Pedido: 2 pollos…</div>
        <div id="cnt"><span class="chip o" id="cc" style="font-size: 36px; padding: 12px 28px">Pedido por pedido, a mano</span></div>
      </section>
      <audio id="s-in" src="assets/sfx/whoosh.wav" data-start="0.05" data-volume="0.45"></audio>
      <audio id="s-c" src="assets/sfx/click.wav" data-start="1.5" data-volume="0.4"></audio>
      <audio id="s-p" src="assets/sfx/pop.wav" data-start="2.35" data-volume="0.3"></audio>
      <audio id="s-t" src="assets/sfx/tick.wav" data-start="3.3" data-volume="0.28"></audio>
      <audio id="s-out" src="assets/sfx/whoosh-out.wav" data-start="4.58" data-volume="0.4"></audio>
    </div>
    <script>
      GEX.icons();
      const tl = gsap.timeline({ paused: true });
      const EXIT = 4.6;
      const scene = document.getElementById("scene");
      GEX.wipe(tl, scene, 0);
      gsap.set(["#fw", "#fly", "#r1", "#r2", "#o2", "#cc"], { autoAlpha: 0 });
      tl.fromTo("#tag", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#c1", { y: -500, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.2);
      tl.fromTo("#c2", { y: 600, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.35);
      tl.fromTo("#o1", { x: -300, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, 0.6);
      // reenviar
      const cur = GEX.cursor(scene);
      tl.fromTo(cur.c, { x: 900, y: 1300, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, 0.8);
      tl.fromTo("#fw", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 1.0);
      GEX.tap(tl, cur, 720, 560, 1.1, 0.4);
      tl.to("#fw", { keyframes: [{ scale: 0.92, duration: 0.08 }, { scale: 1, duration: 0.2 }], ease: "sine.out" }, 1.5);
      tl.fromTo("#fly", { x: 0, y: 0, scale: 1, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.1, immediateRender: false }, 1.6);
      tl.to("#fly", { y: 570, rotation: -4, duration: 0.6, ease: "power2.inOut" }, 1.65);
      tl.to("#fly", { autoAlpha: 0, duration: 0.1 }, 2.3);
      tl.fromTo("#r1", { scale: 0.6, autoAlpha: 0, transformOrigin: "0% 50%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 50%", duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, 2.3);
      // y otro... y otro
      tl.fromTo("#o2", { x: -300, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 2.7);
      tl.to(cur.c, { x: 720, y: 600, duration: 0.3, ease: "power2.inOut" }, 2.9);
      tl.to("#fw", { keyframes: [{ scale: 0.92, duration: 0.08 }, { scale: 1, duration: 0.2 }], ease: "sine.out" }, 3.2);
      tl.fromTo("#r2", { scale: 0.6, autoAlpha: 0, transformOrigin: "0% 50%" }, { scale: 1, autoAlpha: 1, transformOrigin: "0% 50%", duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, 3.3);
      tl.fromTo("#cc", { y: 40, scale: 0.5, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)", immediateRender: false }, 3.6);
      // salida + barrido
      tl.to(cur.c, { autoAlpha: 0, duration: 0.15 }, EXIT);
      GEX.scatter(tl, ["#c1", "#fw", "#c2", "#cc", "#tag"], EXIT, 31);
      GEX.wipe(tl, scene, EXIT - 0.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
